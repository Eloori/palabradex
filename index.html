 {ch:9,diff:1,title:'Leo',
  tz:{de:'Ein ruhiger Nachmittag in der Bar. Mia lernt Leo besser kennen und erfährt etwas über seinen Grossvater.',en:'A quiet afternoon at the bar. Mia gets to know Leo and learns something about his grandfather.'},
  paras:[
   'Es martes. Leo y yo estamos en el bar. Hoy Leo no trabaja.',
   '«Tengo una pregunta», dice Leo. «¿Por qué estás en Barcelona? ¿Por la llave?»',
   '«No», digo. «Estudio aquí. Estudio economía en la universidad.»',
   '«¡Yo también estudio! Estudio música», dice Leo. «Por la mañana estudio y por la tarde trabajo en el bar.»',
   '«¿Te gusta trabajar en el bar?»',
   '«Sí, me gusta. Hablo con mucha gente. Pero me gusta más la música. Toco la guitarra.»',
   '«¿Tienes hermanos?», pregunto.',
   '«Sí, una hermana. Se llama Laia. Tiene dieciséis años y es muy inteligente. ¿Y tú?»',
   '«No tengo hermanos. Tengo a mi madre, a mi padre... y a mi abuela Ana.»',
   '«Laia es más inteligente que yo», dice Leo. «Ella dice: tú eres el hermano simpático y yo soy la hermana inteligente.»',
   'Leo me mira. «Tu abuela tiene un secreto. Y mi abuelo también. Yo sé que mi abuelo sabe algo más.»',
   '«¿Por qué?»',
   '«Porque mi abuelo no duerme. Desde el lunes no duerme. Y por la noche escucha la radio. Una radio muy vieja.»'
  ],
  quiz:[
   {q:'¿Qué estudia Mia?',o:['Economía.','Música.','Español.']},
   {q:'¿Qué toca Leo?',o:['La guitarra.','La radio.','El teléfono.']},
   {q:'¿Cómo se llama la hermana de Leo?',o:['Laia.','Ana.','Rosa.']},
   {q:'¿Qué hace el abuelo de Leo por la noche?',o:['Escucha la radio.','Trabaja en el bar.','Estudia.']}
  ]},
 {ch:10,diff:2,title:'La voz de la radio',
  tz:{de:'In Joans Küche steht ein blaues Radio. Endlich erfährt Mia, wer die Stimme ist.',en:'There is a blue radio in Joan\'s kitchen. At last Mia finds out who the voice is.'},
  paras:[
   'Esta noche, Leo y yo vamos a la casa de su abuelo. Joan vive en un piso pequeño en la plaza del Sol.',
   'Leo abre la puerta con su llave. Todo está oscuro. Solo hay una luz pequeña en la cocina.',
   'Joan está en la cocina. Está sentado en una silla. En la mesa hay una radio. Una radio vieja... y azul.',
   '«Abuelo», dice Leo. «¿Qué haces?»',
   'Joan no mira a Leo. Mira la radio. «Hablo con la casa azul», dice.',
   'Miro la radio. Y escucho una voz. Mi voz. «¿Quién eres tú?» Es mi voz, en la casa azul.',
   '«Eres tú», digo. «Tú eres la voz de la radio.»',
   'Joan me mira. Sus ojos están tristes. «Sí, Mia. Soy yo.»',
   '«¿Pero por qué? ¿Por qué la llave, la radio, la carta?»',
   'Joan cierra los ojos. «Porque yo soy el amor de Ana. Y tengo una pregunta para ella. Una pregunta de cincuenta años.»',
   '«¿Y cómo sabes mi nombre? ¿Mi edad? ¿Mi piso?»',
   '«Por Rosa. Rosa es la amiga de Ana. Cada año, Ana escribe una carta a Rosa. Un día, la carta dice: mi nieta Mia va a Barcelona. Tiene veintidós años.»',
   '«¿Y la radio? ¿Y la casa azul?»',
   '«La casa azul es mía. Cada noche, a las doce, hablo con la casa azul. Durante cincuenta años, nadie contesta. Y una noche... una chica contesta.»',
   '«Y la foto. Tú dices: la chica de la foto eres tú.»',
   'Joan sonríe un poco. «Perdón. La chica de la foto es Ana. Pero eres igual que ella. Igual.»',
   '«¿Y la llave en mi maleta? ¿Y la nota?»',
   'Joan me mira. «Eso, Mia... no lo sé. De verdad, no lo sé.»'
  ],
  quiz:[
   {q:'¿Dónde está Joan?',o:['En la cocina.','En el mercado.','En la playa.']},
   {q:'¿De qué color es la radio de Joan?',o:['Azul.','Roja.','Negra.']},
   {q:'¿Quién es la voz de la radio?',o:['Joan.','Leo.','Rosa.']},
   {q:'¿Quién es el amor de Ana?',o:['Joan.','Leo.','El padre de Mia.']}
  ]},
 {ch:11,diff:2,title:'La pregunta de Joan',
  tz:{de:'Bei einer Tasse Tee erzählt Joan, was vor fünfzig Jahren in jener Nacht passiert ist.',en:'Over a cup of tea Joan tells what happened that night fifty years ago.'},
  paras:[
   'Joan hace un té. Miro el reloj de la cocina. Estamos en la mesa. Es la una de la noche, pero nadie tiene sueño.',
   '«Ana y yo somos jóvenes», dice Joan. «Ella tiene veinte años y yo tengo veintidós. Trabajamos en la misma tienda: la tienda de radios de la calle del Sol.»',
   '«Cada día, Ana canta en la tienda. Tiene una voz muy bonita. Y yo quiero a Ana. Mucho.»',
   '«Pero el padre de Ana no quiere. Para él, yo soy pobre. Un chico sin dinero.»',
   '«Una noche, Ana escribe una carta. La carta dice: a las doce, en la puerta azul.»',
   '«¿Y tú vas?», pregunta Leo.',
   'Joan cierra los ojos. «No. Esa noche mi madre está enferma. Muy enferma. Estoy en el hospital con ella. No voy.»',
   '«Y Ana se va a Suiza», digo.',
   '«Sí. Y yo no sé nada. No sé dónde está. No tengo su dirección. Nada.»',
   'Hay silencio en la cocina.',
   '«¿Y tu pregunta?», digo. «¿Cuál es tu pregunta para Ana?»',
   'Joan me mira. «Es una pregunta simple. ¿Todavía tienes la llave?»'
  ],
  quiz:[
   {q:'¿Dónde trabajan Ana y Joan?',o:['En una tienda de radios.','En un hospital.','En un bar.']},
   {q:'¿Por qué no va Joan a la puerta azul?',o:['Su madre está enferma.','No tiene llave.','No quiere a Ana.']},
   {q:'¿Qué hace Ana cada día en la tienda?',o:['Canta.','Duerme.','Compra fruta.']},
   {q:'¿Cuál es la pregunta de Joan?',o:['¿Todavía tienes la llave?','¿Dónde está el hospital?','¿Quieres un té?']}
  ]},
 {ch:12,diff:1,title:'Un día de lluvia',
  tz:{de:'Regen in Barcelona. Mia bleibt im Bett, bis Leo mit Suppe und einer Idee vor der Tür steht.',en:'Rain in Barcelona. Mia stays in bed until Leo turns up with soup and an idea.'},
  paras:[
   'Hoy llueve. Llueve mucho. Barcelona está gris y fría.',
   'Hoy es un mal día. Estoy en mi cama. No quiero salir. No quiero ver la tele. Abro mis libros de la universidad, pero no entiendo nada. Pienso en Ana. Pienso en Joan.',
   '¿Mi abuela todavía tiene la llave? No sé. Mi abuela tiene ochenta años. Vive en un piso en Zúrich con su gato. Es una mujer seria. No canta. Nunca canta.',
   '¿Por qué no canta? ¿Por Joan?',
   'A las dos, hay alguien en la puerta. Es Leo. Tiene una bolsa grande.',
   '«Hola. Hace frío y llueve. Tengo sopa caliente», dice Leo.',
   'Comemos sopa en mi cocina. La sopa es muy buena. Es la sopa de la madre de Leo.',
   '«Mia», dice Leo, «tengo una idea. Tu abuela tiene teléfono, ¿no?»',
   '«Sí, claro.»',
   '«Entonces, ¿por qué no hablas con ella? Hoy. Ahora.»',
   'Miro mi teléfono. Mi abuela. Ana. Una pregunta de cincuenta años.',
   'Tengo mucho miedo. Pero tomo el teléfono.'
  ],
  quiz:[
   {q:'¿Qué tiempo hace hoy?',o:['Llueve y hace frío.','Hace sol.','Hace calor.']},
   {q:'¿Dónde vive la abuela de Mia?',o:['En Zúrich.','En la calle del Sol.','En el hospital.']},
   {q:'¿Qué tiene Leo en la bolsa?',o:['Sopa caliente.','Una guitarra.','Fresas.']},
   {q:'¿Cuál es la idea de Leo?',o:['Hablar con la abuela.','Ir al mercado.','Dormir.']}
  ]},
 {ch:13,diff:2,title:'La voz de la abuela',
  tz:{de:'Mia ruft ihre Grossmutter an und stellt die eine Frage, die alles verändert.',en:'Mia calls her grandmother and asks the one question that changes everything.'},
  paras:[
   'El teléfono suena una vez. Dos veces. Tres veces.',
   '«¿Sí?» Es la voz de mi abuela. Es una voz seria, como siempre.',
   '«Hola, abuela. Soy Mia.»',
   '«¡Mia! ¿Qué tal en Barcelona? ¿Comes bien? ¿Duermes bien? ¿Tienes dinero?»',
   '«Sí, abuela. Todo bien. Pero tengo una pregunta.»',
   '«Dime.»',
   'Respiro. «Abuela, ¿conoces a un hombre que se llama Joan?»',
   'Silencio. Un silencio muy largo.',
   '«¿Abuela? ¿Estás ahí?»',
   '«Sí. Estoy aquí.» Su voz es diferente. Es una voz pequeña. «¿Joan? ¿Mi Joan? ¿Todavía vive?»',
   '«Sí, abuela. Vive aquí, en la plaza del Sol. Y tiene una pregunta para ti.»',
   'Mi abuela no dice nada. Después, escucho algo. Mi abuela llora. Mi abuela, la mujer seria, llora.',
   '«Mia», dice. «Necesito tiempo. Mañana hablamos.» Y no dice nada más.'
  ],
  quiz:[
   {q:'¿Cómo es la voz de la abuela al principio?',o:['Seria.','Muy rápida.','Triste.']},
   {q:'¿Qué pregunta Mia?',o:['Si conoce a Joan.','Si come bien.','Dónde está Zúrich.']},
   {q:'¿Qué hace la abuela después?',o:['Llora.','Canta.','Duerme.']},
   {q:'¿Qué necesita la abuela?',o:['Tiempo.','Un teléfono.','Una llave.']}
  ]},
 {ch:14,diff:1,title:'Un día en la playa',
  tz:{de:'Drei Tage keine Antwort. Leo nimmt Mia mit an den Strand, und dann kommt doch eine Nachricht.',en:'Three days without an answer. Leo takes Mia to the beach, and then a message arrives.'},
  paras:[
   'Es miércoles. Mi abuela no escribe. Es jueves. Mi abuela no escribe. Es viernes, y mi abuela no escribe.',
   'El viernes, Leo dice: «¡Basta! Hoy vamos a la playa. Tú, yo y mi hermana Laia.»',
   'Hoy no llueve. Hace sol y hace calor. En la playa de la Barceloneta hay mucha gente: familias, chicos, chicas y perros.',
   'Laia es muy simpática. Leo y Laia son hermanos, pero son muy diferentes: Leo es tranquilo, Laia no. Tiene dieciséis años y habla muy rápido. Habla de música, de la escuela y de un chico de su clase.',
   'Comemos paella en un restaurante pequeño. «¿Paella para tres? ¡No hay problema!», dice el camarero. «Mi paella tiene arroz, pescado y mucho amor.»',
   'Después, tomamos un helado. Laia toma un helado de chocolate. Yo tomo un helado de limón.',
   'Por primera vez en tres días, estoy feliz. No pienso en Ana. No pienso en Joan.',
   'Pero entonces, mi teléfono suena. Es un mensaje. De mi abuela.',
   {t:'«Mia: llego a Barcelona el domingo, a las once. Al aeropuerto. Es una sorpresa para Joan. Abuela.»',cls:'note'}
  ],
  quiz:[
   {q:'¿Qué tiempo hace en la playa?',o:['Hace sol y calor.','Llueve.','Hace mucho frío.']},
   {q:'¿Qué comen en el restaurante?',o:['Paella.','Sopa.','Pan con queso.']},
   {q:'¿Qué helado toma Mia?',o:['De limón.','De chocolate.','De fresa.']},
   {q:'¿Cuándo llega la abuela?',o:['El domingo a las once.','El viernes.','Hoy.']}
  ]},
 {ch:15,diff:2,title:'El abrigo azul',
  tz:{de:'Am Flughafen wartet Mia auf ihre Grossmutter. Die hat etwas Kleines in der Tasche.',en:'Mia waits for her grandmother at the airport. She has something small in her bag.'},
  paras:[
   'Es domingo. Son las once. Leo y yo estamos en el aeropuerto.',
   'Hay mucha gente: personas con maletas grandes y pequeñas, familias, niños.',
   '«¿Cómo es tu abuela?», pregunta Leo.',
   '«Pequeña. Pelo blanco. Siempre lleva un abrigo azul.»',
   'Y allí está. Una mujer pequeña, con el pelo blanco y un abrigo azul. Camina despacio con una maleta vieja.',
   '«¡Abuela!»',
   'Mi abuela me abraza. Me abraza mucho tiempo. Después, mira a Leo.',
   '«¿Y tú quién eres?»',
   '«Soy Leo. El nieto de Joan.»',
   'Mi abuela mira a Leo. Mira sus ojos. «Tienes los ojos de tu abuelo», dice. Y sonríe. Nunca veo a mi abuela sonreír así.',
   'En el taxi, mi abuela abre su bolsa y saca algo pequeño.',
   'Es una llave. Una llave pequeña, vieja y azul.',
   '«Cincuenta años», dice mi abuela. «Cincuenta años con esta llave.»',
   '«Pero abuela... yo también tengo una llave. La llave de mi maleta.»',
   'Mi abuela me mira. Después mira por la ventana del taxi.',
   '«Lo sé», dice. «En la carta tengo dos llaves: una para mí y una para Joan. La llave de Joan... la pongo yo en tu maleta. Y la nota también.»',
   '«¿Tú? ¿Pero por qué no me dices nada?»',
   '«Porque yo tengo miedo, Mia. Cincuenta años de miedo. Y tú no tienes miedo.»'
  ],
  quiz:[
   {q:'¿Dónde están Mia y Leo?',o:['En el aeropuerto.','En la playa.','En el mercado.']},
   {q:'¿Qué lleva siempre la abuela?',o:['Un abrigo azul.','Una guitarra.','Un gato.']},
   {q:'¿Qué dice la abuela de Leo?',o:['Tiene los ojos de su abuelo.','Es muy alto.','Habla rápido.']},
   {q:'¿Qué saca la abuela en el taxi?',o:['Una llave azul.','Un teléfono.','Una carta.']}
  ]},
 {ch:16,diff:2,title:'Dos llaves',
  tz:{de:'Mitternacht vor der blauen Tür. Fünfzig Jahre zu spät, aber pünktlich.',en:'Midnight at the blue door. Fifty years late, but on time.'},
  paras:[
   'Son las doce de la noche. Mi abuela, Leo y yo estamos en la calle del Sol, número siete, delante de la puerta azul.',
   '«¿Por qué a las doce?», pregunta Leo.',
   '«Porque la carta dice a las doce», dice mi abuela. «Cincuenta años tarde. Pero a las doce.»',
   'Mi abuela tiene su llave. Yo tengo mi llave. Dos llaves azules.',
   'Esta noche hay luna. Abro la puerta. La casa está oscura. Pero hoy hay una luz: una vela en la mesa. Y al lado de la vela, la radio.',
   'Y un hombre. Un hombre viejo, sentado en una silla. Joan.',
   'Joan se levanta despacio. Mira a mi abuela. Mi abuela mira a Joan. Nadie habla.',
   'Después de mucho tiempo, Joan dice una sola palabra: «Ana.»',
   'Mi abuela no dice nada. Pone su llave en la mano de Joan.',
   '«Tu pregunta», dice ella. «Sí. Todavía tengo la llave. Siempre tengo la llave. Y ahora quiero estar aquí. Contigo.»',
   'Joan llora. Mi abuela llora. Y Leo y yo también lloramos un poco.'
  ],
  quiz:[
   {q:'¿Dónde están a las doce?',o:['Delante de la puerta azul.','En el aeropuerto.','En el bar.']},
   {q:'¿Qué hay en la mesa?',o:['Una vela y la radio.','Una paella.','Un gato.']},
   {q:'¿Qué dice Joan?',o:['«Ana.»','«Hola, Mia.»','Nada.']},
   {q:'¿Qué pone la abuela en la mano de Joan?',o:['Su llave.','Una carta.','Una foto.']}
  ]},
 {ch:17,diff:1,title:'Desayuno para cuatro',
  tz:{de:'Ein Frühstück in der Bar Sol. Alle lächeln, und Leo hat eine Frage an Mia.',en:'Breakfast at Bar Sol. Everyone is smiling, and Leo has a question for Mia.'},
  paras:[
   'Es lunes por la mañana. Estamos todos en el bar: Joan, mi abuela, Leo y yo.',
   'Desayunamos juntos, como una familia. Mi abuela toma un café con leche y una tostada. Joan toma un té. Leo y yo tomamos zumo de naranja.',
   'Mi abuela pide también un poco de queso. «El queso de aquí es bueno», dice, «pero me gusta más el queso de Suiza.» Joan se ríe. «Todos los suizos dicen lo mismo.»',
   'Mi abuela y Joan hablan y hablan. Hablan de la tienda de radios, de la calle del Sol, de Barcelona. Hablan en catalán. No entiendo todo, pero entiendo una cosa: están felices.',
   '«Mira», dice Leo. «Mi abuelo sonríe. Mi abuelo nunca sonríe.»',
   '«Mi abuela tampoco», digo.',
   'Después del desayuno, Leo me mira. Está un poco nervioso.',
   '«Mia... El sábado toco la guitarra en un concierto pequeño, en un bar del Born. ¿Quieres venir?»',
   '«¿Un concierto? Sí, claro. Me gusta mucho la música.»',
   'Leo sonríe. Yo sonrío. Y en la otra mesa, mi abuela nos mira y sonríe también.'
  ],
  quiz:[
   {q:'¿Qué toma la abuela?',o:['Un café con leche y una tostada.','Un té.','Un helado.']},
   {q:'¿En qué idioma hablan Joan y la abuela?',o:['En catalán.','En alemán.','En inglés.']},
   {q:'¿Cómo está Leo después del desayuno?',o:['Un poco nervioso.','Muy triste.','Enfermo.']},
   {q:'¿Cuándo es el concierto?',o:['El sábado.','El lunes.','Mañana a las diez.']}
  ]},
 {ch:18,diff:2,title:'El concierto',
  tz:{de:'Eine kleine Bühne, eine alte Lied und eine Stimme, die fünfzig Jahre geschwiegen hat.',en:'A small stage, an old song and a voice that has been silent for fifty years.'},
  paras:[
   'Es sábado. El bar del Born es pequeño y oscuro. Hay velas en las mesas y mucha gente joven. Cien personas, o más.',
   'Mi abuela y Joan también están aquí. Están sentados en la primera mesa, juntos.',
   'Leo sube al escenario con su guitarra y su grupo. Está nervioso. Me mira. Yo levanto la mano.',
   '«Hola a todos», dice Leo. «Esta canción es de mi abuelo. Es una canción muy vieja. Se llama La puerta azul.»',
   'Mi abuela mira a Joan. Joan toma la mano de mi abuela.',
   'Leo toca. La canción es lenta y bonita. Habla de una chica, de una llave y de una noche en la calle del Sol.',
   'Entonces pasa algo increíble. Mi abuela se levanta. Camina despacio hasta Leo. Y canta.',
   'Su voz no es la voz de una mujer de ochenta años. Es la voz de una chica de veinte. Es la voz de la tienda, de la carta, de la foto.',
   'Todo el bar está en silencio. Nadie habla. Nadie bebe. Todos escuchan.',
   'Al final, todos aplauden. Joan llora. Yo lloro. Y Leo me mira y dice, sin voz: «Gracias.»'
  ],
  quiz:[
   {q:'¿Dónde está el concierto?',o:['En un bar del Born.','En la playa.','En la universidad.']},
   {q:'¿Cómo se llama la canción?',o:['La puerta azul.','La llave.','Barcelona.']},
   {q:'¿Quién canta con Leo?',o:['La abuela.','Mia.','Joan.']},
   {q:'¿Qué hace la gente al final?',o:['Aplaude.','Sale del bar.','Duerme.']}
  ]},
 {ch:19,diff:2,title:'Una decisión',
  tz:{de:'Ein Spaziergang am Meer. Die Grossmutter hat eine Entscheidung getroffen.',en:'A walk by the sea. Grandmother has made a decision.'},
  paras:[
   'Es domingo. Mi abuela y yo caminamos por la playa. El mar está tranquilo. En el cielo hay nubes y hace un poco de viento.',
   '«Abuela, ¿qué vas a hacer ahora?», pregunto.',
   'Mi abuela mira el mar mucho tiempo. «Tengo ochenta años, Mia. Mi casa está en Zúrich. Mis amigas están en Zúrich. Mi gato está en Zúrich.»',
   '«Sí, pero Joan está aquí.»',
   '«Sí. Joan está aquí.» Mi abuela sonríe un poco. «Y mi corazón también está aquí. Siempre está aquí.»',
   'Caminamos un poco más. En la playa hay un perro. Corre y corre detrás de una pelota.',
   '«Voy a vivir en Barcelona», dice mi abuela. «Con Joan. En la calle del Sol.»',
   'Me paro. «¿En serio?»',
   '«¿Estás segura, abuela?»',
   '«Muy segura. Pero primero voy a Zúrich. Necesito mi gato.»',
   'Me río. Mi abuela también se ríe. Y por primera vez, mi abuela parece joven. Parece la chica de la foto.'
  ],
  quiz:[
   {q:'¿Dónde caminan Mia y su abuela?',o:['Por la playa.','Por el mercado.','Por el aeropuerto.']},
   {q:'¿Dónde está el corazón de la abuela?',o:['En Barcelona.','En Zúrich.','En la radio.']},
   {q:'¿Qué va a hacer la abuela?',o:['Vivir en Barcelona con Joan.','Vivir en Zúrich.','Ir a la universidad.']},
   {q:'¿Por qué va primero a Zúrich?',o:['Necesita su gato.','Tiene miedo.','Tiene un concierto.']}
  ]},
 {ch:20,diff:2,title:'La llave de Mia',
  tz:{de:'Dezember in Barcelona. Ein Geburtstag in der blauen Tür und ein Geschenk mit einer Frage.',en:'December in Barcelona. A birthday behind the blue door and a gift with a question.'},
  paras:[
   'Es diciembre. En Barcelona no hace mucho frío, pero hay luces en todas las calles.',
   'Mi abuela vive ahora en la calle del Sol, número siete. La casa ya no está oscura. Tiene luz, flores y música. En la mesa está la radio azul. Joan escucha la radio cada mañana.',
   'Hoy es un día especial: es mi cumpleaños. Tengo veintitrés años.',
   'Estamos todos en la casa azul: mi abuela, Joan, Leo, Laia, Rosa del mercado y mi madre. Sí, mi madre está aquí, en Barcelona.',
   '«¡Feliz cumpleaños, Mia!», dicen todos. Comemos una tarta de chocolate. Rosa trae fresas y plátanos de su mercado. Leo toca la guitarra. Mi abuela canta.',
   'Después, mi abuela me da una caja pequeña. «Para ti», dice.',
   'Abro la caja. Dentro hay una llave. Una llave pequeña, vieja y azul. La llave de mi abuela.',
   '«Una llave es una pregunta», dice mi abuela. «Ahora es tu pregunta, Mia.»',
   'Miro la llave. Miro a Leo. Leo me mira y sonríe.',
   'No sé cuál es mi pregunta. Todavía no. Pero sé una cosa: tengo tiempo. Y tengo una llave azul.',
   {t:'Fin',cls:'voice'}
  ],
  quiz:[
   {q:'¿Qué día es hoy para Mia?',o:['Su cumpleaños.','Su primer día.','Un día de lluvia.']},
   {q:'¿Cuántos años tiene Mia ahora?',o:['Veintitrés.','Veintidós.','Ochenta.']},
   {q:'¿Qué hay en la caja?',o:['Una llave azul.','Una tarta.','Una carta.']},
   {q:'¿Quién vive ahora en la casa azul?',o:['La abuela de Mia.','Rosa.','Leo y Laia.']}
  ]}
];

 {ch:21,diff:1,title:'Las doce uvas',
  tz:{de:'Silvester bei der Grossmutter: zwölf Trauben, rote Kleider, und um Mitternacht spricht das Radio. Aber nicht Joan.',en:'New Year\'s Eve at grandmother\'s: twelve grapes, red clothes, and at midnight the radio speaks. But not Joan.'},
  paras:[
   'Es el treinta y uno de diciembre. Es Nochevieja, la última noche del año.',
   'Estamos todos en la casa azul: mi abuela, Joan, Leo, Laia y yo. Mi abuela lleva un vestido rojo. Leo lleva una camisa blanca. Yo llevo un jersey negro.',
   '«¿Por qué rojo, abuela?», pregunto.',
   '«En España, en Nochevieja, la ropa roja trae suerte», dice mi abuela. «Y ahora, las uvas.»',
   'Laia pone un plato pequeño delante de cada persona. En cada plato hay doce uvas verdes.',
   '«¿Doce uvas?», digo. «¿Para qué?»',
   '«A las doce, el reloj de la Puerta del Sol hace doce campanadas», dice Leo. «Con cada campanada, comes una uva. Doce campanadas, doce uvas, doce meses de suerte.»',
   'Miramos la tele. Son las doce menos un minuto. Todos tenemos el plato en la mano.',
   'Una campanada: una uva. Dos campanadas: dos uvas. Es muy difícil. Las uvas son grandes. Laia se ríe. Yo me río. ¡Es imposible!',
   '«¡Feliz año nuevo!», dicen todos. Nos abrazamos.',
   'Entonces, la radio azul habla. Una voz. Pero no es la voz de Joan. Es una voz diferente.',
   {t:'«Feliz año nuevo, Mia. ¿Te gustan los juegos? El juego empieza mañana.»',cls:'note'},
   '«¿Quién está ahí?», pregunta Joan a la radio. Nadie contesta.',
   'Miro a Joan. Joan mira la radio. Su cara está blanca.',
   '«No soy yo», dice Joan. «Esa voz no es mía.»'
  ],
  quiz:[
   {q:'¿Qué día es?',o:['El treinta y uno de diciembre.','El primero de enero.','Su cumpleaños.']},
   {q:'¿Por qué lleva la abuela ropa roja?',o:['Porque trae suerte.','Porque tiene frío.','Porque es su color.']},
   {q:'¿Cuántas uvas come cada persona?',o:['Doce.','Siete.','Una.']},
   {q:'¿Quién habla en la radio?',o:['Una voz diferente.','Joan.','Leo.']}
  ]},
 {ch:22,diff:1,title:'Un paquete sin nombre',
  tz:{de:'Am ersten Januar liegt ein Paket vor Mias Tür. Ohne Absender, aber mit einem Rätsel.',en:'On the first of January there is a parcel at Mia\'s door. No sender, but a riddle.'},
  paras:[
   'Es el primero de enero. Son las diez de la mañana. Alguien llama a la puerta.',
   'Abro. No hay nadie. Pero en el suelo hay un paquete. Un paquete pequeño, con papel marrón.',
   'En el paquete hay mi nombre: «Para Mia». No hay otro nombre. No hay dirección.',
   'Abro el paquete. Dentro hay una cámara de fotos. Es una cámara muy vieja, negra y pesada. Y hay un sobre.',
   'Abro el sobre. Dentro hay una tarjeta. En la tarjeta hay una pregunta:',
   {t:'«Primera pregunta: ¿Dónde vive el dragón de colores? Busca el dragón. Lleva la cámara.»',cls:'note'},
   '¿Un dragón? ¿En Barcelona? Me gustan los juegos. Pero este juego es difícil.',
   'Escribo un mensaje a Leo: «¿Tú sabes algo de un paquete? ¿Y de un dragón?»',
   'Leo responde rápido: «¿Un dragón? Ni idea. ¿Por qué?»',
   'Miro la cámara. Miro la tarjeta. Es la letra de una persona joven. No es la letra de mi abuela. No es la letra de Joan.',
   '¿Es Laia? Laia es inteligente y le gustan los secretos. Pero Laia tiene dieciséis años. No tiene dinero para una cámara.',
   'Alguien quiere jugar conmigo. Y yo... yo quiero jugar también.'
  ],
  quiz:[
   {q:'¿Qué hay en el suelo?',o:['Un paquete.','Una carta de Ana.','Un gato.']},
   {q:'¿Qué hay dentro del paquete?',o:['Una cámara y un sobre.','Una radio.','Doce uvas.']},
   {q:'¿Qué tiene que buscar Mia?',o:['Un dragón.','Una llave.','Un piso.']},
   {q:'¿De quién es la letra?',o:['De una persona joven.','De la abuela.','De Joan.']}
  ]},
 {ch:23,diff:1,title:'Un día normal',
  tz:{de:'Mias Alltag zwischen Wecker, Dusche und Uni. Und Leo kennt plötzlich den Drachen.',en:'Mia\'s routine between alarm, shower and uni. And suddenly Leo knows the dragon.'},
  paras:[
   'Mi día empieza a las siete y media. Me despierto, me levanto, voy al baño y me ducho. El agua está muy caliente. ¡Me gusta!',
   'Después me visto. Hoy llevo unos pantalones azules y un jersey gris. Hace frío en enero.',
   'Desayuno en la cocina: un café con leche y pan con tomate. Siempre desayuno muy rápido.',
   'A las ocho y cuarto salgo de casa. Voy a la universidad en metro. El viaje es de veinte minutos.',
   'Las clases empiezan a las nueve y terminan a las dos. Hoy tengo clase de economía y clase de español. La profesora de español es muy simpática. Se llama Carmen.',
   'A las dos y media como algo en la universidad. Después estudio en la biblioteca. Pero hoy no estudio mucho. Pienso en el dragón.',
   'A las seis voy al Bar Sol. Leo está detrás de la barra. Me pone un café con leche, como siempre.',
   '«¿Y el dragón?», pregunta Leo.',
   '«Nada. No sé dónde está.»',
   'Leo piensa un momento. Después sonríe. «Mia... ¿conoces a Gaudí?»',
   '«¿El arquitecto? Claro.»',
   '«En el Park Güell, de Gaudí, hay un dragón. Un dragón de muchos colores.»',
   'Lo miro. ¡Claro! «¿Vamos mañana?»',
   '«Mañana trabajo hasta las cinco», dice Leo. «Pero después, sí. Vamos.»'
  ],
  quiz:[
   {q:'¿A qué hora se levanta Mia?',o:['A las siete y media.','A las nueve.','A las doce.']},
   {q:'¿Cómo va Mia a la universidad?',o:['En metro.','En taxi.','A pie.']},
   {q:'¿Cómo se llama la profesora de español?',o:['Carmen.','Rosa.','Laia.']},
   {q:'¿Dónde vive el dragón?',o:['En el Park Güell.','En el mercado.','En la casa azul.']}
  ]},
 {ch:24,diff:2,title:'El dragón de colores',
  tz:{de:'Mit Metro und Bus zum Park Güell. Der Drache hat etwas für Mia versteckt.',en:'By metro and bus to Park Güell. The dragon has hidden something for Mia.'},
  paras:[
   'Son las cinco y media. Leo y yo tomamos el metro, la línea tres. Después tomamos un autobús. El Park Güell está en una montaña, lejos del centro.',
   'Bajamos del autobús. «¿Dónde está el parque?», pregunto a una señora.',
   '«Muy cerca», dice la señora. «Sigue recto. Después, a la derecha. Y después, a la izquierda. Allí está la entrada.»',
   'Caminamos. Recto, a la derecha, a la izquierda. Y allí está: el Park Güell.',
   'Es increíble. Hay casas como de chocolate, con techos blancos como helado. Hay árboles, flores y muchos turistas con cámaras.',
   'Y en la escalera grande, allí está: el dragón. Es verde, azul, amarillo y naranja. Tiene la boca abierta.',
   '«Hola, dragón», digo. «¿Tienes algo para mí?»',
   'Miro el dragón. Miro la boca. Miro debajo del dragón. Y allí, entre las piedras, hay un sobre pequeño.',
   'Abro el sobre. Hay una foto. En la foto hay una iglesia muy alta, con muchas torres.',
   {t:'«Segunda pregunta: ¿Cuántas torres tiene? Haz una foto con la cámara.»',cls:'note'},
   'Leo mira la foto. «Es la Sagrada Familia», dice. «Pero tu juego... ¿quién es? ¿Quién hace esto?»',
   'Leo parece sorprendido. Pero, ¿por qué sonríe un poco?'
  ],
  quiz:[
   {q:'¿Cómo van al Park Güell?',o:['En metro y en autobús.','En taxi.','A pie desde casa.']},
   {q:'¿Qué dice la señora?',o:['Recto, a la derecha y a la izquierda.','Que no conoce el parque.','Que el parque está lejos.']},
   {q:'¿Dónde está el sobre?',o:['Debajo del dragón.','En la boca del dragón.','En un árbol.']},
   {q:'¿Qué hay en la foto?',o:['Una iglesia con muchas torres.','Un dragón.','La casa azul.']}
  ]},
 {ch:25,diff:2,title:'Las torres',
  tz:{de:'In der Sagrada Familia zählt Mia Türme, bezahlt Eintritt und findet die nächste Spur.',en:'At the Sagrada Familia Mia counts towers, pays for a ticket and finds the next clue.'},
  paras:[
   'Es sábado. Leo trabaja, entonces voy sola a la Sagrada Familia. Hay mucha gente delante de la iglesia. Gente de todo el mundo.',
   '«¿Cuánto cuesta la entrada?», pregunto en la taquilla.',
   '«Veintiséis euros», dice el chico. «Con estudiante, veintiuno.»',
   'Pago veintiún euros y entro. Delante de mí hay una familia de Suiza. Hablan alemán. Yo no digo nada. Hoy soy de Barcelona.',
   'Dentro, la iglesia es como un bosque. Las columnas son como árboles blancos. Por las ventanas entra luz de colores: azul, verde, rojo, amarillo. Es muy bonito. No digo nada. Solo miro.',
   'Después, salgo y cuento las torres. Una, dos, tres... Hay muchas. Algunas están terminadas. Otras no.',
   'Pregunto a una guía. «Perdón, ¿cuántas torres tiene la Sagrada Familia?»',
   '«Al final, va a tener dieciocho torres», dice la guía. «Pero todavía no están todas.»',
   'Dieciocho. Hago una foto con la cámara vieja. Clic.',
   'Entonces veo algo. En la puerta de una tienda de recuerdos hay un papel pequeño con una llave azul dibujada. Y un número: dieciocho.',
   'Debajo del número hay una dirección: «Calle Verdi, número cuarenta. Tienda de ropa.»'
  ],
  quiz:[
   {q:'¿Cuánto paga Mia por la entrada?',o:['Veintiún euros.','Veintiséis euros.','Dieciocho euros.']},
   {q:'¿Cómo es la iglesia por dentro?',o:['Como un bosque.','Muy oscura.','Pequeña.']},
   {q:'¿Cuántas torres va a tener?',o:['Dieciocho.','Doce.','Siete.']},
   {q:'¿Dónde está la próxima pista?',o:['En una tienda de ropa.','En el mercado.','En la playa.']}
  ]},
 {ch:26,diff:2,title:'La tienda de ropa',
  tz:{de:'Ein kleiner Kleiderladen in Gràcia. Mia probiert eine Jacke an, und in der Tasche steckt die nächste Karte.',en:'A small clothes shop in Gràcia. Mia tries on a jacket, and the next card is in the pocket.'},
  paras:[
   'La calle Verdi está en el barrio de Gracia. Es una calle estrecha, con tiendas pequeñas y bares.',
   'En el número cuarenta hay una tienda de ropa vintage. Entro. Hay ropa vieja de todos los colores: vestidos, camisas, pantalones, zapatos.',
   '«Hola, ¿te puedo ayudar?», dice la dependienta. Es una mujer mayor con gafas grandes.',
   '«Hola. Busco... no sé. Busco algo azul», digo.',
   'La mujer me mira con una sonrisa. «Algo azul. Claro. Tengo una chaqueta azul. ¿Qué talla tienes?»',
   '«Una M, creo.»',
   'La mujer me da una chaqueta azul, vieja y bonita. «Pruébatela. El probador está allí.»',
   'Me pruebo la chaqueta. Me queda un poco grande, pero me gusta mucho.',
   '«¿Cuánto cuesta?», pregunto.',
   '«Para ti, quince euros.»',
   'Pago con tarjeta. Después, en la calle, pongo la mano en el bolsillo de la chaqueta. Hay un papel.',
   {t:'«Tercera pregunta: ¿Qué tren azul sube a la montaña mágica? La respuesta está en tu casa nueva.»',cls:'note'},
   '¿Mi casa nueva? Yo no tengo casa nueva. Vivo en mi piso de siempre.',
   'Pero esa noche, mi teléfono suena. Es el dueño de mi piso.'
  ],
  quiz:[
   {q:'¿En qué barrio está la calle Verdi?',o:['En Gracia.','En el Born.','En la Barceloneta.']},
   {q:'¿Qué compra Mia?',o:['Una chaqueta azul.','Unos zapatos.','Un vestido rojo.']},
   {q:'¿Cómo le queda la chaqueta?',o:['Un poco grande.','Muy pequeña.','Perfecta.']},
   {q:'¿Dónde está el papel?',o:['En el bolsillo de la chaqueta.','En la caja.','Debajo de la puerta.']}
  ]},
 {ch:27,diff:1,title:'Un problema con el piso',
  tz:{de:'Der Vermieter braucht die Wohnung zurück. Mia muss bis Februar etwas Neues finden.',en:'The landlord needs the flat back. Mia has to find a new place by February.'},
  paras:[
   'El dueño de mi piso se llama señor Ruiz. Es un hombre amable, pero hoy tiene una mala noticia.',
   '«Lo siento, Mia. Mi hija viene a Barcelona en febrero. Necesita el piso. Tienes que salir el treinta y uno de enero.»',
   '¿Salir? ¿En tres semanas? Me siento en la cama. Miro mi piso: la ventana grande, la cama vieja, el mar. Me gusta mucho mi piso.',
   'Pienso en mi primer día en este piso: la luna en el mar, la llave en mi maleta, la nota. Pero no hay otra opción. Necesito un piso nuevo.',
   'Esa noche cuento mi dinero. No es mucho. Al día siguiente, busco en internet. Hay muchos pisos, pero son muy caros. Un piso pequeño en el centro cuesta mil euros al mes. ¡Mil euros!',
   'Hay habitaciones en pisos compartidos. Son más baratas: entre cuatrocientos y seiscientos euros.',
   'Quiero hablar con Leo. Le escribo un mensaje: «Necesito un piso. ¡Ayuda!»',
   'Leo responde: «Tranquila. Mañana vamos a ver pisos juntos. Conozco el barrio de Gracia muy bien.»',
   'Gracia. La calle Verdi está en Gracia. La tienda de ropa está en Gracia.',
   'Y el papel dice: «La respuesta está en tu casa nueva.»',
   '¿Cómo sabe el papel que necesito una casa nueva?'
  ],
  quiz:[
   {q:'¿Quién es el señor Ruiz?',o:['El dueño del piso.','El abuelo de Leo.','Un profesor.']},
   {q:'¿Por qué tiene que salir Mia?',o:['La hija del dueño necesita el piso.','El piso es muy caro.','Hay un problema con la ventana.']},
   {q:'¿Cuánto cuesta un piso pequeño en el centro?',o:['Mil euros al mes.','Quince euros.','Cien euros.']},
   {q:'¿Qué barrio conoce bien Leo?',o:['Gracia.','La Barceloneta.','Zúrich.']}
  ]},
 {ch:28,diff:1,title:'Me duele la cabeza',
  tz:{de:'Fieber, Kopfweh und ein Besuch beim Arzt. Laia bringt Medizin und weiss vielleicht mehr, als sie sagt.',en:'Fever, a headache and a visit to the doctor. Laia brings medicine and may know more than she says.'},
  paras:[
   'Por la mañana me levanto y no me siento bien. Me duele la cabeza. Me duele la garganta. Tengo mucho calor y después mucho frío.',
   'Tengo fiebre. Treinta y ocho grados.',
   'Escribo a Leo: «Hoy no puedo ver pisos. Estoy enferma.»',
   'Voy al médico. El centro de salud está cerca de mi casa. Espero una hora en la sala de espera.',
   '«¿Usted es estudiante?», pregunta la médica. «Sí.» «¿Y qué le pasa?»',
   '«Me duele la cabeza y la garganta. Y tengo fiebre.»',
   'La médica mira mi garganta. Escucha mi corazón. «Es la gripe», dice. «Tiene que descansar tres o cuatro días. Beba mucha agua. Y tome estas pastillas cada ocho horas.»',
   'Voy a la farmacia y compro las pastillas. Después vuelvo a casa y me acuesto. No veo la tele. No leo. Solo duermo.',
   'A las cuatro, alguien llama a la puerta. Es Laia, la hermana de Leo. Tiene una bolsa con naranjas y una botella de zumo.',
   '«Leo trabaja», dice Laia. «Entonces vengo yo. Y hay sopa de mi madre. Para los enfermos, siempre es la misma sopa.»',
   'Laia ve la cámara vieja en mi mesa. Sus ojos se abren mucho. Después mira a otro lado, muy rápido.',
   '«Bonita cámara», dice. Pero su voz es rara.',
   '¿Laia sabe algo?'
  ],
  quiz:[
   {q:'¿Qué le duele a Mia?',o:['La cabeza y la garganta.','La mano.','Los ojos.']},
   {q:'¿Qué tiene Mia?',o:['La gripe.','Un problema con el piso.','Una pierna rota.']},
   {q:'¿Cada cuántas horas toma las pastillas?',o:['Cada ocho horas.','Cada hora.','Cada día.']},
   {q:'¿Qué hace Laia cuando ve la cámara?',o:['Mira a otro lado muy rápido.','Hace una foto.','Se ríe mucho.']}
  ]},
 {ch:29,diff:2,title:'Tres pisos',
  tz:{de:'Wohnungssuche in Gràcia: zu dunkel, zu teuer, und dann ein Zimmer mit Balkon.',en:'Flat hunting in Gràcia: too dark, too expensive, and then a room with a balcony.'},
  paras:[
   'Una semana después, estoy bien otra vez. Hoy Leo y yo vamos a ver tres pisos en Gracia.',
   'El primer piso es muy oscuro. La habitación no tiene ventana. «No, gracias», digo.',
   'El segundo piso es bonito y grande, pero es muy caro: setecientos euros por una habitación. Es más caro que mi piso de ahora.',
   'El tercer piso está en la calle Verdi. Sí, en la calle Verdi. Número cuarenta y dos. Al lado de la tienda de ropa.',
   'Es un piso compartido en el tercer piso de un edificio viejo. No hay ascensor. Seguimos por la escalera: uno, dos, tres pisos.',
   'Una chica abre la puerta. «¡Hola! Soy Marta. Pasad, pasad.»',
   'El piso tiene un salón con muchas plantas, una cocina pequeña, un baño y tres habitaciones. La habitación libre es pequeña, pero tiene un balcón. Desde el balcón veo la calle y los tejados.',
   '«Cuesta cuatrocientos cincuenta euros al mes, con agua y luz», dice Marta. «Y hay un supermercado a la derecha y una farmacia a la izquierda.»',
   'Es más pequeño que mi piso de ahora. Pero es más barato, y yo no tengo mucho dinero. Y es más bonito. Y tiene un balcón.',
   '«Me gusta mucho», digo. «¿Cuándo puedo entrar?»',
   '«El primero de febrero», dice Marta. «Perfecto, ¿no?»',
   'Miro a Leo. Leo mira el techo. Silba una canción. La puerta azul.'
  ],
  quiz:[
   {q:'¿Cómo es el primer piso?',o:['Muy oscuro.','Muy caro.','Muy grande.']},
   {q:'¿Dónde está el tercer piso?',o:['En la calle Verdi.','En la Barceloneta.','En la plaza del Sol.']},
   {q:'¿Qué tiene la habitación libre?',o:['Un balcón.','Un baño grande.','Dos ventanas.']},
   {q:'¿Cuánto cuesta la habitación?',o:['Cuatrocientos cincuenta euros.','Setecientos euros.','Mil euros.']}
  ]},
 {ch:30,diff:1,title:'La mudanza',
  tz:{de:'Kisten schleppen, drei Stockwerke ohne Lift, und zwei neue Mitbewohner.',en:'Carrying boxes up three floors with no lift, and two new flatmates.'},
  paras:[
   'Es el primero de febrero. Hoy es mi mudanza.',
   'No tengo muchas cosas: dos maletas, tres cajas, mis libros, la radio... no, la radio no. La radio está en la casa azul. Pero tengo la cámara y la llave azul.',
   'Leo tiene un coche pequeño. Ponemos todo en el coche. Después, en la calle Verdi, subimos todo por la escalera. Tres pisos. Sin ascensor.',
   '«Tu caja de libros pesa mucho», dice Leo.',
   '«Lo siento. Me gustan los libros.»',
   'En el piso, Marta nos espera con pizza. Y hay un chico también.',
   '«Este es Pau», dice Marta. «Vive aquí también.»',
   'Marta trabaja en el hospital. «Mucho trabajo y poco dinero», dice. «Pero me gusta.»',
   'Pau es alto, tiene barba y lleva gafas. Es de Valencia. Es cocinero y trabaja en un restaurante en el centro. Marta es de Madrid. Es enfermera y trabaja en un hospital.',
   '«Y tú, Mia, ¿qué haces?», pregunta Pau.',
   '«Soy estudiante. Estudio economía. Y soy de Suiza.»',
   '«¡Suiza! ¿Tienes chocolate?», dice Pau. Todos se ríen.',
   'Comemos pizza en el salón. Es mi primera noche en mi casa nueva. Me siento bien. Me siento en casa.'
  ],
  quiz:[
   {q:'¿Qué tiene Leo?',o:['Un coche pequeño.','Un piso grande.','Una tienda.']},
   {q:'¿De dónde es Pau?',o:['De Valencia.','De Madrid.','De Suiza.']},
   {q:'¿Qué es Marta?',o:['Enfermera.','Cocinera.','Estudiante.']},
   {q:'¿Qué comen en el salón?',o:['Pizza.','Paella.','Uvas.']}
  ]},
 {ch:31,diff:2,title:'Debajo de la puerta',
  tz:{de:'Am ersten Morgen in der neuen Wohnung liegt ein Umschlag unter Mias Tür. Wer kennt die neue Adresse schon?',en:'On her first morning in the new flat an envelope lies under Mia\'s door. Who already knows the new address?'},
  paras:[
   'Es domingo. Me despierto en mi habitación nueva. Por la ventana entra el sol. Escucho los pájaros en el balcón.',
   'Me levanto y abro la puerta de la habitación. En el suelo, debajo de la puerta, hay un sobre.',
   '«¿Quién está ahí?», pregunto. Nadie. Mi corazón hace bum, bum. Abro el sobre.',
   {t:'«Bienvenida a tu casa nueva, Mia. Tercera pregunta, otra vez: ¿Qué tren azul sube a la montaña mágica? Sábado. A las once. Lleva la cámara.»',cls:'note'},
   'Voy a la cocina. Marta está allí con un café.',
   '«Marta, ¿quién pone este sobre debajo de mi puerta?»',
   '«¿Qué sobre?», dice Marta. «Yo no sé nada. Pero... ¡qué misterio!» Marta sonríe y bebe su café.',
   'Pau entra en la cocina. Lleva un pijama de dinosaurios.',
   '«Pau, ¿tú sabes algo de este sobre?»',
   '«¿Sobre? Yo solo sé cocinar», dice Pau. «¿Quieres huevos?» Y prepara huevos, pan con tomate y un café con leche. Es un desayuno perfecto.',
   'Nadie sabe nada. Pero alguien sabe mi dirección nueva. Solo cinco personas saben mi dirección nueva: mi abuela, Joan, Leo, Laia y mi madre.',
   'Y la montaña mágica... Busco en el teléfono. ¡Claro! El Tibidabo. Y el tren azul es el Tramvia Blau, un tranvía muy viejo.'
  ],
  quiz:[
   {q:'¿Dónde está el sobre?',o:['Debajo de la puerta.','En la cocina.','En el balcón.']},
   {q:'¿Qué lleva Pau?',o:['Un pijama de dinosaurios.','Una chaqueta azul.','Un abrigo.']},
   {q:'¿Cuántas personas saben la dirección nueva?',o:['Cinco.','Dos.','Ninguna.']},
   {q:'¿Cuál es la montaña mágica?',o:['El Tibidabo.','El Park Güell.','La Sagrada Familia.']}
  ]},
 {ch:32,diff:2,title:'Cena con sospechosos',
  tz:{de:'Abendessen im Restaurant mit der Grossmutter und Joan. Mia macht eine Liste der Verdächtigen.',en:'Dinner at a restaurant with grandmother and Joan. Mia makes a list of suspects.'},
  paras:[
   'El miércoles ceno con mi abuela y Joan en un restaurante pequeño cerca de la casa azul.',
   '«¿Qué van a tomar?», pregunta el camarero.',
   '«De primero, una ensalada», dice mi abuela. «Y de segundo, pescado con patatas.»',
   '«Para mí, sopa de primero y pollo de segundo», dice Joan.',
   '«Yo quiero la ensalada también. Y de segundo, el arroz negro, por favor», digo.',
   '«¿Y para beber?»',
   '«Agua para todos», dice mi abuela. «Y una copa de vino tinto para mí.»',
   'Mientras comemos, hablo del juego. Saco un papel y escribo los sospechosos:',
   {t:'Mi madre: está en Zúrich. No. Joan: no es su voz. No. Mi abuela: ¿una cámara? No. Laia: sabe algo. Quizás. Leo: siempre sonríe. Quizás.',cls:'note'},
   'Mi abuela mira mi lista y se ríe.',
   '«¿Tú sabes quién es, abuela?»',
   '«Yo no digo nada», dice mi abuela. «Pero un juego es más bonito sin respuestas.»',
   '«¿Otra copa de vino, abuela?» «No, gracias. Una es suficiente.» La cena es muy buena. De postre tomamos flan. Después, Joan pide la cuenta. «Hoy invito yo», dice.',
   'Mi abuela y Joan se miran como dos jóvenes. Yo miro mi lista. Laia. Leo. ¿O los dos?'
  ],
  quiz:[
   {q:'¿Qué toma la abuela de segundo?',o:['Pescado con patatas.','Pollo.','Arroz negro.']},
   {q:'¿Qué beben?',o:['Agua y una copa de vino.','Zumo de naranja.','Café con leche.']},
   {q:'¿Quién paga la cuenta?',o:['Joan.','Mia.','La abuela.']},
   {q:'¿Quiénes son los sospechosos al final?',o:['Laia y Leo.','Marta y Pau.','La madre de Mia.']}
  ]},
 {ch:33,diff:2,title:'El tranvía azul',
  tz:{de:'Mit der alten blauen Tram auf den Tibidabo. Oben ist es windig, und am Riesenrad wartet ein Foto.',en:'Up the Tibidabo on the old blue tram. It is windy at the top, and a photo is waiting at the Ferris wheel.'},
  paras:[
   'Es sábado. Son las once. Estoy en la parada del Tramvia Blau. Llevo mi chaqueta azul y la cámara vieja.',
   'Hoy no hace sol. Hay nubes y hace viento. Hace un poco de frío.',
   'El tranvía es azul y muy viejo, como de una película. Subo. Despacio, muy despacio, el tranvía sube la montaña.',
   'Después del tranvía, tomo el funicular. Arriba, en el Tibidabo, hay una iglesia y un parque de atracciones muy viejo.',
   'Abajo, la ciudad parece un juego. Desde arriba veo toda Barcelona: el mar, la Sagrada Familia, las casas, las calles. La ciudad es enorme. Y es preciosa.',
   'Busco una pista. En el parque de atracciones hay una noria. Delante de la noria, un hombre vende billetes.',
   '«Un billete, por favor.»',
   'El hombre me da el billete. Y un sobre. «Para la chica de la chaqueta azul», dice.',
   '«¿Quién le da este sobre?»',
   '«Un chico joven. No sé su nombre.»',
   'Subo a la noria. Arriba, el viento es fuerte. Abro el sobre. ¿Qué es esto? Hay una foto del Bar Sol. Y una frase:',
   {t:'«Última pregunta: ¿Quién soy yo? La respuesta, el sábado que viene, a las ocho de la tarde, en el Bar Sol.»',cls:'note'},
   'Bajo de la noria. Sigo la pista con el corazón muy rápido. Un chico joven. Leo. Tiene que ser Leo. ¿O no?'
  ],
  quiz:[
   {q:'¿Qué tiempo hace en el Tibidabo?',o:['Hay nubes y hace viento.','Hace mucho calor.','Llueve mucho.']},
   {q:'¿Qué ve Mia desde arriba?',o:['Toda Barcelona.','Solo el mar.','Zúrich.']},
   {q:'¿Quién le da el sobre al hombre de la noria?',o:['Un chico joven.','Una mujer mayor.','Laia.']},
   {q:'¿Dónde está la respuesta?',o:['En el Bar Sol.','En la noria.','En la casa azul.']}
  ]},
 {ch:34,diff:1,title:'Una semana larga',
  tz:{de:'Leo ist eine Woche in Valencia. Mia merkt, wie sehr sie ihn vermisst.',en:'Leo is in Valencia for a week. Mia realises how much she misses him.'},
  paras:[
   'El domingo, Leo me escribe: «Hola. Esta semana estoy en Valencia. Tengo tres conciertos con mi grupo. Vuelvo el sábado.»',
   'El sábado. Justo el sábado del Bar Sol.',
   'El lunes estudio en la biblioteca. Miro el teléfono. No hay mensajes de Leo.',
   'El martes voy a clase de español. Carmen dice: «Mia, tu español es muy bueno ahora. ¿Tienes un profesor en casa?» Me río. «No. Tengo un camarero.»',
   'Yo tampoco duermo bien esta semana. El miércoles ceno con Marta y Pau. Pau cocina una paella valenciana, de verdad, con pollo y conejo. Está muy buena.',
   '«Pau, ¿cómo es Valencia?», pregunto.',
   '«Bonita. Pero Barcelona es más bonita. ¿Por qué? ¿Piensas en alguien en Valencia?» Marta y Pau se miran y sonríen.',
   'El jueves, Leo me manda una foto: él con su guitarra en un escenario. Debajo escribe: «Te echo de menos.»',
   'Leo me echa de menos. Miro la foto mucho tiempo. Y lo sé: yo también le echo de menos. Mucho.',
   'El jueves hace viento y hay nubes. Como yo: un día gris.',
   'El viernes no duermo bien. Pienso en el Bar Sol. Pienso en la última pregunta. ¿Quién soy yo?',
   'Y pienso en Leo.'
  ],
  quiz:[
   {q:'¿Dónde está Leo esta semana?',o:['En Valencia.','En Zúrich.','En el Tibidabo.']},
   {q:'¿Qué cocina Pau?',o:['Una paella valenciana.','Una pizza.','Sopa.']},
   {q:'¿Qué escribe Leo debajo de la foto?',o:['«Te echo de menos.»','«Feliz año nuevo.»','«¿Quién soy yo?»']},
   {q:'¿En quién piensa Mia el viernes?',o:['En Leo.','En el señor Ruiz.','En Carmen.']}
  ]},
 {ch:35,diff:2,title:'El carrete',
  tz:{de:'Mia lässt den Film der alten Kamera entwickeln. Auf den Fotos ist jemand, mit dem sie nicht gerechnet hat.',en:'Mia has the old camera\'s film developed. Someone unexpected is in the photos.'},
  paras:[
   'El viernes por la tarde, tengo una idea. La cámara vieja tiene un carrete. Un carrete de fotos de verdad, no digital.',
   'Busco una tienda de fotos. Hay una en la calle Verdi, claro. Todo está en la calle Verdi.',
   '«¿Puede revelar este carrete?», pregunto.',
   '«Sí. Está listo en una hora», dice el hombre de la tienda.',
   'Espero en un café. Una hora es muy larga.',
   'Después, el hombre me da un sobre con fotos. Las miro en la calle.',
   'Hay mi foto de la Sagrada Familia. Pero hay más fotos. Muchas más. Y en todas las fotos... estoy yo.',
   'Yo en el mercado, con fresas. Yo en la playa, con un helado de limón. Yo en el concierto del Born, con mi abuela. Yo en el Bar Sol, con un café.',
   'Son fotos de antes del juego. Alguien hace fotos de mí desde hace semanas.',
   'Pero no tengo miedo. Las fotos son bonitas. En todas sonrío. Son fotos hechas con cariño.',
   'La última foto es diferente. No estoy yo. Es una mano con una púa de guitarra. Una púa azul.',
   'Conozco esa púa. Es la púa de Leo.'
  ],
  quiz:[
   {q:'¿Qué hay en la cámara?',o:['Un carrete de fotos.','Una carta.','Una llave.']},
   {q:'¿Quién está en casi todas las fotos?',o:['Mia.','Leo.','La abuela.']},
   {q:'¿Cómo son las fotos?',o:['Bonitas, hechas con cariño.','Oscuras y tristes.','Muy viejas.']},
   {q:'¿Qué hay en la última foto?',o:['Una mano con una púa azul.','El Bar Sol.','La noria.']}
  ]},
 {ch:36,diff:2,title:'Laia habla',
  tz:{de:'Laia kann kein Geheimnis mehr für sich behalten. Aber die wichtigste Antwort gibt sie Mia nicht.',en:'Laia can\'t keep the secret any longer. But she won\'t give Mia the most important answer.'},
  paras:[
   'Con las fotos en la mano, voy a casa de Joan. Laia está allí, haciendo los deberes en la mesa del salón.',
   '«Laia, tenemos que hablar», digo. Pongo las fotos en la mesa.',
   'Laia mira las fotos. Mira la púa azul. Se pone roja.',
   '«Vale, vale», dice Laia. «Pero el juego no es mi problema. Yo solo ayudo. Yo hago algunas fotos. Y yo escribo las tarjetas. Mi letra es más bonita.»',
   '«¿Y la voz de la radio?»',
   '«Soy yo también. Con un programa del ordenador, la voz es diferente.» Laia está muy orgullosa.',
   '«Pero el juego no es tu idea, ¿verdad?»',
   'Laia no dice nada. Mira por la ventana.',
   '«Laia. ¿Es la idea de Leo?»',
   '«No puedo decir nada», dice Laia. «Es la regla número uno. Pero mañana es sábado. Y mañana, a las ocho, tienes tu respuesta.»',
   'Después, Laia me mira muy seria. «Mia, una cosa. Mañana ponte guapa. Muy guapa.»',
   'Y se ríe, como una niña pequeña.'
  ],
  quiz:[
   {q:'¿Qué hace Laia en el salón?',o:['Los deberes.','La cena.','Un concierto.']},
   {q:'¿Quién escribe las tarjetas?',o:['Laia.','Leo.','La abuela.']},
   {q:'¿Cómo hace Laia la voz de la radio?',o:['Con un programa del ordenador.','Con la voz de Joan.','No sabe.']},
   {q:'¿Qué dice Laia al final?',o:['Que mañana Mia tiene que ponerse guapa.','Que el juego termina.','Que Leo está enfermo.']}
  ]},
 {ch:37,diff:1,title:'¿Qué me pongo?',
  tz:{de:'Was zieht man an, wenn man nicht weiss, was einen erwartet? Marta und Pau haben klare Meinungen.',en:'What do you wear when you don\'t know what to expect? Marta and Pau have strong opinions.'},
  paras:[
   'Es sábado. Son las cinco de la tarde. Faltan tres horas.',
   'Abro mi armario. Tengo vaqueros, jerseys, camisetas... y nada especial.',
   '«Marta, ¡ayuda!», grito.',
   'Marta entra en mi habitación. Pau también. Pau lleva un delantal de cocinero.',
   '«A ver», dice Marta. «¿Esta falda negra? ¿Con esta camisa blanca?»',
   'Me pruebo la falda y la camisa. Me miro en el espejo.',
   '«Muy seria», dice Pau. «Parece una entrevista de trabajo.»',
   '«¿Y este vestido verde?»',
   'Me pruebo el vestido verde. Es bonito, pero hace frío en febrero.',
   '«¿Y si hace frío?», pregunta Pau.',
   '«Si hace frío, medias negras, botas y la chaqueta azul», dice Marta. «Perfecto.»',
   'Me ducho otra vez. Me visto. Me miro en el espejo: vestido verde, botas negras, chaqueta azul. Me peino. Me pinto un poco los ojos.',
   '«Estás guapísima», dice Marta.',
   '«¿Y la cámara?», pregunta Pau.',
   '«Claro. La cámara y la llave azul. Siempre.»',
   '«¿Y los zapatos?», pregunta Pau. «Las botas. Ya está.» Son las siete y media. Salgo de casa. El corazón me hace bum, bum, bum.'
  ],
  quiz:[
   {q:'¿Qué hay en el armario de Mia?',o:['Vaqueros, jerseys y camisetas.','Muchos vestidos de fiesta.','Nada.']},
   {q:'¿Por qué no la falda negra?',o:['Porque es muy seria.','Porque es muy pequeña.','Porque es roja.']},
   {q:'¿Qué lleva Mia al final?',o:['Un vestido verde, botas y la chaqueta azul.','Una falda y una camisa.','Un pijama.']},
   {q:'¿A qué hora sale de casa?',o:['A las siete y media.','A las cinco.','A las ocho y media.']}
  ]},
 {ch:38,diff:2,title:'¿Quién soy yo?',
  tz:{de:'Die Bar Sol ist dunkel, nur Kerzen und das blaue Radio. Endlich die Antwort auf die letzte Frage.',en:'Bar Sol is dark, only candles and the blue radio. At last the answer to the final question.'},
  paras:[
   'Son las ocho en punto. Estoy delante del Bar Sol. La puerta está cerrada, pero hay luz dentro. Luz de velas.',
   'Abro la puerta. El bar está vacío. No hay gente. Solo hay velas en las mesas, flores... y en la barra, la radio azul.',
   'La radio empieza a sonar. Es una canción. La puerta azul. Pero no es la voz de mi abuela. Es la voz de un chico. Y una guitarra.',
   'Entonces, alguien sale de la cocina. Lleva una camisa blanca y tiene una púa azul en la mano.',
   'Leo.',
   '«Hola, Mia», dice. Está muy nervioso. «Tú tienes una pregunta: ¿quién soy yo?»',
   '«Sí.»',
   '«Soy un chico tímido», dice Leo. «Un chico que trabaja en un bar y toca la guitarra. Un chico que no sabe hablar de cosas importantes. Por eso, el juego. Quiero enseñarte mi Barcelona. El dragón, las torres, la montaña...»',
   '«¿Y las fotos?»',
   '«Las fotos son de Laia y de mí. Perdón. Es un poco raro, ¿no?»',
   '«¿Y mi piso nuevo? ¿Cómo sabes que necesito un piso nuevo?»',
   'Leo sonríe. «El señor Ruiz toma café en mi bar cada mañana. Él me habla de su hija. Y Marta es amiga de Laia. La habitación de la calle Verdi, el sobre debajo de tu puerta... Marta y Pau ayudan mucho.»',
   '«Un poco raro», digo. «Pero muy bonito.»',
   'Leo respira. «Mia, tengo una pregunta. Una pregunta de verdad. ¿Quieres salir conmigo?»',
   'Saco la llave azul de mi bolsillo. La miro. Mi abuela dice: una llave es una pregunta.',
   '«Sí», digo. «Sí quiero.»',
   'Detrás de la barra, alguien grita «¡Sí!». Es Laia. Y detrás de Laia, mi abuela y Joan. Todos aplauden.'
  ],
  quiz:[
   {q:'¿Cómo está el Bar Sol?',o:['Vacío, con velas y flores.','Lleno de gente.','Cerrado y oscuro.']},
   {q:'¿Quién sale de la cocina?',o:['Leo.','Pau.','Joan.']},
   {q:'¿Por qué hace Leo el juego?',o:['Porque es tímido.','Porque quiere dinero.','Porque Laia quiere.']},
   {q:'¿Qué pregunta Leo?',o:['Si Mia quiere salir con él.','Si tiene la llave.','Si le gusta el bar.']}
  ]},
 {ch:39,diff:1,title:'Planes',
  tz:{de:'Prüfungen, Pläne für den Sommer und eine Frage, die Mia sich selbst stellen muss.',en:'Exams, summer plans and a question Mia has to ask herself.'},
  paras:[
   'Ahora es marzo. En Barcelona ya hace calor por la tarde. Hay flores en los árboles de la calle Verdi.',
   'Leo y yo estamos juntos. Leo me enseña a cocinar paella. Bueno, intenta. Es fácil estar con Leo. Hablamos mucho, nos reímos mucho. Los domingos comemos en casa de mi abuela y Joan.',
   'Pero en abril tengo exámenes en la universidad. Estudio mucho en la biblioteca. Leo también estudia para sus exámenes de música.',
   'Una tarde, en el balcón, Leo pregunta: «Mia, ¿qué vas a hacer en verano?»',
   'Es una buena pregunta. Mi semestre en Barcelona termina en junio. Después, tengo que volver a Suiza.',
   '«No sé», digo. «En julio voy a Zúrich. Voy a ver a mis padres. Y después... no sé.»',
   '«¿Vas a volver a Barcelona?»',
   'Miro la calle. Miro los tejados. Miro a Leo.',
   '«Voy a pensar», digo. «Pero creo que sí. Creo que mi casa está aquí también.»',
   'Leo sonríe. «Mi abuelo dice que en tu familia todas las mujeres vuelven a Barcelona. Tarde o temprano.»',
   '«Tu abuelo tiene razón», digo. «Pero yo no voy a esperar cincuenta años.»'
  ],
  quiz:[
   {q:'¿Qué tiempo hace en marzo?',o:['Ya hace calor por la tarde.','Hace mucho frío.','Llueve cada día.']},
   {q:'¿Qué tiene Mia en abril?',o:['Exámenes.','Un concierto.','Su cumpleaños.']},
   {q:'¿Cuándo termina el semestre?',o:['En junio.','En marzo.','En diciembre.']},
   {q:'¿Qué dice Mia al final?',o:['Que no va a esperar cincuenta años.','Que no vuelve nunca.','Que se va a Valencia.']}
  ]},
 {ch:40,diff:2,title:'Una llave para Leo',
  tz:{de:'Das Ende von A1. Mia lässt einen Schlüssel nachmachen und stellt ihre eigene Frage.',en:'The end of A1. Mia has a key copied and asks her own question.'},
  paras:[
   'Es el último día de abril. Mis exámenes terminan hoy. Salgo de la universidad y no voy a casa. Voy a una tienda pequeña en la calle Verdi. Una ferretería.',
   '«Hola. ¿Puede hacer una copia de esta llave?»',
   'El hombre mira mi llave azul. «Es una llave muy vieja. Pero sí. Vuelve en veinte minutos.»',
   'Veinte minutos después, tengo dos llaves: la llave vieja de mi abuela y una llave nueva. La llave nueva no es azul. Es gris. Entonces compro un poco de pintura azul.',
   'Por la noche, en mi habitación, pinto la llave nueva de azul.',
   'El sábado voy con Leo a la playa. Es temprano. No hay gente. Solo el mar, el sol y nosotros dos.',
   '«Tengo algo para ti», digo. Le doy una caja pequeña.',
   'Leo abre la caja. Dentro está la llave nueva, azul.',
   '«Mi abuela dice que una llave es una pregunta», digo. «Esta es mi pregunta: ¿quieres abrir conmigo todas las puertas de Barcelona? Las puertas azules, las rojas, las verdes... todas.»',
   'Leo mira la llave. Me mira a mí. Se ríe y llora al mismo tiempo.',
   '«Sí», dice. «Todas.»',
   'El sol sube detrás del mar. Barcelona se despierta. Y yo pienso: mi español es todavía pequeño. Pero mi historia aquí es muy grande.',
   {t:'Fin de la segunda parte',cls:'voice'}
  ],
  quiz:[
   {q:'¿Dónde copia Mia la llave?',o:['En una ferretería.','En una tienda de ropa.','En el mercado.']},
   {q:'¿De qué color es la llave nueva al principio?',o:['Gris.','Azul.','Roja.']},
   {q:'¿Dónde le da Mia la llave a Leo?',o:['En la playa.','En el Bar Sol.','En el Tibidabo.']},
   {q:'¿Qué responde Leo?',o:['«Sí. Todas.»','«No, gracias.»','«No sé.»']}
  ]}
];
