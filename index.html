function wrapAll(x,t,X,y,maxW,lh){const ws=String(t).split(' ');let line='';for(const w of ws){const test=line?line+' '+w:w;if(x.measureText(test).width>maxW&&line){x.fillText(line,X,y);y+=lh;line=w;}else line=test;}if(line){x.fillText(line,X,y);y+=lh;}return y;}
function pageBg(x,W,H,c1,c2){const g=x.createRadialGradient(W/2,H*.35,50,W/2,H*.35,H);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;x.fillRect(0,0,W,H);rays(x,W/2,H*.35,H*1.3,'rgba(255,255,255,.035)',36);}
function slotEmpty(x,X,Y,W,e,label){const H=W*88/63;x.save();rr(x,X,Y,W,H,W*.06);x.fillStyle='rgba(255,255,255,.04)';x.fill();x.setLineDash([W*.04,W*.03]);x.lineWidth=Math.max(2,W*.01);x.strokeStyle='rgba(255,255,255,.22)';x.stroke();x.setLineDash([]);
  x.textAlign='center';x.fillStyle='rgba(255,255,255,.16)';x.font=`400 ${W*.3}px Bungee`;x.fillText('?',X+W/2,Y+H/2+W*.1);x.font=`800 ${W*.07}px Outfit`;x.fillStyle='rgba(255,255,255,.4)';x.fillText(num(e.n),X+W/2,Y+W*.14);if(label){x.font=`700 ${W*.06}px Outfit`;x.fillText(label,X+W/2,Y+H-W*.08);}x.textAlign='left';x.restore();}
function drawColPage(x,W,H,c,o){
  o=o||{};const st=colState(c);pageBg(x,W,H,c.color[1],'#0a0b16');
  const top=H*.045,u=W/100;
  // header band
  const hb=x.createLinearGradient(0,0,W,0);hb.addColorStop(0,c.color[0]);hb.addColorStop(1,c.color[1]);rr(x,4*u,top,W-8*u,25*u,3*u);x.fillStyle=hb;x.fill();
  x.save();rr(x,4*u,top,W-8*u,25*u,3*u);x.clip();rays(x,W*.85,top+11*u,60*u,'rgba(255,255,255,.08)',24);x.restore();
  x.fillStyle='rgba(255,255,255,.75)';x.font=`800 ${2.2*u}px Outfit`;if('letterSpacing' in x)x.letterSpacing=(.5*u)+'px';x.fillText('COLECCIÓN',8*u,top+6.5*u);if('letterSpacing' in x)x.letterSpacing='0px';
  x.fillStyle='#fff';x.font=`400 ${6.4*u}px Bungee`;x.fillText(c.title.toUpperCase(),8*u,top+13.5*u);
  x.font=`500 ${2.3*u}px Outfit`;x.fillStyle='rgba(255,255,255,.9)';wrapText(x,tr(c.intro),8*u,top+18.6*u,W-30*u,3*u,2);
  x.textAlign='right';x.font=`400 ${4.2*u}px Bungee`;x.fillStyle=st.gold?'#ffe07a':'#fff';x.fillText(st.gold?'ORO':st.have+'/'+st.slots.length,W-8*u,top+14*u);x.textAlign='left';
  // grid 4x3
  const cols=4,gap=2.6*u,cw=(W-8*u-gap*(cols-1))/cols,chh=cw*88/63,gy=top+28.5*u;
  st.slots.forEach((s,i)=>{const X=4*u+(i%cols)*(cw+gap),Y=gy+Math.floor(i/cols)*(chh+gap*1.4);const e=LEX[s.w];
    if(!s.caught)slotEmpty(x,X,Y,cw,e,'');
    else if(!s.sp){x.save();x.globalAlpha=.32;drawCard(x,e,'normal',X,Y,cw);x.restore();x.save();x.textAlign='center';x.font=`800 ${cw*.07}px Outfit`;x.fillStyle='#fff';rr(x,X+cw*.18,Y+chh/2-cw*.07,cw*.64,cw*.13,cw*.065);x.fillStyle='rgba(0,0,0,.6)';x.fill();x.fillStyle='#fff';x.fillText('FALTA',X+cw/2,Y+chh/2+cw*.025);x.restore();}
    else drawCard(x,e,s.v,X,Y,cw);});
  const by=gy+3*chh+2*gap*1.4+3*u;
  if(o.footer!==false){x.textAlign='center';x.font=`700 ${2.4*u}px Outfit`;x.fillStyle=st.complete?'#3ddc97':'rgba(255,255,255,.55)';
    x.fillText(st.complete?('Escena extra desbloqueada: '+c.scene.title):'Escena extra: completa la colección',W/2,Math.min(by,H-7*u));
    x.font=`600 ${1.9*u}px Outfit`;x.fillStyle='rgba(255,255,255,.45)';x.fillText(o.foot||('PALABRADEX · '+siteUrl().replace(/^https?:\/\//,'').replace(/\/$/,'')),W/2,H-3*u);x.textAlign='left';}
}

  x.fillStyle=c.color[0];rr(x,8*u,8*u,14*u,1*u,.5*u);x.fill();
  x.font=`800 ${2*u}px Outfit`;x.fillStyle='rgba(255,255,255,.6)';x.fillText('ESCENA EXTRA · '+c.title.toUpperCase(),8*u,14*u);

function drawCover(x,W,H,title,sub,lines){const u=W/100;pageBg(x,W,H,'#3a2a7a','#0a0b16');rays(x,W/2,H*.42,H,'rgba(255,203,61,.05)',30);

function drawAlbumPage(x,W,H,cards,pageNo,total){const u=W/100;pageBg(x,W,H,'#1d1846','#0a0b16');
  const cols=3,gap=3.2*u,cw=(W-12*u-gap*2)/cols,chh=cw*88/63,gy=(H-(3*chh+2*gap))/2-1*u;
  cards.forEach(([e,v],i)=>{drawCard(x,e,v,6*u+(i%cols)*(cw+gap),gy+Math.floor(i/cols)*(chh+gap),cw);});

function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s);});}
async function getPDF(){if(!(window.jspdf&&window.jspdf.jsPDF)){try{await loadScript('vendor/jspdf.umd.min.js');}catch(e){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');}}return window.jspdf.jsPDF;}
async function saveFile(name,blob){try{if(window.claude&&typeof window.claude.use==='function'){const d=await window.claude.use('downloads');if(d){await d.save({filename:name,data:blob});return true;}}}catch(e){}
  try{const a=document.createElement('a');a.style.display='none';a.rel='noopener';a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return true;}catch(e){return false;}}
let pdfBusy=false;
async function buildPdf(pages,name){if(pdfBusy)return;pdfBusy=true;const t0=toast('PDF wird erstellt...','',8000);
  try{await Promise.all(['400 60px Bungee','italic 400 30px Literata','400 30px Literata','800 30px Outfit','700 30px Outfit','600 30px Outfit','500 30px Outfit'].map(f=>document.fonts.load(f)));
    const jsPDF=await getPDF();const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
    const W=1240,H=1754;const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    for(let i=0;i<pages.length;i++){x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);x.textAlign='left';pages[i](x,W,H);if(i)doc.addPage();doc.addImage(c.toDataURL('image/jpeg',.9),'JPEG',0,0,210,297,undefined,'FAST');await new Promise(r=>setTimeout(r,0));}
    const ok=await saveFile(name,doc.output('blob'));toast(ok?'PDF bereit':'Download hier nicht möglich');}
  catch(e){toast('PDF konnte nicht erstellt werden');}
  pdfBusy=false;}

function albumPdf(){const cards=albumCards();if(!cards.length)return toast('Noch keine Spezialkarten');const per=9,total=Math.ceil(cards.length/per);

async function shareBlob(blob,fname,text,title){

  const url=blob?URL.createObjectURL(blob):'';pushModal();
  openModal(`<h2>${title}</h2>${url?`<img src="${url}" alt="${esc(title)}" style="width:100%;border-radius:14px;display:block;margin-bottom:10px">`:''}

   <div style="display:flex;gap:8px;flex-wrap:wrap">${url?`<a class="btn ghost" href="${url}" download="${esc(fname)}">Bild speichern</a>`:''}
   <a class="btn" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">WhatsApp</a>
   <button class="btn ghost" id="cpyB">Text kopieren</button></div>`);
  $('#cpyB').onclick=async()=>{try{await navigator.clipboard.writeText(text);toast('Text kopiert');}catch(err){toast('Kopieren nicht möglich');}};
}

function keyWords(st,n){n=n||5;const m=STATS[st.id]||{};const L=chainOf(st);const idx=L.indexOf(st);const before=new Set();

function conjPool(){return Object.keys(S.caught).filter(l=>{const e=LEX[l];return e&&e.p==='v'&&!e.noforms&&conjOf(e);});}

      $('#qfb').innerHTML=(ok?`<span style="color:var(--good)">¡Correcto!</span>${exact?'':` <span style="color:var(--mut)">Akzent: <b>${esc(ans)}</b></span>`}`:`<span style="color:var(--bad)">Richtig: <b>${esc(pron.split(' / ')[0])} ${esc(ans)}</b></span>`)

function examScopes(){const out=[];const add=(name,ids,es)=>{const st=ids.map(id=>STORIES.find(s=>s.id===id)).filter(Boolean);if(st.length)out.push({name,st,es});};

function readPassage(st,q){const paras=st.paras.map(p=>typeof p==='string'?p:(p&&!p.gram&&p.cls!=='note'?p.t:null)).filter(Boolean);if(!paras.length)return null;

function adjFormsSafe(k){try{return adjForms(k);}catch(e){return null;}}
function buildExam(sc){const Q=[];const pool=shuffle(sc.known.slice());const pick=(f,n)=>{const r=[];for(const l of pool){if(r.length>=n)break;if(f(LEX[l])&&!Q.some(q=>q.l===l)&&!r.includes(l))r.push(l);}return r;};
  const distr=(l,f)=>shuffle(sc.lem.filter(x=>x!==l&&LEX[x].p===LEX[l].p&&gl(LEX[x])!==gl(LEX[l]))).slice(0,3).map(f);
  pick(e=>true,9).forEach(l=>Q.push({t:'vocab',l,pts:1,q:`Was bedeutet <b class="exw">${esc(l)}</b>?`,opts:shuffle([gl(LEX[l]),...distr(l,x=>gl(LEX[x]))]),ans:gl(LEX[l])}));
  pick(e=>e.k.length>=3,6).forEach(l=>{const e=LEX[l];Q.push({t:'write',l,pts:2,q:`Schreib auf Spanisch: <b class="exw">${esc(gl(e))}</b>${e.g?` <small>(${e.g==='m'?'el':'la'} ...)</small>`:''}`,ans:e.k});});

  vpool.slice(0,5).forEach(l=>{const pi=[0,1,2,3,5][Math.floor(Math.random()*5)];Q.push({t:'conj',l,pts:2,q:`Konjugiere <b class="exw">${esc(l)}</b> für <b>${esc(PRON[pi])}</b>`,ans:conjOf(LEX[l])[pi]});});
  const g=[];const nouns=shuffle(sc.lem.filter(l=>LEX[l].p==='n'&&LEX[l].g));const adjs=shuffle(sc.lem.filter(l=>LEX[l].p==='adj'&&adjFormsSafe(l)));
  if(nouns[0]){const l=nouns[0],a=LEX[l].g==='m'?'el':'la';g.push({t:'gram',pts:1,q:`Welcher Artikel passt? <b class="exw">___ ${esc(l)}</b>`,opts:['el','la','los','las'],ans:a});}
  if(nouns[1]){const l=nouns[1],pl=plural(l);g.push({t:'gram',pts:1,q:`Mehrzahl von <b class="exw">${esc(l)}</b>?`,opts:shuffle([pl,l+'s',l+'es',l.replace(/[aeo]$/,'')+'is'].filter((x,i,a)=>a.indexOf(x)===i)).slice(0,4).concat([]),ans:pl});if(!g[g.length-1].opts.includes(pl))g[g.length-1].opts[0]=pl;}
  if(nouns[3]){const l=nouns[3],a=LEX[l].g==='m'?'un':'una';g.push({t:'gram',pts:1,q:`Unbestimmter Artikel: <b class="exw">___ ${esc(l)}</b>`,opts:['un','una','unos','unas'],ans:a});}
  if(adjs[1]&&nouns[4]){const n=nouns[4],af=adjFormsSafe(adjs[1]);if(af&&af[2]){const pl=plural(n);g.push({t:'gram',pts:1,q:`Welche Form passt? <b class="exw">${LEX[n].g==='m'?'los':'las'} ${esc(pl)} ___</b> <small>(${esc(gl(LEX[adjs[1]]))})</small>`,opts:shuffle([...new Set(af)]),ans:af[LEX[n].g==='m'?2:3]});}}
  if(adjs[0]&&nouns[2]){const n=nouns[2],af=adjFormsSafe(adjs[0]);const idx=LEX[n].g==='m'?0:1;g.push({t:'gram',pts:1,q:`Welche Form passt? <b class="exw">${LEX[n].g==='m'?'el':'la'} ${esc(n)} ___</b> <small>(${esc(gl(LEX[adjs[0]]))})</small>`,opts:shuffle([...new Set(af)]),ans:af[idx]});}
  const cl=STORIES.filter(s=>s.clase&&sc.st.includes(s)&&isDone(s));for(const c of shuffle(cl))for(const q of shuffle(c.quiz.slice())){if(g.length>=8)break;g.push({t:'gram',pts:1,q:esc(q.q),opts:shuffle(q.o.slice()),ans:q.o[0],sp:1});}
  shuffle(g).slice(0,5).forEach(x=>Q.push(x));

function runExam(sc){const Q=buildExam(sc);let i=0;const A=[];

      ${typed?`<div class="typein"><input id="tIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Antwort"><button class="btn" id="tOk">Weiter</button></div><div class="accents">${['á','é','í','ó','ú','ñ','ü'].map(c=>`<button data-ch="${c}">${c}</button>`).join('')}</div>`
       :`<div class="qopts trgrid">${q.opts.map((o,j)=>`<button class="qopt" data-o="${j}"><b class="kn">${j+1}</b>${esc(o)}</button>`).join('')}</div>`}`);

  function score(q,a){if(!q.opts){const v=String(a||'').toLowerCase().trim().replace(/^(el|la|los|las|un|una|yo|tú|él|ella|usted|nosotros|vosotros|ellos|ellas|ustedes)\s+/,'');const t=q.ans.toLowerCase(),t2=t.split(' ').pop();
      if(q.t==='write'&&q.l){const f=FORMS[v];if(f&&f.l===q.l)return q.pts;const nf=Object.keys(FORMS).find(k=>norm(k)===norm(v)&&FORMS[k].l===q.l);if(nf)return q.pts-.5;}
