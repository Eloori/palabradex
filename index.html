<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palabradex</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#0c0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Palabradex">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="description" content="Palabradex: Spanisch lernen mit Kurzgeschichten. Wörter sammeln, Karten freischalten, Truhen öffnen. Ein Prototyp von Eloori Interactive.">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--bg:#0c0e1a;--panel:#151829;--panel2:#1c2036;--line:#2a2f4a;--txt:#eef0ff;--mut:#9aa0c3;--acc:#ffcb3d;--acc2:#ff5d8f;--good:#3ddc97;--bad:#ff6b6b;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Outfit,system-ui,sans-serif;background:var(--bg);color:var(--txt);background-image:radial-gradient(1200px 600px at 10% -10%,#2a1f5a55,transparent 60%),radial-gradient(900px 500px at 110% 10%,#0e5a6b44,transparent 60%);background-attachment:fixed;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px clamp(14px,4vw,40px);background:linear-gradient(#0c0e1aee,#0c0e1acc);backdrop-filter:blur(10px);border-bottom:1px solid #ffffff0d}
.brand{display:flex;align-items:center;gap:10px;font-family:Bungee;font-size:20px;letter-spacing:.5px;cursor:pointer;user-select:none}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:conic-gradient(from 200deg,var(--acc),var(--acc2),#7b5cff,var(--acc));color:#111;font-size:18px;box-shadow:0 4px 18px #ff5d8f55}
.hud{display:flex;align-items:center;gap:8px}
.lvchip{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px}
.lvnum{background:linear-gradient(135deg,var(--acc),#ff9f1c);color:#1a1200;font-weight:800;border-radius:999px;padding:4px 10px;font-size:13px}
.xpbar{width:80px;height:8px;background:#ffffff14;border-radius:9px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:9px;transition:width .6s}
.xptxt{font-size:12px;color:var(--mut);min-width:44px}
.pill{position:relative;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px}
.pill:hover,.lvchip:hover,.iconbtn:hover{border-color:#4a5180}
.pill b{color:var(--acc)}
.pill.has{border-color:#ffcb3d88;box-shadow:0 0 18px #ffcb3d44;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 28px #ffcb3d77}}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
@media (max-width:700px){.xpbar,.xptxt,.brand span:last-child,.pill .lbl{display:none}}

main{max-width:1100px;margin:0 auto;padding:28px clamp(14px,4vw,40px) 60px}
.hello h1{font-family:Bungee;font-size:clamp(26px,4vw,38px);font-weight:400}
.hello p{color:var(--mut);margin-top:6px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 26px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 16px}
.stat b{font-size:20px;display:block}.stat span{font-size:12px;color:var(--mut)}
.cont{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(120deg,#2b2160,#162a4a);border:1px solid #ffffff1a;border-radius:var(--r);padding:16px 20px;margin-bottom:16px;cursor:pointer}
.cont small{color:#c9c6ff;font-size:12px;text-transform:uppercase;letter-spacing:1px}
.cont .t{font-family:Literata;font-size:20px;margin-top:2px}
.cont.gold{background:linear-gradient(120deg,#5a3a08,#3a1d4a)}
.btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--acc),#ff9f1c);color:#1a1200;font-weight:700;border-radius:12px;padding:11px 18px;box-shadow:0 6px 20px #ffb02e33;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:var(--panel2);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:10px}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
.tile{position:relative;display:flex;flex-direction:column;text-align:left;border-radius:22px;padding:22px;min-height:190px;overflow:hidden;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 10px 30px #00000055,inset 0 1px 0 #ffffff33;transition:transform .2s,box-shadow .2s;isolation:isolate}
.tile::before{content:"";position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,#ffffff10 0 10deg,transparent 10deg 20deg);z-index:-1;animation:spin 60s linear infinite}
.tile:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 18px 40px #00000077}
.tile-code{font-family:Bungee;font-size:clamp(44px,6vw,62px);line-height:1;color:#fff;text-shadow:0 4px 0 #00000033}
.tile-name{font-weight:800;font-size:18px;margin-top:10px;color:#fff}
.tile-sub{font-size:13px;color:#ffffffcc}
.tile-meta{margin-top:auto;padding-top:14px;font-size:12px;color:#fff;font-weight:600}
.tile-meta .bar{margin-top:6px;height:6px;background:#00000033;border-radius:6px;overflow:hidden}
.tile-meta .bar i{display:block;height:100%;background:#fff;border-radius:6px}
.tile.locked{filter:saturate(.35) brightness(.7)}
.lock{position:absolute;top:18px;right:18px;background:#00000040;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700;color:#fff;letter-spacing:.5px}
@keyframes spin{to{transform:rotate(360deg)}}
.foot{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:6px 14px;margin-top:40px;padding-top:16px;border-top:1px solid #ffffff10;font-size:12px;color:var(--mut)}
.foot a{color:var(--mut);text-decoration:none}.foot a:hover{color:var(--txt);text-decoration:underline}
.foot b{color:var(--txt);font-weight:600}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);margin-bottom:16px;font-weight:600}
.back:hover{color:var(--txt)}
.lvhead{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px}
.lvhead .code{font-family:Bungee;font-size:64px;line-height:.9;background:linear-gradient(135deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.chapters{display:grid;gap:14px}
.chap{display:flex;gap:18px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:border-color .2s,transform .2s}
.chap:hover{border-color:#4a5180;transform:translateX(3px)}
.chap .num{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-family:Bungee;font-size:22px;background:linear-gradient(135deg,var(--c1),var(--c2));flex:none}
.chap .ttl{font-family:Literata;font-size:21px;font-weight:600}
.chap .tz{color:var(--mut);font-size:14px;margin-top:3px}
.chap .meta{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.chap .meta .nw{color:var(--acc);font-weight:700}
.chap .st{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--panel2)}
.st.done{color:var(--good)}.st.new{color:var(--acc)}
.chap.locked{opacity:.55;cursor:default}
.chap.locked:hover{transform:none;border-color:var(--line)}
.dots{display:flex;gap:3px}.dots i{width:7px;height:7px;border-radius:50%;background:#ffffff22}.dots i.on{background:var(--acc)}

/* reader */
#reader{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--rbg);color:var(--rtx);transition:background .3s,color .3s}
#reader[data-theme=papel]{--rbg:#fbfaf6;--rtx:#22201c;--rmut:#8a857a;--rline:#e7e3d9;--rhl:#f0b42955}
#reader[data-theme=sepia]{--rbg:#f4ecd8;--rtx:#3b2f1e;--rmut:#8f7c5c;--rline:#e2d6b8;--rhl:#d8892b44}
#reader[data-theme=noche]{--rbg:#111317;--rtx:#d9d5cc;--rmut:#7b7a75;--rline:#24262c;--rhl:#ffcb3d33}
#reader[data-theme=mar]{--rbg:#e9f3f6;--rtx:#11324a;--rmut:#5f8296;--rline:#cfe3ea;--rhl:#2aa3c955}
.rbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;color:var(--rmut)}
.rbar .rt{font-family:Literata;font-size:14px;font-style:italic;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--rmut)}
.rbtn:hover{background:#00000010;color:var(--rtx)}
.rbtn.txt{width:auto;padding:0 12px;font-family:Literata;font-weight:600}
.rwrap{flex:1;position:relative;display:flex;justify-content:center;padding:6px 64px 0;min-height:0}
@media (max-width:640px){.rwrap{padding:4px 22px 0}}
#rvp{width:100%;max-width:640px;height:100%;overflow:hidden;position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#rct{font-family:var(--rf,Literata),Georgia,serif;font-size:var(--fs,21px);line-height:1.75;column-fill:auto;will-change:transform;transition:transform .38s cubic-bezier(.2,.8,.2,1)}
#rct p{margin:0 0 .9em;orphans:2;widows:2}
#rct p.note{font-style:italic;padding:.6em 1em;border-left:3px solid var(--rmut);background:#00000008;border-radius:4px}
#rct p.voice{font-style:italic;font-size:1.15em;text-align:center;margin-top:1.4em}
.chead{text-align:center;margin:1.2em 0 1.6em}
.chead small{font-family:Outfit;letter-spacing:3px;text-transform:uppercase;font-size:.55em;color:var(--rmut)}
.chead h2{font-size:1.75em;font-weight:600;margin-top:.3em;line-height:1.2}
.chead .orn{color:var(--rmut);margin-top:.6em;letter-spacing:8px}
.w{border-radius:4px;transition:background .2s;cursor:default}
.w.new{text-decoration:underline dotted var(--rmut,#9aa0c3);text-decoration-thickness:1.5px;text-underline-offset:.24em}
#reader.nomark .w.new,#reader.nomark .w.nf{text-decoration:none}
.w.new.rare{text-decoration-color:#9b5cf0;text-decoration-thickness:2px;text-decoration-style:dotted}
.w.nf{text-decoration:underline dotted #2f9e6e;text-decoration-thickness:1.5px;text-underline-offset:.24em}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:22px;border-bottom:2px dotted}
.w:hover,.w.on{background-color:var(--rhl,#ffcb3d33)}
.w.pop{animation:pop .6s}
@keyframes pop{0%{background-color:#ffcb3d}100%{background-color:transparent}}
.endcard{break-before:column;-webkit-column-break-before:always;text-align:center;padding-top:10%;font-family:Outfit}
.endcard .fin{font-family:Literata;font-style:italic;font-size:1.6em}
.endcard p{color:var(--rmut);font-size:.8em;margin:.8em auto;max-width:28em;line-height:1.5}
.endcard .wc{font-family:Bungee;font-size:1.6em;color:var(--rtx);margin:.6em 0 .2em}
.endcard .btn{font-size:.85em;margin-top:.8em}
.rnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:80px;display:grid;place-items:center;color:var(--rmut);opacity:.35;border-radius:12px}
.rnav:hover{opacity:1;background:#00000008}
.rnav.l{left:8px}.rnav.r{right:8px}
@media (hover:none),(max-width:640px){.rnav{display:none}}
.rfoot{padding:10px 20px 16px;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--rmut);max-width:720px;margin:0 auto;width:100%}
.rprog{flex:1;height:3px;background:var(--rline);border-radius:3px;overflow:hidden}
.rprog i{display:block;height:100%;width:0;background:var(--rmut);transition:width .38s}
.rwords{display:flex;align-items:center;gap:5px;font-weight:600}

/* tooltip */
#tip{position:fixed;z-index:70;min-width:170px;max-width:260px;background:#14172a;color:#fff;border:1px solid #ffffff22;border-radius:14px;padding:11px 13px;box-shadow:0 14px 40px #0008;font-family:Outfit;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;display:none}
#tip.show{opacity:1;transform:none}
#tip .tw{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:Literata;font-size:18px;font-weight:600}
#tip .tr{font-size:15px;margin-top:2px;color:#ffe9a8}
#tip .tl{font-size:12px;color:#aab0d6;margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#tip .newtag{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1200;font-weight:800;font-size:10px;border-radius:6px;padding:2px 6px;letter-spacing:.5px}
#tip .tlink{color:#9fd0ff;text-decoration:underline;font-size:12px;margin-top:6px;display:inline-block}
.spk{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#ffffff14;flex:none}
.spk:hover{background:#ffffff26}

#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:#14172aee;color:#fff;border:1px solid #ffffff22;border-radius:999px;padding:8px 16px 8px 8px;font-size:14px;box-shadow:0 10px 30px #0006;animation:tin .35s cubic-bezier(.2,1.4,.4,1);white-space:nowrap}
.toast .gem{min-width:26px;height:26px;border-radius:13px;padding:0 6px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#111}
.toast .x{color:var(--acc);font-weight:700}
.toast.out{animation:tout .3s forwards}
.toast.big{border-radius:18px;padding:14px 20px;flex-direction:column;gap:2px;background:linear-gradient(135deg,#3b2a8a,#7a2361);text-align:center;white-space:normal}
.toast.big b{font-family:Bungee;font-size:24px;font-weight:400}
@keyframes tin{from{opacity:0;transform:translateY(20px) scale(.9)}}
@keyframes tout{to{opacity:0;transform:translateY(10px)}}

/* dex */
#dex{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;background-image:radial-gradient(900px 500px at 0% 0%,#ff5d8f22,transparent 60%),radial-gradient(900px 500px at 100% 0%,#3d7bff22,transparent 60%)}
.dexin{max-width:1100px;margin:0 auto;padding:20px clamp(14px,4vw,40px) 60px}
.dexhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:10px 0 16px}
.dexhead h1{font-family:Bungee;font-weight:400;font-size:clamp(28px,4vw,40px)}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),#ffffff14 0);display:grid;place-items:center}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:13px}
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;width:max-content;margin-bottom:14px}
.tabs button{padding:8px 16px;border-radius:10px;font-weight:700;color:var(--mut)}
.tabs button.on{background:linear-gradient(135deg,var(--acc),#ff9f1c);color:#1a1200}
.albbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ptsbadge{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid #ffcb3d55;border-radius:999px;padding:7px 14px;font-weight:800;color:var(--acc)}
.coin{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff6c4,#ffcb3d 45%,#c8861a);color:#3a2500;font-family:Bungee;font-size:11px;box-shadow:0 0 8px #ffcb3d66}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.colgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.colt{position:relative;text-align:left;border-radius:20px;padding:18px;min-height:150px;display:flex;flex-direction:column;gap:6px;overflow:hidden;background:linear-gradient(140deg,var(--c1),var(--c2));box-shadow:0 10px 26px #0006;transition:transform .2s;isolation:isolate}
.colt::before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,#ffffff0e 0 9deg,transparent 9deg 18deg);z-index:-1}
.colt:hover{transform:translateY(-3px)}
.colt .ct{font-family:Bungee;font-size:22px;color:#fff;line-height:1.05}
.colt .cs{font-weight:800;font-size:13px;color:#fff;background:#00000033;border-radius:999px;padding:3px 10px;width:max-content}
.colt .cdots{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}.colt .cdots i{width:12px;height:12px;border-radius:3px;transform:rotate(45deg)}
.colt .cr{font-size:12px;color:#ffffffcc}
.colt.done{box-shadow:0 0 0 2px #3ddc97,0 10px 26px #0006}.colt.gold{box-shadow:0 0 0 3px #ffcb3d,0 0 30px #ffcb3d66}
.colv{position:relative;width:100%;max-width:880px;background:var(--panel);border:1px solid var(--line);border-radius:24px;overflow:hidden;animation:rise .35s cubic-bezier(.2,1.2,.4,1)}
.colh{padding:24px 26px;background:linear-gradient(120deg,var(--c1),var(--c2));color:#fff;position:relative}
.colh small{font-weight:800;letter-spacing:2px;opacity:.8}.colh h2{font-family:Bungee;font-weight:400;font-size:34px;margin:2px 0 6px}.colh p{opacity:.9;max-width:560px}
.colh .cs{position:absolute;right:24px;top:24px;font-weight:800;background:#00000033;border-radius:999px;padding:5px 12px;font-size:13px}
.colslots{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:20px 22px}
@media (max-width:700px){.colslots{grid-template-columns:repeat(3,1fr)}}
.slot{display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer}.slot .sl{font-size:11px;font-weight:700;color:var(--mut);text-align:center}
.slot.miss .tcg{opacity:.38;filter:grayscale(.6)}.slot.miss .sl{color:#ffb4c6}
.colr{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 22px 16px}@media (max-width:700px){.colr{grid-template-columns:1fr}}
.rw{background:var(--panel2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut)}.rw b{color:var(--txt);font-size:15px}
.rw.ok{box-shadow:inset 0 0 0 2px #3ddc97}.rw .btn{width:max-content;margin-top:4px}
.colact{display:flex;gap:10px;justify-content:flex-end;padding:0 22px 22px;flex-wrap:wrap}
.mbox:has(.scene){max-width:660px}
.scene small{font-weight:800;letter-spacing:2px;color:var(--c1)}.scene h2{margin-top:4px}.scene .who{font-style:italic;color:var(--mut);margin-bottom:14px}
.scene p{font-family:Literata;font-size:18px;line-height:1.7;margin-bottom:12px}.scene p.note{font-style:italic;color:#ffe9a8;padding-left:14px;border-left:3px solid var(--c1)}
.scene .orn{text-align:center;color:var(--mut);letter-spacing:8px;margin:10px 0 14px}
.ptsline{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;text-align:center}
.vsel button.buy{opacity:.8;border-style:dashed}.vsel button.cf{border-color:var(--acc);color:var(--acc);opacity:1}
.dsort{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--mut);margin:0 0 12px}
.dsort select{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit;font-size:13px}
.dsearch{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:12px;color:var(--mut);max-width:520px}
.dsearch:focus-within{border-color:#5a62a0}
.dsearch input{flex:1;background:none;border:0;outline:0;color:var(--txt);font:inherit;font-size:15px;padding:12px 0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{padding:7px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mut)}
.chip.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.empty{color:var(--mut);background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:24px;text-align:center}

/* ===== TRADING CARD ===== */
.tcg{position:relative;width:300px;aspect-ratio:63/88;border-radius:18px;padding:9px;background:var(--frame);box-shadow:0 22px 50px #000b,inset 0 0 0 1px #ffffff66,inset 0 0 12px #0004;transition:transform .2s ease-out;user-select:none;-webkit-user-select:none;text-align:left;display:block;color:#fff;flex:none;container-type:inline-size}
button.tcg{cursor:pointer}
.tcg.mini{width:100%;padding:5px;border-radius:11px;box-shadow:0 8px 20px #0008,inset 0 0 0 1px #ffffff55}
button.tcg.mini:hover{transform:translateY(-4px) rotate(-1deg)}
.v-normal{--frame:linear-gradient(145deg,#f2f4f9,#a3aabd 40%,#e6e9f1 58%,#7d849a 85%,#c9cedb)}
.v-holo{--frame:linear-gradient(135deg,#e6f7ff,#a6b4ff 25%,#ffc8f2 45%,#b0fff0 65%,#fff2a8 85%,#e6f7ff);background-size:200% 200%;animation:framemove 6s ease-in-out infinite alternate}
.v-gold{--frame:linear-gradient(145deg,#fff6c4,#d9a42e 30%,#fff1a3 50%,#a87318 72%,#ffe07a)}
.v-leg{--frame:conic-gradient(from var(--ang),#ff5d8f,#ffcb3d,#3ddc97,#4da3ff,#c46bff,#ff5d8f);animation:angle 4s linear infinite}
@keyframes angle{to{--ang:360deg}}
@keyframes framemove{to{background-position:100% 100%}}
.tcg-in{position:relative;height:100%;border-radius:11px;overflow:hidden;display:flex;flex-direction:column;padding:4.5cqw 4.5cqw 3cqw;background:linear-gradient(172deg,var(--pc2) 0%,#121428 70%);isolation:isolate}
.tcg.mini .tcg-in{border-radius:7px}
.tcg-top{display:flex;justify-content:space-between;align-items:center;gap:2cqw}
.tcg-name{font-family:Bungee;font-size:8.5cqw;line-height:1;text-shadow:0 2px 0 #0009;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcg-pwr{font-size:3.2cqw;font-weight:800;display:flex;align-items:baseline;gap:1cqw;color:#ffffffcc;flex:none}
.tcg-pwr b{font-size:7cqw;color:#fff;font-family:Bungee;font-weight:400}
.tcg-art{position:relative;margin-top:2.5cqw;height:47%;border-radius:5px;overflow:hidden;display:grid;place-items:center;border:1.5cqw solid transparent;background:radial-gradient(circle at 50% 58%,#ffffff70,transparent 50%) padding-box,linear-gradient(160deg,var(--pc),var(--pc2)) padding-box,linear-gradient(135deg,#fff,#ffffff55,#fff) border-box;box-shadow:inset 0 0 20px #0006}
.tcg-art::before{content:"";position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,#ffffff1c 0 7deg,transparent 7deg 14deg);animation:spin 50s linear infinite}
.tcg-art h3{position:relative;z-index:1;font-family:Bungee;font-weight:400;font-size:var(--ws,13cqw);line-height:1;transform:skew(-7deg);-webkit-text-stroke:.9cqw #1a1033;paint-order:stroke fill;text-shadow:0 1.4cqw 0 #1a1033,0 3cqw 6cqw #0008;text-align:center;padding:0 3cqw;word-break:break-word;color:#fff}
.tcg-art .tg{position:absolute;bottom:2.5cqw;left:50%;transform:translateX(-50%);z-index:1;font-family:Literata;font-style:italic;font-size:3.6cqw;background:#00000055;border-radius:99px;padding:.6cqw 3cqw;white-space:nowrap}
.tcg-rib{margin-top:2.4cqw;font-size:3cqw;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:#ffffff1c;border-radius:4px;padding:1.2cqw 2.4cqw;display:flex;justify-content:space-between;gap:2cqw}
.tcg-tr{font-size:6.2cqw;font-weight:800;margin-top:2.6cqw;line-height:1.15}
.tcg-fl{font-family:Literata;font-style:italic;font-size:4.1cqw;line-height:1.38;color:#ffffffc8;margin-top:1.4cqw;flex:1;overflow:hidden;border-top:1px solid #ffffff22;padding-top:1.4cqw}
.tcg-bot{display:flex;justify-content:space-between;align-items:center;font-size:2.9cqw;font-weight:800;color:#ffffffaa;letter-spacing:.06em;text-transform:uppercase;margin-top:1.4cqw}
.tcg-bot .rg{display:flex;align-items:center;gap:1.4cqw}
.tcg-bot .rg i{width:2.6cqw;height:2.6cqw;transform:rotate(45deg);border-radius:.5cqw;background:var(--rc);box-shadow:0 0 2cqw var(--rc)}
.tcg.mini .tcg-name,.tcg.mini .tcg-tr,.tcg.mini .tcg-fl,.tcg.mini .tcg-art .tg{display:none}
.tcg.mini .tcg-art{height:auto;flex:1;margin-top:2cqw}
.tcg.mini .tcg-art h3{font-size:var(--wsm,15cqw)}
.tcg.mini .tcg-rib{font-size:5.4cqw;padding:1.6cqw 3cqw}
.tcg.mini .tcg-pwr{font-size:6cqw}.tcg.mini .tcg-pwr b{font-size:10cqw}
.tcg.mini .tcg-top .no{font-size:7cqw;font-weight:800}
.tcg.mini .tcg-bot{font-size:5.4cqw;margin-top:2cqw}
.tcg.mini .tcg-bot .rg i{width:4cqw;height:4cqw}
.tcg .foil,.tcg .glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:5}
.tcg .glare{background:radial-gradient(circle at var(--mx,30%) var(--my,20%),#ffffff50,transparent 45%);mix-blend-mode:overlay;opacity:.8}
.v-holo .foil,.v-leg .foil{background:repeating-linear-gradient(115deg,#ff008440 0%,#fca40040 8%,#ffff0040 16%,#00ff8a40 24%,#00cfff40 32%,#cc4cfa40 40%,#ff008440 48%);background-size:300% 300%;background-position:var(--mx,0%) var(--my,0%);mix-blend-mode:color-dodge;animation:foil 8s linear infinite}
.tcg.tilt .foil{animation:none}
@keyframes foil{to{background-position:300% 300%}}
.v-gold .tcg-in{background:linear-gradient(172deg,#6b4710,#1c1306 72%)}
.v-gold .tcg-name,.v-gold .tcg-tr{color:#ffe7a0}
.v-gold .tcg-art{background:radial-gradient(circle at 50% 58%,#fff5c080,transparent 50%) padding-box,linear-gradient(160deg,#e8b647,#7a4f0c) padding-box,linear-gradient(135deg,#fff3b0,#b07d1c,#fff3b0) border-box}
.v-gold .tcg-in::after{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#ffe58a 1px,transparent 1.5px);background-size:37px 41px,53px 47px;background-position:0 0,20px 10px;opacity:.35;animation:twinkle 3s ease-in-out infinite alternate;pointer-events:none;z-index:4}
@keyframes twinkle{to{opacity:.08}}
.v-leg .tcg-in{background:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#fff,transparent),radial-gradient(1px 1px at 85% 20%,#fff,transparent),radial-gradient(circle at 30% 20%,#5b2a9a,transparent 60%),radial-gradient(circle at 80% 90%,#9a2a6b,transparent 60%),#0b0820}
.v-leg .tcg-name{background:linear-gradient(90deg,#ffcb3d,#ff5d8f,#4da3ff,#3ddc97,#ffcb3d);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:framemove 3s linear infinite;text-shadow:none}
.v-leg .tcg-art{background:radial-gradient(circle at 50% 58%,#ffffff60,transparent 50%) padding-box,conic-gradient(from 180deg at 50% 60%,#3b1a7a,#7a1a5a,#1a3b7a,#3b1a7a) padding-box,conic-gradient(from var(--ang),#ff5d8f,#ffcb3d,#3ddc97,#4da3ff,#ff5d8f) border-box;animation:angle 4s linear infinite}
.tcg.unk{--frame:linear-gradient(145deg,#2a2f4a,#1a1d30);cursor:default}
.tcg.unk .tcg-in{background:repeating-linear-gradient(45deg,#15182b 0 10px,#181b30 10px 20px);display:grid;place-items:center;text-align:center}
.tcg.unk .q{font-family:Bungee;font-size:22cqw;color:#ffffff14}
.tcg.unk .no{position:absolute;top:4cqw;left:5cqw;font-size:7cqw;font-weight:800;color:#ffffff40}
.cardback{--frame:linear-gradient(145deg,#2a1f5a,#7a2361)}
.cardback .tcg-in{background:repeating-conic-gradient(from 0deg at 50% 50%,#ffffff0a 0 10deg,transparent 10deg 20deg),radial-gradient(circle,#3b2a8a,#120a2a);display:grid;place-items:center}
.cardback .lg{width:40cqw;height:40cqw;border-radius:30%;display:grid;place-items:center;background:conic-gradient(from 200deg,var(--acc),var(--acc2),#7b5cff,var(--acc));font-family:Bungee;font-size:22cqw;color:#111;box-shadow:0 0 12cqw #ff5d8f88}
.vlabel{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;border-radius:999px;padding:4px 10px}
.vl-holo{background:linear-gradient(90deg,#a6b4ff,#ffc8f2,#b0fff0);color:#1a1033}
.vl-gold{background:linear-gradient(90deg,#fff1a3,#d9a42e);color:#3a2500}
.vl-leg{background:linear-gradient(90deg,#ff5d8f,#ffcb3d,#3ddc97,#4da3ff);color:#140a2a}
.vl-normal{background:#ffffff22;color:#fff}

/* modal */
#modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:#05060ccc;backdrop-filter:blur(6px);animation:fade .2s;overflow:auto}
@keyframes fade{from{opacity:0}}
.mbox{position:relative;width:100%;max-width:440px;max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px;animation:rise .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes rise{from{transform:translateY(30px) scale(.96);opacity:0}}
.mclose{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mut);z-index:6}
.mclose:hover{background:#ffffff10;color:#fff}
.mbox h2{font-family:Bungee;font-weight:400;font-size:22px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .lbl{font-weight:600}.row small{display:block;color:var(--mut);font-size:12px;font-weight:400}
.seg{display:flex;background:var(--panel2);border-radius:10px;padding:3px}
.seg button{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--txt);color:var(--bg)}
.themes{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.th{min-width:54px;height:40px;padding:0 8px;border-radius:10px;border:2px solid transparent;position:relative;font-family:Literata;font-weight:600;font-size:14px}
.th.on{border-color:var(--acc)}
.th.lk{opacity:.4;cursor:not-allowed}
.th .lv{position:absolute;bottom:-6px;right:-6px;background:var(--panel2);color:var(--mut);font-family:Outfit;font-size:9px;border-radius:6px;padding:1px 4px;border:1px solid var(--line)}
.fontchip{background:var(--panel2);color:var(--txt);font-size:16px}
.toggle{width:46px;height:26px;border-radius:999px;background:var(--panel2);position:relative;border:1px solid var(--line);flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--mut);transition:.2s}
.toggle.on{background:var(--good)}.toggle.on::after{left:23px;background:#fff}
input[type=range]{accent-color:var(--acc);width:140px}
.danger{color:var(--bad);font-weight:600;font-size:14px}
.sync{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.sync.ok i{background:var(--good)}

/* card view (split) */
.cv{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:26px;width:100%;max-width:900px;align-items:start;animation:rise .35s cubic-bezier(.2,1.2,.4,1)}
.cv-data{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:20px;min-height:470px}
.cv-card{display:flex;flex-direction:column;align-items:center;gap:14px;position:sticky;top:0}
.cv-card .tcg{perspective:900px}
@media (max-width:780px){.cv{grid-template-columns:1fr}.cv-card{order:-1;position:static}.cv-data{max-height:none}.cv-card .tcg{width:min(300px,78vw)}}
.cvh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.cvh small{color:var(--mut);font-weight:700;letter-spacing:1px}
.cvh h2{font-family:Bungee;font-weight:400;font-size:28px;line-height:1.1}
.cvtr{font-size:18px;color:#ffe9a8;margin-bottom:6px}
.sec{margin-top:4px}
.ctabs{display:flex;gap:6px;background:var(--panel2);border-radius:12px;padding:4px;margin:12px 0 14px}
.ctabs button{flex:1;padding:8px;border-radius:9px;font-weight:700;font-size:13px;color:var(--mut)}
.ctabs button.on{background:var(--txt);color:var(--bg)}
.tabc .sec+.sec{margin-top:14px}
.sec h4{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin-bottom:8px;display:flex;justify-content:space-between}
.sec h4 span{color:var(--acc)}
.ftab{width:100%;border-collapse:collapse;font-size:14px;background:var(--panel2);border-radius:12px;overflow:hidden}
.ftab td{padding:7px 12px;border-bottom:1px solid #ffffff0a}
.ftab td:first-child{color:var(--mut);width:48%}
.ftab td:last-child{font-family:Literata;font-weight:600}
.ftab tr:last-child td{border:0}
.ftab .irr{color:var(--acc)}
.ftab .lk{color:#ffffff30;font-family:Bungee;font-weight:400;letter-spacing:2px}
.ftab .fresh{animation:pop 1.2s}
.quest{display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--panel2);border-radius:10px;margin-bottom:6px}
.quest .qt{font-size:13px!important}
.quest .ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.quest.done .ck{background:var(--good);border-color:var(--good);color:#06301c}
.quest .qt{flex:1;font-size:14px}
.quest .qb{height:4px;background:#ffffff14;border-radius:4px;margin-top:5px;overflow:hidden}
.quest .qb i{display:block;height:100%;background:var(--acc)}
.quest.done .qb i{background:var(--good)}
.quest .qx{font-size:12px;font-weight:800;color:var(--acc)}
.quest.done .qx{color:var(--good)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--panel2);border-radius:12px;padding:10px 12px}
.kv b{display:block;font-size:18px}.kv span{font-size:11px;color:var(--mut)}
.ex{font-family:Literata;font-style:italic;color:#d8dbf5;border-left:3px solid var(--pc);padding:4px 0 4px 12px;font-size:15px;line-height:1.5}
.ex mark{background:none;color:#fff;font-weight:600;text-decoration:underline;text-decoration-color:var(--pc);text-underline-offset:3px}
.vsel{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.vsel button{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800;background:var(--panel);border:1px solid var(--line);color:var(--mut);display:flex;align-items:center;gap:6px}
.vsel button.on{border-color:var(--acc);color:#fff}
.vsel button.lk{opacity:.45;cursor:default}
.vsel i{width:10px;height:10px;border-radius:3px;transform:rotate(45deg)}
.cvclose{position:fixed;top:14px;right:14px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);z-index:45}

/* chest */
.chestwrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:480px;justify-content:center;width:100%;max-width:520px}
.cglow{position:absolute;top:50%;left:50%;width:520px;height:520px;transform:translate(-50%,-55%);background:radial-gradient(circle,#ffcb3d55,transparent 60%);pointer-events:none;transition:all .6s}
.cglow.burst{background:radial-gradient(circle,var(--gc,#ffcb3d) 0,transparent 62%);transform:translate(-50%,-55%) scale(1.25)}
.rays{position:absolute;top:50%;left:50%;width:700px;height:700px;transform:translate(-50%,-55%);background:repeating-conic-gradient(from 0deg,#ffffff18 0 6deg,transparent 6deg 18deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 20%,transparent 65%);mask:radial-gradient(circle,#000 20%,transparent 65%);animation:spin 20s linear infinite;opacity:0;transition:opacity .6s;pointer-events:none}
.rays.on{opacity:1}
.chest{width:220px;cursor:pointer;position:relative;z-index:2;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 20px 30px #000a)}
@keyframes bob{50%{transform:translateY(-10px)}}
.chest.shake{animation:shake .8s}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-8deg) scale(1.05)}30%{transform:rotate(8deg) scale(1.08)}45%{transform:rotate(-10deg) scale(1.1)}60%{transform:rotate(10deg) scale(1.12)}80%{transform:rotate(-4deg) scale(1.15)}}
.chest .lid{transition:transform .5s cubic-bezier(.3,1.6,.5,1),opacity .5s;transform-origin:100px 75px}
.chest.open .lid{transform:translateY(-70px) rotate(-18deg);opacity:0}
.chest.gone{transition:opacity .4s,transform .4s;opacity:0;transform:scale(.6)}
.chint{color:var(--mut);font-weight:600;position:relative;z-index:2}
.ccount{position:relative;z-index:2;font-size:13px;color:var(--mut)}
.flip{position:relative;width:min(280px,72vw);aspect-ratio:63/88;perspective:1200px;z-index:3}
.flip .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,1.3,.5,1);transform:rotateY(180deg)}
.flip.show .inner{transform:rotateY(0)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .face .tcg{width:100%}
.flip .face.bk{transform:rotateY(180deg)}
.flip.enter{animation:enter .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes enter{from{transform:scale(.2) translateY(120px);opacity:0}}
.rev{text-align:center;position:relative;z-index:3}
.rev .big{font-family:Bungee;font-size:26px;margin-top:6px}
.rev p{color:var(--mut);margin-top:4px}
.rev .acts{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* quiz */
.qprog{display:flex;gap:6px;margin-bottom:16px}
.qprog i{flex:1;height:5px;border-radius:5px;background:var(--panel2)}
.qprog i.ok{background:var(--good)}.qprog i.no{background:var(--bad)}.qprog i.cur{background:var(--acc)}
.qq{font-family:Literata;font-size:22px;font-weight:600;line-height:1.4;margin-bottom:16px}
.qopts{display:grid;gap:10px}
.qopt{text-align:left;padding:14px 16px;border-radius:14px;background:var(--panel2);border:2px solid var(--line);font-family:Literata;font-size:17px;transition:border-color .15s,background .15s}
.qopt:hover:not(:disabled){border-color:#5a62a0}
.qopt.ok{border-color:var(--good);background:#3ddc9720}
.qopt.no{border-color:var(--bad);background:#ff6b6b20}

.trq{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0 4px;min-height:70px}
.trw{font-family:Bungee;font-size:clamp(30px,7vw,44px);transform:skew(-6deg);text-shadow:0 4px 0 #0006}
.trt{font-size:26px;font-weight:800;text-align:center}
.trh{text-align:center;color:var(--mut);font-size:13px;margin-bottom:16px}
.trgrid{grid-template-columns:1fr 1fr}.trgrid .qopt{font-family:Outfit;font-size:16px;display:flex;gap:10px;align-items:center}
.kn{width:22px;height:22px;border-radius:6px;background:#ffffff14;display:grid;place-items:center;font-size:11px;flex:none}
@media (max-width:520px){.trgrid{grid-template-columns:1fr}}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;min-height:44px}
.qfb{font-weight:700}
.qres{text-align:center;padding:10px 0}
.qres .big{font-family:Bungee;font-size:56px;line-height:1}
.qres p{color:var(--mut);margin:10px 0}
.xpgain{display:inline-block;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1200;font-weight:800;border-radius:999px;padding:6px 14px;margin:6px 0 10px}
.rew{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rew .lv{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:var(--panel2);flex:none}
.rew.got .lv{background:linear-gradient(135deg,var(--acc),#ff9f1c);color:#1a1200}
.rew .d{font-size:14px}.rew .d small{display:block;color:var(--mut);font-size:12px}
.how{background:var(--panel2);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--mut);margin-top:14px;line-height:1.7}
.how b{color:var(--txt)}
</style>

<body>

<header class="top">

<script>

const LEX = {};
function W(k,p,n,de,en,fde,fen,x){LEX[k]=Object.assign({k,p,n,de,en,f:fde?{de:fde,en:fen}:null},x||{});}
W('de','prep',1,'von, aus','of, from','Das häufigste Wort der spanischen Sprache. Aus de + el wird del.','The most frequent word in the Spanish language. de + el becomes del.');
W('el','art',2,'der, die, das','the','Vier Formen: el, la, los, las. Aus a + el wird al.','Four forms: el, la, los, las. a + el becomes al.');
W('que','conj',3,'dass; der, die, das (Relativ)','that, which, who','Mit Akzent (qué) wird es zum Fragewort: was?','With an accent (qué) it becomes a question word: what?');
W('y','conj',4,'und','and','Vor Wörtern mit i oder hi wird y zu e: padre e hijo.','Before words starting with i or hi, y turns into e: padre e hijo.');
W('a','prep',5,'zu, nach, um','to, at','Bei Uhrzeiten: a las doce heisst um zwölf.','With times: a las doce means at twelve.');
W('en','prep',6,'in, an, auf','in, on, at','Ein Wort für drei: en la mesa heisst auf dem Tisch.','One word for in, on and at: en la mesa means on the table.');
W('un','art',7,'ein, eine','a, an','un vor männlichen, una vor weiblichen Nomen.','un before masculine, una before feminine nouns.');
W('ser','v',8,'sein (dauerhaft)','to be (permanent)','Eines der häufigsten und unregelmässigsten Verben. Für Herkunft, Identität und Uhrzeit: Soy de Suiza. Son las once.','One of the most frequent and most irregular verbs. For origin, identity and time: Soy de Suiza. Son las once.',{conj:['soy','eres','es','somos','sois','son'],irr:[0,1,2,3,4,5]});
W('no','adv',9,'nicht, nein','not, no','Steht direkt vor dem Verb: No es mi llave.','Goes right before the verb: No es mi llave.');
W('haber','v',10,'haben (Hilfsverb); hay = es gibt','to have (auxiliary); hay = there is','Die Sonderform hay bleibt immer gleich: hay una llave, hay dos llaves.','The special form hay never changes: hay una llave, hay dos llaves.',{conj:['he','has','ha','hemos','habéis','han'],irr:[0,1,2,3,5],note:{de:'Unpersönlich: hay = es gibt',en:'Impersonal: hay = there is / there are'}});
W('con','prep',11,'mit','with','Mit mir heisst conmigo, mit dir contigo.','With me is conmigo, with you is contigo.');
W('estar','v',12,'sein (Ort, Zustand)','to be (location, state)','ser oder estar? estar steht für Ort und Zustand: Estoy cansada. La puerta está en la calle.','ser or estar? estar is for location and state: Estoy cansada. La puerta está en la calle.',{conj:['estoy','estás','está','estamos','estáis','están'],irr:[0,1,2,5]});
W('tener','v',13,'haben','to have','Auch für Alter und Gefühle: Tengo 22 años. Tengo miedo heisst ich habe Angst.','Also for age and feelings: Tengo 22 años (I am 22). Tengo miedo (I am afraid).',{conj:['tengo','tienes','tiene','tenemos','tenéis','tienen'],irr:[0,1,2,5]});
W('mi','det',14,'mein, meine','my','Ohne Akzent heisst es mein, mit Akzent (mí) mich oder mir.','Without an accent it means my, with an accent (mí) it means me.');
W('pero','conj',15,'aber','but','Nicht verwechseln mit perro (Hund). Das doppelte r wird gerollt.','Don\'t mix it up with perro (dog). The double r is rolled.');
W('más','adv',16,'mehr','more','algo más heisst noch etwas oder etwas mehr.','algo más means something more or something else.');
W('decir','v',17,'sagen','to say','Das e wird zu i: digo, dices, dice.','The e changes to i: digo, dices, dice.',{conj:['digo','dices','dice','decimos','decís','dicen'],irr:[0,1,2,5]});
W('este','det',18,'dieser, diese, dieses','this','esta noche heisst heute Abend oder heute Nacht.','esta noche means tonight.');
W('ver','v',19,'sehen','to see','Nur die yo Form ist besonders: veo.','Only the yo form is special: veo.',{conj:['veo','ves','ve','vemos','veis','ven'],irr:[0]});
W('saber','v',20,'wissen','to know','saber ist Wissen, conocer ist kennen (Personen, Orte). Die yo Form ist winzig: sé.','saber is knowing facts, conocer is knowing people or places. The yo form is tiny: sé.',{conj:['sé','sabes','sabe','sabemos','sabéis','saben'],irr:[0]});
W('querer','v',21,'wollen; lieben','to want; to love','Te quiero heisst ich hab dich lieb. Das e wird zu ie: quiero.','Te quiero means I love you. The e changes to ie: quiero.',{conj:['quiero','quieres','quiere','queremos','queréis','quieren'],irr:[0,1,2,5]});
W('también','adv',22,'auch','also, too','Das Gegenteil ist tampoco: auch nicht.','The opposite is tampoco: not either.');
W('muy','adv',23,'sehr','very','muy vor Adjektiven (muy pequeña), mucho vor Nomen (mucho miedo).','muy before adjectives (muy pequeña), mucho before nouns (mucho miedo).');
W('algo','pron',24,'etwas','something','Das Gegenteil ist nada: nichts.','The opposite is nada: nothing.');
W('hasta','prep',25,'bis','until, up to','¡Hasta luego! heisst bis später.','¡Hasta luego! means see you later.');
W('día','n',26,'Tag','day','Endet auf a, ist aber männlich: el día.','Ends in a but is masculine: el día.',{g:'m'});
W('año','n',27,'Jahr','year','Ohne die Tilde auf dem ñ wird daraus ein ganz anderes Wort. Das ñ ist wichtig!','Without the tilde on the ñ it turns into a completely different word. The ñ matters!',{g:'m'});
W('tú','pron',28,'du','you','Mit Akzent heisst es du, ohne Akzent (tu) dein.','With an accent it means you, without (tu) it means your.');
W('hoy','adv',29,'heute','today','ayer = gestern, hoy = heute, mañana = morgen.','ayer = yesterday, hoy = today, mañana = tomorrow.');
W('me','pron',30,'mich, mir','me, myself','Me llamo heisst wörtlich: ich nenne mich.','Me llamo literally means: I call myself.');
W('quién','pron',31,'wer','who','In Fragen immer mit Akzent. Mehrzahl: quiénes.','Always with an accent in questions. Plural: quiénes.');
W('qué','pron',32,'was, welche','what, which','¿Qué tal? ist die lockere Frage nach: wie geht\'s?','¿Qué tal? is the casual way to ask: how are you?');
W('dónde','adv',33,'wo','where','¿De dónde eres? heisst: woher kommst du?','¿De dónde eres? means: where are you from?');
W('allí','adv',34,'dort','there','aquí = hier, allí = dort.','aquí = here, allí = there.');
W('desde','prep',35,'von ... aus; seit','from; since','desde la ventana heisst vom Fenster aus.','desde la ventana means from the window.');
W('casa','n',36,'Haus, Zuhause','house, home','en casa = zu Hause, a casa = nach Hause.','en casa = at home, a casa = (going) home.',{g:'f'});
W('noche','n',37,'Nacht, Abend','night, evening','In Spanien isst man spät: Abendessen gibt es oft erst um 21 oder 22 Uhr.','In Spain people eat late: dinner is often at 9 or 10 pm.',{g:'f'});
W('hora','n',38,'Stunde, Uhrzeit','hour, time','¿Qué hora es? heisst: wie spät ist es?','¿Qué hora es? means: what time is it?',{g:'f'});
W('nombre','n',39,'Name','name','Endet auf e und ist männlich: el nombre.','Ends in e and is masculine: el nombre.',{g:'m'});
W('gente','n',40,'Leute','people','gente ist Einzahl: la gente es simpática heisst die Leute sind nett.','gente is singular: la gente es simpática means people are nice.',{g:'f'});
W('primero','num',41,'erster, erste','first','Vor männlichen Nomen fällt das o weg: el primer día.','Before masculine nouns the o drops: el primer día.');
W('grande','adj',42,'gross','big, large','Vor einem Nomen wird es zu gran und heisst dann grossartig: un gran día.','Before a noun it becomes gran and means great: un gran día.');
W('pequeño','adj',43,'klein','small','Dank ñ ausgesprochen: pe-ke-njo.','Thanks to the ñ it sounds like: pe-KE-nyo.');
W('viejo','adj',44,'alt','old','Das j klingt wie das deutsche ch in Bach.','The j sounds like the ch in Scottish loch.');
W('buscar','v',45,'suchen','to look for','Ohne nach: Busco mi libro heisst ich suche mein Buch.','No for needed: Busco mi libro means I am looking for my book.');
W('tomar','v',46,'nehmen','to take','Heisst auch trinken: tomar un café.','Also means to drink: tomar un café.');
W('salir','v',47,'hinausgehen, verlassen','to go out, to leave','Nur yo ist unregelmässig: salgo. salir de heisst verlassen.','Only yo is irregular: salgo. salir de means to leave a place.',{conj:['salgo','sales','sale','salimos','salís','salen'],irr:[0]});
W('escribir','v',48,'schreiben','to write','Regelmässiges ir Verb, perfekt zum Üben der Endungen.','A regular -ir verb, perfect for practising the endings.');
W('mirar','v',49,'(an)schauen','to look at','mirar heisst bewusst hinschauen, ver einfach sehen.','mirar is to look at on purpose, ver is simply to see.');
W('abrir','v',50,'öffnen','to open','Im Präsens ganz regelmässig. Gegenteil: cerrar.','Completely regular in the present. Opposite: cerrar.');
W('llamarse','v',51,'heissen','to be called','Reflexiv: me llamo, te llamas. llamar allein heisst rufen oder anrufen.','Reflexive: me llamo, te llamas. llamar alone means to call.',{conj:['me llamo','te llamas','se llama','nos llamamos','os llamáis','se llaman']});
W('caminar','v',52,'gehen, spazieren','to walk','In Spanien sagt man oft auch andar.','In Spain people also often say andar.');
W('escuchar','v',53,'(zu)hören','to listen, to hear','escuchar ist zuhören, oír ist hören.','escuchar is to listen, oír is to hear.');
W('calle','n',54,'Strasse','street','In Barcelona steht auf den Schildern carrer, das katalanische Wort für calle.','In Barcelona the street signs say carrer, the Catalan word for calle.',{g:'f'});
W('puerta','n',55,'Tür','door','Die Puerta del Sol in Madrid ist der Kilometer null aller spanischen Strassen.','Puerta del Sol in Madrid is kilometre zero of all Spanish roads.',{g:'f'});
W('número','n',56,'Nummer, Zahl','number','Abkürzung: nº.','Abbreviation: nº.',{g:'m'});
W('pregunta','n',57,'Frage','question','hacer una pregunta heisst eine Frage stellen.','hacer una pregunta means to ask a question.',{g:'f'});
W('respuesta','n',58,'Antwort','answer','Das Verb dazu ist responder: antworten.','The related verb is responder: to answer.',{g:'f'});
W('voz','n',59,'Stimme','voice','Mehrzahl: voces. Aus z wird c.','Plural: voces. The z turns into c.',{g:'f'});
W('libro','n',60,'Buch','book','Falscher Freund: librería ist eine Buchhandlung, die Bibliothek heisst biblioteca.','False friend: librería is a bookshop, a library is a biblioteca.',{g:'m'});
W('miedo','n',61,'Angst','fear','Man hat Angst: tener miedo.','You have fear: tener miedo means to be afraid.',{g:'m'});
W('hola','int',62,'hallo','hello','Das h ist im Spanischen immer stumm. Hola klingt wie ola, die Welle.','The h is always silent in Spanish. Hola sounds like ola, the wave.');
W('detrás','adv',63,'hinten; detrás de = hinter','behind','Gegenteil: delante de heisst vor.','Opposite: delante de means in front of.');
W('mar','n',64,'Meer','sea','Meist el mar, Seeleute und Dichter sagen aber oft la mar.','Usually el mar, but sailors and poets often say la mar.',{g:'m'});
W('sol','n',65,'Sonne','sun','Hace sol heisst es ist sonnig.','Hace sol means it is sunny.',{g:'m'});
W('ventana','n',66,'Fenster','window','Kommt von viento (Wind): eine Öffnung für den Wind.','Comes from viento (wind): an opening for the wind.',{g:'f'});
W('cama','n',67,'Bett','bed','hacer la cama heisst das Bett machen.','hacer la cama means to make the bed.',{g:'f'});
W('piso','n',68,'Wohnung; Stockwerk','flat; floor','In Spanien ist ein piso eine Wohnung. Eine WG heisst piso compartido.','In Spain a piso is a flat. A shared flat is a piso compartido.',{g:'m'});
W('nota','n',69,'Notiz, Zettel','note','Auch die Schulnote heisst nota.','A school grade is also called a nota.',{g:'f'});
W('maleta','n',70,'Koffer','suitcase','hacer la maleta heisst den Koffer packen.','hacer la maleta means to pack your suitcase.',{g:'f'});
W('llave','n',71,'Schlüssel','key','Das ll klingt in Spanien meist wie das j in ja.','In Spain ll usually sounds like the y in yes.',{g:'f'});
W('azul','adj',72,'blau','blue','Gleiche Form für männlich und weiblich: el mar azul, la puerta azul.','Same form for masculine and feminine: el mar azul, la puerta azul.');
W('bonito','adj',73,'hübsch, schön','pretty, nice','Bonito ist auch ein Fisch, eine kleine Thunfischart.','Bonito is also a fish, a small kind of tuna.');
W('cansado','adj',74,'müde','tired','Mit estar, denn es ist ein Zustand: estoy cansada.','Used with estar because it is a state: estoy cansada.');
W('oscuro','adj',75,'dunkel','dark','Das Gegenteil ist claro: hell.','The opposite is claro: light, bright.');
W('siete','num',76,'sieben','seven','las siete maravillas sind die sieben Weltwunder.','las siete maravillas are the seven wonders of the world.');
W('once','num',77,'elf','eleven','Nicht verwechseln mit dem englischen once!','Not to be confused with English once!');
W('doce','num',78,'zwölf','twelve','Ein Dutzend heisst una docena.','A dozen is una docena.');
W('veintidós','num',79,'zweiundzwanzig','twenty-two','Die Zahlen 21 bis 29 schreibt man als ein Wort: veintidós.','The numbers 21 to 29 are written as one word: veintidós.');
W('Suiza','prop',80,'die Schweiz','Switzerland','Ein Schweizer ist ein suizo, eine Schweizerin eine suiza.','A Swiss man is a suizo, a Swiss woman a suiza.');
W('Barcelona','prop',81,'Barcelona','Barcelona','Zweitgrösste Stadt Spaniens und Hauptstadt Kataloniens.','Second largest city in Spain and capital of Catalonia.');

W('yo','pron',82,'ich','I','Wird oft weggelassen, weil die Verbform schon zeigt, wer spricht: (Yo) tengo miedo.','Often dropped because the verb already shows who is speaking: (Yo) tengo miedo.',{fr:15});
W('sí','adv',83,'ja','yes','Mit Akzent heisst es ja. Ohne Akzent (si) heisst es wenn.','With an accent it means yes. Without (si) it means if.',{fr:30});
W('otro','det',84,'anderer; otra vez = nochmal','other; otra vez = again','Nie mit un davor: otro libro heisst ein anderes Buch.','Never with un in front: otro libro means another book.',{fr:25});
W('vez','n',85,'Mal','time (occurrence)','Una vez = einmal, otra vez = nochmal. Mehrzahl: veces.','Una vez = once, otra vez = again. Plural: veces.',{g:'f',fr:40});
W('nada','pron',86,'nichts','nothing','De nada heisst gern geschehen.','De nada means you are welcome.',{fr:45});
W('aquí','adv',87,'hier','here','aquí = hier, allí = dort. Beide mit Akzent am Ende.','aquí = here, allí = there. Both with an accent at the end.',{fr:45});
W('como','conj',88,'wie (Vergleich)','like, as','Ohne Akzent heisst es wie im Vergleich. Mit Akzent (cómo) ist es die Frage: wie?','Without an accent it means like or as. With an accent (cómo) it asks: how?',{fr:12});
W('mesa','n',89,'Tisch','table','¡A la mesa! ruft man, wenn das Essen fertig ist.','¡A la mesa! is what you call when the food is ready.',{g:'f',fr:60});
W('luz','n',90,'Licht','light','Mehrzahl: luces. Dar a luz heisst ein Kind zur Welt bringen.','Plural: luces. Dar a luz means to give birth.',{g:'f',fr:60});
W('radio','n',91,'Radio','radio','Endet auf o, ist aber weiblich: la radio, kurz für radiodifusión.','Ends in o but is feminine: la radio, short for radiodifusión.',{g:'f',fr:75});
W('foto','n',92,'Foto','photo','Auch weiblich trotz o: la foto, kurz für fotografía.','Feminine despite the o: la foto, short for fotografía.',{g:'f',fr:70});
W('chica','n',93,'Mädchen, junge Frau','girl, young woman','Die männliche Form ist chico. Los chicos kann auch eine gemischte Gruppe sein.','The masculine form is chico. Los chicos can also mean a mixed group.',{g:'f',fr:70});

const FORMS = {};
for(const k in LEX) FORMS[k.toLowerCase()] = {l:k};
function F(form,l,de,en){FORMS[form]={l,de,en};}
F('me','me','mich, mir','me');F('llamo','llamarse','(ich) heisse','(I) am called');
F('tengo','tener','ich habe','I have');F('tienes','tener','du hast','you have');F('tiene','tener','hat','has');
F('años','año','Jahre','years');
F('soy','ser','ich bin','I am');F('eres','ser','du bist','you are');F('es','ser','ist','is');F('son','ser','sind; es ist (Uhrzeit)','are; it is (time)');
F('primer','primero','erster','first');F('una','un','eine','a');F('vieja','viejo','alt (weiblich)','old (feminine)');
F('la','el','die','the');F('las','el','die (Mehrzahl)','the (plural)');F('del','de','des, vom (de + el)','of the (de + el)');
F('veo','ver','ich sehe','I see');F('ves','ver','du siehst','you see');
F('estoy','estar','ich bin','I am');F('estás','estar','du bist','you are');F('está','estar','ist (befindet sich)','is (located)');
F('cansada','cansado','müde (weiblich)','tired (feminine)');F('abro','abrir','ich öffne','I open');F('busco','buscar','ich suche','I look for');
F('hay','haber','es gibt, da ist','there is');F('dice','decir','sagt','says');F('digo','decir','ich sage','I say');
F('esta','este','diese','this');F('escribe','escribir','schreibt','writes');
F('sé','saber','ich weiss','I know');F('sabes','saber','du weisst','you know');F('sabe','saber','weiss','knows');
F('miro','mirar','ich schaue','I look at');F('quiero','querer','ich will','I want');F('quieres','querer','du willst','you want');F('quiere','querer','will','wants');
F('tomo','tomar','ich nehme','I take');F('salgo','salir','ich gehe hinaus','I go out');F('oscura','oscuro','dunkel (weiblich)','dark (feminine)');
F('camino','caminar','ich gehe (zu Fuss)','I walk');F('pequeña','pequeño','klein (weiblich)','small (feminine)');

const STORIES=[
 {id:'a1-1',lvl:'A1',ch:1,diff:1,title:'La llave azul',
  tz:{de:'Mias erster Tag in Barcelona. In ihrem Koffer liegt etwas, das ihr nicht gehört.',en:'Mia\'s first day in Barcelona. Something in her suitcase isn\'t hers.'},
  paras:[
   'Me llamo Mia. Tengo veintidós años y soy de Suiza. Hoy es mi primer día en Barcelona.',
   'Mi piso es pequeño, pero bonito. Tiene una ventana grande y una cama vieja. Desde la ventana veo el mar.',
   'Estoy muy cansada. Abro mi maleta y busco mi libro. Pero en la maleta hay algo más: una llave. Una llave pequeña, vieja y azul.',
   '¿Una llave? No es mi llave. No es de mi casa en Suiza.',
   'Con la llave hay una nota. La nota dice:',
   {t:'«Hola, Mia. La puerta azul está en la calle del Sol, número siete. Esta noche, a las doce.»',cls:'note'},
   '¿Quién escribe la nota? ¿Quién sabe mi nombre?',
   'Miro la hora. Son las once de la noche.',
   'Tengo miedo. Pero también tengo una pregunta. Y quiero la respuesta.',
   'Tomo la llave y salgo de mi piso. La calle está oscura y no hay gente.',
   'Camino hasta la calle del Sol. Busco el número siete. Y allí está: una puerta azul, vieja y muy pequeña.',
   'Son las doce. Escucho algo detrás de la puerta. Una voz. Una voz que dice mi nombre.',
   {t:'«¿Mia? ¿Eres tú?»',cls:'voice'}
  ],
  quiz:[

   {q:'¿Dónde está la puerta azul?',o:['En la calle del Sol.','En el piso de Mia.','En Suiza.']},
   {q:'¿Qué escucha Mia detrás de la puerta?',o:['Una voz.','El mar.','Una pregunta.']}
  ]},
 {id:'a1-2',lvl:'A1',ch:2,diff:1,title:'La voz',
  tz:{de:'Hinter der blauen Tür wartet jemand, der Mia kennt. Oder etwas?',en:'Someone behind the blue door knows Mia. Or something?'},

 {ch:4,diff:1,title:'El abuelo de Leo',

 {ch:5,diff:1,title:'Un mensaje para mamá',
  tz:{de:'Mia fragt ihre Mutter nach der Grossmutter. Die Antwort macht alles noch seltsamer.',en:'Mia asks her mother about her grandmother. The answer makes everything stranger.'},
  paras:[

 {ch:6,diff:1,title:'La segunda llave',
  tz:{de:'Um Mitternacht spricht das Radio wieder. Diesmal hat es einen Auftrag für Mia.',en:'At midnight the radio speaks again. This time it has a task for Mia.'},
  paras:[
   'Son las doce de la noche. Estoy otra vez en la calle del Sol, número siete.',
   'Abro la puerta azul con mi llave. La casa está oscura, como siempre. La radio está en la mesa.',

 {ch:7,diff:1,title:'En el mercado',
  tz:{de:'Im grössten Markt Barcelonas suchen Mia und Leo eine Frau namens Rosa.',en:'In Barcelona\'s biggest market Mia and Leo look for a woman called Rosa.'},
  paras:[
   'Es lunes. Leo y yo vamos al mercado de la Boqueria. Es el mercado más grande de Barcelona.',
   'Hay mucha gente. Hay fruta, pan, pescado y queso. Todo tiene muchos colores: rojo, verde, amarillo, naranja.',
   '«¿Dónde está Rosa?», dice Leo. «Hay cien personas aquí.»',
   'Caminamos y preguntamos. «¿Conoce a Rosa?» «No.» «¿Rosa? No sé.»',
   'Entonces veo algo. Hay una mujer con fruta roja y fruta amarilla: fresas y plátanos. Y en su mesa hay una foto pequeña de una puerta azul.',

   'La mujer me mira. «¿Quién quiere saber?»',
   '«Me llamo Mia. Tengo una llave azul.»',
   'Rosa no dice nada. Mira a Leo. Mira la llave. Después, abre una caja pequeña y saca algo.',

   '«¿Y la segunda llave?», pregunto.',
   '«La carta es la llave», dice Rosa. «Y ahora, ¿quieres comprar fruta? Las fresas son muy buenas. Dos euros.»',
   'Leo compra fresas. Yo miro la carta. Tengo la carta en la mano, y mi mano tiene miedo.'
  ],
  quiz:[

   {q:'¿Qué compra Leo?',o:['Fresas.','Una caja.','Un café.']}
  ]},
 {ch:8,diff:2,title:'La carta de Ana',
  tz:{de:'Ein alter Brief erzählt von einer verbotenen Liebe in der calle del Sol.',en:'An old letter tells of a forbidden love on calle del Sol.'},
  paras:[
   'En mi piso, abro la carta. El papel es viejo y amarillo. La letra es muy bonita.',
   {t:'«Querido amor: Me llamo Ana. Tengo veinte años y vivo en la calle del Sol, número siete. Trabajo en una tienda de radios. Me gusta mi trabajo. Me gusta la música, me gusta el mar y me gustas tú.»',cls:'note'},
   {t:'«Pero tengo un problema. Mi padre no quiere. Dice que tú eres pobre. Dice que yo tengo que ir a Suiza con la familia. Yo no quiero ir. Quiero estar aquí, contigo.»',cls:'note'},
