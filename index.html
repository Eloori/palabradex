  ]}},
 {id:'cuerpo',title:'El cuerpo',color:['#f43f5e','#881337'],
  intro:{de:'Kopf, Hände, Füsse: beim Salsa braucht man alles gleichzeitig.',en:'Head, hands, feet: salsa needs all of them at once.'},
  words:['cuerpo','cabeza','cara','ojo','boca','pelo','mano','brazo','pierna','pie','corazón','garganta'],
  scene:{title:'La clase de Rafa',who:{de:'Rafa, der Salsalehrer aus Kuba',en:'Rafa, the salsa teacher from Cuba'},paras:[
   'Me llamo Rafa. Soy de Cuba y bailo desde los cinco años. Ahora tengo una escuela de baile en Barcelona.',
   'Los martes, la clase es muy divertida. Hay una chica suiza que se llama Mia. Mia tiene una cabeza muy inteligente. Pero su cuerpo no escucha a su cabeza.',
   'Su pie derecho va a la izquierda. Su brazo va arriba cuando la música va abajo. Pero Mia sonríe siempre. Y eso es lo más importante.',
   'Yo digo a mis alumnos: «La salsa no está en la cabeza. No está en los pies. Está aquí.» Y pongo la mano en el corazón.',
   'Mia me mira con los ojos grandes. Cierra los ojos. Escucha la música. Y por un momento, solo un momento, baila. Baila de verdad.',
   'Después pierde el ritmo y se ríe. Pero yo lo veo. Esta chica tiene salsa en el corazón.'
  ]}},
 {id:'ropa',title:'Ropa',color:['#a855f7','#4c1d95'],
  intro:{de:'Ein Vintage Laden in Gràcia und eine blaue Jacke mit Geheimnis.',en:'A vintage shop in Gràcia and a blue jacket with a secret.'},
  words:['ropa','camisa','camiseta','jersey','pantalón','falda','vestido','chaqueta','abrigo','zapato','bota','gafas'],
  scene:{title:'La chaqueta azul',who:{de:'Teresa, die Besitzerin des Kleiderladens in der calle Verdi',en:'Teresa, owner of the clothes shop on calle Verdi'},paras:[
   'Me llamo Teresa. Tengo una tienda de ropa vieja en la calle Verdi. Vestidos, camisas, zapatos, abrigos de otros años.',
   'Un día de enero, entra un chico joven. Lleva gafas de sol, en enero. Muy raro.',
   '«Hola», dice. «Necesito su ayuda. Una chica va a venir. Busca algo azul. ¿Usted tiene una chaqueta azul?»',
   'Busco en mi tienda. Al final encuentro una chaqueta azul, vieja y muy bonita.',
   'El chico pone un papel en el bolsillo de la chaqueta. «Para ella», dice. «Por favor, no diga nada.»',
   'Dos días después, entra una chica. Pelo largo, botas negras, ojos nerviosos. «Busco algo azul», dice.',
   'Yo sonrío. En treinta años de tienda, nunca vendo una chaqueta con tanto amor dentro.'
  ]}},
 {id:'tiempo',title:'Las estaciones',color:['#14b8a6','#134e4a'],
  intro:{de:'Sonne, Regen, Schnee: fünfzig Winter warten.',en:'Sun, rain, snow: fifty winters of waiting.'},
  words:['sol','luna','lluvia','nieve','viento','nube','calor','frío','primavera','verano','otoño','invierno'],
  scene:{title:'Cincuenta inviernos',who:{de:'Joan, über die Jahre, in denen er gewartet hat',en:'Joan, about the years he spent waiting'},paras:[
   'Cada noche, a las doce, voy a la casa azul. En primavera, cuando hay flores en la calle. En verano, cuando hace calor y la gente cena en los balcones.',
   'En otoño, cuando hay viento y las nubes son grises. Y en invierno, cuando hace frío y la lluvia cae en la puerta.',
   'En Barcelona no hay nieve. Pero en mi corazón, cada invierno, hay mucha nieve.',
   'Pongo la radio en la mesa. Digo: «Ana, ¿estás ahí?» Nadie contesta. Cincuenta veranos. Cincuenta inviernos. Nadie.',
   'Mi hija dice: «Papá, ¿por qué vas a la casa azul cada noche?» Yo no digo nada.',
   'Una noche de septiembre, hay luna. Pongo la radio en la mesa. Digo: «¿Hola?»',
   'Y una voz de chica contesta: «¿Hola? ¿Quién es?»',
   'Esa noche, por primera vez en cincuenta años, el invierno termina.'
  ]}},
 {id:'verbos',title:'Los rebeldes',color:['#ef4444','#7f1d1d'],
  intro:{de:'Die wichtigsten Verben halten sich an keine Regel. Genau deshalb muss man sie kennen.',en:'The most important verbs follow no rules. That\'s exactly why you need them.'},
  words:['ser','estar','ir','tener','hacer','decir','poder','querer','venir','saber','ver','dar'],
  scene:{title:'La clase de Carmen',who:{de:'Carmen, Mias Spanischlehrerin',en:'Carmen, Mia\'s Spanish teacher'},paras:[
   'Me llamo Carmen. Soy profesora de español. Hoy la clase habla de los verbos rebeldes.',
   '«¿Por qué rebeldes?», pregunta un estudiante.',
   '«Porque no quieren seguir las reglas», digo. «Ser, estar, ir, tener... Son como adolescentes.»',
   'Escribo en la pizarra: yo soy, yo voy, yo tengo, yo hago, yo digo. Los estudiantes me miran con miedo.',
   '«Tranquilos», digo. «Los verbos rebeldes son difíciles. Pero son los más importantes. Con ellos podéis decir todo: quién sois, dónde estáis, qué queréis.»',
   'Mia levanta la mano. «Profesora, ¿cómo aprendo todo esto?»',
   '«Leyendo», digo. «Una historia, y otra, y otra. Los rebeldes vienen solos. Un día, sin pensar, dices: voy, tengo, sé. Y ya está.»',
   'Mia sonríe. Creo que ella ya sabe.'
  ]}},
 {id:'sentimientos',title:'Sentimientos',color:['#8b5cf6','#3b1a7a'],
  intro:{de:'Angst, Liebe, Freude: manche Wörter spürt man, bevor man sie versteht.',en:'Fear, love, joy: some words you feel before you understand them.'},
  words:['miedo','amor','feliz','triste','nervioso','cansado','contento','sorpresa','cariño','beso','sonrisa','felicidad'],
  scene:{title:'La noche del hospital',who:{de:'Joan, in der Nacht, als Ana auf ihn wartet',en:'Joan, the night Ana waits for him'},paras:[
   'Es la noche de la carta. Son las once. Estoy en el hospital. Mi madre está en la cama, muy enferma.',
   'En mi bolsillo no hay nada. No tengo la carta de Ana. No sé nada de la puerta azul. No sé nada de las doce.',
   'Mi madre me mira. «Joan, estás triste.»',
   '«No, mamá. Estoy cansado.»',
   '«Estás nervioso. Es por la chica de la tienda, ¿verdad? La chica que canta.»',
   'No digo nada. Mi madre sonríe. Es una sonrisa pequeña, con mucho cariño.',
   '«El amor es así», dice. «Siempre llega tarde o temprano. Muchas veces tarde.»',
   'A las doce, en la calle del Sol, una chica espera delante de una puerta azul. Y yo no lo sé. Cincuenta años sin saber.',
   'Pero mi madre tiene razón. El amor llega. Tarde, pero llega.'
  ]}},
 {id:'musica',title:'Música y fiesta',color:['#d4a73a','#713f12'],
  intro:{de:'Gitarren, Konzerte und eine Nacht mit Feuer am Strand.',en:'Guitars, concerts and a night with fire on the beach.'},
  words:['música','guitarra','canción','concierto','cantar','bailar','baile','salsa','fiesta','escenario','fuego','estrella'],
  scene:{title:'La primera canción',who:{de:'Joan, mit zweiundzwanzig, in der Radiowerkstatt',en:'Joan, aged twenty-two, in the radio shop'},paras:[
   'Tengo veintidós años. Es tarde y la tienda de radios está cerrada. Estoy solo con mi guitarra.',
   'Escucho la radio. Es música de otro país, con mucho ritmo. Pero yo quiero otra cosa. Quiero una canción para Ana.',
   'Ana canta cada día en la tienda. Ella no sabe que yo escucho. Su voz es como una estrella en el cielo de la noche.',
   'Toco la guitarra. Una nota. Otra nota. Despacio. Escribo en un papel: «Una chica, una llave, una puerta azul.»',
   'La canción es lenta. Es simple. No es para un escenario. No es para un concierto. Es para una persona.',
   'Muchos años después, mi nieto Leo toca esta canción en un bar del Born. Y Ana canta.',
   'Pero esta noche, en la tienda, nadie escucha. Solo yo, mi guitarra y un sueño.'
  ]}},
 {id:'casa',title:'En casa',color:['#22c55e','#14532d'],
  intro:{de:'Ein Zimmer mit Balkon, ein Sofa und Mitbewohner, die zur Familie werden.',en:'A room with a balcony, a sofa and flatmates who become family.'},
  words:['casa','piso','habitación','cocina','baño','salón','cama','mesa','silla','ventana','balcón','sofá'],
  scene:{title:'Una habitación libre',who:{de:'Marta, bevor Mia in die WG einzieht',en:'Marta, before Mia moves into the flat'},paras:[
   'Me llamo Marta. Soy enfermera y vivo en un piso de la calle Verdi con Pau.',
   'Nuestro piso es viejo. La cocina es pequeña, el baño es más pequeño. Pero el salón tiene un sofá grande y muchas plantas. Y hay una habitación libre, con balcón.',
   'Un día, Laia, la hermana de Leo, me escribe: «Marta, tengo una amiga para tu habitación. Bueno, no es mi amiga. Es la chica de mi hermano. Bueno, todavía no.»',
   'Me río. Laia es mi vecina desde siempre. Es como mi hermana pequeña.',
   'Preparo la habitación. Pongo una cama nueva, una mesa, una silla al lado de la ventana. Y flores en el balcón.',
   'Pau me mira. «¿Flores? ¿Para una chica que no conocemos?»',
   '«Las flores son importantes», digo. «Una casa no es solo un piso. Una casa son las personas.»',
   'Una semana después, Mia entra con sus cajas y su cámara vieja. Y el piso, de repente, es una casa.'
  ]}}
];

 {before:3,title:'Diario: la primera noche',
  tz:{de:'Mias Tagebuch: Sie kann nicht schlafen und schreibt auf, was passiert ist.',en:'Mia\'s diary: she can\'t sleep and writes down what happened.'},

 {before:5,title:'Diario: Ana',
  tz:{de:'Mias Tagebuch: Ana Vidal. Ein Name, den sie kennt. Oder doch nicht?',en:'Mia\'s diary: Ana Vidal. A name she knows. Or does she?'},
  paras:[
   'Hola, diario. Hoy conozco a Joan, el abuelo de Leo. Es un hombre viejo y simpático. Tiene el pelo blanco y los ojos azules.',
   'Joan conoce a la chica de la foto. Se llama Ana. Ana Vidal.',
   'Leo es el chico del bar. Es joven y simpático, y habla muy rápido. Joan habla despacio. Su voz es bonita.',
   'En la plaza del Sol hay mucha gente y mucho sol. Pero yo solo miro a Joan.',
   'Mi abuela se llama Ana. Pero mi abuela vive en Suiza. Siempre en Suiza. ¿Siempre?',
   '¿Qué sé yo de mi abuela? Poco. Muy poco.',
   'Mi familia es pequeña: mi madre, mi padre, mi abuela y yo. Y mi madre sabe mucho de mi abuela.',
   'Tengo una pregunta para mi madre. ¿Hablo con mamá por teléfono? No. Por teléfono mamá habla mucho y yo no digo nada.',
   'Un mensaje. Un mensaje es bueno. Escribo despacio.',
   'Pero primero espero. Espero un minuto. Espero diez minutos.',
   'Miro la llave azul en mi mano. Miro la foto. Y sé una cosa: en mi familia hay un secreto.',
   'Mañana escribo un mensaje a mamá.'
  ],
  quiz:[
   {q:'¿Quién conoce a la chica de la foto?',o:['Joan.','La madre de Mia.','Leo.']},
   {q:'¿Dónde vive la abuela de Mia?',o:['En Suiza.','En Barcelona.','En el bar.']},
   {q:'¿Qué escribe Mia mañana?',o:['Un mensaje a su madre.','Una nota a Leo.','Un libro.']},
   {q:'¿Qué hay en la familia de Mia?',o:['Un secreto.','Una radio.','Un bar.']}
  ]},
 {before:7,title:'Diario: fruta roja',
  tz:{de:'Mias Tagebuch: Rote Früchte, gelbe Früchte und ein Markt, den sie noch nicht kennt.',en:'Mia\'s diary: red fruit, yellow fruit and a market she doesn\'t know yet.'},
  paras:[
   'Hola, diario. Hoy es lunes. Son las siete de la mañana y no duermo mucho.',
   'La radio dice: busca a Rosa en el mercado. Rosa tiene fruta roja y fruta amarilla.',
   'Pero ¿qué mercado? En Barcelona hay muchos mercados. Leo sabe dónde está el mercado. Leo sabe mucho de Barcelona.',
   'En mi calle hay un gato negro. Me mira con sus ojos verdes. Yo miro al gato. El gato no dice nada.',
   '¿Fruta roja? Fresas. ¿Fruta amarilla? Plátanos. ¿Y fruta naranja? Naranjas, claro.',
   'Ahora escribo una nota para el mercado. Quiero comprar algo. Y en el mercado hablo con la gente.',
   {t:'Pan, queso, fresas, plátanos, naranjas.',cls:'note'},
   'Tengo veinte euros. ¿Es mucho? ¿Es poco? No sé.',
   'En el mercado hay mucha gente. Hay muchas mujeres y muchos hombres. Y todo tiene color: rojo, amarillo, naranja, verde.',
   'Rosa es una mujer. ¿Es vieja? ¿Es joven? No sé nada de Rosa. Solo su nombre.',
   'Para una mujer vieja no digo «tú». Digo «usted». «¿Es usted Rosa?»',
   'Tres palabras en español. Bueno. Digo las tres palabras muchas veces: «¿Es usted Rosa? ¿Es usted Rosa?»',
   'Ahora tomo mi café y salgo. Tengo una llave. Y quiero la segunda.'
  ],
  quiz:[
   {q:'¿A qué hora escribe Mia?',o:['A las siete de la mañana.','A las doce de la noche.','A las diez.']},
   {q:'¿Qué fruta es roja?',o:['La fresa.','El plátano.','La naranja.']},
   {q:'¿Qué quiere comprar Mia?',o:['Pan, queso y fruta.','Una radio.','Una llave.']},
   {q:'¿Qué dice Mia a una mujer vieja?',o:['«Usted».','«Tú».','«Hola, chica».']}
  ]},
 {before:9,title:'Diario: el amor de Ana',
  tz:{de:'Mias Tagebuch: Ein Brief, eine verbotene Liebe und ein Gedanke an die Uni.',en:'Mia\'s diary: a letter, a forbidden love and a thought about university.'},
  paras:[
   'Hola, diario. Hoy abro la carta de Ana. Una carta de amor. Una carta muy vieja.',
   'Ana tiene veinte años y trabaja en una tienda de radios. Su padre no quiere al chico de la carta. ¿Por qué? Porque es pobre.',
   'Porque es pobre. Pobre Ana.',
   'Esta noche la carta está en mi mesa, con la llave y la foto. «Querido amor», dice la carta. Pero no hay otro nombre.',
   'Hoy es lunes. Mañana es martes. Los martes por la tarde no hay universidad. Estudio en casa.',
   'Sí, diario: no estoy en Barcelona por la llave. Estoy aquí para estudiar. Estudio economía en la universidad.',
   'Pero hoy no estudio. Hoy miro la carta. Miro la letra bonita de Ana.',
   'Leo trabaja en el bar. ¿Trabaja mucho? ¿Estudia? ¿Tiene familia? No sé. Sé muy poco de Leo.',
   'Ella, Ana, tiene un secreto. Y Joan también tiene un secreto. Seguro.',
   'Mañana por la tarde voy al bar. Hablo con Leo. Y pregunto. Pregunto mucho.'
  ],
  quiz:[
   {q:'¿Qué abre Mia hoy?',o:['Una carta de amor.','Un libro.','Un mensaje de Leo.']},
   {q:'¿Por qué no quiere el padre de Ana al chico?',o:['Porque es pobre.','Porque es de Suiza.','Porque no trabaja.']},
   {q:'¿Qué estudia Mia?',o:['Economía.','Música.','Español.']},
   {q:'¿Qué día va Mia al bar?',o:['El martes por la tarde.','El lunes por la noche.','Nunca.']}
  ]},
 {before:12,title:'Diario: la pregunta',
  tz:{de:'Mias Tagebuch: Joans Geschichte lässt sie nicht los. Draussen wird es grau.',en:'Mia\'s diary: Joan\'s story stays with her. Outside everything turns grey.'},
  paras:[
   'Hola, diario. Son las tres de la mañana. Hace frío en mi piso. Mucho frío.',
   'Pienso en Joan. Pienso en Ana. Pienso en una noche de hace cincuenta años.',
   'Esta noche, en la cocina de Joan, nadie tiene sueño. Joan habla despacio. Leo no dice nada. Yo escucho.',
   'Joan no va a la puerta azul porque su madre está en el hospital. Ana se va a Suiza. Y nadie sabe nada. Nadie.',
   'No entiendo. ¿Por qué no escribe Joan? ¿Por qué no escribe Ana? Bueno, sí entiendo: no tienen dirección.',
   'Ahora Joan tiene ochenta años y una pregunta: ¿todavía tienes la llave?',
   'Es una pregunta para mi abuela. Pero alguien tiene que preguntar. Y ese alguien soy yo.',
   'Miro por la ventana. Todo está gris. Mañana va a llover. Seguro.',
   'Tengo frío. No como nada desde la mañana. En casa solo hay un poco de pan.',
   'Quiero una sopa caliente. Una sopa caliente y una buena idea.',
   'Mañana no salgo de la cama. Mañana pienso. Solo pienso.'
  ],
  quiz:[
   {q:'¿Qué hora es?',o:['Las tres de la mañana.','Las doce del día.','Las siete de la tarde.']},
   {q:'¿Qué pregunta tiene Joan?',o:['¿Todavía tienes la llave?','¿Dónde está la radio?','¿Quién es Mia?']},
   {q:'¿Qué dice Mia de mañana?',o:['Va a llover.','Hay mucha luz.','Mia va a Suiza.']},
   {q:'¿Qué quiere Mia ahora?',o:['Una sopa caliente.','Un café frío.','Una foto.']}
  ]},
 {before:14,title:'Diario: tres días',
  tz:{de:'Mias Tagebuch: Die Grossmutter braucht Zeit. Mia zählt die Tage.',en:'Mia\'s diary: her grandmother needs time. Mia counts the days.'},
  paras:[
   {t:'Miércoles.',cls:'note'},
   'Mi abuela dice: «Mañana hablamos». Pero hoy es miércoles y no hay mensaje. Nada. Miro el teléfono cada minuto.',
   {t:'Jueves.',cls:'note'},
   'No hay mensaje. Voy a la universidad, pero en clase no escucho nada. Pienso en mi abuela. Pienso en Joan.',
   'Por la tarde estoy en el bar con Leo. Leo dice: «Mia, tienes que estar tranquila. Tu abuela necesita tiempo. Cincuenta años es mucho tiempo.»',
   'Tranquila. Sí, claro.',
   'Joan también espera. Joan espera cincuenta años. Yo solo espero tres días. ¿Por qué no estoy tranquila?',
   {t:'Viernes.',cls:'note'},
   'No hay mensaje. Hoy hace calor. Mucho calor. En Suiza hace frío ahora, pero en Barcelona hace sol.',
   'Leo tiene una idea: «Mañana vamos a la playa. Comemos paella en un restaurante y después un helado. Un helado de chocolate.»',
   '¿La playa? ¿Ahora? Bueno. ¿Por qué no?',
   'Esta noche escribo poco. Estoy cansada de esperar. Quiero estar feliz. Un día. Solo un día.'
  ],
  quiz:[
   {q:'¿Qué espera Mia?',o:['Un mensaje de su abuela.','Una carta de Joan.','Un libro.']},
   {q:'¿Qué dice Leo el jueves?',o:['Tienes que estar tranquila.','Tienes que ir a Suiza.','Tienes que estudiar.']},
   {q:'¿Qué tiempo hace el viernes?',o:['Hace calor.','Hace mucho frío.','Llueve.']},
   {q:'¿Qué idea tiene Leo?',o:['Ir a la playa.','Ir al mercado.','Ir al hospital.']}
  ]},
 {before:21,title:'Diario: doce uvas',
  tz:{de:'Mias Tagebuch: Das Jahr geht zu Ende. Leo erklärt ihr eine seltsame spanische Tradition.',en:'Mia\'s diary: the year is ending. Leo explains a strange Spanish tradition.'},
  paras:[
   'Hola, diario. Es diciembre, el último mes del año. Un año difícil, pero muy bonito.',
   'Hoy Leo me dice una cosa. Aquí, la última noche del año, a las doce, hay doce campanadas.',
   'Con cada campanada comes una uva. Doce campanadas, doce uvas. Una uva para cada mes del año nuevo.',
   '«¿Doce uvas en un minuto? ¡Es imposible!», digo.',
   '«No es imposible. Es difícil. Es un juego», dice Leo. «Y si comes las doce uvas, tienes suerte todo el año.»',
   'Suerte. Necesito mucha suerte para el año nuevo.',
   'La casa azul tiene luz, flores y música. Mi abuela canta y Joan escucha la radio. Leo toca la guitarra. Laia habla mucho, como siempre.',
   'Mi madre está en Zúrich, pero mi madre también viene a Barcelona. Todos juntos en la casa azul.',
   'Y hay ropa especial: ropa roja. Mi abuela tiene un vestido rojo. Yo tengo una camisa roja. Bueno, es más naranja que roja.',
   'Mi abuela hace un plato especial para la noche. No sé qué plato. Es un secreto, dice.',
   'Ahora estoy en la cocina. Tengo doce uvas en un plato. Empiezo: una, dos, tres...',
   'Tres uvas. Solo tres. Es muy difícil. Mañana empiezo otra vez.'
  ],
  quiz:[
   {q:'¿Qué mes es?',o:['Diciembre, el último mes.','El primer mes del año.','Mia no sabe.']},
   {q:'¿Qué comes con cada campanada?',o:['Una uva.','Una sopa.','Un helado.']},
   {q:'¿Qué tienes si comes las doce uvas?',o:['Suerte.','Frío.','Miedo.']},
   {q:'¿De qué color es la ropa especial?',o:['Roja.','Azul.','Negra.']}
  ]},
 {before:24,title:'Diario: a la derecha',
  tz:{de:'Mias Tagebuch: Bus, Metro, links, rechts. Mia lernt, sich in Barcelona zu bewegen.',en:'Mia\'s diary: bus, metro, left, right. Mia learns to get around Barcelona.'},
  paras:[
   'Hola, diario. Barcelona es grande. Muy grande. Pero ahora conozco un poco Barcelona.',
   'Mi piso está cerca del mar. El centro no está lejos: camino veinte minutos y estoy en el centro.',
   'Para ir a la universidad tomo el metro. A veces tomo el autobús. En el autobús veo las calles, la gente, el mar.',
   'Desde mi ventana veo una montaña. En la montaña hay árboles y un parque.',
   'Hoy una señora me pregunta en la calle: «¿Dónde está la iglesia?»',
   'Y yo sé la respuesta. «Todo recto. Después, a la derecha. No, no: a la izquierda.»',
   'La señora sonríe. Yo también. ¡Una turista habla con una turista!',
   'Me gusta Barcelona. Me gusta el mar, me gusta el sol y me gusta la gente.',
   'En Barcelona hay iglesias muy altas, con torres muy altas. Y hay muchos turistas, claro.',
   'Mañana voy con Leo a un parque en la montaña. Leo dice que allí vive un dragón. ¿Un dragón? Sí, claro, Leo.',
   'Vamos en autobús. Yo miro a la derecha y a la izquierda. Y Leo mira su teléfono.'
  ],
  quiz:[
   {q:'¿Dónde está el piso de Mia?',o:['Cerca del mar.','Lejos del centro.','En la montaña.']},
   {q:'¿Cómo va Mia a la universidad?',o:['En metro o en autobús.','Con su abuela.','No va.']},
   {q:'¿Qué busca la señora?',o:['La iglesia.','El mar.','Un dragón.']},
   {q:'¿Qué dice Leo del parque?',o:['Que allí vive un dragón.','Que no hay árboles.','Que está en Suiza.']}
  ]},
 {before:26,title:'Diario: frío en enero',
  tz:{de:'Mias Tagebuch: Im Januar ist es kalt, und Mias Jacke ist viel zu klein.',en:'Mia\'s diary: January is cold, and Mia\'s jacket is far too small.'},
  paras:[
   'Hola, diario. Es enero y hace frío. Sí, en Barcelona también hace frío.',
   'Mi chaqueta es vieja. Tengo la chaqueta desde los quince años. Ahora es pequeña y muy estrecha.',
   'Necesito una chaqueta nueva. Y zapatos nuevos. Mis zapatos son para el sol, no para el frío.',
   'Laia, la hermana de Leo, conoce una tienda de ropa en su barrio. Dice que la mujer de la tienda es mayor y muy simpática.',
   '«Te ayudo», dice Laia. «Primero pruebas la chaqueta. Si te queda bien, la compras.»',
   '¿Mi talla? No sé mi talla aquí. En Suiza es otra talla.',
   'En mi maleta de Suiza hay ropa para el sol. No hay ropa para el frío.',
   'Leo dice: «¿Frío? ¡En Barcelona no hace frío!» Leo es de Barcelona. Para él, nada es frío.',
   'Laia tiene gafas grandes y una sonrisa grande. Es mi amiga. Mi primera amiga en Barcelona.',
   'Mañana vamos en metro. No, en tren. Laia dice que en tren es más rápido.',
   'Una chaqueta nueva. Con bolsillos grandes. Para mis llaves, claro.'
  ],
  quiz:[
   {q:'¿Qué necesita Mia?',o:['Una chaqueta nueva.','Una maleta nueva.','Un piso nuevo.']},
   {q:'¿Cómo es la chaqueta vieja?',o:['Pequeña y estrecha.','Grande y nueva.','Roja y bonita.']},
   {q:'¿Quién conoce una tienda de ropa?',o:['Laia.','Joan.','La abuela.']},
   {q:'¿Para qué quiere Mia bolsillos grandes?',o:['Para sus llaves.','Para su teléfono.','Para sus gafas.']}
  ]}
];

 {ch:1,title:'Las historias de Joan',diff:1,

 {ch:2,title:'Atapuerca',diff:1,
  tz:{de:'In einem Berg im Norden liegen die ältesten Menschenknochen Europas.',en:'Inside a mountain in the north lie the oldest human bones in Europe.'},
  paras:[
   'Es martes otra vez. Joan tiene un libro en la mano. En el libro hay una foto: una montaña verde.',
   '«Esta es Atapuerca», dice Joan. «Está en el norte de España, cerca de Burgos. Dentro de la montaña hay cuevas.»',
   '«¿Cuevas?»',
   '«Sí. Una cueva es como una casa en la montaña. Una casa de piedra, oscura y fría.»',
   '«¿Y quién vive en las cuevas?»',
   '«Hoy, nadie. Pero hace mucho tiempo, allí viven personas. Los primeros humanos de Europa.»',
   'Joan abre el libro. En otra foto hay un hueso. Un hueso muy viejo.',
   '«En Atapuerca, los científicos encuentran huesos. Huesos de humanos. Algunos tienen más de un millón de años.»',
   '«¿Un millón de años? ¿Y cómo saben eso?»',
   '«Los científicos estudian los huesos y la tierra. Es su trabajo», dice Joan. «Y en 2022 encuentran algo especial: una parte de una cara. ¡La cara más vieja de Europa!»',
   'Miro la foto. Es solo un hueso. Pero es una cara. Una persona. Hace más de un millón de años.',
   '«¿Cómo es su vida?», pregunto.',
   '«Difícil», dice Joan. «Hace frío. Hay animales muy grandes. No hay casas, no hay pan, no hay cafés.»',
   '«¿No hay cafés? ¡Qué vida tan difícil!», digo. Joan ríe.'
  ],
  quiz:[
   {q:'¿Dónde está Atapuerca?',o:['En el norte de España.','En Barcelona.','En el mar.']},
   {q:'¿Qué hay dentro de la montaña?',o:['Cuevas.','Un bar.','Una tienda.']},
   {q:'¿Qué encuentran los científicos?',o:['Huesos de humanos.','Una llave.','Una radio.']},
   {q:'¿Cómo es la vida hace un millón de años?',o:['Difícil.','Muy fácil.','Como hoy.']}

 {ch:3,title:'Una niña en la cueva',diff:1,
  tz:{de:'1879: Ein achtjähriges Mädchen schaut in einer Höhle nach oben und entdeckt etwas Unglaubliches.',en:'1879: an eight-year-old girl looks up in a cave and discovers something incredible.'},
  paras:[
   '«Hoy, una historia con una niña», dice Joan. «Una niña de ocho años. Se llama María.»',
   '«¿Y dónde vive María?»',
   '«En el norte de España, en Cantabria. Es el año 1879. Su padre se llama Marcelino. Marcelino estudia cosas muy viejas: piedras, huesos, cuevas.»',
   '«Un día, Marcelino y María van a una cueva. La cueva se llama Altamira.»',
   '«Marcelino busca huesos en la tierra. Mira abajo, siempre abajo. Pero María es pequeña. Ella mira arriba.»',
   '«¿Arriba? ¿Y qué ve?»',
   'Joan habla despacio. «En el techo de la cueva hay animales. Animales rojos y negros. Grandes y bonitos. María grita: ¡Papá, mira! ¡Bueyes pintados!»',
   '«¿Bueyes?»',
   '«Ella piensa que son bueyes. Pero no son bueyes. Son bisontes. Un bisonte es un animal grande, como una vaca enorme.»',
   '«¿Y quién pinta los bisontes?»',
   '«Esa es la pregunta. Marcelino dice: son pinturas muy, muy viejas. De los primeros humanos. Pero muchas personas no le creen. Dicen: es imposible. ¡Es mentira!»',
   '«¿Y es mentira?»',
   'Joan sonríe. «La respuesta, el martes que viene.»'
  ],
  quiz:[
   {q:'¿Quién es María?',o:['Una niña de ocho años.','La madre de Mia.','Una profesora.']},
   {q:'¿Dónde mira María?',o:['Arriba, al techo.','Abajo, a la tierra.','Por la ventana.']},
   {q:'¿Qué hay en el techo?',o:['Animales pintados.','Una llave.','Fotos.']},
   {q:'¿Qué dicen muchas personas?',o:['Que es mentira.','Que es bonito.','Que es de Joan.']}
  ]},
 {ch:4,title:'Los pintores de Altamira',diff:1,
  tz:{de:'Wer malte die Bisons, und wie malt man in einer dunklen Höhle?',en:'Who painted the bison, and how do you paint in a dark cave?'},
  paras:[
   '«No es mentira», dice Joan. «Las pinturas son de verdad. Y son muy viejas: tienen más de catorce mil años.»',
   '«¿Catorce mil años? ¿Y quién las pinta?»',
   '«Personas como tú y como yo. Viven en cuevas y cazan animales: bisontes, caballos, ciervos.»',
   '«¿Y por qué pintan?»',
   '«Nadie lo sabe. Es un secreto de la historia. Quizás por magia. Quizás para contar historias. Quizás porque es bonito.»',
   '«¿Y cómo pintan en una cueva oscura? No hay luz.»',
   '«Con fuego», dice Joan. «Tienen lámparas de piedra con fuego. Y los colores vienen de la tierra: rojo, negro, amarillo.»',
   '«En otras cuevas de España también hay manos pintadas. Manos de hace más de treinta mil años.»',
   '«¿Manos? ¿Por qué manos?»',
   '«Quizás es como un nombre. Como decir: yo estoy aquí.»',
   'Miro mi mano. Pienso en una mano roja en una cueva oscura. Hace treinta mil años, una persona dice: yo estoy aquí.',
   '«Hoy, la cueva de Altamira está cerrada», dice Joan. «Pero hay una copia de la cueva en un museo. Allí puedes ver los bisontes.»',
   '«Entonces voy», digo. «Un día voy a ver los bisontes.»'
  ],

 {ch:5,title:'El fuego y el frío',diff:1,
  tz:{de:'Eiszeit: Wie leben Menschen vor zwanzigtausend Jahren?',en:'Ice age: how do people live twenty thousand years ago?'},
  paras:[
   'Hoy hace frío en Barcelona. Joan lleva una chaqueta grande.',
   '«¿Frío?», dice Joan. «Esto no es frío. Hace veinte mil años, sí hace frío. Mucho frío. Es el tiempo del hielo.»',
   '«¿Hay hielo en España?»',
   '«En las montañas, mucho. Y en invierno, nieve por todas partes. Los humanos tienen que vivir con el frío.»',
   '«¿Y cómo viven?»',
   '«En grupos pequeños. Una familia, dos familias. Veinte o treinta personas. Viven en cuevas o cerca de los ríos.»',
   '«Los hombres y las mujeres cazan juntos. Comen carne de ciervo, de caballo, de bisonte. También comen peces del río y fruta del bosque.»',
   '«¿Y la ropa?»',
   '«Ropa de piel de animal. Y fuego, siempre fuego. El fuego es la vida: da luz, da calor y cocina la carne.»',
   '«Por la noche, todos están cerca del fuego. Hablan, comen, escuchan historias.»',
   '«Como nosotros», digo. «Tú cuentas historias y yo escucho.»',
   'Joan ríe. «Sí. Pero nosotros tenemos café.»'
  ],
  quiz:[

 {ch:6,title:'El pan y las cabras',diff:1,
  tz:{de:'Vor über siebentausend Jahren lernen die Menschen, das Land zu bebauen.',en:'Over seven thousand years ago, people learn to farm the land.'},
  paras:[
   '«Hoy hablamos de pan», dice Joan, y toma un poco de pan con tomate.',
   '«¿Pan? ¿Hay pan en la historia?»',
   '«Claro. El pan es muy importante. Hace más de siete mil años, en España, las personas aprenden algo nuevo.»',
   '«¿Qué aprenden?»',
   '«Aprenden a cultivar la tierra. Plantan trigo y hacen pan. Y tienen animales en casa: cabras y ovejas.»',
   '«Ahora no tienen que buscar comida todo el día. Ahora la comida está aquí, en el campo.»',
   '«Entonces ya no viven en cuevas.»',
   '«No. Construyen casas. Casas pequeñas, juntas. Así nacen los primeros pueblos.»',
   '«Y en los pueblos hacen cosas nuevas: platos de tierra, ropa, herramientas de piedra.»',
   'Pienso en el mercado de Rosa: pan, queso, fruta. Todo empieza aquí. Hace siete mil años.',
   '«Joan, una pregunta: ¿el queso también es tan viejo?»',
   '«Casi», dice Joan. «Con la leche de las cabras, sí.»'
  ],
  quiz:[
   {q:'¿Qué aprenden las personas hace siete mil años?',o:['A cultivar la tierra.','A pintar.','A escribir.']},
   {q:'¿Qué animales tienen en casa?',o:['Cabras y ovejas.','Bisontes.','Caballos.']},
   {q:'¿Dónde viven ahora?',o:['En casas, en pueblos.','En cuevas.','En el bosque.']},
   {q:'¿Qué hacen con el trigo?',o:['Pan.','Ropa.','Fuego.']}
  ]},
 {ch:7,title:'Las casas de los muertos',diff:2,
  tz:{de:'In Antequera stehen Steinbauten, die älter sind als die Pyramiden.',en:'In Antequera stand stone buildings older than the pyramids.'},
  paras:[
   '«¿Conoces Antequera?», pregunta Joan. «Es un pueblo en el sur, cerca de Málaga.»',
   '«No. ¿Qué hay allí?»',
   '«Casas de piedra. Pero no son casas para vivir. Son casas para los muertos.»',
   '«¿Para los muertos?»',
   '«Sí. Se llaman dólmenes. Son muy viejos: tienen casi seis mil años. Son más viejos que las pirámides de Egipto.»',
   '«¿Y cómo son?»',
   '«Enormes. Las piedras son muy grandes. Una piedra del techo pesa más que cien coches.»',
   '«¿Y cómo mueven esas piedras? No tienen máquinas.»',
   '«Con mucha gente, mucho trabajo y mucho tiempo. Es otro secreto de la historia.»',
   'Joan dibuja una montaña en un papel. «Desde un dolmen ves esta montaña. Tiene la forma de una cara. La cara de un hombre que duerme.»',
   '«¿Una cara en la montaña?»',
   '«Sí. Y la puerta del dolmen mira a la montaña. Las personas de entonces miran la misma montaña que nosotros hoy.»',
   'Me gusta esa idea. Una montaña que mira la historia. Seis mil años.'
  ],
  quiz:[
   {q:'¿Para qué son los dólmenes?',o:['Para los muertos.','Para vivir.','Para cocinar.']},
   {q:'¿Cómo son las piedras?',o:['Enormes.','Pequeñas.','Azules.']},
   {q:'¿Qué forma tiene la montaña?',o:['La cara de un hombre que duerme.','Un bisonte.','Una mano.']},
   {q:'¿Dónde está Antequera?',o:['En el sur, cerca de Málaga.','En el norte.','Cerca de Barcelona.']}
  ]},
 {ch:8,title:'Los íberos',diff:2,
  tz:{de:'Die Iberer haben eigene Buchstaben. Lesen kann man sie, verstehen nicht.',en:'The Iberians have their own letters. You can read them, but not understand them.'},
  paras:[
   '«Ahora la historia cambia», dice Joan. «Hace unos dos mil quinientos años, en el este{el este} y en el sur de España viven los íberos.»',
   '«¿Íberos? ¿Como la península Ibérica?»',
   '«Exacto. El nombre viene de ellos. Los íberos no son un pueblo. Son muchos pueblos. Cada pueblo tiene su ciudad y su rey.»',
   '«¿Ciudades de verdad?»',
   '«Sí. Ciudades pequeñas, en lo alto de una montaña, con un muro de piedra. Desde allí ven a los enemigos.»',
   '«Los íberos cultivan la tierra, pero también trabajan el metal. Hacen espadas muy buenas. Y tienen muchos caballos.»',
   '«¿Y saben escribir?»',
   '«Sí. Tienen sus propias letras. Hoy podemos leer las letras... pero no entendemos las palabras.»',
   '«¿Cómo? ¿Puedes leer, pero no entender?»',
   '«Exacto. Leemos los sonidos, pero la lengua de los íberos es un misterio. Nadie sabe qué dicen.»',
   'Pienso en mis primeros días en Barcelona. Escucho español, pero no entiendo nada. Como los íberos para nosotros.',
   '«Y la mujer más famosa de los íberos», dice Joan, «es una mujer de piedra.»'
  ],
  quiz:[
   {q:'¿Dónde viven los íberos?',o:['En el este{el este} y en el sur de España.','En el norte.','En Suiza.']},
   {q:'¿Dónde están sus ciudades?',o:['En lo alto de una montaña.','En el mar.','En cuevas.']},
   {q:'¿Qué hacen muy bien?',o:['Espadas de metal.','Pan con tomate.','Radios.']},
   {q:'¿Qué es un misterio?',o:['La lengua de los íberos.','El nombre de Joan.','El color del mar.']}
  ]},
 {ch:9,title:'La Dama de Elche',diff:2,
  tz:{de:'1897 findet ein Junge auf einem Feld einen steinernen Frauenkopf.',en:'In 1897 a boy finds a woman\'s stone head in a field.'},
  paras:[
   '«Es el año 1897, en Elche, cerca de Alicante», dice Joan. «Un chico joven trabaja en el campo. De repente, encuentra una piedra con cara.»',
   '«¿Una piedra con cara?»',
   '«Una cabeza de mujer. Una mujer de piedra, muy elegante. Hoy la llamamos la Dama de Elche.»',
   'Joan me enseña una foto en su teléfono. La mujer tiene los ojos tranquilos. En la cabeza lleva dos ruedas grandes, una a cada lado.',
   '«¿Qué son las ruedas?»',
   '«Quizás joyas. Quizás el pelo. Nadie lo sabe seguro.»',
   '«¿Y qué edad tiene?»',
   '«Unos dos mil quinientos años. Es íbera.»',
   '«Y tiene una historia triste: en el mismo año, 1897, un museo de París la compra. La Dama vive más de cuarenta años en Francia.»',
   '«¿Y ahora?»',
   '«Vuelve a España en 1941. Ahora está en un museo en Madrid.»',
   'Miro otra vez la foto. Una mujer de piedra, sola, lejos de su casa. Un poco como yo.'
  ],
  quiz:[
   {q:'¿Quién encuentra la Dama?',o:['Un chico joven.','María.','Joan.']},
   {q:'¿Qué lleva la Dama en la cabeza?',o:['Dos ruedas grandes.','Una llave.','Una foto.']},
   {q:'¿Dónde está la Dama más de cuarenta años?',o:['En Francia.','En Elche.','En Suiza.']},
   {q:'¿Dónde está hoy?',o:['En un museo en Madrid.','En Barcelona.','En el campo.']}
  ]},
 {ch:10,title:'Los celtas',diff:2,

  paras:[

   '«Allí viven otros pueblos: los celtas», dice Joan. «Vienen del centro de Europa.»',
   '«¿Celtas? ¿Como en Irlanda?»',
   '«Sí, parecidos. En Galicia, en el norte, todavía hay pueblos celtas de piedra. Se llaman castros. Las casas son redondas.»',
   '«¿Redondas? ¡Qué bonito!»',
   '«Y en el centro de España, los íberos y los celtas viven juntos. Por eso los llamamos celtíberos.»',
   '«Celta más íbero: celtíbero. Es fácil.»',
   '«Son fuertes y libres», dice Joan. «Muy libres. Para ellos, la libertad es lo más importante.»',
   '«¿Por qué dices eso?»',
   '«Porque pronto llegan otros pueblos a España. Y los celtíberos no quieren a nadie en su tierra.»',
   '«¿Quién llega?»',
   'Joan mira el mar por la ventana. «Ellos llegan por allí. Por el mar.»'
  ],
  quiz:[
   {q:'¿Dónde viven los celtas?',o:['En el norte y en el oeste.','En el sur.','En el este{el este}.']},
   {q:'¿Cómo son las casas de los castros?',o:['Redondas, de piedra.','Altas, de metal.','Pequeñas, de papel.']},

 {ch:11,title:'Tartessos, el reino de la plata',diff:2,
  tz:{de:'Ein reiches Königreich im Süden verschwindet spurlos.',en:'A rich kingdom in the south disappears without a trace.'},
  paras:[
   '«Antes del mar, una historia rara», dice Joan. «Un reino muy rico en el sur. Se llama Tartessos.»',
   '«¿Rico? ¿Con oro?»',
   '«Con oro y, sobre todo, con plata. En sus montañas hay mucho metal.»',
   '«Los griegos escriben sobre Tartessos. Dicen que tiene un rey muy famoso: Argantonio.»',
   '«¿Y qué tiene de especial?»',
   '«Según los griegos, vive ciento veinte años. Y es rey durante ochenta años.»',
   '«¡Ciento veinte años! ¿Es verdad?»',
   'Joan ríe. «Seguro que no. Es una leyenda. Pero es una leyenda bonita.»',
   '«¿Y dónde está Tartessos hoy?»',
   '«Esa es la gran pregunta. Un día, Tartessos desaparece. Nadie sabe por qué. Y nadie sabe dónde está su ciudad.»',
   '«¿Nadie? ¿Todavía no?»',
   '«Todavía no. Muchos científicos la buscan. Quizás está bajo la tierra, cerca de un río. Quizás bajo el mar.»',
   '«Una ciudad perdida», digo. «Me gusta.»'
  ],
  quiz:[
   {q:'¿Dónde está Tartessos?',o:['En el sur.','En el norte.','Cerca de Barcelona.']},
   {q:'¿Qué hay en sus montañas?',o:['Mucho metal.','Mucha nieve.','Muchas cuevas pintadas.']},
   {q:'¿Qué dicen los griegos de Argantonio?',o:['Que vive ciento veinte años.','Que es pobre.','Que no es rey.']},

 {ch:12,title:'Barcos del este{el este}',diff:2,

   '«De muy lejos. Del este{el este} del mar Mediterráneo, del Líbano de hoy.»',

   '«¿Cádiz tiene tres mil años?»',

 {ch:13,title:'Una ciudad griega',diff:2,

 {ch:14,title:'Cartago',diff:2,
  tz:{de:'Karthago will Spanien. Und eine Legende verbindet die Familie Barca mit Barcelona.',en:'Carthage wants Spain. And a legend links the Barca family to Barcelona.'},

   '«En el norte de África, en Túnez de hoy. Es una ciudad de los fenicios. Pero ahora es muy fuerte y quiere más tierra.»',
   '«¿Y qué tierra quiere?»',
   '«España. Por la plata, por los metales, por los soldados.»',
   '«Una familia de Cartago es muy importante aquí: la familia Barca. En el año 227 antes de Cristo, los cartagineses fundan una ciudad nueva en el sur. La llaman Qart Hadasht: ciudad nueva.»',

   '«Hoy se llama Cartagena.»',

   '«Eso dice la leyenda. Pero es solo una leyenda. Los historiadores no están seguros.»',
   '«Barca, Barcelona, Barça», dice Leo desde la barra. «¡Todo tiene sentido!»',

 {ch:15,title:'Aníbal y los elefantes',diff:3,

   '«En el año 219 antes de Cristo, Aníbal ataca Sagunto, una ciudad íbera amiga de Roma. Sagunto está cerca de Valencia.»',
   '«Y Roma está enfadada.»',
   '«Muy enfadada. Así empieza una guerra enorme. Y Aníbal tiene una idea loca: ir a Italia a pie.»',
   '«¿A pie? ¿Desde España?»',
   '«Sí. Con un ejército enorme. Miles de soldados, miles de caballos... y treinta y siete elefantes.»',
   '«¿Elefantes? ¿En las montañas?»',
   '«Sí. Cruzan los Pirineos y después los Alpes, con nieve y mucho frío. Muchos soldados mueren. Muchos elefantes también.»',
   'Pienso en un elefante en la nieve. Un animal de África, en la nieve de los Alpes. Pobre elefante.',

 {ch:16,title:'Llegan los romanos',diff:3,

   '«¡No! ¿En Empúries? Yo estoy allí el sábado.»',
   '«Exacto. Los romanos llegan en barcos, con muchos soldados. Quieren luchar contra Cartago aquí, en España.»',
   '«La guerra es larga. Doce años. Pero al final, Roma gana. Los cartagineses tienen que salir de España.»',
   '«Entonces, ¿los romanos vuelven a casa?»',
   'Joan ríe. «No. Los romanos no vuelven. Se quedan. Se quedan seiscientos años.»',
   '«¿Seiscientos años?»',
   '«Sí. Para ellos, España es Hispania. Una tierra rica: plata, oro, trigo, aceite, vino. Todo lo que Roma necesita.»',
   '«¿Y los íberos y los celtas? ¿Qué piensan?»',
   '«No están contentos. Muchos pueblos luchan contra Roma. Durante doscientos años.»',

   '«Sí. Y una ciudad lucha más que todas. Se llama Numancia.»'

 {ch:17,title:'Numancia',diff:3,

 {ch:18,title:'Viriato, el pastor',diff:3,
  tz:{de:'Ein Hirte kämpft acht Jahre gegen Rom. Am Ende verraten ihn seine Freunde.',en:'A shepherd fights Rome for eight years. In the end his friends betray him.'},
  paras:[
   '«Ahora una historia del oeste», dice Joan. «De Lusitania, entre España y Portugal de hoy.»',
   '«Allí hay un hombre que se llama Viriato. No es rey. No es general. Es pastor: cuida ovejas en las montañas.»',
   '«¿Un pastor contra Roma?»',
   '«Sí. Viriato conoce muy bien las montañas. Ataca rápido y desaparece. Los romanos no lo encuentran nunca.»',
   '«Durante ocho años, Viriato gana batalla tras batalla. Roma no entiende cómo un pastor puede ser tan peligroso.»',
   '«¿Y al final?»',
   '«Al final, Roma no puede ganar con soldados. Entonces usa el dinero. Paga a tres amigos de Viriato.»',
   '«¡No!»',
   '«Sí. Una noche, mientras Viriato duerme, los tres amigos lo matan.»',
   '«¡Qué horror! ¿Y Roma paga?»',
   '«Dice la leyenda que no. Cuando los tres van a pedir su dinero, los romanos dicen: Roma no paga a traidores.»',
   'Pienso un momento. «Es una frase muy famosa, ¿no?»',
   '«Muy famosa. En España y en Portugal, Viriato es un héroe.»'
  ],

   {q:'¿Cómo muere Viriato?',o:['Sus tres amigos lo matan.','En una batalla en Roma.','Muy viejo, en casa.']},
   {q:'¿Qué dicen los romanos a los traidores?',o:['Roma no paga a traidores.','Gracias, amigos.','Aquí está el dinero.']}

 {ch:19,title:'Hablas latín (casi)',diff:3,
  tz:{de:'Spanisch kommt vom Latein. Und die Römer bauen Strassen, Brücken und Aquädukte.',en:'Spanish comes from Latin. And the Romans build roads, bridges and aqueducts.'},
  paras:[
   '«Hoy, una buena noticia», dice Joan. «Tú hablas latín.»',
   '«¿Yo? No. Hablo un poco de español. Y alemán.»',
   '«El español viene del latín, la lengua de los romanos. Mira.»',
   'Joan escribe en un papel: aqua, noctem, oculum.',
   '«Aqua es agua. Noctem es noche. Oculum es ojo», dice. «El latín cambia poco a poco, durante muchos siglos. Y un día es español.»',
   '«¡Entonces sí hablo un poco de latín!»',
   '«Exacto. Y los romanos no traen solo la lengua. Construyen caminos, puentes y ciudades. Un camino romano va desde los Pirineos hasta Cádiz: la Vía Augusta. Y pasa por Barcelona.»',
   '«¿Por Barcelona?»',
   '«Sí. Y en Segovia hay un acueducto romano. Lleva agua a la ciudad. Tiene casi dos mil años y todavía está allí.»',
   '«Y los hispanos, ¿son romanos ahora?»',
   '«Poco a poco, sí. Hablan latín y viven en ciudades romanas. Y algunos llegan muy alto. Trajano nace en Hispania, cerca de Sevilla. Y es emperador de Roma.»',
   '«¿Un emperador de Roma, de España?»',
   '«Sí. Es el primer emperador que no nace en Italia.»'
  ],
  quiz:[
   {q:'¿De dónde viene el español?',o:['Del latín.','Del griego.','De la lengua íbera.']},
   {q:'¿Qué es aqua en español?',o:['Agua.','Noche.','Ojo.']},
   {q:'¿Qué hay en Segovia?',o:['Un acueducto romano.','Una cueva pintada.','Un dolmen.']},
   {q:'¿Quién es Trajano?',o:['Un emperador de Roma que nace en Hispania.','Un pastor.','Un general de Cartago.']}
  ]},
 {ch:20,title:'Barcino',diff:3,
  tz:{de:'Mitten in Barcelona findet Mia vier römische Säulen. Ende des ersten Teils.',en:'In the middle of Barcelona, Mia finds four Roman columns. End of part one.'},
  paras:[
   'Hoy no voy al bar. Joan me envía un mensaje: «Ve a la calle Paradís, detrás de la catedral. Entra en el patio. Y mira arriba.»',
   'Camino por el barrio Gótico. Las calles son estrechas y oscuras. Busco la calle Paradís. Es pequeña, muy pequeña.',
   'Entro en un patio. Y allí, dentro de una casa vieja, hay cuatro columnas enormes. Columnas romanas.',
   'Miro arriba, como María en Altamira. Las columnas son muy altas. Tienen dos mil años.',
   'En la pared hay un papel: «Templo de Augusto. Siglo I antes de Cristo. Barcino.»',
   'Barcino. Así se llama Barcelona en tiempos de los romanos. Una ciudad pequeña, con un muro alrededor y cuatro puertas.',
   'En el templo, los romanos hablan con sus dioses y con el emperador Augusto. Aquí, en mi ciudad. Cerca de mi piso.',
   'Escribo a Joan: «Estoy aquí. Es increíble.»',
   'Joan contesta: «Barcelona tiene más de dos mil años, Mia. Cada piedra tiene una historia. Y tú ahora conoces el principio.»',
   'Toco una columna. Está fría. Pienso en María y los bisontes, en la Dama de Elche, en Viriato, en los elefantes en la nieve.',
   'Escribo otra vez: «¿Y el martes que viene?»',
   'Joan contesta: «El martes que viene, Roma empieza a caer.»',
   {t:'Fin de la primera parte',cls:'note'}
  ],
  quiz:[
   {q:'¿Qué hay en el patio?',o:['Cuatro columnas romanas.','Una cueva.','Un bar.']},
   {q:'¿Cómo se llama Barcelona en tiempos de los romanos?',o:['Barcino.','Gadir.','Emporion.']},
   {q:'¿Con quién hablan los romanos en el templo?',o:['Con sus dioses y el emperador.','Con los fenicios.','Con Joan.']},
   {q:'¿Qué tiene cada piedra de Barcelona, según Joan?',o:['Una historia.','Un número.','Un secreto de Mia.']}
  ]}

 {ch:2,title:'El chocolate',diff:1,

 {ch:3,title:'Libros para todos',diff:1,

  paras:[

 {ch:4,title:'¿Hola? ¿Me oyes?',diff:1,

 {ch:5,title:'Luz en la noche',diff:2,

 {ch:6,title:'Doce segundos en el aire',diff:2,

 {ch:7,title:'Una medicina por casualidad',diff:2,

 {ch:8,title:'Marie Curie',diff:2,

   {q:'¿Cuántos Premios Nobel recibe Marie?',o:['Dos.','Uno.','Cinco.']}
  ]},
 {ch:9,title:'El Titanic',diff:2,

 {ch:10,title:'La Segunda Guerra Mundial',diff:3,
  tz:{de:'1939 bis 1945: der grösste Krieg der Geschichte, und was die Welt daraus lernt.',en:'1939 to 1945: the largest war in history, and what the world learns from it.'},

 {ch:11,title:'Un pequeño paso',diff:3,

 {ch:12,title:'El muro cae',diff:3,
  tz:{de:'28 Jahre trennt eine Mauer Berlin. In einer Nacht im November 1989 ist sie plötzlich offen.',en:'For 28 years a wall divides Berlin. One night in November 1989 it is suddenly open.'},
  paras:[
   'Después de la Segunda Guerra Mundial, Alemania tiene dos partes. Al oeste, un país libre. Al este{el este}, un país comunista.',
   'La ciudad de Berlín también tiene dos partes. Muchas personas del este{el este} se van al oeste. Quieren más libertad.',
   'En 1961, el gobierno del este{el este} construye un muro. Un muro alto y largo, en medio de la ciudad.',
   'De un día para otro, familias y amigos están separados. Una calle, un muro, dos mundos.',
   'Durante veintiocho años, el muro está allí. Muchas personas intentan pasar. Algunas mueren.',
   'En 1989, todo cambia. En el este{el este} hay grandes protestas. La gente quiere libertad.',
   'El 9 de noviembre de 1989, el gobierno abre la frontera. Por la noche, miles de personas van al muro.',
   'Pasan al otro lado. Lloran, ríen, se abrazan. Algunas personas suben al muro con martillos.',
   'Un año después, en 1990, Alemania es otra vez un solo país.',
   {t:'¿Sabías que...? Hoy hay trozos del muro de Berlín en muchas ciudades del mundo. También en Barcelona.',cls:'note'}
  ],
  quiz:[
   {q:'¿Cuántas partes tiene Berlín?',o:['Dos.','Tres.','Una.']},
   {q:'¿Cuándo construyen el muro?',o:['En 1961.','En 1492.','En 1903.']},
   {q:'¿Qué pasa el 9 de noviembre de 1989?',o:['Abren la frontera.','Construyen otro muro.','Empieza una guerra.']},
   {q:'¿Qué pasa en 1990?',o:['Alemania es otra vez un solo país.','Berlín desaparece.','Todos se van a España.']}
  ]}
];

/* Clase de español: Grammatikstunden zwischen den Kapiteln */
const CLASES=[
 {after:5,title:'El, la, un, una',
  tz:{de:'Erste Spanischstunde an der Uni: Warum heisst es el sol, aber la luna?',en:'First Spanish class at university: why is it el sol but la luna?'},
  paras:[
   'Es lunes. Hoy empieza mi clase de español en la universidad. Somos diez personas de muchos países.',
   'A mi lado hay un chico alto. Se llama Tom y es de Londres. Delante de mí hay una chica. Se llama Yuki y es de Tokio.',
   'La profesora se llama Carmen. Es simpática y habla despacio. Muy despacio. ¡Perfecto para mí!',
   '«En español, cada palabra es masculina o femenina», dice Carmen. «Por ejemplo: el libro, la mesa. El sol, la luna.»',
   {gram:{de:'<b>Männlich oder weiblich</b><br>Jedes Nomen hat ein Geschlecht. Der Artikel zeigt es:<table><tr><th></th><th>männlich</th><th>weiblich</th></tr><tr><td>der/die/das</td><td><b>el</b> libro</td><td><b>la</b> mesa</td></tr><tr><td>ein/eine</td><td><b>un</b> libro</td><td><b>una</b> mesa</td></tr></table>Faustregel: Wörter auf <b>-o</b> sind meist männlich, Wörter auf <b>-a</b> meist weiblich. Ausnahmen: <i>el día, el mapa, la mano, la foto</i>.',en:'<b>Masculine or feminine</b><br>Every noun has a gender. The article shows it:<table><tr><th></th><th>masculine</th><th>feminine</th></tr><tr><td>the</td><td><b>el</b> libro</td><td><b>la</b> mesa</td></tr><tr><td>a</td><td><b>un</b> libro</td><td><b>una</b> mesa</td></tr></table>Rule of thumb: words ending in <b>-o</b> are mostly masculine, words in <b>-a</b> mostly feminine. Exceptions: <i>el día, el mapa, la mano, la foto</i>.'}},
   'Tom levanta la mano. «¿Y la foto? Termina en a.»',
   '«Muy bien, Tom. La foto es femenina. Pero el día es masculino. Siempre hay excepciones», dice Carmen, y sonríe.',
   'Yuki escribe todo en un cuaderno pequeño. Yo escribo también: el café, la casa, el mar, la llave.',
   'Pienso en mi llave azul. Una llave. La llave. Mi llave. Ahora la palabra tiene un artículo.'
  ],
  quiz:[
   {q:'___ libro',o:['el','la']},
   {q:'___ casa',o:['la','el']},
   {q:'Tengo ___ llave azul.',o:['una','un']},
   {q:'___ día es muy bonito.',o:['El','La']},
   {q:'Hay ___ chico alto.',o:['un','una']},
   {q:'___ foto es muy vieja.',o:['La','El']}
  ]},
 {after:10,title:'Uno, dos, muchos',
  tz:{de:'Plural: Wann kommt -s, wann -es? Und was wird aus el und la?',en:'Plural: when do you add -s, when -es? And what happens to el and la?'},
  paras:[
   'Hoy Carmen trae una bolsa grande a clase. Dentro hay muchas cosas: un libro, dos libros, una flor, tres flores.',
   '«Hoy hablamos del plural», dice. «Una cosa, muchas cosas.»',
   {gram:{de:'<b>Mehrzahl</b><table><tr><th>Endung</th><th>Einzahl</th><th>Mehrzahl</th></tr><tr><td>Vokal</td><td>libro</td><td>libro<b>s</b></td></tr><tr><td>Konsonant</td><td>flor</td><td>flor<b>es</b></td></tr><tr><td>-z</td><td>vez</td><td>ve<b>ces</b></td></tr></table>Die Artikel ändern sich mit: <b>el → los</b>, <b>la → las</b>, <b>un → unos</b>, <b>una → unas</b>.',en:'<b>Plural</b><table><tr><th>Ending</th><th>Singular</th><th>Plural</th></tr><tr><td>vowel</td><td>libro</td><td>libro<b>s</b></td></tr><tr><td>consonant</td><td>flor</td><td>flor<b>es</b></td></tr><tr><td>-z</td><td>vez</td><td>ve<b>ces</b></td></tr></table>The articles change too: <b>el → los</b>, <b>la → las</b>, <b>un → unos</b>, <b>una → unas</b>.'}},
   'Carmen pone las cosas en la mesa. «Tom, ¿qué hay en la mesa?»',
   '«Hay dos libros, tres flores... y una llave.»',
   '«¿Una llave?», pregunto. Miro la mesa. Es una llave normal, no azul. Bueno.',
   '«Yuki, ¿y ahora?» Carmen pone otra llave en la mesa.',
   '«Dos llaves», dice Yuki. «Las llaves.»',
   '«¡Perfecto!» Carmen está contenta. «Y Mia: el mes, los...»',
   '«¿Los meses?», digo.',
   '«Exacto. Mes termina en consonante, entonces es meses.»',
   'Después de la clase, en la calle, cuento todo: dos coches, cuatro árboles, muchas personas. El español está en todas partes.'
  ],
  quiz:[
   {q:'un libro, dos ___',o:['libros','libroes']},
   {q:'una flor, tres ___',o:['flores','flors']},
   {q:'el mes, los ___',o:['meses','mess']},
   {q:'___ llaves',o:['las','los']},
   {q:'___ libros',o:['los','las']},
   {q:'una vez, dos ___',o:['veces','vezes']}
  ]},
 {after:15,title:'Soy de Suiza',
  tz:{de:'Das Verb ser: Wer bin ich, woher komme ich, wie bin ich?',en:'The verb ser: who am I, where am I from, what am I like?'},
  paras:[
   '«Hoy cada persona dice quién es», dice Carmen. «Nombre, país y una cosa sobre vosotros.»',
   'Tom empieza: «Soy Tom. Soy de Londres. Soy estudiante de historia.»',
   'Yuki dice: «Soy Yuki. Soy de Japón. Mi familia es grande: somos seis.»',
   'Ahora yo. Estoy un poco nerviosa. «Soy Mia. Soy de Suiza. Soy estudiante de economía. Y... soy una persona curiosa.»',
   '«¿Curiosa?», pregunta Carmen. «¿Por qué?»',
   'Pienso en la llave azul, en la radio, en Joan. «Es una historia larga», digo. Todos ríen.',
   {gram:{de:'<b>ser = sein</b> (unregelmässig)<table><tr><td>yo</td><td><b>soy</b></td><td>nosotros</td><td><b>somos</b></td></tr><tr><td>tú</td><td><b>eres</b></td><td>vosotros</td><td><b>sois</b></td></tr><tr><td>él / ella</td><td><b>es</b></td><td>ellos / ellas</td><td><b>son</b></td></tr></table>Ser braucht man für Dinge, die zu jemandem gehören: <b>Name, Herkunft, Beruf, Charakter</b>.<br><i>Soy Mia. Soy de Suiza. Es simpática.</i>',en:'<b>ser = to be</b> (irregular)<table><tr><td>yo</td><td><b>soy</b></td><td>nosotros</td><td><b>somos</b></td></tr><tr><td>tú</td><td><b>eres</b></td><td>vosotros</td><td><b>sois</b></td></tr><tr><td>él / ella</td><td><b>es</b></td><td>ellos / ellas</td><td><b>son</b></td></tr></table>Use ser for what belongs to someone: <b>name, origin, job, character</b>.<br><i>Soy Mia. Soy de Suiza. Es simpática.</i>'}},
   '«Tom y Yuki, ¿de dónde sois?», pregunta Carmen.',
   '«Somos de muy lejos», dice Yuki. «Él es de Londres y yo soy de Tokio.»',
   'Al final de la clase, Carmen dice: «Sois un grupo muy bueno.» Y yo pienso: sí, somos un buen grupo.'
  ],
  quiz:[
   {q:'Yo ___ de Suiza.',o:['soy','es','eres']},
   {q:'Tom ___ de Londres.',o:['es','soy','son']},
   {q:'Nosotros ___ estudiantes.',o:['somos','son','sois']},
   {q:'¿De dónde ___ tú?',o:['eres','es','soy']},
   {q:'Tom y Yuki ___ simpáticos.',o:['son','es','somos']},
   {q:'Vosotros ___ un grupo muy bueno.',o:['sois','somos','son']}
  ]},
 {after:20,title:'¿Ser o estar?',
  tz:{de:'Zwei Verben für sein. Die wichtigste Frage der spanischen Grammatik.',en:'Two verbs for to be. The most important question in Spanish grammar.'},
  paras:[
   'Hoy Tom no está bien. Está cansado y un poco triste.',
   '«Tom, ¿estás bien?», pregunta Carmen.',
   '«Estoy cansado. Mi novia está en Londres y yo estoy aquí.»',
   'Carmen dice que sí con la cabeza. Después mira a la clase. «Tom no es triste. Tom está triste. Hoy. ¿Veis la diferencia?»',
   {gram:{de:'<b>ser oder estar?</b><br><b>ser</b>: wer oder was jemand <i>ist</i>. Name, Herkunft, Beruf, Charakter.<br><b>estar</b>: wie es jemandem <i>gerade geht</i> und <b>wo</b> etwas ist.<table><tr><td>yo</td><td><b>estoy</b></td><td>nosotros</td><td><b>estamos</b></td></tr><tr><td>tú</td><td><b>estás</b></td><td>vosotros</td><td><b>estáis</b></td></tr><tr><td>él / ella</td><td><b>está</b></td><td>ellos</td><td><b>están</b></td></tr></table><i>Tom es simpático</i> (Charakter). <i>Tom está cansado</i> (jetzt). <i>Londres está en Inglaterra</i> (Ort).',en:'<b>ser or estar?</b><br><b>ser</b>: who or what someone <i>is</i>. Name, origin, job, character.<br><b>estar</b>: how someone <i>is right now</i> and <b>where</b> something is.<table><tr><td>yo</td><td><b>estoy</b></td><td>nosotros</td><td><b>estamos</b></td></tr><tr><td>tú</td><td><b>estás</b></td><td>vosotros</td><td><b>estáis</b></td></tr><tr><td>él / ella</td><td><b>está</b></td><td>ellos</td><td><b>están</b></td></tr></table><i>Tom es simpático</i> (character). <i>Tom está cansado</i> (now). <i>Londres está en Inglaterra</i> (place).'}},
   'Yuki levanta la mano. «¿Y Barcelona? ¿Es bonita o está bonita?»',
   '«Barcelona es bonita. Siempre», dice Carmen. «Pero hoy, con el sol, está muy bonita.»',
   'Todos reímos. Hasta Tom.',
   'Después de la clase, escribo a Leo: «Estoy en la universidad. Estoy contenta. ¿Dónde estás tú?»',
   'Leo contesta: «Estoy en el bar. Y tú eres muy rápida con el español.»'
  ],
  quiz:[
   {q:'Tom ___ cansado hoy.',o:['está','es']},
   {q:'Carmen ___ profesora.',o:['es','está']},
   {q:'¿Dónde ___ el bar?',o:['está','es']},
   {q:'Yo ___ de Suiza.',o:['soy','estoy']},
   {q:'Hoy ___ muy contenta.',o:['estoy','soy']},
   {q:'Leo y Joan ___ en el bar.',o:['están','son']}
  ]},
 {after:25,title:'Hablo, hablas, habla',
  tz:{de:'Regelmässige Verben auf -ar. Ein Muster für Hunderte Verben.',en:'Regular -ar verbs. One pattern for hundreds of verbs.'},
  paras:[
   '«Hoy os doy una llave», dice Carmen.',
   'Yo miro a Carmen con los ojos muy abiertos. ¿Una llave?',
   '«Una llave para cientos de verbos», dice ella. «Los verbos en -ar.»',
   'Escribe en la pizarra: hablar, trabajar, estudiar, escuchar, tomar, mirar.',
   {gram:{de:'<b>Verben auf -ar</b>: Stamm + Endung<table><tr><th></th><th>habl-ar</th></tr><tr><td>yo</td><td>habl<b>o</b></td></tr><tr><td>tú</td><td>habl<b>as</b></td></tr><tr><td>él / ella / usted</td><td>habl<b>a</b></td></tr><tr><td>nosotros</td><td>habl<b>amos</b></td></tr><tr><td>vosotros</td><td>habl<b>áis</b></td></tr><tr><td>ellos / ustedes</td><td>habl<b>an</b></td></tr></table>Gleich bei <i>trabajar, estudiar, escuchar, tomar, mirar, buscar, llegar</i>. Das Pronomen lässt man oft weg: <i>hablo español</i>.',en:'<b>-ar verbs</b>: stem + ending<table><tr><th></th><th>habl-ar</th></tr><tr><td>yo</td><td>habl<b>o</b></td></tr><tr><td>tú</td><td>habl<b>as</b></td></tr><tr><td>él / ella / usted</td><td>habl<b>a</b></td></tr><tr><td>nosotros</td><td>habl<b>amos</b></td></tr><tr><td>vosotros</td><td>habl<b>áis</b></td></tr><tr><td>ellos / ustedes</td><td>habl<b>an</b></td></tr></table>Same with <i>trabajar, estudiar, escuchar, tomar, mirar, buscar, llegar</i>. The pronoun is often left out: <i>hablo español</i>.'}},
   '«En español, muchas veces no decimos yo o tú», explica Carmen. «El verbo ya lo dice. Hablo: soy yo. Hablas: eres tú.»',
   'Tom practica: «Yo estudio historia. Tú estudias economía. Yuki estudia arte.»',
   '«Y nosotros...», dice Yuki, «estudiamos español.»',
   '«Y trabajamos mucho», dice Tom.',
   'Carmen ríe. «Vosotros habláis mucho. Eso es verdad.»',
   'En casa, practico con mi vida: Leo trabaja en el bar. Joan escucha la radio. Yo busco una llave. Nosotros buscamos una historia.'
  ],
  quiz:[
   {q:'Yo ___ español.',o:['hablo','habla','hablas']},
   {q:'Tú ___ economía.',o:['estudias','estudio','estudian']},
   {q:'Leo ___ en el bar.',o:['trabaja','trabajo','trabajan']},
   {q:'Nosotros ___ la radio.',o:['escuchamos','escuchan','escucho']},
   {q:'Ellos ___ un café.',o:['toman','tomamos','toma']},
   {q:'Vosotros ___ mucho.',o:['habláis','hablan','hablamos']}
  ]},
 {after:30,title:'Comer y vivir',
  tz:{de:'Verben auf -er und -ir. Fast gleich, mit kleinem Unterschied.',en:'-er and -ir verbs. Almost the same, with a small difference.'},
  paras:[
   'Hoy la clase es especial. Estamos en la Boqueria, el mercado más famoso de Barcelona.',
   '«Aquí aprendemos dos tipos de verbos más», dice Carmen. «Comer y vivir.»',
   'Yuki come una fresa. Tom bebe un zumo de naranja. Yo leo los nombres de las frutas.',
   {gram:{de:'<b>Verben auf -er und -ir</b><table><tr><th></th><th>com-er</th><th>viv-ir</th></tr><tr><td>yo</td><td>com<b>o</b></td><td>viv<b>o</b></td></tr><tr><td>tú</td><td>com<b>es</b></td><td>viv<b>es</b></td></tr><tr><td>él / ella</td><td>com<b>e</b></td><td>viv<b>e</b></td></tr><tr><td>nosotros</td><td>com<b>emos</b></td><td>viv<b>imos</b></td></tr><tr><td>vosotros</td><td>com<b>éis</b></td><td>viv<b>ís</b></td></tr><tr><td>ellos</td><td>com<b>en</b></td><td>viv<b>en</b></td></tr></table>Nur bei <b>nosotros</b> und <b>vosotros</b> unterscheiden sie sich. Wie comer: <i>beber, leer, aprender</i>. Wie vivir: <i>escribir, abrir</i>.',en:'<b>-er and -ir verbs</b><table><tr><th></th><th>com-er</th><th>viv-ir</th></tr><tr><td>yo</td><td>com<b>o</b></td><td>viv<b>o</b></td></tr><tr><td>tú</td><td>com<b>es</b></td><td>viv<b>es</b></td></tr><tr><td>él / ella</td><td>com<b>e</b></td><td>viv<b>e</b></td></tr><tr><td>nosotros</td><td>com<b>emos</b></td><td>viv<b>imos</b></td></tr><tr><td>vosotros</td><td>com<b>éis</b></td><td>viv<b>ís</b></td></tr><tr><td>ellos</td><td>com<b>en</b></td><td>viv<b>en</b></td></tr></table>They only differ for <b>nosotros</b> and <b>vosotros</b>. Like comer: <i>beber, leer, aprender</i>. Like vivir: <i>escribir, abrir</i>.'}},
   '«¿Dónde vivís?», pregunta Carmen.',
   '«Vivimos en Barcelona», dice Tom. «Pero yo vivo cerca del mar y Yuki vive en el centro.»',
   'Una mujer en una tienda de fruta nos mira y ríe. «¿Estudiantes?»',
   '«Sí. Aprendemos español», digo.',
   '«Entonces, ¡fruta para los estudiantes!», dice la mujer, y nos da tres fresas. Comemos las fresas. Son perfectas.',
   'Pienso en Rosa y su fruta roja. Barcelona es una ciudad de mercados. Y de historias.'
  ],
  quiz:[
   {q:'Yuki ___ una fresa.',o:['come','como','comen']},
   {q:'Nosotros ___ en Barcelona.',o:['vivimos','vivemos','viven']},
   {q:'Yo ___ cerca del mar.',o:['vivo','vive','vives']},
   {q:'¿Dónde ___ tú?',o:['vives','vivo','vivís']},
   {q:'Nosotros ___ fruta.',o:['comemos','comimos','comen']},
   {q:'Vosotros ___ español.',o:['aprendéis','aprendís','aprenden']}
  ]},
 {after:35,title:'Tengo que estudiar',
  tz:{de:'tener: haben, Alter, und tener que für müssen.',en:'tener: to have, age, and tener que for must.'},
  paras:[
   'Hoy es el cumpleaños de Yuki. Tiene veinte años. Carmen trae un pastel pequeño.',
   '«¿Cuántos años tienes, Yuki?», pregunta Carmen.',
   '«Tengo veinte años.»',
   '«En español no decimos soy veinte», explica Carmen. «Decimos tengo veinte años. Los años son algo que tienes.»',
   {gram:{de:'<b>tener = haben</b> (unregelmässig)<table><tr><td>yo</td><td><b>tengo</b></td><td>nosotros</td><td><b>tenemos</b></td></tr><tr><td>tú</td><td><b>tienes</b></td><td>vosotros</td><td><b>tenéis</b></td></tr><tr><td>él / ella</td><td><b>tiene</b></td><td>ellos</td><td><b>tienen</b></td></tr></table><b>Alter</b>: <i>Tengo veinte años</i> (nicht: soy veinte).<br><b>Gefühle</b>: <i>tener hambre, tener frío, tener miedo</i>.<br><b>Müssen</b>: <b>tener que</b> + Infinitiv: <i>Tengo que estudiar</i>.',en:'<b>tener = to have</b> (irregular)<table><tr><td>yo</td><td><b>tengo</b></td><td>nosotros</td><td><b>tenemos</b></td></tr><tr><td>tú</td><td><b>tienes</b></td><td>vosotros</td><td><b>tenéis</b></td></tr><tr><td>él / ella</td><td><b>tiene</b></td><td>ellos</td><td><b>tienen</b></td></tr></table><b>Age</b>: <i>Tengo veinte años</i> (not: soy veinte).<br><b>Feelings</b>: <i>tener hambre, tener frío, tener miedo</i>.<br><b>Must</b>: <b>tener que</b> + infinitive: <i>Tengo que estudiar</i>.'}},
   'Tom mira el pastel. «Tengo hambre», dice.',
   '«Primero tienes que cantar», dice Carmen.',
   'Cantamos «Cumpleaños feliz». Tom canta muy mal. Todos reímos.',
   'Después Carmen dice: «Y ahora tenéis que escribir cinco frases con tener.»',
   'Escribo: Tengo una llave azul. Tengo una abuela en Suiza. Leo tiene un abuelo muy especial. Tenemos un secreto. Y tengo que saber la verdad.'
  ],
  quiz:[
   {q:'Yuki ___ veinte años.',o:['tiene','es','tengo']},
   {q:'Yo ___ hambre.',o:['tengo','tiene','soy']},
   {q:'Tú ___ que cantar.',o:['tienes','tiene','tengo']},
   {q:'Nosotros ___ un secreto.',o:['tenemos','tienen','tenéis']},
   {q:'Vosotros ___ que escribir.',o:['tenéis','tenemos','tienen']},
   {q:'¿Cuántos años ___ tú?',o:['tienes','eres','estás']}
  ]},
 {after:40,title:'Voy a ir',
  tz:{de:'ir heisst gehen. Und mit ir a sprichst du über die Zukunft.',en:'ir means to go. And with ir a you talk about the future.'},
  paras:[
   '«¿Qué vais a hacer el fin de semana?», pregunta Carmen.',
   'Tom dice: «Voy a ir a la playa.»',
   'Yuki dice: «Voy a visitar la Sagrada Familia.»',
   'Yo digo: «Voy a hablar con mi abuela.» Es verdad. Y es importante.',
   {gram:{de:'<b>ir = gehen</b> (unregelmässig)<table><tr><td>yo</td><td><b>voy</b></td><td>nosotros</td><td><b>vamos</b></td></tr><tr><td>tú</td><td><b>vas</b></td><td>vosotros</td><td><b>vais</b></td></tr><tr><td>él / ella</td><td><b>va</b></td><td>ellos</td><td><b>van</b></td></tr></table><b>Zukunft</b> ganz einfach: <b>ir a</b> + Infinitiv.<br><i>Voy a estudiar</i> = ich werde lernen.<br><i>Vamos a comer</i> = wir werden essen. Auch: Lass uns essen!',en:'<b>ir = to go</b> (irregular)<table><tr><td>yo</td><td><b>voy</b></td><td>nosotros</td><td><b>vamos</b></td></tr><tr><td>tú</td><td><b>vas</b></td><td>vosotros</td><td><b>vais</b></td></tr><tr><td>él / ella</td><td><b>va</b></td><td>ellos</td><td><b>van</b></td></tr></table><b>Future</b> made easy: <b>ir a</b> + infinitive.<br><i>Voy a estudiar</i> = I am going to study.<br><i>Vamos a comer</i> = we are going to eat. Also: let\'s eat!'}},
   '«Muy bien», dice Carmen. «Con ir a podéis hablar del futuro. Es fácil y todo el mundo lo usa.»',
   'Tom pregunta: «¿Y usted, profesora? ¿Qué va a hacer?»',
   '«Yo voy a dormir», dice Carmen. «Mucho.»',
   'Todos reímos. Después de la clase, Tom y Yuki van a un bar. Yo voy a casa.',
   'Esta noche voy a escribir un mensaje largo a mi abuela. Y mañana vamos a hablar. Por fin.'
  ],
  quiz:[
   {q:'Yo ___ a la playa.',o:['voy','va','vas']},
   {q:'¿Adónde ___ tú?',o:['vas','va','voy']},
   {q:'Nosotros ___ a comer.',o:['vamos','van','vais']},
   {q:'Mañana voy ___ estudiar.',o:['a','de','en']},
   {q:'Tom y Yuki ___ a un bar.',o:['van','vamos','va']},
   {q:'¿Qué ___ a hacer vosotros?',o:['vais','vamos','van']}
  ]},
 {after:45,title:'Me gusta',
  tz:{de:'gustar funktioniert anders: Nicht ich mag, sondern es gefällt mir.',en:'gustar works differently: not I like, but it pleases me.'},
  paras:[
   'Hoy cada persona habla de lo que le gusta.',
   'Tom dice: «Me gusta el fútbol. Me gustan los libros de historia.»',
   'Yuki dice: «Me gusta la música. No me gusta el café.»',
   '«¿No te gusta el café?», pregunta Tom. «¡En España!»',
   {gram:{de:'<b>gustar = gefallen</b><br>Auf Spanisch sagt man: <i>es gefällt mir</i>.<table><tr><td>mir</td><td><b>me</b> gusta</td></tr><tr><td>dir</td><td><b>te</b> gusta</td></tr><tr><td>ihm / ihr</td><td><b>le</b> gusta</td></tr><tr><td>uns</td><td><b>nos</b> gusta</td></tr></table>Das Verb richtet sich nach dem, was gefällt:<br><i>Me gusta <b>el</b> café</i> (eins) &middot; <i>Me gust<b>an</b> <b>las</b> fresas</i> (mehrere).<br>Verneinung: <i>No me gusta</i>.',en:'<b>gustar = to please</b><br>In Spanish you say: <i>it pleases me</i>.<table><tr><td>me</td><td><b>me</b> gusta</td></tr><tr><td>you</td><td><b>te</b> gusta</td></tr><tr><td>him / her</td><td><b>le</b> gusta</td></tr><tr><td>us</td><td><b>nos</b> gusta</td></tr></table>The verb agrees with what is liked:<br><i>Me gusta <b>el</b> café</i> (one) &middot; <i>Me gust<b>an</b> <b>las</b> fresas</i> (several).<br>Negative: <i>No me gusta</i>.'}},
   '«Y a ti, Mia, ¿qué te gusta?», pregunta Carmen.',
   'Pienso un momento. «Me gusta el mar. Me gustan las historias viejas. Y me gusta mucho Barcelona.»',
   '«¿Y qué no te gusta?»',
   '«No me gustan los secretos», digo. Y es verdad. Bueno, solo un poco verdad.',
   'Carmen sonríe. «A todos nos gustan los secretos. Pero no nos gusta esperar.»'
  ],
  quiz:[
   {q:'Me ___ el café.',o:['gusta','gustan']},
   {q:'Me ___ las fresas.',o:['gustan','gusta']},
   {q:'¿Te ___ la música?',o:['gusta','gustas']},
   {q:'A Tom ___ gusta el fútbol.',o:['le','me','te']},
   {q:'A nosotros ___ gusta Barcelona.',o:['nos','me','le']},

iveau": "Reading at the right level", "Man versteht einen Text gut, wenn man # bis # % der Wörter kennt. Darunter wird Lesen zur Qual, darüber lernt man kaum Neues.": "You understand a text well when you know # to # % of its words. Below that, reading is a struggle; above it, you hardly learn anything new.", "In Palabradex:": "In Palabradex:", "Jedes Kapitel zeigt dir, wie viel Prozent der Wörter du schon kennst. Vor schwierigen Kapiteln bereitet ein kurzer Tagebucheintrag von Mia die neuen Wörter vor.": "Every chapter shows what percentage of words you already know. Before difficult chapters, a short diary entry by Mia prepares the new words.", "Jedes Wort im Kontext wiederholen": "Repeat every word in context", "Wörter lernt man schrittweise. Nach rund # Begegnungen in verschiedenen Sätzen sitzt ein Wort meist deutlich besser.": "Words are learned step by step. After around # encounters in different sentences a word usually sticks much better.", "Die Geschichten bauen aufeinander auf und wiederholen Wörter über viele Kapitel. Jede Karte zeigt deine Begegnungen.": "The stories build on each other and repeat words over many chapters. Every card shows your encounters.", "Wiederholen, kurz bevor du vergisst": "Review just before you forget", "Verteiltes Lernen schlägt Pauken. Abstände, die mit der Zeit wachsen, halten Wissen am längsten.": "Spaced learning beats cramming. Gaps that grow over time keep knowledge longest.", "Dein Karteikasten hat # Fächer: nach #, #, #, #, # und # Tagen kommt ein Wort wieder. Nach jedem Kapitel landen die # wichtigsten Wörter direkt darin.": "Your flashcard box has # boxes: a word comes back after #, #, #, #, # and # days. After each chapter the # most important words go straight in.", "Abrufen statt wiederlesen": "Recall instead of rereading", "Sich aktiv an etwas zu erinnern, festigt es stärker als erneutes Lesen. Etwas Anstrengung ist dabei gewollt.": "Actively recalling something strengthens it more than rereading. Some effort is in function i18nKey(t){return t.replace(/\s+/g,' ').trim();}
function i18nStr(raw){const t=i18nKey(raw);if(!t||!/[A-Za-zÄÖÜäöüß]{2}/.test(t))return null;
  if(EN_UI[t]!==undefined)return raw.replace(t.length===raw.length?raw:raw.trim(),EN_UI[t]);
  const nums=[];const tpl=t.replace(/\d+(?:[.,]\d+)?/g,m=>{nums.push(m);return '#';});
  if(nums.length&&EN_UI[tpl]!==undefined){let i=0;const out=EN_UI[tpl].replace(/#/g,()=>{const n=nums[i++]||'';return n.replace(/^(\d+),(\d+)$/,'$1.$2');});return raw.replace(raw.trim(),out);}
  for(const [re,f] of EN_RX){const m=t.match(re);if(m)return raw.replace(raw.trim(),f(...m));}
  if(I18N.collect)I18N.miss.add(t);return null;}
const I18N_SKIP='.tcg,.w,.ph,.para,.chead h2,.tcg-name,.tcg-word,[data-noi18n],script,style,textarea,.exw,.dqh b,.qopt.es';

  if(root.nodeType!==1||root.closest&&root.closest(I18N_SKIP))return;
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode:n=>n.nodeType===1?(n.matches(I18N_SKIP)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_SKIP):NodeFilter.FILTER_ACCEPT});
  const list=[];while(tw.nextNode())list.push(tw.currentNode);
  for(const n of list){const r=i18nStr(n.nodeValue);if(r!==null&&r!==n.nodeValue)n.nodeValue=r;}
  const els=root.querySelectorAll?[root,...root.querySelectorAll('[placeholder],[title],[aria-label]')]:[];
  for(const e of els){if(!e.getAttribute)continue;for(const a of ['placeholder','title','aria-label']){const v=e.getAttribute(a);if(v){const r=i18nStr(v);if(r!==null&&r!==v)e.setAttribute(a,r);}}}}

function merge(a,b){
  const o=defState();const newer=(b.upd||0)>(a.upd||0)?b:a;
  for(const k of ['lang','fs','theme','font','mark','last','lastMode','hintSeen','histToast','daily','name','deck','duelStreak'])o[k]=newer[k]??o[k];
  o.caught=Object.assign({},b.caught||{},a.caught||{});
  for(const k in (b.caught||{}))if(a.caught&&a.caught[k]&&b.caught[k].t<a.caught[k].t)o.caught[k]=b.caught[k];
  for(const src of [a.forms||{},b.forms||{}])for(const k in src)o.forms[k]=[...new Set([...(o.forms[k]||[]),...src[k]])];
  for(const src of [a.cards||{},b.cards||{}])for(const k in src)o.cards[k]=Object.assign({},src[k],o.cards[k]||{});
  const ids=new Set([...Object.keys(a.stories||{}),...Object.keys(b.stories||{})]);
  for(const id of ids){const x=(a.stories||{})[id]||{},y=(b.stories||{})[id]||{};o.stories[id]={done:!!(x.done||y.done),quiz:Math.max(x.quiz||0,y.quiz||0),read:!!(x.read||y.read),page:(newer===a?x.page:y.page)||0};}
  o.days=[...new Set([...(a.days||[]),...(b.days||[])])].sort().slice(-120);
  for(const src of [a.mast||{},b.mast||{}])for(const k in src)o.mast[k]=Math.max(o.mast[k]||0,src[k]);
  for(const src of [a.enc||{},b.enc||{}])for(const k in src)o.enc[k]=Math.max(o.enc[k]||0,src[k]);
  for(const src of [a.seen||{},b.seen||{}])for(const k in src)if(!o.caught[k])o.seen[k]=o.seen[k]||src[k];
  o.duelW=Math.max(a.duelW||0,b.duelW||0);o.duelL=Math.max(a.duelL||0,b.duelL||0);
  for(const src of [a.phr||{},b.phr||{}])for(const k in src)o.phr[k]=o.phr[k]||src[k];
  o.exams=[...(a.exams||[]),...(b.exams||[])].filter((x,i,arr)=>arr.findIndex(y=>y.d===x.d)===i).sort((x,y)=>x.d-y.d).slice(-30);
  for(const src of [a.conjS||{},b.conjS||{}])for(const k in src){const x=o.conjS[k]||{r:0,c:0};o.conjS[k]={r:Math.max(x.r,src[k].r),c:Math.max(x.c,src[k].c)};}
  for(const src of [a.star||{},b.star||{}])for(const k in src)o.star[k]=Math.max(o.star[k]||0,src[k]||0);
  for(const src of [a.fang||{},b.fang||{}])for(const k in src)o.fang[k]=Math.max(o.fang[k]||0,src[k]);
  for(const src of [a.srs||{},b.srs||{}])for(const k in src){const x=o.srs[k],y=src[k];if(!x||y.d>x.d)o.srs[k]=y;}
  o.opened=Math.max(a.opened||0,b.opened||0);o.empties=Math.max(a.empties||0,b.empties||0);o.spent=Math.max(a.spent||0,b.spent||0);o.bonusXp=Math.max(a.bonusXp||0,b.bonusXp||0);
  o.upd=Math.max(a.upd||0,b.upd||0);return o;
}

function Q(t,cur,max,x){return {t,cur:Math.min(cur,max),max,x};}
function quests(e){
  const q=[];const fl=formsList(e);
  if(fl){const tot=new Set(fl.map(x=>x.key)).size,got=(S.forms[e.k]||[]).length;
    if(e.p==='v'){q.push(Q('Finde 2 Formen',got,2,3));q.push(Q('Finde 4 Formen',got,4,6));q.push(Q('Finde alle '+tot+' Formen',got,tot,12));}
    else if(tot>2){q.push(Q('Finde 2 Formen',got,2,3));q.push(Q('Finde alle '+tot+' Formen',got,tot,6));}}
  const m=met(e.k);q.push(Q('In 3 Kapiteln gelesen',m,3,3));q.push(Q('In 6 Kapiteln gelesen',m,6,6));
  const tm=(S.mast||{})[e.k]||0;q.push(Q('3x im Training richtig',tm,3,3));
  const c=cardCount(e.k);q.push(Q('Spezialkarte gesammelt',c,1,4));q.push(Q('Alle 3 Spezialkarten',c,3,12));
  if(rarity(e)>=2&&(!S.caught[e.k]||(S.fang||{})[e.k])){const fg=(S.fang||{})[e.k]||0;q.push(Q('Im Minispiel gefangen',fg?1:0,1,3));q.push(Q('Fehlerfrei gefangen',fg===2?1:0,1,5));}
  const ok=!!S.caught[e.k];q.forEach(x=>x.done=ok&&x.cur>=x.max);return q;
}
function questTotals(){let n=0,x=0;for(const k in S.caught){const e=LEX[k];if(!e)continue;for(const q of quests(e))if(q.done){n++;x+=q.x;}}return {n,x};}

function levelOf(x){let l=1;for(let i=1;i<LV.length;i++)if(x>=LV[i])l=i+1;if(x>=LV[LV.length-1])l=LV.length+Math.floor((x-LV[LV.length-1])/700);return l;}

function dayKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function markDay(){const t=today();if(!S.days.includes(t)){S.days.push(t);S.days=S.days.slice(-120);}}

const PRICE={holo:120,gold:300,leg:1200};
const PTS_CHEST=5,PTS_EMPTY=20,PTS_COL=100,PTS_GOLD=250,PTS_DUEL=15;
const PCOIN='<span class="coin">P</span>';
const PDFI='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14"/></svg>';
function colState(c){const slots=c.words.map(w=>{const caught=!!S.caught[w],sp=caught&&cardCount(w)>0;return {w,caught,sp,v:caught?bestVar(w):null};});
  const have=slots.filter(x=>x.sp).length;return {slots,have,complete:have===slots.length,gold:slots.every(x=>x.v==='gold'||x.v==='leg'||x.v==='arte'||(x.v==='holo'&&!canVar(x.w,'gold')))};}
function colsDone(){let done=0,gold=0;for(const c of COLS){const st=colState(c);if(st.complete)done++;if(st.gold)gold++;}return {done,gold};}
function colOf(w){return COLS.find(c=>c.words.includes(w));}
const RANKS=[[0,'Novato'],[1,'Coleccionista'],[3,'Experto'],[6,'Maestro'],[10,'Leyenda']];
function rankName(n){let r=RANKS[0][1];for(const [t,name] of RANKS)if(n>=t)r=name;return r;}
function ptsEarned(){const cd=colsDone();return (S.opened||0)*PTS_CHEST+(S.empties||0)*PTS_EMPTY+cd.done*PTS_COL+cd.gold*PTS_GOLD+(S.duelW||0)*PTS_DUEL;}
function pts(){return Math.max(0,ptsEarned()-(S.spent||0));}
function buyVariant(k,v){if(!S.caught[k]||pts()<PRICE[v])return false;S.spent=(S.spent||0)+PRICE[v];(S.cards[k]||(S.cards[k]={}))[v]=Date.now();markDay();save();updateHud();if(!$('#dex').classList.contains('hidden'))renderDex();toast(`<span class="gem" style="background:${VAR[v][1]}">${VAR[v][0][0]}</span><span><b>${esc(k)}</b> als ${VAR[v][0]} gekauft</span>`);if(v==='leg'||v==='gold')confetti();return true;}
function colsHtml(){
  return `<div class="albbar"><span class="ptsbadge">${PCOIN} ${pts()} Puntos</span><span class="mut" style="font-size:13px;color:var(--mut)">Puntos: 5 pro Truhe, +20 wenn eine Truhe nichts Neues bringt, +100 pro volle Seite, +250 pro Goldseite. Fehlende Spezialkarten kannst du in der Kartenansicht kaufen.</span><button class="btn" id="colPdf" style="margin-left:auto">${PDFI} Colecciones als PDF</button></div>
  <div class="colgrid">${COLS.map(c=>{const st=colState(c);return `<button class="colt ${st.complete?'done':''} ${st.gold?'gold':''}" data-col="${c.id}" style="--c1:${c.color[0]};--c2:${c.color[1]}">
    <span class="ct">${esc(c.title)}</span><span class="cs">${st.gold?'Oro':st.complete?'Komplett':st.have+' / '+st.slots.length}</span>
    <span class="cdots">${st.slots.map(x=>`<i style="background:${x.sp?VAR[x.v][1]:x.caught?'#ffffff40':'#ffffff14'}"></i>`).join('')}</span>
    <span class="cr">${st.complete?'Escena extra freigeschaltet':'Belohnung: Escena extra'}</span></button>`;}).join('')}</div>`;}
function bindCols(d){d.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>openCol(b.dataset.col));const p=d.querySelector('#colPdf');if(p)p.onclick=()=>colsPdf();}
function openCol(id,opt){

   <div class="colact"><button class="btn ghost" id="colShare">${SHR} Seite teilen</button><button class="btn ghost" id="colPdf1">${PDFI} Seite als PDF</button></div></div>`,true);

const ALBSORT=[['var','Variante (Legendaria zuerst)'],['num','Nummer'],['az','A bis Z'],['rar','Seltenheit'],['pos','Wortart'],['new','Neueste zuerst']];
let albSort='var';
function albumCards(){const out=[];for(const e of Object.values(LEX))if(S.caught[e.k])for(const v of ['arte','leg','gold','holo'])if(S.cards[e.k]&&S.cards[e.k][v])out.push([e,v]);
  const by={var:(a,b)=>VRANK[b[1]]-VRANK[a[1]]||a[0].n-b[0].n,num:(a,b)=>a[0].n-b[0].n||VRANK[b[1]]-VRANK[a[1]],az:(a,b)=>a[0].k.localeCompare(b[0].k,'es')||VRANK[b[1]]-VRANK[a[1]],rar:(a,b)=>rarity(b[0])-rarity(a[0])||VRANK[b[1]]-VRANK[a[1]],pos:(a,b)=>a[0].p.localeCompare(b[0].p)||a[0].n-b[0].n,new:(a,b)=>(S.cards[b[0].k][b[1]]||0)-(S.cards[a[0].k][a[1]]||0)}[albSort];
  return out.sort(by);}
