 {ch:41,diff:1,title:'Libros y rosas',
  tz:{de:'Sant Jordi in Barcelona: Bücher, Rosen und ein Buch von Leo, das Mia nicht mehr weglegen kann.',en:'Sant Jordi in Barcelona: books, roses and a book from Leo that Mia can\'t put down.'},
  paras:[
   'Ahora es mayo. Desde marzo, es primavera en Barcelona. Hace sol, pero no hace mucho calor. Hay flores en todos los balcones de la calle Verdi.',
   'En mi mesa hay una rosa roja y un libro. Son de Sant Jordi, la fiesta de los libros y las rosas.',
   'En Barcelona, el veintitrés de abril es un día muy especial. Hay libros y rosas en todas las calles. Las personas regalan una rosa y un libro a las personas que quieren.',
   'Leo me regala un libro. Es una novela pequeña, en español fácil. Se llama «La chica del mar».',
   'Yo le regalo una rosa roja. Y una púa nueva para su guitarra. Una púa azul, claro.',
   'Ahora, cada noche, intento leer un poco en la cama. Hay muchas palabras nuevas. Pero me gusta mucho leer en español.',
   'La novela habla de una chica que vive en una casa al lado del mar. La chica tiene un secreto. Siempre hay un secreto.',
   'Una noche, Marta entra en mi habitación. «¿Todavía estás despierta? Son las dos.»',
   '«Sí. No puedo parar de leer. ¡Quiero saber el final!»',
   'Marta se ríe. «Muy bien. Pero mañana tienes clase a las nueve.»',
   'Leo tiene razón: leer en español es difícil, pero es muy bonito. Cierro el libro. Miro la rosa en la mesa. Mi primera primavera en Barcelona es muy bonita.'
  ],
  quiz:[
   {q:'¿Qué estación es?',o:['Primavera.','Invierno.','Verano.']},
   {q:'¿Qué regalan las personas en Sant Jordi?',o:['Libros y rosas.','Uvas.','Helados.']},
   {q:'¿Qué le regala Leo a Mia?',o:['Una novela.','Una guitarra.','Una cámara.']},
   {q:'¿Por qué no duerme Mia?',o:['Quiere leer el final.','Le duele la cabeza.','Hace calor.']}
  ]},
 {ch:42,diff:1,title:'La familia de Leo',
  tz:{de:'Sonntagsessen bei Leos Familie: Eltern, ein Onkel, ein Cousin und viel zu viel Essen.',en:'Sunday lunch with Leo\'s family: parents, an uncle, a cousin and far too much food.'},
  paras:[
   'Es domingo. Hoy como con la familia de Leo. Estoy un poco nerviosa.',
   'Los padres de Leo viven en un piso grande cerca de la playa. Su madre se llama Montse. Es alta, delgada y tiene el pelo negro. Su padre se llama Xavi. Es bajo, un poco gordo y muy simpático.',
   'También está el tío de Leo, Jordi. Es el hermano de Montse. Tiene una barba blanca y habla muy fuerte. Siempre habla de fútbol. Es del Barça, claro.',
   'Y está Marc, el primo de Leo. Es el hijo de Jordi. Tiene veinticinco años y trabaja en un hotel.',
   'La comida es enorme. Primero hay ensalada y pan con tomate. Después, carne con patatas. Después, pescado. Después, postre.',
   '«¿Y qué estudias, hija?», pregunta Montse. «Economía.» «¡Qué inteligente!»',
   'Montse trabaja en una farmacia y Xavi es médico. Pero hoy no hablan de trabajo. Hoy hablan de comida.',
   '«Come, come, hija», dice Montse. Es muy amable. «Estás muy delgada.»',
   '«No estoy delgada. ¡Y no puedo comer más!»',
   'Todos se ríen. En la mesa hay un perro pequeño. Bueno, no en la mesa. Debajo de la mesa.',
   '«Es el perro de Jordi», dice Leo. «Se llama Bombón.»',
   'El perro es un poco feo, pero muy simpático. Tiene los ojos grandes y la cara de un viejo.',
   'Al final de la comida, el tío Jordi levanta su copa. «Tengo una noticia», dice. «Marc se casa. ¡En septiembre!»',
   'Todos gritan. Marc está rojo como un tomate.'
  ],
  quiz:[
   {q:'¿Cómo es la madre de Leo?',o:['Alta y delgada.','Baja y gorda.','Vieja y seria.']},
   {q:'¿Quién es Marc?',o:['El primo de Leo.','El padre de Leo.','El tío de Mia.']},
   {q:'¿Cómo es el perro?',o:['Un poco feo, pero simpático.','Muy grande.','Muy serio.']},
   {q:'¿Cuál es la noticia?',o:['Marc se casa en septiembre.','Jordi vende el hotel.','Leo va a Valencia.']}
  ]},
 {ch:43,diff:1,title:'Una llamada de Suiza',
  tz:{de:'Mias Mutter ruft an. Die Eltern wollen nach Barcelona kommen, und der Vater hat Angst vor dem Fliegen.',en:'Mia\'s mother calls. Her parents want to come to Barcelona, and her father is afraid of flying.'},
  paras:[
   'El lunes por la noche, mi teléfono suena. Es mi madre. Normalmente mi madre escribe mensajes. Pero hoy llama.',
   '«Hola, Mia. ¿Tienes un momento?»',
   '«Sí, mamá. ¿Qué pasa? ¿Todo bien?»',
   '«Sí, todo bien. Tu padre y yo tenemos una idea. Queremos ir a Barcelona. En junio.»',
   '«¿En serio? ¡Qué bien!»',
   '«Sí. Queremos ver a la abuela, conocer a Joan... y conocer a Leo, claro. ¿Y tú? ¿Comes bien? ¿Tienes dinero?»',
   'Es igual que la abuela. Siempre las mismas preguntas.',
   'Me río. «Vale. ¿Y cómo venís? ¿En avión?»',
   '«Tu padre no quiere ir en avión. Tiene miedo. Desde ayer busca trenes en internet. El viaje en tren es largo: once horas. Pero tu padre está contento.»',
   '«¿Y dónde vais a dormir? Mi habitación es muy pequeña.»',
   '«En un hotel. Cerca de la Sagrada Familia. Tu padre quiere ver todo. Todo el país.»',
   '«Mamá, España es un país muy grande. En una semana no podéis ver todo.»',
   '«Díselo a tu padre», dice mi madre. Y las dos nos reímos.',
   'Después de la llamada, escribo a Leo: «Mis padres vienen en junio. Prepárate.»'
  ],
  quiz:[
   {q:'¿Quién llama a Mia?',o:['Su madre.','Su abuela.','Leo.']},
   {q:'¿Cuándo van los padres a Barcelona?',o:['En junio.','En septiembre.','En diciembre.']},
   {q:'¿Por qué no van en avión?',o:['El padre tiene miedo.','Es muy caro.','No hay aviones.']},
   {q:'¿Dónde van a dormir?',o:['En un hotel.','En la casa azul.','En la habitación de Mia.']}
  ]},
 {ch:44,diff:1,title:'En el supermercado',
  tz:{de:'Einkaufen mit Pau, der für eine Party kocht. Mia lernt Preise, Zahlen und spanisches Olivenöl kennen.',en:'Shopping with Pau, who is cooking for a party. Mia learns prices, numbers and Spanish olive oil.'},
  paras:[
   'El sábado hay una cena en nuestro piso. Pau cocina para catorce personas. Bueno, para trece. Marta no come carne.',
   'Es nuestra primera cena grande en el piso. Pau y yo vamos al supermercado. Pau tiene una lista muy larga.',
   '«Vale», dice Pau. «Primero, la fruta y la verdura. Tomates, patatas, cebollas, limones.»',
   'Ponemos todo en el carro. Después vamos a la carne. Pau compra pollo. Mucho pollo.',
   '«¿Y para Marta?», pregunto.',
   'Pau mira los precios. «¡Qué caro está todo!»',
   '«Mañana el supermercado está cerrado. Es domingo», dice Pau. «Entonces compramos todo hoy.»',
   '«Para Marta, tortilla de patatas. La comida más famosa de España.»',
   'Después, el aceite de oliva. Hay muchas botellas diferentes. Una cuesta tres euros. Otra cuesta catorce euros.',
   '«¿Por qué catorce euros?», pregunto.',
   '«Porque es aceite bueno. Muy bueno», dice Pau, muy serio. «Con el aceite no se juega.»',
   'En la caja, la chica dice: «Son sesenta y siete euros con noventa céntimos.»',
   'Pau paga con tarjeta. Yo pago la mitad: treinta y cuatro euros. Bueno, treinta y tres con noventa y cinco.',
   'Volvemos a casa con seis bolsas. Seis bolsas y tres pisos sin ascensor. Pau dice: «Con setenta años, voy a vivir en un piso con ascensor.»'
  ],
  quiz:[
   {q:'¿Para cuántas personas cocina Pau?',o:['Para trece.','Para seis.','Para setenta.']},
   {q:'¿Qué come Marta?',o:['Tortilla de patatas.','Pollo.','Carne.']},
   {q:'¿Cuánto cuesta el aceite bueno?',o:['Catorce euros.','Tres euros.','Noventa céntimos.']},
   {q:'¿Cuánto paga Mia?',o:['La mitad.','Todo.','Nada.']}
  ]},
 {ch:45,diff:1,title:'Clase de baile',
  tz:{de:'Marta nimmt Mia mit zum Salsa. Arme, Beine, Füsse und ein Tanzlehrer namens Rafa.',en:'Marta takes Mia to salsa class. Arms, legs, feet and a dance teacher called Rafa.'},
  paras:[
   'El martes, Marta me lleva a una clase de baile. Es una clase de salsa en un gimnasio de Gracia.',
   '«Yo no sé bailar», digo.',
   '«Nadie sabe bailar al principio», dice Marta. «Vamos.»',
   'El profesor se llama Rafa. Es de Cuba. Tiene mucha energía y una sonrisa enorme.',
   '«¡Vamos! Primero, el cuerpo. Arriba los brazos. Abajo los brazos. ¡Ahora la cabeza, a la derecha, a la izquierda!»',
   'Después vienen los pies. Un, dos, tres. Cinco, seis, siete. El pie derecho adelante. El pie izquierdo atrás.',
   'Mis pies no escuchan. Mis brazos no escuchan. Todo mi cuerpo hace cosas diferentes.',
   '«Mia, ¡relájate!», dice Rafa. «La salsa no está en los pies. Está aquí.» Y pone la mano en el corazón.',
   'Marta baila muy bien. Baila con Rafa y todos miran.',
   'Después de una hora, estoy muy cansada. Me duelen las piernas. Me duelen los pies. Pero estoy feliz.',
   'Después de la clase, cenamos una pizza en la plaza. Marta pide la cuenta. «Es imposible: bailar, comer pizza y no estar cansada», digo.',
   '«¿Vienes el martes que viene?», pregunta Marta.',
   '«Claro», digo. «Quiero bailar con Leo en la boda de su primo.»'
  ],
  quiz:[
   {q:'¿Qué baile aprenden?',o:['Salsa.','Flamenco.','Tango.']},
   {q:'¿De dónde es Rafa?',o:['De Cuba.','De Valencia.','De Madrid.']},
   {q:'¿Dónde está la salsa, según Rafa?',o:['En el corazón.','En los pies.','En la cabeza.']},
   {q:'¿Por qué quiere bailar Mia?',o:['Para la boda del primo de Leo.','Para un examen.','Para su abuela.']}
  ]},
 {ch:46,diff:1,title:'¡Ay, mi brazo!',
  tz:{de:'Ein Fahrrad, ein Hund und ein schmerzender Arm. Zum Glück ist Marta Krankenschwester.',en:'A bike, a dog and a sore arm. Luckily Marta is a nurse.'},
  paras:[
   'Es jueves. Voy a la universidad en bicicleta. En Barcelona hay muchas bicicletas públicas. Son rojas y blancas.',
   'Me gusta ir en bicicleta. Es más rápido que el autobús y más barato que el taxi.',
   'Pero hoy, en una calle pequeña, un perro sale de una puerta. Un perro grande y negro. Corre delante de mi bicicleta.',
   '¡Paro! Pero muy tarde. La bicicleta para, y yo no. Me caigo al suelo.',
   '«¡Ay! ¡Mi brazo!»',
   'Una señora mayor viene rápido. «¿Estás bien, guapa?»',
   '«Me duele el brazo. Mucho.»',
   'El perro me mira. Después mueve la cola y se va. Muy simpático.',
   'Escribo a Marta. Marta es enfermera y hoy no trabaja. Viene en diez minutos.',
   'Me duele el brazo derecho. Marta mira mi brazo con cuidado. «No está roto», dice. «Pero tienes que ponerlo en alto y no moverlo. Una semana, mínimo.»',
   '«¿Una semana? ¿Y cómo escribo? ¿Y cómo cocino?»',
   '«No escribes. Y no cocinas», dice Marta. «Pau cocina. Y Leo escribe por ti.»',
   'Pau cocina sopa. «Para los enfermos, siempre sopa», dice. «¡No estoy enferma! Es mi brazo.» Pau no escucha. Sopa.',
   'Esa noche, Leo viene con flores. Y con chocolate. «Para el brazo», dice. «El chocolate ayuda.»'
  ],
  quiz:[
   {q:'¿Cómo va Mia a la universidad?',o:['En bicicleta.','En metro.','En coche.']},
   {q:'¿Qué sale de una puerta?',o:['Un perro grande.','Un gato.','Un taxi.']},
   {q:'¿Qué le duele a Mia?',o:['El brazo.','La cabeza.','El pie.']},
   {q:'¿Qué trae Leo?',o:['Flores y chocolate.','Una bicicleta nueva.','Pastillas.']}
  ]},
 {ch:47,diff:1,title:'Las cuatro estaciones',
  tz:{de:'Auf dem Balkon reden Mia und Leo über Schnee, Herbst und Monate. Leo hat noch nie Schnee gesehen.',en:'On the balcony Mia and Leo talk about snow, autumn and months. Leo has never seen snow.'},
  paras:[
   'Mi brazo está mejor. Leo y yo estamos en mi balcón. Es una noche bonita de mayo.',
   '«En Suiza, ¿qué tiempo hace ahora?», pregunta Leo.',
   '«En mayo, en Zúrich, a veces hace sol y a veces llueve. Y en las montañas todavía hay nieve.»',
   '«¿Nieve en mayo? ¡Increíble!»',
   '«Sí. En Suiza, el invierno es largo y frío. Nieva mucho en diciembre, en enero y en febrero. La primavera es corta. El verano es bonito, pero no muy caliente. Y el otoño es mi estación favorita: los árboles son rojos, amarillos y naranjas.»',
   '«¿Y tú, Leo? ¿Cuál es tu estación favorita?» «El verano. Por la playa. Y por el helado.»',
   '«En Barcelona no hay invierno de verdad», dice Leo. «En invierno hace diez o doce grados. Casi nunca nieva.»',
   '«Yo tampoco», digo. «En Suiza, me gusta el sol de Barcelona.»',
   '«¿Tú nunca ves la nieve?»',
   'Leo piensa. «En la tele, sí. En la vida real... no. Nunca.»',
   '«¿Nunca? ¿En veinticuatro años?»',
   '«Nunca.»',
   'Miro a Leo. Tengo una idea. «En agosto voy a estar en Suiza. ¿Vienes? Te enseño la nieve. En las montañas hay nieve también en agosto.»',
   '«¿Y cuándo vienes?», pregunto.',
   'Leo sonríe. «¿Nieve en agosto? Vale. Pero en septiembre tengo que volver. La boda de Marc. Y en octubre empiezan mis clases.»',
   '«Perfecto», digo. «Agosto en Suiza. Septiembre en Barcelona. Y noviembre... ya vemos.»'
  ],
  quiz:[
   {q:'¿Cuál es la estación favorita de Mia?',o:['El otoño.','El verano.','El invierno.']},
   {q:'¿Cuándo nieva mucho en Suiza?',o:['En diciembre, enero y febrero.','En agosto.','Nunca.']},
   {q:'¿Leo ve la nieve en la vida real?',o:['No, nunca.','Sí, cada año.','Sí, en Barcelona.']},
   {q:'¿Cuándo va Leo a Suiza?',o:['En agosto.','En octubre.','En noviembre.']}
  ]},
 {ch:48,diff:2,title:'Una noticia de la abuela',
  tz:{de:'Die Grossmutter ruft alle in die blaue Tür. Sie und Joan haben eine Neuigkeit, mit fünfzig Jahren Verspätung.',en:'Grandmother calls everyone to the blue door. She and Joan have news, fifty years late.'},
  paras:[
   'El domingo, mi abuela nos llama a todos: a Leo, a Laia y a mí. «Venid a la casa azul. A las seis. Es importante.»',
   'A las seis estamos en la casa azul. Mi abuela y Joan están sentados en el sofá. Se dan la mano. Están nerviosos, como dos niños.',
   '«Bueno», dice Joan. «Ana y yo tenemos una noticia.»',
   'Mi abuela mira a Joan. Joan mira a mi abuela. Nadie dice nada.',
   '«¡Abuelo, habla!», dice Laia.',
   '«Nos casamos», dice mi abuela. «En noviembre.»',
   'Silencio. Después, Laia grita. Leo abraza a su abuelo. Yo abrazo a mi abuela.',
   '«¿Por qué en noviembre?», pregunto.',
   '«Porque en noviembre conozco a Joan», dice mi abuela. «Hace muchos años, un día de noviembre, entro en la tienda de radios. Y allí está él, con una radio en las manos.»',
   'Joan saca algo del bolsillo. Es un anillo pequeño, con una piedra azul.',
   '«¡Qué sorpresa!», dice Laia. «¿Y esto? ¿Una boda de verdad?»',
   '«Abuelo, ¿estás seguro?», pregunta Leo. Joan se ríe. «Nunca estoy tan seguro.»',
   '«Azul», digo. «Claro.»',
   '«Claro», dice Joan. «Todo en esta historia es azul.»'
  ],
  quiz:[
   {q:'¿A qué hora están en la casa azul?',o:['A las seis.','A las doce.','A las nueve.']},
   {q:'¿Cuál es la noticia?',o:['La abuela y Joan se casan.','La abuela vuelve a Suiza.','Joan está enfermo.']},
   {q:'¿Cuándo es la boda?',o:['En noviembre.','En septiembre.','En agosto.']},
   {q:'¿De qué color es la piedra del anillo?',o:['Azul.','Roja.','Verde.']}
  ]},
 {ch:49,diff:1,title:'Mis padres llegan',
  tz:{de:'Elf Stunden Zug, ein müder Vater und eine Mutter mit zu viel Gepäck. Leo trifft Mias Eltern.',en:'Eleven hours by train, a tired father and a mother with too much luggage. Leo meets Mia\'s parents.'},
  paras:[
   'Es el diez de junio. Leo y yo estamos en la estación de Sants, la estación de tren más grande de Barcelona.',
   'El tren de mis padres llega a las ocho de la tarde. Llega tarde, claro. Veinte minutos tarde.',
   'Y allí están. Mi padre es bajo y un poco gordo, como el padre de Leo. Mi madre, con dos maletas grandes. Mi padre, con una maleta pequeña y una cara muy cansada.',
   '«¡Mia!» Mi madre me abraza. Mi padre me abraza. Y después miran a Leo.',
   '«Mamá, papá: este es Leo.»',
   '«Encantado», dice Leo, en alemán. Una palabra. La única palabra de alemán que sabe.',
   'Mi padre sonríe. «Encantado», dice en español. La única palabra de español que sabe.',
   'Todos nos reímos. Y ya está: son amigos.',
   'En Zúrich, mi padre tiene un coche. Pero aquí no necesita coche. Vamos al hotel en taxi. Mi padre mira la ciudad por la ventana. «Mucho ruido», dice. «Mucha gente. Me gusta.»',
   'El taxi para. El hotel está en una calle tranquila cerca de la Sagrada Familia. Es pequeño, pero muy bonito.',
   'La chica de la recepción es muy amable. «¿Ustedes tienen una habitación aquí?» En la recepción, mi padre habla en inglés. Yo traduzco al español. Leo traduce al catalán. Es un caos, pero al final tenemos la llave de la habitación.',
   '«Una llave», dice mi madre. «En esta familia, siempre hay una llave.»'
  ],
  quiz:[
   {q:'¿Dónde están Mia y Leo?',o:['En la estación de tren.','En el aeropuerto.','En el hotel.']},
   {q:'¿Cómo llega el tren?',o:['Veinte minutos tarde.','Muy temprano.','A las doce.']},
   {q:'¿Qué palabra dice el padre en español?',o:['«Encantado».','«Hola».','«Gracias».']},
   {q:'¿Dónde está el hotel?',o:['Cerca de la Sagrada Familia.','En la playa.','En la calle Verdi.']}
  ]},
 {ch:50,diff:1,title:'Barcelona en bicicleta',
  tz:{de:'Mias Vater will alles sehen, und zwar mit dem Fahrrad. Ein Tag voller Sehenswürdigkeiten und Muskelkater.',en:'Mia\'s father wants to see everything, by bike. A day full of sights and sore muscles.'},
  paras:[
   'Mi padre tiene un plan. Un plan muy grande. «Hoy vemos Barcelona en bicicleta. Toda Barcelona.»',
   'Mi padre es así: cuando tiene un plan, nadie puede cambiar el plan.',
   'Alquilamos cuatro bicicletas: para mi padre, mi madre, Leo y yo. Mi brazo ya está bien.',
   'Primero vamos por la playa. Hace sol y el mar está azul. Hay gente que corre, gente que está en el agua y gente que toma el sol.',
   'Después vamos al parque de la Ciutadella. Hay un lago con barcas, una fuente enorme y muchas flores moradas.',
   'Después, al Born y al barrio Gótico, la parte más vieja de la ciudad. Las calles son muy estrechas. Mucha gente. Muchos turistas. Mi padre hace fotos de todo: de las puertas, de las ventanas, de los gatos.',
   'A las dos, comemos en un restaurante pequeño. Mi padre pide paella. «¡Es la mejor paella de mi vida!», dice. Es la primera paella de su vida.',
   '«Hoy invito yo», dice mi padre, y pide la cuenta. Después de comer, mi madre dice: «Yo vuelvo al hotel. Me duelen las piernas.»',
   'Pero mi padre no está cansado. «¡Vamos! ¡Ahora Montjuic!»',
   'Leo me mira. «¿Montjuic? ¿En bicicleta? Es una montaña.»',
   '«Mi padre es suizo», digo. «Para él, Montjuic no es una montaña. Es una colina.»',
   'Por la noche, en el hotel, mi padre está en la cama a las nueve. No puede mover las piernas. Pero está muy feliz.'
  ],
  quiz:[
   {q:'¿Cómo ven Barcelona?',o:['En bicicleta.','En autobús.','A pie.']},
   {q:'¿Qué hay en el parque de la Ciutadella?',o:['Un lago y una fuente.','Un dragón.','Una noria.']},
   {q:'¿Qué come el padre?',o:['Paella.','Pizza.','Sopa.']},
   {q:'¿Cómo está el padre por la noche?',o:['Muy cansado, pero feliz.','Enfermo.','Triste.']}
  ]},
 {ch:51,diff:1,title:'Un partido en el Camp Nou',
  tz:{de:'Joan lädt Mias Vater zum Barça Spiel ein. Zwei Männer ohne gemeinsame Sprache, aber mit derselben Leidenschaft.',en:'Joan invites Mia\'s father to a Barça match. Two men with no common language but the same passion.'},
  paras:[
   'Joan tiene dos entradas para el fútbol. Barça contra Real Madrid. El partido más importante del año.',
   '«¿Estás listo, papá?», pregunto. Mi padre está muy nervioso.',
   '«Una entrada es para mí», dice Joan. «Y la otra... para tu padre.»',
   'Mi padre no habla español. Joan no habla alemán. Pero los dos hablan fútbol.',
   'Leo y yo vamos también. En el metro, en la línea tres, todos llevan camisetas del Barça. Tenemos entradas arriba, muy arriba. Desde allí, los jugadores son muy pequeños.',
   'El estadio es enorme. Hay casi cien mil personas. Todos cantan. Todos llevan camisetas azules y rojas, los colores del Barça.',
   'En el minuto diez, el Madrid marca un gol. Silencio en el estadio.',
   'En el minuto cuarenta, el Barça marca un gol. ¡Gooool! Todo el estadio grita. Mi padre grita. Joan grita. Mi padre y Joan se abrazan.',
   'En el minuto noventa, el partido está uno a uno. Y entonces, un jugador joven del Barça corre, corre, corre... y ¡gol!',
   'El Barça gana dos a uno. Su equipo gana. Cien mil personas cantan. Mi padre llora. Joan llora.',
   'Mi padre no sabe jugar al fútbol, pero sabe cantar. Para él, es el mejor día del mundo.',
   'Después del partido, mi padre dice a Joan su segunda palabra en español: «¡Visca el Barça!» Bueno, es catalán. Pero Joan está muy contento.'
  ],
  quiz:[
   {q:'¿Quién juega?',o:['El Barça contra el Real Madrid.','El Barça contra Valencia.','Suiza contra España.']},
   {q:'¿Cuántas personas hay en el estadio?',o:['Casi cien mil.','Mil.','Cien.']},
   {q:'¿Quién gana?',o:['El Barça, dos a uno.','El Madrid.','Nadie.']},
   {q:'¿Qué dice el padre al final?',o:['«¡Visca el Barça!»','«Encantado».','«Gracias».']}
  ]},
 {ch:52,diff:1,title:'El agua está fría',
  tz:{de:'Erster Strandtag des Jahres. Leo schwimmt, Mia zögert, und die Mutter verteilt Sonnencreme.',en:'First beach day of the year. Leo swims, Mia hesitates, and her mother hands out sun cream.'},
  paras:[
   'Es domingo. Hace mucho calor: treinta grados. Vamos todos a la playa: mis padres, Leo, Laia y yo.',
   'Mi madre trae una bolsa enorme: toallas, agua, fruta, bocadillos y tres botellas de crema para el sol.',
   '«Mamá, solo es un día de playa.»',
   '«El sol de España es muy fuerte», dice mi madre. Y pone crema en la cara de mi padre. Mucha crema. Mi padre parece un fantasma.',
   'Leo corre al agua. «¡Vamos, Mia! ¡A nadar!»',
   'Pongo un pie en el agua. «¡Está muy fría!»',
   '«No está fría. ¡Está perfecta!», grita Leo. Leo sabe nadar muy bien. Es como un pez.',
   'Un camarero camina por la playa y vende bebidas frías. «¡Agua! ¡Cerveza! ¡Zumo!» Mi padre compra una cerveza. Mi madre, un agua.',
   'Laia me mira. «Las chicas de Suiza tienen miedo del agua, ¿no?»',
   '¿Miedo? ¿Yo? Corro al agua. Una ola grande viene hacia mí. ¡Splash! Todo mi cuerpo está en el agua.',
   'Está fría. Muy fría. Pero después de un minuto, está bien. Nado hasta Leo.',
   '«¿Ves?», dice Leo. «Perfecta.»',
   'Hay un padre con su hijo en el agua. Mientras yo nado con Leo, mi madre lee un libro. Mi padre duerme debajo de su crema blanca. Laia hace fotos con mi cámara vieja.',
   'Por la noche, en el cielo hay muchas estrellas. Es un buen día. Un día perfecto.'
  ],
  quiz:[
   {q:'¿Cuántos grados hace?',o:['Treinta.','Diez.','Cuarenta.']},
   {q:'¿Qué hay en la bolsa de la madre?',o:['Toallas, agua y crema.','Un libro y una guitarra.','Nada.']},
   {q:'¿Cómo es Leo en el agua?',o:['Como un pez.','Tiene miedo.','No le gusta.']},
   {q:'¿Qué hace el padre al final?',o:['Duerme.','Nada.','Hace fotos.']}
  ]},
 {ch:53,diff:2,title:'La noche de Sant Joan',
  tz:{de:'Die kürzeste Nacht des Jahres: Feuer am Strand, Feuerwerk und Mias Eltern tanzen.',en:'The shortest night of the year: fires on the beach, fireworks, and Mia\'s parents dance.'},
  paras:[
   'Es el veintitrés de junio. Es la noche de Sant Joan, la noche más corta del año.',
   'En Barcelona, esta noche nadie duerme. Hay fiestas en todas las calles, en todas las plazas y en todas las playas.',
   'Por la tarde, comemos coca de Sant Joan en la casa azul. Es un dulce típico, con fruta y azúcar. Mi padre come tres trozos.',
   'Por la noche vamos todos a la playa. Hay bebidas, comida típica y miles de personas. Hay música, hay fuego, hay fuegos artificiales en el cielo.',
   '«¿Qué celebráis?», pregunta mi madre.',
   '«El verano», dice Joan. «El sol. La luz. Y hay una tradición: a las doce, saltas el fuego y pides un deseo.»',
   'Mi madre mira el fuego. «¡Cuidado, Mia!» «Tranquila, mamá.»',
   'A las doce, Leo me da la mano. Saltamos juntos un fuego pequeño. Cierro los ojos y pido un deseo. Es un secreto, claro.',
   'Después, mi madre y mi padre bailan en la arena. Mis padres nunca bailan. Nunca. Pero esta noche bailan.',
   'Mi abuela y Joan miran el cielo. Hay estrellas y fuegos de colores.',
   'A las cuatro de la mañana, todavía estamos en la playa. El cielo está cada vez más claro.',
   'Mi padre mira el mar. «Ahora entiendo», dice en alemán. «Ahora entiendo por qué la abuela vuelve aquí.»'
  ],
  quiz:[
   {q:'¿Qué noche es?',o:['La noche de Sant Joan.','Nochevieja.','Su cumpleaños.']},
   {q:'¿Qué es la coca de Sant Joan?',o:['Un dulce típico.','Una bebida.','Un baile.']},
   {q:'¿Qué hacen a las doce?',o:['Saltan el fuego y piden un deseo.','Comen uvas.','Duermen.']},
   {q:'¿Qué hacen los padres de Mia?',o:['Bailan en la arena.','Duermen en el hotel.','Nadan.']}
  ]},
 {ch:54,diff:1,title:'Adiós en la estación',
  tz:{de:'Abschied am Bahnhof. Mias Vater spricht ein ernstes Wort mit Leo.',en:'Goodbye at the station. Mia\'s father has a serious word with Leo.'},
  paras:[
   'Es el veinticinco de junio. Mis padres vuelven a Suiza hoy.',
   'Estamos otra vez en la estación de Sants. Mi madre tiene tres maletas. Tiene una maleta más que en el viaje a Barcelona.',
   '«¿Qué hay en la maleta nueva, mamá?»',
   '«Recuerdos. Aceite de oliva, queso, una camiseta del Barça para tu tío... y un libro de Gaudí.»',
   'Mi padre está con Leo, un poco lejos. Hablan en inglés. Mi padre está serio. Leo escucha y dice que sí con la cabeza.',
   '«¿Qué dice tu padre?», pregunta mi abuela.',
   '«No sé», digo. «Mi padre es un hombre de pocas palabras.»',
   'El tren está en el andén. Mi madre me abraza y me da un beso. «En julio te esperamos en Zúrich. Y a Leo en agosto.»',
   'Mi padre me abraza también. «Adiós, papá», digo. «Estoy orgulloso de ti», dice en mi oído. «Tu español es muy bueno.»',
   'Mi padre da la mano a Leo y dice su tercera palabra en español: «¡Adiós!» Y después: «¡Visca el Barça!»',
   'El tren sale. Miro el tren hasta el final.',
   'Después, pregunto a Leo: «¿Qué te dice mi padre?»',
   'Leo sonríe. «Dice que el Barça es el mejor equipo del mundo. Y que tengo que cuidar de ti. Pero creo que tú cuidas de ti muy bien.»'
  ],
  quiz:[
   {q:'¿Cuántas maletas tiene la madre ahora?',o:['Tres.','Dos.','Una.']},
   {q:'¿Qué hay en la maleta nueva?',o:['Recuerdos.','Ropa sucia.','La cámara.']},
   {q:'¿Qué dice el padre a Mia?',o:['Que está orgulloso de ella.','Que tiene que volver a Suiza.','Nada.']},
   {q:'¿Qué dice el padre a Leo?',o:['Que el Barça es el mejor y que tiene que cuidar de Mia.','Que no le gusta Barcelona.','Que tiene que estudiar.']}
  ]},
 {ch:55,diff:1,title:'Las notas',
  tz:{de:'Die Prüfungsresultate sind da. Und dann kommt eine E-Mail von der Universität.',en:'The exam results are out. And then an email arrives from the university.'},
  paras:[
   'Hoy es el último día de junio. Hoy salen las notas de los exámenes. Desde ayer no duermo bien.',
   'Estoy en mi habitación con el ordenador. Marta está a mi lado. Pau está en la puerta con un café.',
   '«¿Y?», pregunta Marta.',
   '«Espera. La página no abre.» Internet en nuestro piso es muy lento.',
   'Por fin, la página abre. Economía: un ocho. Marketing: un siete. Estadística: un cinco. Y español... ¡un nueve!',
   '«¡Un nueve en español!», grita Pau. «¡Increíble! ¡Esta chica es casi de Barcelona!»',
   '«Y un cinco en estadística», digo. «Pero un cinco es aprobado. Apruebo todo.»',
   'Marta me abraza. Pau me da el café. «Para celebrar», dice. Escribo un mensaje a Leo: «¡Apruebo todo!» Leo responde con veinte corazones.',
   'Entonces, en el ordenador, hay un correo nuevo. Es de la universidad.',
   {t:'«Querida Mia: Tenemos una plaza para un segundo semestre en Barcelona, de septiembre a diciembre. ¿Quieres continuar con nosotros? Por favor, responde antes del quince de julio.»',cls:'note'},
   'Miro el correo dos veces. Tres veces.',
   'Un semestre más. Cuatro meses más en Barcelona. Con Leo. Con mi abuela. Con la calle Verdi.',
   'Pero también: cuatro meses más sin mis padres. Sin mi vida en Suiza.',
   'Cierro el ordenador. Necesito pensar.'
  ],
  quiz:[
   {q:'¿Qué nota tiene Mia en español?',o:['Un nueve.','Un cinco.','Un siete.']},
   {q:'¿Aprueba todo Mia?',o:['Sí.','No, estadística no.','No sabe.']},
   {q:'¿Qué ofrece la universidad?',o:['Un segundo semestre.','Un trabajo.','Un piso.']},
   {q:'¿Hasta cuándo tiene que responder?',o:['Hasta el quince de julio.','Hasta diciembre.','Hasta mañana.']}
  ]},
 {ch:56,diff:2,title:'La decisión',
  tz:{de:'Bleiben oder gehen? Mia fragt die Grossmutter um Rat und bekommt eine Antwort, mit der sie nicht rechnet.',en:'Stay or go? Mia asks her grandmother for advice and gets an answer she doesn\'t expect.'},
  paras:[
   'Una semana después, todavía no sé qué hacer. Voy a la casa azul. Mi abuela está en la cocina. Hace una tarta de manzana.',
   '«Abuela, necesito tu ayuda.»',
   '«Siéntate», dice. «¿Un té?»',
   'Le hablo del correo de la universidad. Del semestre. De Leo. De mis padres.',
   '«¿Qué hago, abuela? ¿Me quedo o me voy?»',
   'Mi abuela corta la manzana. Despacio. Muy despacio.',
   '«Mia, hace muchos años, yo tengo que tomar una decisión. Quedarme en Barcelona o irme a Suiza.»',
   '«Y te vas.»',
   '«Me voy. Y tengo una buena vida en Suiza. Una buena familia. Tu madre. Tú. No estoy triste por mi vida.» Mi abuela me mira. «Pero cada día, durante cincuenta años, pienso: ¿y si me quedo?»',
   'No digo nada. «No es fácil», dice mi abuela. «Nunca es fácil.»',
   '«No te digo qué hacer», dice mi abuela. «Solo te digo una cosa: una pregunta no es un problema. Una pregunta es un regalo.»',
   'Esa noche, escribo un correo a la universidad. Es un correo muy corto. Solo tiene una palabra.',
   '«Sí.»'
  ],
  quiz:[
   {q:'¿Qué hace la abuela?',o:['Una tarta de manzana.','Una paella.','Un té frío.']},
   {q:'¿Qué decisión tiene que tomar la abuela hace muchos años?',o:['Quedarse en Barcelona o irse a Suiza.','Comprar una casa.','Estudiar o trabajar.']},
   {q:'¿Está triste la abuela por su vida?',o:['No.','Sí, mucho.','No sabe.']},
   {q:'¿Qué responde Mia a la universidad?',o:['«Sí».','«No».','Nada.']}
  ]},
 {ch:57,diff:1,title:'La maleta',
  tz:{de:'Koffer packen für einen Monat Zürich. Was nimmt man mit, wenn man zurückkommen will?',en:'Packing for a month in Zurich. What do you take when you want to come back?'},
  paras:[
   'Es el quince de julio. Mañana viajo a Zúrich. Voy a viajar sola, pero no es mi primer viaje sola. Un mes en Suiza, y después, en septiembre, vuelvo a Barcelona.',
   'Mi maleta está abierta en la cama. ¿Qué pongo?',
   'En Zúrich, en julio, hace calor, pero no mucho. Y en las montañas hace frío. Entonces pongo de todo: camisetas, dos jerseys, unos vaqueros, una chaqueta, el vestido verde y las botas.',
   'También pongo regalos: aceite de oliva para mi tío, una camiseta del Barça para mi primo, y para mi madre, un libro de recetas catalanas.',
   'Marta entra. «¿Llevas la chaqueta azul?»',
   '«Claro. Y la cámara. Y la llave.»',
   'Pau entra. «¿Y para nosotros? ¿Chocolate suizo?»',
   '«En agosto, cuando vuelvo, traigo chocolate para todos. Kilos de chocolate.»',
   'Mi habitación se queda vacía. Pero no del todo. En la mesa dejo la rosa de Sant Jordi, ya seca. Y la novela «La chica del mar». Son una promesa: vuelvo.',
   'Es una buena decisión, pienso. Por la noche, Leo me acompaña a la estación de autobuses. Esta vez no voy en tren. Voy en avión. Pero el aeropuerto está lejos y el autobús sale muy temprano.',
   '«¿Tienes el billete?», pregunta Leo. «Sí, en el teléfono.» «Buen viaje.»',
   '«Un mes», dice Leo.',
   '«Un mes», digo. «Y después, tú en Zúrich. Y la nieve.»',
   '«Y la nieve», dice Leo. Y me da un beso. «Adiós, Mia.» «Adiós no. Hasta pronto.»'
  ],
  quiz:[
   {q:'¿Cuánto tiempo va Mia a Suiza?',o:['Un mes.','Una semana.','Un año.']},
   {q:'¿Qué regalo es para la madre?',o:['Un libro de recetas.','Aceite de oliva.','Una camiseta del Barça.']},
   {q:'¿Qué deja Mia en la mesa?',o:['La rosa y la novela.','La llave.','La cámara.']},
   {q:'¿Cómo viaja Mia a Zúrich?',o:['En avión.','En tren.','En bicicleta.']}
  ]},
 {ch:58,diff:1,title:'Zúrich',
  tz:{de:'Zurück in Zürich. Alles ist sauber, pünktlich und ruhig. Und Mia träumt auf Spanisch.',en:'Back in Zurich. Everything is clean, punctual and quiet. And Mia dreams in Spanish.'},
  paras:[
   'Zúrich. Mi ciudad. Todo es igual: el lago, los tranvías azules, las montañas a lo lejos. Todo está limpio. Todo llega a la hora.',
   'Mi madre prepara mi comida favorita: rosti con salchicha. Y de postre, chocolate suizo, el dulce más típico de Suiza. Mi padre me enseña doscientas fotos de Barcelona. Doscientas. Las miramos todas.',
   'En mi habitación de Zúrich todo está igual: la cama, el armario, los libros de la escuela. Pero algo es diferente. Yo soy diferente.',
   'En el supermercado, digo «¡Hola!» y «¡Gracias!» en español. La cajera me mira raro.',
   'En la calle, busco gente que habla fuerte, que ríe en la calle, que come a las diez de la noche. Pero en Zúrich, a las diez de la noche, la ciudad duerme.',
   'Por la noche sueño en español. Sueño con la calle Verdi, con el Bar Sol, con la casa azul.',
   'Cada noche, Leo me llama. Hablamos una hora. A veces dos.',
   '«¿Qué tal Zúrich?», pregunta.',
   '«Bonita. Tranquila. Muy limpia.»',
   '«¿Y tú?»',
   '«Yo te echo de menos. Y echo de menos el ruido.»',
   'Leo se ríe. «Aquí tengo mucho ruido para ti. En dos semanas estoy en Zúrich. Con mi guitarra.»',
   'Cuento los días en el calendario de mi habitación. Catorce días. Trece. Doce...'
  ],
  quiz:[
   {q:'¿Cómo es Zúrich?',o:['Limpia y tranquila.','Ruidosa.','Muy caliente.']},
   {q:'¿Qué comida prepara la madre?',o:['Rosti con salchicha.','Paella.','Pizza.']},
   {q:'¿En qué idioma sueña Mia?',o:['En español.','En alemán.','En inglés.']},
   {q:'¿Qué echa de menos Mia?',o:['A Leo y el ruido.','La nieve.','El lago.']}
  ]},
 {ch:59,diff:2,title:'Nieve en agosto',
  tz:{de:'Leo in der Schweiz. Ein Zug auf den Berg, ein Gletscher und zum ersten Mal Schnee in seinen Händen.',en:'Leo in Switzerland. A train up the mountain, a glacier and, for the first time, snow in his hands.'},
  paras:[
   'Es el diez de agosto. Leo está en Zúrich. Lleva pantalones cortos y una camiseta. «Hace fresco aquí», dice. Hace veinticuatro grados.',
   'Hoy vamos a la montaña. En la estación hay muchos turistas con cámaras. Tomamos un tren rojo, muy pequeño, que sube y sube. Primero hay vacas, árboles y casas de madera. Después, solo piedras. Y después...',
   '«¿Eso es nieve?», pregunta Leo. Pone la cara en la ventana como un niño.',
   'Arriba, a tres mil metros, hace frío. Mucho frío. Leo lleva mi jersey rosa. Le queda pequeño. Muy pequeño.',
   'Salimos del tren. Todo es blanco. El sol en la nieve es tan fuerte que no podemos abrir los ojos.',
   'Leo toca la nieve con la mano. Muy despacio, como un niño con un regalo.',
   '«Está fría», dice. «Y es suave. Y...» Hace una bola de nieve. Me la tira. ¡Paf! En mi cara.',
   '«¡Leo!»',
   'Leo corre y se ríe. Yo hago una bola de nieve también. Y otra. Y otra. Después de diez minutos, estamos los dos blancos, mojados y muy felices.',
   'En la montaña no hay ruido. Solo el viento. Leo se sienta en la nieve. Mira las montañas. «Es increíble. Es como estar en otro planeta.»',
   'Saco la cámara vieja y hago una foto. Leo en la nieve, con mi jersey rosa: un poco feo, pero muy guapo. Es precioso, como en una película. Es mi foto favorita de todo el año.'
  ],
  quiz:[
   {q:'¿Qué dice Leo del tiempo en Zúrich?',o:['Que hace fresco.','Que hace mucho calor.','Que llueve.']},
   {q:'¿Qué ven desde el tren?',o:['Vacas, árboles y después nieve.','El mar.','La Sagrada Familia.']},
   {q:'¿Qué lleva Leo arriba?',o:['El jersey rosa de Mia.','Su chaqueta azul.','Una camiseta del Barça.']},
   {q:'¿Qué hace Leo con la nieve?',o:['Una bola de nieve.','Una foto.','Nada.']}
  ]},
 {ch:60,diff:2,title:'Septiembre',
  tz:{de:'Zurück in Barcelona. Ein neues Semester, eine Hochzeit im November und das Ende von A1.',en:'Back in Barcelona. A new semester, a wedding in November and the end of A1.'},
  paras:[
   'Es el primero de septiembre. El avión llega a Barcelona a las once de la mañana. Por la ventana veo el mar. Azul, como siempre.',
   'Leo me espera en el aeropuerto. Me da un beso. «Bienvenida a casa.»',
   'Y también están Laia, mi abuela y Joan. Laia tiene un cartel: «BIENVENIDA A CASA, MIA».',
   '«¡Sorpresa!», gritan todos. A casa. Sí. Barcelona es mi casa ahora. Una de mis casas.',
   'En la calle Verdi, Marta y Pau me esperan con una fiesta. Hay tortilla de patatas, pan con tomate y una tarta. Yo saco el chocolate suizo. Tres kilos. Pau grita de felicidad.',
   'Dejo la maleta en mi habitación. Está igual: la rosa seca, la novela, el balcón. En la mesa hay un sobre nuevo. Es de mi abuela.',
   {t:'«Querida Mia: El veintitrés de noviembre, a las doce, en la casa azul. Tú vas a ser mi testigo. Con amor, Abuela Ana.»',cls:'note'},
   'Sonrío. Mi abuela y Joan se casan. Una boda en noviembre. Una boda de cincuenta años.',
   'Esa noche, en el balcón, Leo toca la guitarra. Abajo, en la calle, la gente habla, ríe, cena tarde. Hay mucho ruido. Me gusta el ruido.',
   'En octubre empiezan las clases de Leo. Y el sábado es la boda de Marc, el primo de Leo. Rafa dice que ya bailo salsa muy bien. Bueno, muy bien no. Pero bailo.',
   'Pienso en mi primer día en Barcelona. En la llave azul en mi maleta. En la nota: «La puerta azul está en la calle del Sol.»',
   'Ahora tengo amigos, una familia nueva, un barrio, una vida. Y hablo español. Todavía no perfecto. Pero hablo.',
   'Y ahora puedo decir mi deseo de Sant Joan. Mi deseo es simple: una vida aquí. Y mi deseo ahora es verdad.',
   'Mi historia en Barcelona no termina aquí. Solo cambia de nivel.',
   {t:'Fin del nivel A1',cls:'voice'}
  ],
  quiz:[
   {q:'¿Quién espera a Mia en el aeropuerto?',o:['Leo, Laia, la abuela y Joan.','Sus padres.','Nadie.']},
   {q:'¿Qué trae Mia de Suiza?',o:['Tres kilos de chocolate.','Una radio.','Un gato.']},
   {q:'¿Qué hay en el sobre?',o:['Una invitación a la boda.','Una foto vieja.','Una llave.']},
   {q:'¿Qué va a ser Mia en la boda?',o:['La testigo.','La cocinera.','La fotógrafa.']}
  ]}
];

 {id:'familia',title:'Familia',color:['#ec4899','#831843'],

 {id:'comida',title:'Comida',color:['#f97316','#7c2d12'],

 {id:'barcelona',title:'Barcelona',color:['#eab308','#713f12'],

 {id:'cuerpo',title:'El cuerpo',color:['#f43f5e','#881337'],
  intro:{de:'Kopf, Hände, Füsse: beim Salsa braucht man alles gleichzeitig.',en:'Head, hands, feet: salsa needs all of them at once.'},
  words:['cuerpo','cabeza','cara','ojo','boca','pelo','mano','brazo','pierna','pie','corazón','garganta'],
  scene:{title:'La clase de Rafa',who:{de:'Rafa, der Salsalehrer aus Kuba',en:'Rafa, the salsa teacher from Cuba'},paras:[
   'Me llamo Rafa. Soy de Cuba y bailo desde los cinco años. Ahora tengo una escuela de baile en Barcelona.',
   'Los martes, la clase es muy divertida. Hay una chica suiza que se llama Mia. Mia tiene una cabeza muy inteligente. Pero su cuerpo no escucha a su cabeza.',
   'Su pie derecho va a la izquierda. Su brazo va arriba cuando la música va abajo. Pero Mia sonríe siempre. Y eso es lo más importante.',
   'Yo digo a mis alumnos: «La salsa no está en la cabeza. No está en los pies. Está aquí.» Y pongo la mano en el corazón.',
   'Mia me mira con los ojos grandes. Cierra los ojos. Escucha la música. Y por un momento, solo un momento, baila. Baila de verdad.',
   'Después pierde el ritmo y se ríe. Pero yo lo veo. Esta chica tiene salsa en el corazón.'
  ]}},
 {id:'ropa',title:'Ropa',color:['#a855f7','#4c1d95'],
  intro:{de:'Ein Vintage Laden in Gràcia und eine blaue Jacke mit Geheimnis.',en:'A vintage shop in Gràcia and a blue jacket with a secret.'},

  scene:{title:'La chaqueta azul',who:{de:'Teresa, die Besitzerin des Kleiderladens in der calle Verdi',en:'Teresa, owner of the clothes shop on calle Verdi'},paras:[

   'Un día de enero, entra un chico joven. Lleva gafas de sol, en enero. Muy raro.',

function conjOf(e){if(e.conj)return e.conj;const st=e.k.slice(0,-2),en=e.k.slice(-2);const E={ar:['o','as','a','amos','áis','an'],er:['o','es','e','emos','éis','en'],ir:['o','es','e','imos','ís','en']}[en];return E?E.map(x=>st+x):null;}
function adjForms(k){if(k.endsWith('o'))return [k,k.slice(0,-1)+'a',k+'s',k.slice(0,-1)+'as'];if(k.endsWith('e'))return [k,k,k+'s',k+'s'];return [k,k,k+'es',k+'es'];}
function plural(k){const ACC={'á':'a','é':'e','í':'i','ó':'o','ú':'u'};if(/[áéíóú][ns]$/.test(k)&&!/^[^aeiouáéíóú]*[áéíóú][ns]$/.test(k))return k.slice(0,-2)+ACC[k[k.length-2]]+k.slice(-1)+'es';if(/[aeiou].*[aeiou]s$/.test(k)&&!/[áéíóú]s$/.test(k))return k;if(/[aeiouáéó]$/.test(k))return k+'s';if(k.endsWith('z'))return k.slice(0,-1)+'ces';return k+'es';}
const ALAB=['männlich Einzahl','weiblich Einzahl','männlich Mehrzahl','weiblich Mehrzahl'];
function formsList(e){
  if(e.p==='v'){if(e.noforms)return null;const c=conjOf(e);return c?c.map((f,i)=>({lab:PRON[i],f,key:f.split(' ').pop(),irr:!!(e.irr&&e.irr.includes(i))})):null;}
  if(e.forms)return e.forms.map((f,i)=>({lab:ALAB[i],f,key:f}));
  if(e.p==='adj'||e.af)return adjForms(e.k).map((f,i)=>({lab:ALAB[i],f,key:f}));
  return null;
}

const LS='palabradex.v1';
function defState(){return {lang:'de',fs:21,theme:'sepia',font:'literata',mark:true,caught:{},forms:{},cards:{},mast:{},stories:{},days:[],opened:0,bonusXp:0,empties:0,spent:0,last:null,upd:0};}

const remote={ref:null,writing:false,pending:false,timer:null};
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function save(){S.upd=Date.now();saveLocal();if(remote.ref){clearTimeout(remote.timer);remote.timer=setTimeout(flushRemote,1500);}}
async function flushRemote(){
  if(!remote.ref)return;if(remote.writing){remote.pending=true;return;}
  remote.writing=true;
  try{await remote.ref.set(JSON.parse(JSON.stringify(S)));setSync(true);}
  catch(e){if(e&&e.code==='unavailable')setTimeout(flushRemote,800+Math.random()*800);else if(e&&e.code==='invalid_argument'){remote.ref=null;setSync(false);}}
  remote.writing=false;if(remote.pending){remote.pending=false;flushRemote();}
}
function merge(a,b){
  const o=defState();const newer=(b.upd||0)>(a.upd||0)?b:a;
  for(const k of ['lang','fs','theme','font','mark','last'])o[k]=newer[k]??o[k];
  o.caught=Object.assign({},b.caught||{},a.caught||{});
  for(const k in (b.caught||{}))if(a.caught&&a.caught[k]&&b.caught[k].t<a.caught[k].t)o.caught[k]=b.caught[k];
  for(const src of [a.forms||{},b.forms||{}])for(const k in src)o.forms[k]=[...new Set([...(o.forms[k]||[]),...src[k]])];
  for(const src of [a.cards||{},b.cards||{}])for(const k in src)o.cards[k]=Object.assign({},src[k],o.cards[k]||{});
  const ids=new Set([...Object.keys(a.stories||{}),...Object.keys(b.stories||{})]);
  for(const id of ids){const x=(a.stories||{})[id]||{},y=(b.stories||{})[id]||{};o.stories[id]={done:!!(x.done||y.done),quiz:Math.max(x.quiz||0,y.quiz||0),read:!!(x.read||y.read),page:(newer===a?x.page:y.page)||0};}
  o.days=[...new Set([...(a.days||[]),...(b.days||[])])].sort().slice(-120);
  for(const src of [a.mast||{},b.mast||{}])for(const k in src)o.mast[k]=Math.max(o.mast[k]||0,src[k]);
  o.opened=Math.max(a.opened||0,b.opened||0);o.empties=Math.max(a.empties||0,b.empties||0);o.spent=Math.max(a.spent||0,b.spent||0);o.bonusXp=Math.max(a.bonusXp||0,b.bonusXp||0);
  o.upd=Math.max(a.upd||0,b.upd||0);return o;
}

async function initRemote(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;

const LV=[0,80,200,360,560,800,1100,1450,1850,2300,2800,3400];
const REWARDS=[
 {lv:2,id:'noche',de:'Lesethema Noche',sub:'Dunkler Lesemodus für die Nacht'},

function has(id){const r=REWARDS.find(r=>r.id===id);return !r||levelOf(xp())>=r.lv;}
function doneStories(){return STORIES.filter(s=>S.stories[s.id]&&S.stories[s.id].done);}
function met(l){return doneStories().filter(s=>STATS[s.id]&&STATS[s.id][l]).length;}
function cardCount(l){return Object.keys(S.cards[l]||{}).length;}
function Q(t,cur,max,x){return {t,cur:Math.min(cur,max),max,x};}
function quests(e){
  const q=[];const fl=formsList(e);
  if(fl){const tot=new Set(fl.map(x=>x.key)).size,got=(S.forms[e.k]||[]).length;
    if(e.p==='v'){q.push(Q('Finde 2 Formen',got,2,3));q.push(Q('Finde 4 Formen',got,4,6));q.push(Q('Finde alle '+tot+' Formen',got,tot,12));}
    else if(tot>2){q.push(Q('Finde 2 Formen',got,2,3));q.push(Q('Finde alle '+tot+' Formen',got,tot,6));}}
  const m=met(e.k);q.push(Q('In 3 Kapiteln gelesen',m,3,3));q.push(Q('In 6 Kapiteln gelesen',m,6,6));
  const tm=(S.mast||{})[e.k]||0;q.push(Q('3x im Training richtig',tm,3,3));
  const c=cardCount(e.k);q.push(Q('Spezialkarte gesammelt',c,1,4));q.push(Q('Alle 3 Spezialkarten',c,3,12));
  const ok=!!S.caught[e.k];q.forEach(x=>x.done=ok&&x.cur>=x.max);return q;
}
function questTotals(){let n=0,x=0;for(const k in S.caught){const e=LEX[k];if(!e)continue;for(const q of quests(e))if(q.done){n++;x+=q.x;}}return {n,x};}
function xp(){let x=Object.keys(S.caught).filter(k=>LEX[k]).length*2;for(const id in S.stories){const s=S.stories[id];x+=(s.quiz||0)*5+(s.done?15:0);}return x+questTotals().x+(S.bonusXp||0);}
function levelOf(x){let l=1;for(let i=1;i<LV.length;i++)if(x>=LV[i])l=i+1;if(x>=LV[LV.length-1])l=LV.length+Math.floor((x-LV[LV.length-1])/700);return l;}
function nextLv(l){return LV[l]||LV[LV.length-1]+(l-LV.length+1)*700;}
function dayKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return dayKey(new Date());}
function markDay(){const t=today();if(!S.days.includes(t)){S.days.push(t);S.days=S.days.slice(-120);}}
function streak(){const set=new Set(S.days);let d=new Date(),n=0;if(!set.has(today()))d.setDate(d.getDate()-1);while(set.has(dayKey(d))){n++;d.setDate(d.getDate()-1);}return n;}
function bestStreak(){const ds=[...S.days].sort();let best=0,run=0,prev=null;for(const k of ds){const d=new Date(k+'T12:00:00');if(prev&&Math.round((d-prev)/864e5)===1)run++;else run=1;best=Math.max(best,run);prev=d;}return best;}
function chestSources(){const q=questTotals().n;return {story:doneStories().length,quest:Math.floor(q/10),streak:Math.floor(bestStreak()/3),level:levelOf(xp())-1,qn:q};}

let dexFilter='all',dexTab='dex',dexQ='',dexSort='num';
const SORTS=[['num','Nummer'],['az','A bis Z'],['rar','Seltenheit'],['var','Beste Variante'],['new','Zuletzt gefangen'],['pow','Poder']];
const VRANK={normal:0,holo:1,gold:2,leg:3};
function sortDex(list){const caught=e=>S.caught[e.k]?0:1;const by={num:(a,b)=>a.n-b.n,az:(a,b)=>a.k.localeCompare(b.k,'es'),rar:(a,b)=>rarity(b)-rarity(a)||fr(b)-fr(a),var:(a,b)=>VRANK[bestVar(b.k)]-VRANK[bestVar(a.k)]||rarity(b)-rarity(a),new:(a,b)=>((S.caught[b.k]||{}).t||0)-((S.caught[a.k]||{}).t||0),pow:(a,b)=>power(b)-power(a)}[dexSort];return list.sort((a,b)=>dexSort==='num'?by(a,b):(caught(a)-caught(b)||by(a,b)||a.n-b.n));}
function openDex(){hideTip();$('#dex').classList.remove('hidden');renderDex();}
function closeDex(){$('#dex').classList.add('hidden');}
$('#dexBtn').onclick=openDex;$('#chestBtn').onclick=()=>openChest();
const FILT=[['all','Alle'],['v','Verben'],['n','Nomen'],['adj','Adjektive'],['other','Andere'],['shiny','Unregelmässig']];
function renderDex(){
  const all=Object.values(LEX).sort((a,b)=>a.n-b.n);const caught=all.filter(e=>S.caught[e.k]);
  const nSpecial=caught.reduce((a,e)=>a+cardCount(e.k),0),maxSpecial=all.length*3;
  const d=$('#dex');let body='';
  if(dexTab==='dex'){
    body=`<div class="dsearch"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="dexQ" type="search" autocomplete="off" placeholder="Suchen: Wort, Form, Übersetzung oder Nummer" value="${esc(dexQ)}"></div>
    <label class="dsort">Sortieren <select id="dexS">${SORTS.map(([k,n])=>`<option value="${k}" ${dexSort===k?'selected':''}>${n}</option>`).join('')}</select></label>
    <div class="filters">${FILT.map(([k,n])=>`<button class="chip ${dexFilter===k?'on':''}" data-f="${k}">${n}</button>`).join('')}</div>
    <div class="dgrid" id="dGrid"></div>`;
  }else if(dexTab==='col'){
    body=colsHtml();
  }else{
    const owned=albumCards();
    body=`<div class="albbar"><label class="dsort">Sortieren <select id="albS">${ALBSORT.map(([k,n])=>`<option value="${k}" ${albSort===k?'selected':''}>${n}</option>`).join('')}</select></label>
      <span class="ptsbadge">${PCOIN} ${pts()} Puntos</span><button class="btn" id="albPdf" ${owned.length?'':'disabled'}>${PDFI} Album als PDF</button></div>`+
      (owned.length?`<div class="dgrid">${owned.map(([e,v])=>tcgHtml(e,v,{mini:1,btn:1}).replace('data-c=','data-v="'+v+'" data-c=')).join('')}</div>`:
      `<div class="empty">Noch keine Spezialkarten. Öffne Truhen oder kaufe Karten mit Puntos, um Holo, Oro und Legendaria Karten zu sammeln.</div>`);
  }
  d.innerHTML=`<div class="dexin"><button class="back" data-x>&larr; Zurück</button>
  <div class="dexhead">${dexTab==='dex'?`<div class="ring" style="--p:${caught.length/all.length*100}"><span>${Math.round(caught.length/all.length*100)}%</span></div><div><h1>Wortdex</h1><div style="color:var(--mut)">${caught.length} von ${all.length} Wörtern gefangen</div></div>`
   :dexTab==='col'?(()=>{const cd=colsDone();return `<div class="ring" style="--p:${cd.done/COLS.length*100}"><span>${cd.done}/${COLS.length}</span></div><div><h1>Colecciones</h1><div style="color:var(--mut)">Rang: <b style="color:var(--acc)">${rankName(cd.done)}</b> &middot; ${cd.done} von ${COLS.length} Seiten komplett</div></div>`;})()
   :`<div class="ring" style="--p:${nSpecial/maxSpecial*100}"><span>${nSpecial}</span></div><div><h1>Sammelalbum</h1><div style="color:var(--mut)">${nSpecial} von ${maxSpecial} Spezialkarten</div></div>`}
   <span style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" data-train>Trainieren</button>${chestsAvail()?`<button class="btn" data-chest>Truhe öffnen (${chestsAvail()})</button>`:''}</span></div>
  <div class="tabs"><button data-t="dex" class="${dexTab==='dex'?'on':''}">Wortdex</button><button data-t="col" class="${dexTab==='col'?'on':''}">Colecciones</button><button data-t="alb" class="${dexTab==='alb'?'on':''}">Sammelalbum</button></div>${body}</div>`;
  d.querySelector('[data-x]').onclick=closeDex;
  d.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{dexTab=b.dataset.t;renderDex();});
  d.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{dexFilter=b.dataset.f;renderDex();});
  d.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>openCard(b.dataset.c,b.dataset.v));
  const cb=d.querySelector('[data-chest]');if(cb)cb.onclick=()=>openChest();
  d.querySelector('[data-train]').onclick=()=>openTrain();
  if(dexTab==='col')bindCols(d);
  const as=d.querySelector('#albS');if(as){as.onchange=ev=>{albSort=ev.target.value;renderDex();};d.querySelector('#albPdf').onclick=()=>albumPdf();}
  const qi=d.querySelector('#dexQ');if(qi){fillDexGrid();qi.oninput=()=>{dexQ=qi.value;fillDexGrid();};d.querySelector('#dexS').onchange=ev=>{dexSort=ev.target.value;fillDexGrid();};}
}
const norm=t=>String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function dexMatch(e,q){if(!q)return true;const n=q.replace(/^#/,'');if(/^\d+$/.test(n))return e.n===+n;
  if(!S.caught[e.k])return false;if(norm(e.k).includes(q)||norm(e.de).includes(q)||norm(e.en).includes(q))return true;
  const fl=formsList(e);return !!(fl&&fl.some(x=>norm(x.f).includes(q)));}
function fillDexGrid(){const g=$('#dGrid');if(!g)return;const q=norm(dexQ.trim());
  const list=sortDex(Object.values(LEX).filter(e=>(dexFilter==='all'||(dexFilter==='other'?!['v','n','adj'].includes(e.p):dexFilter==='shiny'?isShiny(e):e.p===dexFilter))&&dexMatch(e,q)));
  g.innerHTML=list.length?list.map(e=>S.caught[e.k]?tcgHtml(e,bestVar(e.k),{mini:1,btn:1}):`<div class="tcg mini unk"><div class="tcg-in"><span class="no">${num(e.n)}</span><span class="q">?</span></div></div>`).join(''):`<div class="empty" style="grid-column:1/-1">Kein gefangenes Wort passt zu «${esc(dexQ)}».</div>`;
  g.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>openCard(b.dataset.c));}

function openCard(k,v,opt){
  const e=LEX[k];if(!e)return;const c=S.caught[k];
  if(!c){toast('Dieses Wort hast du noch nicht gefangen');return;}
  if(!(opt&&opt.replace))pushModal();
  const owned=['normal',...['holo','gold','leg'].filter(x=>S.cards[k]&&S.cards[k][x])];v=v&&owned.includes(v)?v:bestVar(k);
  const [pn,pc]=POS[e.p];const fl=formsList(e);const got=S.forms[k]||[];
  let forms='';
  if(fl){const tot=new Set(fl.map(x=>x.key)).size;
    forms=`<div class="sec"><h4>${e.p==='v'?'Presente':'Formen'} <span>${got.length} / ${tot} entdeckt</span></h4><table class="ftab">${fl.map(x=>{const g=got.includes(x.key);
      return `<tr><td>${x.lab}</td><td class="${g?(x.irr?'irr':''):'lk'}">${g?esc(x.f):'???'}</td></tr>`;}).join('')}</table>
      ${e.note?`<p style="color:var(--mut);font-size:12px;margin-top:6px">${esc(tr(e.note))}</p>`:''}<p style="color:var(--mut);font-size:12px;margin-top:6px">Formen schaltest du frei, wenn du sie in einer Geschichte findest.</p></div>`;}
  else if(e.p==='n'){const a=e.g==='m'?['el','los']:['la','las'];
    forms=`<div class="sec"><h4>Formen</h4><table class="ftab"><tr><td>Einzahl</td><td>${a[0]} ${esc(e.k)}</td></tr><tr><td>Mehrzahl</td><td>${a[1]} ${esc(plural(e.k))}</td></tr></table></div>`;}
  const qs=quests(e);
  const quest=`<div class="sec"><h4>Quests <span>${qs.filter(q=>q.done).length} / ${qs.length}</span></h4>${qs.map(q=>`<div class="quest ${q.done?'done':''}"><span class="ck">${q.done?CHK:''}</span><span class="qt">${q.t}<div class="qb"><i style="width:${q.cur/q.max*100}%"></i></div></span><span class="qx">${q.done?'':''}+${q.x} XP</span></div>`).join('')}</div>`;
  const o=occ(k);const st=c.s&&STORIES.find(s=>s.id===c.s);
  let ex='';if(c.ex){const fs=Object.keys(FORMS).filter(f=>FORMS[f].l===k);let h=esc(c.ex);
    fs.sort((a,b)=>b.length-a.length).forEach(f=>{h=h.replace(new RegExp('(^|[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ])('+f+')(?![A-Za-zÁÉÍÓÚÜÑáéíóúüñ])','gi'),'$1<mark>$2</mark>');});
    ex=`<div class="sec"><h4>Gefunden in</h4><div class="ex" style="--pc:${pc}">${h}</div></div>`;}
  const data=`<div class="sec"><h4>Daten</h4><div class="kv"><div><b>${o.n}x</b><span>in ${o.c} ${o.c===1?'Kapitel':'Kapiteln'}</span></div><div><b>${power(e)}</b><span>Poder (Häufigkeit)</span></div>
    <div><b>${num(e.n)}</b><span>Wortdex Nummer</span></div><div><b>${new Date(c.t).toLocaleDateString('de-CH')}</b><span>${c.s==='chest'?'aus einer Truhe':st?'gefangen in '+esc(st.title):'gefangen'}</span></div></div></div>`;
  const tabs=[];if(forms)tabs.push(['f','Formen',forms]);tabs.push(['q','Quests',quest]);tabs.push(['i','Infos',ex+data]);
  openModal(`<button class="cvclose" data-close>${XSVG}</button><div class="cv">
    <div class="cv-data"><div class="cvh"><div><small>${num(e.n)} &middot; ${pn.toUpperCase()}${isShiny(e)?' &middot; IRREGULAR':''}</small><h2>${esc(e.k)}</h2></div><button class="spk" data-say="${esc(e.k)}" style="background:var(--panel2);width:40px;height:40px">${SPK}</button></div>
      <div class="cvtr">${esc(e[S.lang])}</div>
      <div class="ctabs">${tabs.map((t,i)=>`<button data-tab="${t[0]}" class="${i?'':'on'}">${t[1]}</button>`).join('')}</div>
      ${tabs.map((t,i)=>`<div class="tabc ${i?'hidden':''}" data-tc="${t[0]}">${t[2]}</div>`).join('')}</div>
    <div class="cv-card"><div id="cvC">${tcgHtml(e,v,{tilt:1})}</div>
      <div class="vsel">${VORDER.map(x=>{const ok=owned.includes(x);return `<button class="${x===v?'on':''} ${ok?'':'lk buy'}" data-vv="${x}"><i style="background:${VAR[x][1]}"></i>${ok?VAR[x][0]:VAR[x][0]+' &middot; '+PRICE[x]+' P'}</button>`;}).join('')}</div>
      <div class="ptsline">${PCOIN} ${pts()} Puntos${colOf(k)?` &middot; Teil der Colección <b>${esc(colOf(k).title)}</b>`:''}</div>
      <button class="btn" id="shareB">${SHR} Karte teilen</button></div></div>`,true);
  let curV=v;$('#shareB').onclick=()=>shareCard(e,curV);
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('[data-tc]').forEach(x=>x.classList.toggle('hidden',x.dataset.tc!==b.dataset.tab));});

/* ============================================================
   PUNTOS, COLECCIONES, ALBUM
   ============================================================ */
const PRICE={holo:120,gold:300,leg:1200};
const PTS_CHEST=15,PTS_EMPTY=60,PTS_COL=100,PTS_GOLD=250;
const PCOIN='<span class="coin">P</span>';
const PDFI='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14"/></svg>';
function colState(c){const slots=c.words.map(w=>{const caught=!!S.caught[w],sp=caught&&cardCount(w)>0;return {w,caught,sp,v:caught?bestVar(w):null};});
  const have=slots.filter(x=>x.sp).length;return {slots,have,complete:have===slots.length,gold:slots.every(x=>x.v==='gold'||x.v==='leg')};}
function colsDone(){let done=0,gold=0;for(const c of COLS){const st=colState(c);if(st.complete)done++;if(st.gold)gold++;}return {done,gold};}
function colOf(w){return COLS.find(c=>c.words.includes(w));}
const RANKS=[[0,'Novato'],[1,'Coleccionista'],[3,'Experto'],[6,'Maestro'],[10,'Leyenda']];
function rankName(n){let r=RANKS[0][1];for(const [t,name] of RANKS)if(n>=t)r=name;return r;}
function ptsEarned(){const cd=colsDone();return (S.opened||0)*PTS_CHEST+(S.empties||0)*PTS_EMPTY+cd.done*PTS_COL+cd.gold*PTS_GOLD;}
function pts(){return Math.max(0,ptsEarned()-(S.spent||0));}
function buyVariant(k,v){if(!S.caught[k]||pts()<PRICE[v])return false;S.spent=(S.spent||0)+PRICE[v];(S.cards[k]||(S.cards[k]={}))[v]=Date.now();markDay();save();updateHud();if(!$('#dex').classList.contains('hidden'))renderDex();toast(`<span class="gem" style="background:${VAR[v][1]}">${VAR[v][0][0]}</span><span><b>${esc(k)}</b> als ${VAR[v][0]} gekauft</span>`);if(v==='leg'||v==='gold')confetti();return true;}
function colsHtml(){
  return `<div class="albbar"><span class="ptsbadge">${PCOIN} ${pts()} Puntos</span><span class="mut" style="font-size:13px;color:var(--mut)">Puntos gibt es für jede Truhe, volle Seiten und Goldseiten. Fehlende Spezialkarten kannst du in der Kartenansicht kaufen.</span><button class="btn" id="colPdf" style="margin-left:auto">${PDFI} Colecciones als PDF</button></div>
  <div class="colgrid">${COLS.map(c=>{const st=colState(c);return `<button class="colt ${st.complete?'done':''} ${st.gold?'gold':''}" data-col="${c.id}" style="--c1:${c.color[0]};--c2:${c.color[1]}">
    <span class="ct">${esc(c.title)}</span><span class="cs">${st.gold?'Oro':st.complete?'Komplett':st.have+' / '+st.slots.length}</span>

function openTrain(){
  hideTip();const pool=Object.keys(S.caught).filter(l=>LEX[l]&&LEX[l].p!=='prop');
  if(pool.length<4){openModal(`<h2>Training</h2><p style="color:var(--mut)">Fange zuerst mindestens 4 Wörter in den Geschichten.</p>`);return;}
  const N=Math.min(10,pool.length);const left=pool.slice();const picked=[];
  while(picked.length<N){const w=left.map(l=>1/(1+((S.mast||{})[l]||0)*1.5));const tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot,i=0;while(r>w[i]){r-=w[i];i++;}picked.push(left.splice(i,1)[0]);}
  const rounds=picked.map(l=>{const e=LEX[l];const dir=Math.random()<.5?'es':'tr';
    const others=shuffle(pool.filter(x=>x!==l&&LEX[x][S.lang]!==e[S.lang]));
    const same=others.filter(x=>LEX[x].p===e.p);const ds=[...new Set([...same,...others])].slice(0,3);
    let extra=shuffle(Object.keys(LEX).filter(x=>x!==l&&!ds.includes(x)&&LEX[x].p!=='prop'));while(ds.length<3)ds.push(extra.pop());
    return {l,dir,opts:shuffle([l,...ds])};});
  let i=0,score=0;const wrong=[];
  function show(){const R0=rounds[i],e=LEX[R0.l];let done=false;
    const prompt=R0.dir==='es'?`<div class="trq"><span class="trw">${esc(e.k)}</span><button class="spk" data-say="${esc(e.k)}">${SPK}</button></div><div class="trh">Was heisst das?</div>`
      :`<div class="trq"><span class="trt">${esc(e[S.lang])}</span></div><div class="trh">Wie heisst das auf Spanisch? ${e.p==='n'?'<small>(Nomen)</small>':''}</div>`;
    openModal(`<div class="qprog">${rounds.map((_,j)=>`<i class="${j<i?(rounds[j].ok?'ok':'no'):j===i?'cur':''}"></i>`).join('')}</div>${prompt}
      <div class="qopts trgrid">${R0.opts.map((o,j)=>`<button class="qopt" data-o="${j}"><b class="kn">${j+1}</b>${esc(R0.dir==='es'?LEX[o][S.lang]:o)}</button>`).join('')}</div>
      <div class="qfoot"><span class="qfb" id="qfb"></span><button class="btn hidden" id="qnext">${i<rounds.length-1?'Weiter':'Ergebnis'}</button></div>`);
    const answer=j=>{if(done)return;done=true;const o=R0.opts[j];const ok=o===R0.l;R0.ok=ok;
      document.querySelectorAll('.qopt').forEach(x=>{x.disabled=true;if(R0.opts[+x.dataset.o]===R0.l)x.classList.add('ok');});
      if(ok){score++;S.mast[R0.l]=(S.mast[R0.l]||0)+1;}else{document.querySelector(`.qopt[data-o="${j}"]`).classList.add('no');wrong.push(R0.l);}
      $('#qfb').innerHTML=ok?'<span style="color:var(--good)">¡Correcto!</span>':`<span style="color:var(--bad)">${esc(e.k)} = ${esc(e[S.lang])}</span>`;
      if(R0.dir==='tr'||ok)speak(e.k);

      ${wrong.length?`<div style="text-align:left;margin:10px 0"><div style="font-size:12px;font-weight:800;letter-spacing:1px;color:var(--mut);margin-bottom:6px">NOCHMAL ANSCHAUEN</div>${[...new Set(wrong)].map(l=>`<button class="quest" style="width:100%" data-card="${esc(l)}"><span class="qt"><b>${esc(l)}</b> &middot; ${esc(LEX[l][S.lang])}</span></button>`).join('')}</div>`:''}
      <p style="font-size:13px">Jedes Wort, das du 3x richtig hast, erfüllt eine Quest.</p>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:10px"><button class="btn ghost" data-close>Fertig</button><button class="btn" id="tagain">Nochmal</button></div></div>`);

      document.querySelectorAll('.qopt').forEach(x=>{x.disabled=true;if(q.opts[+x.dataset.o].ok)x.classList.add('ok');});if(!o.ok)b.classList.add('no');
      $('#qfb').innerHTML=o.ok?'<span style="color:var(--good)">¡Correcto!</span>':'<span style="color:var(--bad)">Casi...</span>';
      $('#qnext').classList.remove('hidden');$('#qnext').onclick=()=>{i++;i<qs.length?show():finish();};});}
  function finish(){
    const score=res.filter(Boolean).length,pass=score>=3;const p=S.stories[st.id];
    p.quiz=Math.max(p.quiz||0,score);p.read=true;if(pass)p.done=true;markDay();save();
    const gain=xp()-xp0;updateHud();const newCh=chestsAvail()-ch0;
    const next=STORIES.find(s=>s.lvl===st.lvl&&s.ch===st.ch+1);
    openModal(`<div class="qres"><div class="big">${score}/${qs.length}</div>
     <p>${pass?(score===4?'¡Perfecto! Alles richtig.':'¡Muy bien! Bestanden.'):'Fast! Du brauchst 3 von 4. Lies die Geschichte nochmal und versuch es erneut.'}</p>
     ${gain>0?`<div class="xpgain">+${gain} XP</div>`:''}
     ${newCh>0?`<p style="color:var(--acc);font-weight:700">Du hast ${newCh===1?'eine Truhe':newCh+' Truhen'} verdient!</p>`:''}
     ${pass&&next?`<p>${next.soon?'Das nächste Kapitel erscheint bald.':'Kapitel '+next.ch+' ist jetzt freigeschaltet!'}</p>`:''}
     <div style="display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap">${pass?`${chestsAvail()?'<button class="btn" id="qchest">Truhe öffnen</button>':''}<button class="btn ghost" id="qdone">Fertig</button>`:'<button class="btn ghost" id="qdone">Nochmal lesen</button><button class="btn" id="qretry">Nochmal versuchen</button>'}</div></div>`);
    quizOpen=false;
    const dn=$('#qdone');if(dn)dn.onclick=()=>{closeModal();if(pass){closeReader();go({name:'level',lvl:st.lvl});}else goTo(0);};
    const rt=$('#qretry');if(rt)rt.onclick=()=>openQuiz(st);
    const qc=$('#qchest');if(qc)qc.onclick=()=>{closeReader();go({name:'level',lvl:st.lvl});openChest();};
  }
  show();
}

function refreshAll(){updateHud();render();if(curStory){applyReaderPrefs();document.querySelectorAll('#rct .w').forEach(w=>{w.classList.remove('new','rare','nf');const c=wcls(w.dataset.k).trim();if(c)c.split(' ').forEach(x=>w.classList.add(x));});updateReaderWords();}if(!$('#dex').classList.contains('hidden'))renderDex();}
let installEvt=null;addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();installEvt=ev;});
function isStandalone(){try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}}
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!/claude|anthropic/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}catch(e){}
lastLevel=levelOf(xp());lastChests=chestsAvail();updateHud();render();
initRemote();
</script>
