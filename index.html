 {ch:21,diff:1,title:'Las doce uvas',
  tz:{de:'Silvester bei der Grossmutter: zwölf Trauben, rote Kleider, und um Mitternacht spricht das Radio. Aber nicht Joan.',en:'New Year\'s Eve at grandmother\'s: twelve grapes, red clothes, and at midnight the radio speaks. But not Joan.'},
  paras:[
   'Es el treinta y uno de diciembre. Es Nochevieja, la última noche del año.',
   'Estamos todos en la casa azul: mi abuela, Joan, Leo, Laia y yo. Mi abuela lleva un vestido rojo. Leo lleva una camisa blanca. Yo llevo un jersey negro.',
   '«¿Por qué rojo, abuela?», pregunto.',
   '«En España, en Nochevieja, la ropa roja trae suerte», dice mi abuela. «Y ahora, las uvas.»',
   'Laia pone un plato pequeño delante de cada persona. En cada plato hay doce uvas verdes.',
   '«¿Doce uvas?», digo. «¿Para qué?»',
   '«A las doce, el reloj de la Puerta del Sol hace doce campanadas», dice Leo. «Con cada campanada, comes una uva. Doce campanadas, doce uvas, doce meses de suerte.»',
   'Miramos la tele. Son las doce menos un minuto. Todos tenemos el plato en la mano.',
   'Una campanada: una uva. Dos campanadas: dos uvas. Es muy difícil. Las uvas son grandes. Laia se ríe. Yo me río. ¡Es imposible!',
   '«¡Feliz año nuevo!», dicen todos. Nos abrazamos.',
   'Entonces, la radio azul habla. Una voz. Pero no es la voz de Joan. Es una voz diferente.',
   {t:'«Feliz año nuevo, Mia. ¿Te gustan los juegos? El juego empieza mañana.»',cls:'note'},
   '«¿Quién está ahí?», pregunta Joan a la radio. Nadie contesta.',
   'Miro a Joan. Joan mira la radio. Su cara está blanca.',
   '«No soy yo», dice Joan. «Esa voz no es mía.»'
  ],
  quiz:[
   {q:'¿Qué día es?',o:['El treinta y uno de diciembre.','El primero de enero.','Su cumpleaños.']},
   {q:'¿Por qué lleva la abuela ropa roja?',o:['Porque trae suerte.','Porque tiene frío.','Porque es su color.']},
   {q:'¿Cuántas uvas come cada persona?',o:['Doce.','Siete.','Una.']},
   {q:'¿Quién habla en la radio?',o:['Una voz diferente.','Joan.','Leo.']}
  ]},
 {ch:22,diff:1,title:'Un paquete sin nombre',
  tz:{de:'Am ersten Januar liegt ein Paket vor Mias Tür. Ohne Absender, aber mit einem Rätsel.',en:'On the first of January there is a parcel at Mia\'s door. No sender, but a riddle.'},
  paras:[
   'Es el primero de enero. Son las diez de la mañana. Alguien llama a la puerta.',
   'Abro. No hay nadie. Pero en el suelo hay un paquete. Un paquete pequeño, con papel marrón.',
   'En el paquete hay mi nombre: «Para Mia». No hay otro nombre. No hay dirección.',
   'Abro el paquete. Dentro hay una cámara de fotos. Es una cámara muy vieja, negra y pesada. Y hay un sobre.',
   'Abro el sobre. Dentro hay una tarjeta. En la tarjeta hay una pregunta:',
   {t:'«Primera pregunta: ¿Dónde vive el dragón de colores? Busca el dragón. Lleva la cámara.»',cls:'note'},
   '¿Un dragón? ¿En Barcelona? Me gustan los juegos. Pero este juego es difícil.',
   'Escribo un mensaje a Leo: «¿Tú sabes algo de un paquete? ¿Y de un dragón?»',
   'Leo responde rápido: «¿Un dragón? Ni idea. ¿Por qué?»',
   'Miro la cámara. Miro la tarjeta. Es la letra de una persona joven. No es la letra de mi abuela. No es la letra de Joan.',
   '¿Es Laia? Laia es inteligente y le gustan los secretos. Pero Laia tiene dieciséis años. No tiene dinero para una cámara.',
   'Alguien quiere jugar conmigo. Y yo... yo quiero jugar también.'
  ],
  quiz:[
   {q:'¿Qué hay en el suelo?',o:['Un paquete.','Una carta de Ana.','Un gato.']},
   {q:'¿Qué hay dentro del paquete?',o:['Una cámara y un sobre.','Una radio.','Doce uvas.']},
   {q:'¿Qué tiene que buscar Mia?',o:['Un dragón.','Una llave.','Un piso.']},
   {q:'¿De quién es la letra?',o:['De una persona joven.','De la abuela.','De Joan.']}
  ]},
 {ch:23,diff:1,title:'Un día normal',
  tz:{de:'Mias Alltag zwischen Wecker, Dusche und Uni. Und Leo kennt plötzlich den Drachen.',en:'Mia\'s routine between alarm, shower and uni. And suddenly Leo knows the dragon.'},
  paras:[
   'Mi día empieza a las siete y media. Me despierto, me levanto, voy al baño y me ducho. El agua está muy caliente. ¡Me gusta!',
   'Después me visto. Hoy llevo unos pantalones azules y un jersey gris. Hace frío en enero.',
   'Desayuno en la cocina: un café con leche y pan con tomate. Siempre desayuno muy rápido.',
   'A las ocho y cuarto salgo de casa. Voy a la universidad en metro. El viaje es de veinte minutos.',
   'Las clases empiezan a las nueve y terminan a las dos. Hoy tengo clase de economía y clase de español. La profesora de español es muy simpática. Se llama Carmen.',
   'A las dos y media como algo en la universidad. Después estudio en la biblioteca. Pero hoy no estudio mucho. Pienso en el dragón.',
   'A las seis voy al Bar Sol. Leo está detrás de la barra. Me pone un café con leche, como siempre.',
   '«¿Y el dragón?», pregunta Leo.',
   '«Nada. No sé dónde está.»',
   'Leo piensa un momento. Después sonríe. «Mia... ¿conoces a Gaudí?»',
   '«¿El arquitecto? Claro.»',
   '«En el Park Güell, de Gaudí, hay un dragón. Un dragón de muchos colores.»',
   'Lo miro. ¡Claro! «¿Vamos mañana?»',
   '«Mañana trabajo hasta las cinco», dice Leo. «Pero después, sí. Vamos.»'
  ],
  quiz:[
   {q:'¿A qué hora se levanta Mia?',o:['A las siete y media.','A las nueve.','A las doce.']},
   {q:'¿Cómo va Mia a la universidad?',o:['En metro.','En taxi.','A pie.']},
   {q:'¿Cómo se llama la profesora de español?',o:['Carmen.','Rosa.','Laia.']},
   {q:'¿Dónde vive el dragón?',o:['En el Park Güell.','En el mercado.','En la casa azul.']}
  ]},
 {ch:24,diff:2,title:'El dragón de colores',
  tz:{de:'Mit Metro und Bus zum Park Güell. Der Drache hat etwas für Mia versteckt.',en:'By metro and bus to Park Güell. The dragon has hidden something for Mia.'},
  paras:[
   'Son las cinco y media. Leo y yo tomamos el metro, la línea tres. Después tomamos un autobús. El Park Güell está en una montaña, lejos del centro.',
   'Bajamos del autobús. «¿Dónde está el parque?», pregunto a una señora.',
   '«Muy cerca», dice la señora. «Sigue recto. Después, a la derecha. Y después, a la izquierda. Allí está la entrada.»',
   'Caminamos. Recto, a la derecha, a la izquierda. Y allí está: el Park Güell.',
   'Es increíble. Hay casas como de chocolate, con techos blancos como helado. Hay árboles, flores y muchos turistas con cámaras.',
   'Y en la escalera grande, allí está: el dragón. Es verde, azul, amarillo y naranja. Tiene la boca abierta.',
   '«Hola, dragón», digo. «¿Tienes algo para mí?»',
   'Miro el dragón. Miro la boca. Miro debajo del dragón. Y allí, entre las piedras, hay un sobre pequeño.',
   'Abro el sobre. Hay una foto. En la foto hay una iglesia muy alta, con muchas torres.',
   {t:'«Segunda pregunta: ¿Cuántas torres tiene? Haz una foto con la cámara.»',cls:'note'},
   'Leo mira la foto. «Es la Sagrada Familia», dice. «Pero tu juego... ¿quién es? ¿Quién hace esto?»',
   'Leo parece sorprendido. Pero, ¿por qué sonríe un poco?'
  ],
  quiz:[
   {q:'¿Cómo van al Park Güell?',o:['En metro y en autobús.','En taxi.','A pie desde casa.']},
   {q:'¿Qué dice la señora?',o:['Recto, a la derecha y a la izquierda.','Que no conoce el parque.','Que el parque está lejos.']},
   {q:'¿Dónde está el sobre?',o:['Debajo del dragón.','En la boca del dragón.','En un árbol.']},
   {q:'¿Qué hay en la foto?',o:['Una iglesia con muchas torres.','Un dragón.','La casa azul.']}
  ]},
 {ch:25,diff:2,title:'Las torres',
  tz:{de:'In der Sagrada Familia zählt Mia Türme, bezahlt Eintritt und findet die nächste Spur.',en:'At the Sagrada Familia Mia counts towers, pays for a ticket and finds the next clue.'},
  paras:[
   'Es sábado. Leo trabaja, entonces voy sola a la Sagrada Familia. Hay mucha gente delante de la iglesia. Gente de todo el mundo.',
   '«¿Cuánto cuesta la entrada?», pregunto en la taquilla.',
   '«Veintiséis euros», dice el chico. «Con estudiante, veintiuno.»',
   'Pago veintiún euros y entro. Delante de mí hay una familia de Suiza. Hablan alemán. Yo no digo nada. Hoy soy de Barcelona.',
   'Dentro, la iglesia es como un bosque. Las columnas son como árboles blancos. Por las ventanas entra luz de colores: azul, verde, rojo, amarillo. Es muy bonito. No digo nada. Solo miro.',
   'Después, salgo y cuento las torres. Una, dos, tres... Hay muchas. Algunas están terminadas. Otras no.',
   'Pregunto a una guía. «Perdón, ¿cuántas torres tiene la Sagrada Familia?»',
   '«Al final, va a tener dieciocho torres», dice la guía. «Pero todavía no están todas.»',
   'Dieciocho. Hago una foto con la cámara vieja. Clic.',
   'Entonces veo algo. En la puerta de una tienda de recuerdos hay un papel pequeño con una llave azul dibujada. Y un número: dieciocho.',
   'Debajo del número hay una dirección: «Calle Verdi, número cuarenta. Tienda de ropa.»'
  ],
  quiz:[
   {q:'¿Cuánto paga Mia por la entrada?',o:['Veintiún euros.','Veintiséis euros.','Dieciocho euros.']},
   {q:'¿Cómo es la iglesia por dentro?',o:['Como un bosque.','Muy oscura.','Pequeña.']},
   {q:'¿Cuántas torres va a tener?',o:['Dieciocho.','Doce.','Siete.']},
   {q:'¿Dónde está la próxima pista?',o:['En una tienda de ropa.','En el mercado.','En la playa.']}
  ]},
 {ch:26,diff:2,title:'La tienda de ropa',
  tz:{de:'Ein kleiner Kleiderladen in Gràcia. Mia probiert eine Jacke an, und in der Tasche steckt die nächste Karte.',en:'A small clothes shop in Gràcia. Mia tries on a jacket, and the next card is in the pocket.'},
  paras:[
   'La calle Verdi está en el barrio de Gracia. Es una calle estrecha, con tiendas pequeñas y bares.',
   'En el número cuarenta hay una tienda de ropa vintage. Entro. Hay ropa vieja de todos los colores: vestidos, camisas, pantalones, zapatos.',
   '«Hola, ¿te puedo ayudar?», dice la dependienta. Es una mujer mayor con gafas grandes.',
   '«Hola. Busco... no sé. Busco algo azul», digo.',
   'La mujer me mira con una sonrisa. «Algo azul. Claro. Tengo una chaqueta azul. ¿Qué talla tienes?»',
   '«Una M, creo.»',
   'La mujer me da una chaqueta azul, vieja y bonita. «Pruébatela. El probador está allí.»',
   'Me pruebo la chaqueta. Me queda un poco grande, pero me gusta mucho.',
   '«¿Cuánto cuesta?», pregunto.',
   '«Para ti, quince euros.»',
   'Pago con tarjeta. Después, en la calle, pongo la mano en el bolsillo de la chaqueta. Hay un papel.',
   {t:'«Tercera pregunta: ¿Qué tren azul sube a la montaña mágica? La respuesta está en tu casa nueva.»',cls:'note'},
   '¿Mi casa nueva? Yo no tengo casa nueva. Vivo en mi piso de siempre.',
   'Pero esa noche, mi teléfono suena. Es el dueño de mi piso.'
  ],
  quiz:[
   {q:'¿En qué barrio está la calle Verdi?',o:['En Gracia.','En el Born.','En la Barceloneta.']},
   {q:'¿Qué compra Mia?',o:['Una chaqueta azul.','Unos zapatos.','Un vestido rojo.']},
   {q:'¿Cómo le queda la chaqueta?',o:['Un poco grande.','Muy pequeña.','Perfecta.']},
   {q:'¿Dónde está el papel?',o:['En el bolsillo de la chaqueta.','En la caja.','Debajo de la puerta.']}
  ]},
 {ch:27,diff:1,title:'Un problema con el piso',
  tz:{de:'Der Vermieter braucht die Wohnung zurück. Mia muss bis Februar etwas Neues finden.',en:'The landlord needs the flat back. Mia has to find a new place by February.'},
  paras:[
   'El dueño de mi piso se llama señor Ruiz. Es un hombre amable, pero hoy tiene una mala noticia.',
   '«Lo siento, Mia. Mi hija viene a Barcelona en febrero. Necesita el piso. Tienes que salir el treinta y uno de enero.»',
   '¿Salir? ¿En tres semanas? Me siento en la cama. Miro mi piso: la ventana grande, la cama vieja, el mar. Me gusta mucho mi piso.',
   'Pienso en mi primer día en este piso: la luna en el mar, la llave en mi maleta, la nota. Pero no hay otra opción. Necesito un piso nuevo.',
   'Esa noche cuento mi dinero. No es mucho. Al día siguiente, busco en internet. Hay muchos pisos, pero son muy caros. Un piso pequeño en el centro cuesta mil euros al mes. ¡Mil euros!',
   'Hay habitaciones en pisos compartidos. Son más baratas: entre cuatrocientos y seiscientos euros.',
   'Quiero hablar con Leo. Le escribo un mensaje: «Necesito un piso. ¡Ayuda!»',
   'Leo responde: «Tranquila. Mañana vamos a ver pisos juntos. Conozco el barrio de Gracia muy bien.»',
   'Gracia. La calle Verdi está en Gracia. La tienda de ropa está en Gracia.',
   'Y el papel dice: «La respuesta está en tu casa nueva.»',
   '¿Cómo sabe el papel que necesito una casa nueva?'
  ],
  quiz:[
   {q:'¿Quién es el señor Ruiz?',o:['El dueño del piso.','El abuelo de Leo.','Un profesor.']},
   {q:'¿Por qué tiene que salir Mia?',o:['La hija del dueño necesita el piso.','El piso es muy caro.','Hay un problema con la ventana.']},
   {q:'¿Cuánto cuesta un piso pequeño en el centro?',o:['Mil euros al mes.','Quince euros.','Cien euros.']},
   {q:'¿Qué barrio conoce bien Leo?',o:['Gracia.','La Barceloneta.','Zúrich.']}
  ]},
 {ch:28,diff:1,title:'Me duele la cabeza',
  tz:{de:'Fieber, Kopfweh und ein Besuch beim Arzt. Laia bringt Medizin und weiss vielleicht mehr, als sie sagt.',en:'Fever, a headache and a visit to the doctor. Laia brings medicine and may know more than she says.'},
  paras:[
   'Por la mañana me levanto y no me siento bien. Me duele la cabeza. Me duele la garganta. Tengo mucho calor y después mucho frío.',
   'Tengo fiebre. Treinta y ocho grados.',
   'Escribo a Leo: «Hoy no puedo ver pisos. Estoy enferma.»',
   'Voy al médico. El centro de salud está cerca de mi casa. Espero una hora en la sala de espera.',
   '«¿Usted es estudiante?», pregunta la médica. «Sí.» «¿Y qué le pasa?»',
   '«Me duele la cabeza y la garganta. Y tengo fiebre.»',
   'La médica mira mi garganta. Escucha mi corazón. «Es la gripe», dice. «Tiene que descansar tres o cuatro días. Beba mucha agua. Y tome estas pastillas cada ocho horas.»',
   'Voy a la farmacia y compro las pastillas. Después vuelvo a casa y me acuesto. No veo la tele. No leo. Solo duermo.',
   'A las cuatro, alguien llama a la puerta. Es Laia, la hermana de Leo. Tiene una bolsa con naranjas y una botella de zumo.',
   '«Leo trabaja», dice Laia. «Entonces vengo yo. Y hay sopa de mi madre. Para los enfermos, siempre es la misma sopa.»',
   'Laia ve la cámara vieja en mi mesa. Sus ojos se abren mucho. Después mira a otro lado, muy rápido.',
   '«Bonita cámara», dice. Pero su voz es rara.',
   '¿Laia sabe algo?'
  ],
  quiz:[
   {q:'¿Qué le duele a Mia?',o:['La cabeza y la garganta.','La mano.','Los ojos.']},
   {q:'¿Qué tiene Mia?',o:['La gripe.','Un problema con el piso.','Una pierna rota.']},
   {q:'¿Cada cuántas horas toma las pastillas?',o:['Cada ocho horas.','Cada hora.','Cada día.']},
   {q:'¿Qué hace Laia cuando ve la cámara?',o:['Mira a otro lado muy rápido.','Hace una foto.','Se ríe mucho.']}
  ]},
 {ch:29,diff:2,title:'Tres pisos',
  tz:{de:'Wohnungssuche in Gràcia: zu dunkel, zu teuer, und dann ein Zimmer mit Balkon.',en:'Flat hunting in Gràcia: too dark, too expensive, and then a room with a balcony.'},
  paras:[
   'Una semana después, estoy bien otra vez. Hoy Leo y yo vamos a ver tres pisos en Gracia.',
   'El primer piso es muy oscuro. La habitación no tiene ventana. «No, gracias», digo.',
   'El segundo piso es bonito y grande, pero es muy caro: setecientos euros por una habitación. Es más caro que mi piso de ahora.',
   'El tercer piso está en la calle Verdi. Sí, en la calle Verdi. Número cuarenta y dos. Al lado de la tienda de ropa.',
   'Es un piso compartido en el tercer piso de un edificio viejo. No hay ascensor. Seguimos por la escalera: uno, dos, tres pisos.',
   'Una chica abre la puerta. «¡Hola! Soy Marta. Pasad, pasad.»',
   'El piso tiene un salón con muchas plantas, una cocina pequeña, un baño y tres habitaciones. La habitación libre es pequeña, pero tiene un balcón. Desde el balcón veo la calle y los tejados.',
   '«Cuesta cuatrocientos cincuenta euros al mes, con agua y luz», dice Marta. «Y hay un supermercado a la derecha y una farmacia a la izquierda.»',
   'Es más pequeño que mi piso de ahora. Pero es más barato, y yo no tengo mucho dinero. Y es más bonito. Y tiene un balcón.',
   '«Me gusta mucho», digo. «¿Cuándo puedo entrar?»',
   '«El primero de febrero», dice Marta. «Perfecto, ¿no?»',
   'Miro a Leo. Leo mira el techo. Silba una canción. La puerta azul.'
  ],
  quiz:[
   {q:'¿Cómo es el primer piso?',o:['Muy oscuro.','Muy caro.','Muy grande.']},
   {q:'¿Dónde está el tercer piso?',o:['En la calle Verdi.','En la Barceloneta.','En la plaza del Sol.']},
   {q:'¿Qué tiene la habitación libre?',o:['Un balcón.','Un baño grande.','Dos ventanas.']},
   {q:'¿Cuánto cuesta la habitación?',o:['Cuatrocientos cincuenta euros.','Setecientos euros.','Mil euros.']}
  ]},
 {ch:30,diff:1,title:'La mudanza',
  tz:{de:'Kisten schleppen, drei Stockwerke ohne Lift, und zwei neue Mitbewohner.',en:'Carrying boxes up three floors with no lift, and two new flatmates.'},
  paras:[
   'Es el primero de febrero. Hoy es mi mudanza.',
   'No tengo muchas cosas: dos maletas, tres cajas, mis libros, la radio... no, la radio no. La radio está en la casa azul. Pero tengo la cámara y la llave azul.',
   'Leo tiene un coche pequeño. Ponemos todo en el coche. Después, en la calle Verdi, subimos todo por la escalera. Tres pisos. Sin ascensor.',
   '«Tu caja de libros pesa mucho», dice Leo.',
   '«Lo siento. Me gustan los libros.»',
   'En el piso, Marta nos espera con pizza. Y hay un chico también.',
   '«Este es Pau», dice Marta. «Vive aquí también.»',
   'Marta trabaja en el hospital. «Mucho trabajo y poco dinero», dice. «Pero me gusta.»',
   'Pau es alto, tiene barba y lleva gafas. Es de Valencia. Es cocinero y trabaja en un restaurante en el centro. Marta es de Madrid. Es enfermera y trabaja en un hospital.',
   '«Y tú, Mia, ¿qué haces?», pregunta Pau.',
   '«Soy estudiante. Estudio economía. Y soy de Suiza.»',
   '«¡Suiza! ¿Tienes chocolate?», dice Pau. Todos se ríen.',
   'Comemos pizza en el salón. Es mi primera noche en mi casa nueva. Me siento bien. Me siento en casa.'
  ],
  quiz:[
   {q:'¿Qué tiene Leo?',o:['Un coche pequeño.','Un piso grande.','Una tienda.']},
   {q:'¿De dónde es Pau?',o:['De Valencia.','De Madrid.','De Suiza.']},
   {q:'¿Qué es Marta?',o:['Enfermera.','Cocinera.','Estudiante.']},
   {q:'¿Qué comen en el salón?',o:['Pizza.','Paella.','Uvas.']}
  ]},
 {ch:31,diff:2,title:'Debajo de la puerta',
  tz:{de:'Am ersten Morgen in der neuen Wohnung liegt ein Umschlag unter Mias Tür. Wer kennt die neue Adresse schon?',en:'On her first morning in the new flat an envelope lies under Mia\'s door. Who already knows the new address?'},
  paras:[
   'Es domingo. Me despierto en mi habitación nueva. Por la ventana entra el sol. Escucho los pájaros en el balcón.',
   'Me levanto y abro la puerta de la habitación. En el suelo, debajo de la puerta, hay un sobre.',
   '«¿Quién está ahí?», pregunto. Nadie. Mi corazón hace bum, bum. Abro el sobre.',
   {t:'«Bienvenida a tu casa nueva, Mia. Tercera pregunta, otra vez: ¿Qué tren azul sube a la montaña mágica? Sábado. A las once. Lleva la cámara.»',cls:'note'},
   'Voy a la cocina. Marta está allí con un café.',
   '«Marta, ¿quién pone este sobre debajo de mi puerta?»',
   '«¿Qué sobre?», dice Marta. «Yo no sé nada. Pero... ¡qué misterio!» Marta sonríe y bebe su café.',
   'Pau entra en la cocina. Lleva un pijama de dinosaurios.',
   '«Pau, ¿tú sabes algo de este sobre?»',
   '«¿Sobre? Yo solo sé cocinar», dice Pau. «¿Quieres huevos?» Y prepara huevos, pan con tomate y un café con leche. Es un desayuno perfecto.',
   'Nadie sabe nada. Pero alguien sabe mi dirección nueva. Solo cinco personas saben mi dirección nueva: mi abuela, Joan, Leo, Laia y mi madre.',
   'Y la montaña mágica... Busco en el teléfono. ¡Claro! El Tibidabo. Y el tren azul es el Tramvia Blau, un tranvía muy viejo.'
  ],
  quiz:[
   {q:'¿Dónde está el sobre?',o:['Debajo de la puerta.','En la cocina.','En el balcón.']},
   {q:'¿Qué lleva Pau?',o:['Un pijama de dinosaurios.','Una chaqueta azul.','Un abrigo.']},
   {q:'¿Cuántas personas saben la dirección nueva?',o:['Cinco.','Dos.','Ninguna.']},
   {q:'¿Cuál es la montaña mágica?',o:['El Tibidabo.','El Park Güell.','La Sagrada Familia.']}
  ]},
 {ch:32,diff:2,title:'Cena con sospechosos',
  tz:{de:'Abendessen im Restaurant mit der Grossmutter und Joan. Mia macht eine Liste der Verdächtigen.',en:'Dinner at a restaurant with grandmother and Joan. Mia makes a list of suspects.'},
  paras:[
   'El miércoles ceno con mi abuela y Joan en un restaurante pequeño cerca de la casa azul.',
   '«¿Qué van a tomar?», pregunta el camarero.',
   '«De primero, una ensalada», dice mi abuela. «Y de segundo, pescado con patatas.»',
   '«Para mí, sopa de primero y pollo de segundo», dice Joan.',
   '«Yo quiero la ensalada también. Y de segundo, el arroz negro, por favor», digo.',
   '«¿Y para beber?»',
   '«Agua para todos», dice mi abuela. «Y una copa de vino tinto para mí.»',
   'Mientras comemos, hablo del juego. Saco un papel y escribo los sospechosos:',
   {t:'Mi madre: está en Zúrich. No. Joan: no es su voz. No. Mi abuela: ¿una cámara? No. Laia: sabe algo. Quizás. Leo: siempre sonríe. Quizás.',cls:'note'},
   'Mi abuela mira mi lista y se ríe.',
   '«¿Tú sabes quién es, abuela?»',
   '«Yo no digo nada», dice mi abuela. «Pero un juego es más bonito sin respuestas.»',
   '«¿Otra copa de vino, abuela?» «No, gracias. Una es suficiente.» La cena es muy buena. De postre tomamos flan. Después, Joan pide la cuenta. «Hoy invito yo», dice.',
   'Mi abuela y Joan se miran como dos jóvenes. Yo miro mi lista. Laia. Leo. ¿O los dos?'
  ],
  quiz:[
   {q:'¿Qué toma la abuela de segundo?',o:['Pescado con patatas.','Pollo.','Arroz negro.']},
   {q:'¿Qué beben?',o:['Agua y una copa de vino.','Zumo de naranja.','Café con leche.']},
   {q:'¿Quién paga la cuenta?',o:['Joan.','Mia.','La abuela.']},
   {q:'¿Quiénes son los sospechosos al final?',o:['Laia y Leo.','Marta y Pau.','La madre de Mia.']}
  ]},
 {ch:33,diff:2,title:'El tranvía azul',
  tz:{de:'Mit der alten blauen Tram auf den Tibidabo. Oben ist es windig, und am Riesenrad wartet ein Foto.',en:'Up the Tibidabo on the old blue tram. It is windy at the top, and a photo is waiting at the Ferris wheel.'},
  paras:[
   'Es sábado. Son las once. Estoy en la parada del Tramvia Blau. Llevo mi chaqueta azul y la cámara vieja.',
   'Hoy no hace sol. Hay nubes y hace viento. Hace un poco de frío.',
   'El tranvía es azul y muy viejo, como de una película. Subo. Despacio, muy despacio, el tranvía sube la montaña.',
   'Después del tranvía, tomo el funicular. Arriba, en el Tibidabo, hay una iglesia y un parque de atracciones muy viejo.',
   'Abajo, la ciudad parece un juego. Desde arriba veo toda Barcelona: el mar, la Sagrada Familia, las casas, las calles. La ciudad es enorme. Y es preciosa.',
   'Busco una pista. En el parque de atracciones hay una noria. Delante de la noria, un hombre vende billetes.',
   '«Un billete, por favor.»',
   'El hombre me da el billete. Y un sobre. «Para la chica de la chaqueta azul», dice.',
   '«¿Quién le da este sobre?»',
   '«Un chico joven. No sé su nombre.»',
   'Subo a la noria. Arriba, el viento es fuerte. Abro el sobre. ¿Qué es esto? Hay una foto del Bar Sol. Y una frase:',
   {t:'«Última pregunta: ¿Quién soy yo? La respuesta, el sábado que viene, a las ocho de la tarde, en el Bar Sol.»',cls:'note'},
   'Bajo de la noria. Sigo la pista con el corazón muy rápido. Un chico joven. Leo. Tiene que ser Leo. ¿O no?'
  ],
  quiz:[
   {q:'¿Qué tiempo hace en el Tibidabo?',o:['Hay nubes y hace viento.','Hace mucho calor.','Llueve mucho.']},
   {q:'¿Qué ve Mia desde arriba?',o:['Toda Barcelona.','Solo el mar.','Zúrich.']},
   {q:'¿Quién le da el sobre al hombre de la noria?',o:['Un chico joven.','Una mujer mayor.','Laia.']},
   {q:'¿Dónde está la respuesta?',o:['En el Bar Sol.','En la noria.','En la casa azul.']}
  ]},
 {ch:34,diff:1,title:'Una semana larga',
  tz:{de:'Leo ist eine Woche in Valencia. Mia merkt, wie sehr sie ihn vermisst.',en:'Leo is in Valencia for a week. Mia realises how much she misses him.'},
  paras:[
   'El domingo, Leo me escribe: «Hola. Esta semana estoy en Valencia. Tengo tres conciertos con mi grupo. Vuelvo el sábado.»',
   'El sábado. Justo el sábado del Bar Sol.',
   'El lunes estudio en la biblioteca. Miro el teléfono. No hay mensajes de Leo.',
   'El martes voy a clase de español. Carmen dice: «Mia, tu español es muy bueno ahora. ¿Tienes un profesor en casa?» Me río. «No. Tengo un camarero.»',
   'Yo tampoco duermo bien esta semana. El miércoles ceno con Marta y Pau. Pau cocina una paella valenciana, de verdad, con pollo y conejo. Está muy buena.',
   '«Pau, ¿cómo es Valencia?», pregunto.',
   '«Bonita. Pero Barcelona es más bonita. ¿Por qué? ¿Piensas en alguien en Valencia?» Marta y Pau se miran y sonríen.',
   'El jueves, Leo me manda una foto: él con su guitarra en un escenario. Debajo escribe: «Te echo de menos.»',
   'Leo me echa de menos. Miro la foto mucho tiempo. Y lo sé: yo también le echo de menos. Mucho.',
   'El jueves hace viento y hay nubes. Como yo: un día gris.',
   'El viernes no duermo bien. Pienso en el Bar Sol. Pienso en la última pregunta. ¿Quién soy yo?',
   'Y pienso en Leo.'
  ],
  quiz:[
   {q:'¿Dónde está Leo esta semana?',o:['En Valencia.','En Zúrich.','En el Tibidabo.']},
   {q:'¿Qué cocina Pau?',o:['Una paella valenciana.','Una pizza.','Sopa.']},
   {q:'¿Qué escribe Leo debajo de la foto?',o:['«Te echo de menos.»','«Feliz año nuevo.»','«¿Quién soy yo?»']},
   {q:'¿En quién piensa Mia el viernes?',o:['En Leo.','En el señor Ruiz.','En Carmen.']}
  ]},
 {ch:35,diff:2,title:'El carrete',
  tz:{de:'Mia lässt den Film der alten Kamera entwickeln. Auf den Fotos ist jemand, mit dem sie nicht gerechnet hat.',en:'Mia has the old camera\'s film developed. Someone unexpected is in the photos.'},
  paras:[
   'El viernes por la tarde, tengo una idea. La cámara vieja tiene un carrete. Un carrete de fotos de verdad, no digital.',
   'Busco una tienda de fotos. Hay una en la calle Verdi, claro. Todo está en la calle Verdi.',
   '«¿Puede revelar este carrete?», pregunto.',
   '«Sí. Está listo en una hora», dice el hombre de la tienda.',
   'Espero en un café. Una hora es muy larga.',
   'Después, el hombre me da un sobre con fotos. Las miro en la calle.',
   'Hay mi foto de la Sagrada Familia. Pero hay más fotos. Muchas más. Y en todas las fotos... estoy yo.',
   'Yo en el mercado, con fresas. Yo en la playa, con un helado de limón. Yo en el concierto del Born, con mi abuela. Yo en el Bar Sol, con un café.',
   'Son fotos de antes del juego. Alguien hace fotos de mí desde hace semanas.',
   'Pero no tengo miedo. Las fotos son bonitas. En todas sonrío. Son fotos hechas con cariño.',
   'La última foto es diferente. No estoy yo. Es una mano con una púa de guitarra. Una púa azul.',
   'Conozco esa púa. Es la púa de Leo.'
  ],
  quiz:[
   {q:'¿Qué hay en la cámara?',o:['Un carrete de fotos.','Una carta.','Una llave.']},
   {q:'¿Quién está en casi todas las fotos?',o:['Mia.','Leo.','La abuela.']},
   {q:'¿Cómo son las fotos?',o:['Bonitas, hechas con cariño.','Oscuras y tristes.','Muy viejas.']},
   {q:'¿Qué hay en la última foto?',o:['Una mano con una púa azul.','El Bar Sol.','La noria.']}
  ]},
 {ch:36,diff:2,title:'Laia habla',
  tz:{de:'Laia kann kein Geheimnis mehr für sich behalten. Aber die wichtigste Antwort gibt sie Mia nicht.',en:'Laia can\'t keep the secret any longer. But she won\'t give Mia the most important answer.'},
  paras:[
   'Con las fotos en la mano, voy a casa de Joan. Laia está allí, haciendo los deberes en la mesa del salón.',
   '«Laia, tenemos que hablar», digo. Pongo las fotos en la mesa.',
   'Laia mira las fotos. Mira la púa azul. Se pone roja.',
   '«Vale, vale», dice Laia. «Pero el juego no es mi problema. Yo solo ayudo. Yo hago algunas fotos. Y yo escribo las tarjetas. Mi letra es más bonita.»',
   '«¿Y la voz de la radio?»',
   '«Soy yo también. Con un programa del ordenador, la voz es diferente.» Laia está muy orgullosa.',
   '«Pero el juego no es tu idea, ¿verdad?»',
   'Laia no dice nada. Mira por la ventana.',
   '«Laia. ¿Es la idea de Leo?»',
   '«No puedo decir nada», dice Laia. «Es la regla número uno. Pero mañana es sábado. Y mañana, a las ocho, tienes tu respuesta.»',
   'Después, Laia me mira muy seria. «Mia, una cosa. Mañana ponte guapa. Muy guapa.»',
   'Y se ríe, como una niña pequeña.'
  ],
  quiz:[
   {q:'¿Qué hace Laia en el salón?',o:['Los deberes.','La cena.','Un concierto.']},
   {q:'¿Quién escribe las tarjetas?',o:['Laia.','Leo.','La abuela.']},
   {q:'¿Cómo hace Laia la voz de la radio?',o:['Con un programa del ordenador.','Con la voz de Joan.','No sabe.']},
   {q:'¿Qué dice Laia al final?',o:['Que mañana Mia tiene que ponerse guapa.','Que el juego termina.','Que Leo está enfermo.']}
  ]},
 {ch:37,diff:1,title:'¿Qué me pongo?',
  tz:{de:'Was zieht man an, wenn man nicht weiss, was einen erwartet? Marta und Pau haben klare Meinungen.',en:'What do you wear when you don\'t know what to expect? Marta and Pau have strong opinions.'},
  paras:[
   'Es sábado. Son las cinco de la tarde. Faltan tres horas.',
   'Abro mi armario. Tengo vaqueros, jerseys, camisetas... y nada especial.',
   '«Marta, ¡ayuda!», grito.',
   'Marta entra en mi habitación. Pau también. Pau lleva un delantal de cocinero.',
   '«A ver», dice Marta. «¿Esta falda negra? ¿Con esta camisa blanca?»',
   'Me pruebo la falda y la camisa. Me miro en el espejo.',
   '«Muy seria», dice Pau. «Parece una entrevista de trabajo.»',
   '«¿Y este vestido verde?»',
   'Me pruebo el vestido verde. Es bonito, pero hace frío en febrero.',
   '«¿Y si hace frío?», pregunta Pau.',
   '«Si hace frío, medias negras, botas y la chaqueta azul», dice Marta. «Perfecto.»',
   'Me ducho otra vez. Me visto. Me miro en el espejo: vestido verde, botas negras, chaqueta azul. Me peino. Me pinto un poco los ojos.',
   '«Estás guapísima», dice Marta.',
   '«¿Y la cámara?», pregunta Pau.',
   '«Claro. La cámara y la llave azul. Siempre.»',
   '«¿Y los zapatos?», pregunta Pau. «Las botas. Ya está.» Son las siete y media. Salgo de casa. El corazón me hace bum, bum, bum.'
  ],
  quiz:[
   {q:'¿Qué hay en el armario de Mia?',o:['Vaqueros, jerseys y camisetas.','Muchos vestidos de fiesta.','Nada.']},
   {q:'¿Por qué no la falda negra?',o:['Porque es muy seria.','Porque es muy pequeña.','Porque es roja.']},
   {q:'¿Qué lleva Mia al final?',o:['Un vestido verde, botas y la chaqueta azul.','Una falda y una camisa.','Un pijama.']},
   {q:'¿A qué hora sale de casa?',o:['A las siete y media.','A las cinco.','A las ocho y media.']}
  ]},
 {ch:38,diff:2,title:'¿Quién soy yo?',
  tz:{de:'Die Bar Sol ist dunkel, nur Kerzen und das blaue Radio. Endlich die Antwort auf die letzte Frage.',en:'Bar Sol is dark, only candles and the blue radio. At last the answer to the final question.'},
  paras:[
   'Son las ocho en punto. Estoy delante del Bar Sol. La puerta está cerrada, pero hay luz dentro. Luz de velas.',
   'Abro la puerta. El bar está vacío. No hay gente. Solo hay velas en las mesas, flores... y en la barra, la radio azul.',
   'La radio empieza a sonar. Es una canción. La puerta azul. Pero no es la voz de mi abuela. Es la voz de un chico. Y una guitarra.',
   'Entonces, alguien sale de la cocina. Lleva una camisa blanca y tiene una púa azul en la mano.',
   'Leo.',
   '«Hola, Mia», dice. Está muy nervioso. «Tú tienes una pregunta: ¿quién soy yo?»',
   '«Sí.»',
   '«Soy un chico tímido», dice Leo. «Un chico que trabaja en un bar y toca la guitarra. Un chico que no sabe hablar de cosas importantes. Por eso, el juego. Quiero enseñarte mi Barcelona. El dragón, las torres, la montaña...»',
   '«¿Y las fotos?»',
   '«Las fotos son de Laia y de mí. Perdón. Es un poco raro, ¿no?»',
   '«¿Y mi piso nuevo? ¿Cómo sabes que necesito un piso nuevo?»',
   'Leo sonríe. «El señor Ruiz toma café en mi bar cada mañana. Él me habla de su hija. Y Marta es amiga de Laia. La habitación de la calle Verdi, el sobre debajo de tu puerta... Marta y Pau ayudan mucho.»',
   '«Un poco raro», digo. «Pero muy bonito.»',
   'Leo respira. «Mia, tengo una pregunta. Una pregunta de verdad. ¿Quieres salir conmigo?»',
   'Saco la llave azul de mi bolsillo. La miro. Mi abuela dice: una llave es una pregunta.',
   '«Sí», digo. «Sí quiero.»',
   'Detrás de la barra, alguien grita «¡Sí!». Es Laia. Y detrás de Laia, mi abuela y Joan. Todos aplauden.'
  ],
  quiz:[
   {q:'¿Cómo está el Bar Sol?',o:['Vacío, con velas y flores.','Lleno de gente.','Cerrado y oscuro.']},
   {q:'¿Quién sale de la cocina?',o:['Leo.','Pau.','Joan.']},
   {q:'¿Por qué hace Leo el juego?',o:['Porque es tímido.','Porque quiere dinero.','Porque Laia quiere.']},
   {q:'¿Qué pregunta Leo?',o:['Si Mia quiere salir con él.','Si tiene la llave.','Si le gusta el bar.']}
  ]},
 {ch:39,diff:1,title:'Planes',
  tz:{de:'Prüfungen, Pläne für den Sommer und eine Frage, die Mia sich selbst stellen muss.',en:'Exams, summer plans and a question Mia has to ask herself.'},
  paras:[
   'Ahora es marzo. En Barcelona ya hace calor por la tarde. Hay flores en los árboles de la calle Verdi.',
   'Leo y yo estamos juntos. Leo me enseña a cocinar paella. Bueno, intenta. Es fácil estar con Leo. Hablamos mucho, nos reímos mucho. Los domingos comemos en casa de mi abuela y Joan.',
   'Pero en abril tengo exámenes en la universidad. Estudio mucho en la biblioteca. Leo también estudia para sus exámenes de música.',
   'Una tarde, en el balcón, Leo pregunta: «Mia, ¿qué vas a hacer en verano?»',
   'Es una buena pregunta. Mi semestre en Barcelona termina en junio. Después, tengo que volver a Suiza.',
   '«No sé», digo. «En julio voy a Zúrich. Voy a ver a mis padres. Y después... no sé.»',
   '«¿Vas a volver a Barcelona?»',
   'Miro la calle. Miro los tejados. Miro a Leo.',
   '«Voy a pensar», digo. «Pero creo que sí. Creo que mi casa está aquí también.»',
   'Leo sonríe. «Mi abuelo dice que en tu familia todas las mujeres vuelven a Barcelona. Tarde o temprano.»',
   '«Tu abuelo tiene razón», digo. «Pero yo no voy a esperar cincuenta años.»'
  ],
  quiz:[
   {q:'¿Qué tiempo hace en marzo?',o:['Ya hace calor por la tarde.','Hace mucho frío.','Llueve cada día.']},
   {q:'¿Qué tiene Mia en abril?',o:['Exámenes.','Un concierto.','Su cumpleaños.']},
   {q:'¿Cuándo termina el semestre?',o:['En junio.','En marzo.','En diciembre.']},
   {q:'¿Qué dice Mia al final?',o:['Que no va a esperar cincuenta años.','Que no vuelve nunca.','Que se va a Valencia.']}
  ]},
 {ch:40,diff:2,title:'Una llave para Leo',
  tz:{de:'Das Ende von A1. Mia lässt einen Schlüssel nachmachen und stellt ihre eigene Frage.',en:'The end of A1. Mia has a key copied and asks her own question.'},
  paras:[
   'Es el último día de abril. Mis exámenes terminan hoy. Salgo de la universidad y no voy a casa. Voy a una tienda pequeña en la calle Verdi. Una ferretería.',
   '«Hola. ¿Puede hacer una copia de esta llave?»',
   'El hombre mira mi llave azul. «Es una llave muy vieja. Pero sí. Vuelve en veinte minutos.»',
   'Veinte minutos después, tengo dos llaves: la llave vieja de mi abuela y una llave nueva. La llave nueva no es azul. Es gris. Entonces compro un poco de pintura azul.',
   'Por la noche, en mi habitación, pinto la llave nueva de azul.',
   'El sábado voy con Leo a la playa. Es temprano. No hay gente. Solo el mar, el sol y nosotros dos.',
   '«Tengo algo para ti», digo. Le doy una caja pequeña.',
   'Leo abre la caja. Dentro está la llave nueva, azul.',
   '«Mi abuela dice que una llave es una pregunta», digo. «Esta es mi pregunta: ¿quieres abrir conmigo todas las puertas de Barcelona? Las puertas azules, las rojas, las verdes... todas.»',
   'Leo mira la llave. Me mira a mí. Se ríe y llora al mismo tiempo.',
   '«Sí», dice. «Todas.»',
   'El sol sube detrás del mar. Barcelona se despierta. Y yo pienso: mi español es todavía pequeño. Pero mi historia aquí es muy grande.',
   {t:'Fin de la segunda parte',cls:'voice'}
  ],
  quiz:[
   {q:'¿Dónde copia Mia la llave?',o:['En una ferretería.','En una tienda de ropa.','En el mercado.']},
   {q:'¿De qué color es la llave nueva al principio?',o:['Gris.','Azul.','Roja.']},
   {q:'¿Dónde le da Mia la llave a Leo?',o:['En la playa.','En el Bar Sol.','En el Tibidabo.']},
   {q:'¿Qué responde Leo?',o:['«Sí. Todas.»','«No, gracias.»','«No sé.»']}
  ]}
];

 {ch:41,diff:1,title:'Libros y rosas',
  tz:{de:'Sant Jordi in Barcelona: Bücher, Rosen und ein Buch von Leo, das Mia nicht mehr weglegen kann.',en:'Sant Jordi in Barcelona: books, roses and a book from Leo that Mia can\'t put down.'},
  paras:[
   'Ahora es mayo. Desde marzo, es primavera en Barcelona. Hace sol, pero no hace mucho calor. Hay flores en todos los balcones de la calle Verdi.',
   'En mi mesa hay una rosa roja y un libro. Son de Sant Jordi, la fiesta de los libros y las rosas.',
   'En Barcelona, el veintitrés de abril es un día muy especial. Hay libros y rosas en todas las calles. Las personas regalan una rosa y un libro a las personas que quieren.',
   'Leo me regala un libro. Es una novela pequeña, en español fácil. Se llama «La chica del mar».',
   'Yo le regalo una rosa roja. Y una púa nueva para su guitarra. Una púa azul, claro.',
   'Ahora, cada noche, intento leer un poco en la cama. Hay muchas palabras nuevas. Pero me gusta mucho leer en español.',
   'La novela habla de una chica que vive en una casa al lado del mar. La chica tiene un secreto. Siempre hay un secreto.',
   'Una noche, Marta entra en mi habitación. «¿Todavía estás despierta? Son las dos.»',
   '«Sí. No puedo parar de leer. ¡Quiero saber el final!»',
   'Marta se ríe. «Muy bien. Pero mañana tienes clase a las nueve.»',
   'Leo tiene razón: leer en español es difícil, pero es muy bonito. Cierro el libro. Miro la rosa en la mesa. Mi primera primavera en Barcelona es muy bonita.'
  ],
  quiz:[
   {q:'¿Qué estación es?',o:['Primavera.','Invierno.','Verano.']},
   {q:'¿Qué regalan las personas en Sant Jordi?',o:['Libros y rosas.','Uvas.','Helados.']},
   {q:'¿Qué le regala Leo a Mia?',o:['Una novela.','Una guitarra.','Una cámara.']},
   {q:'¿Por qué no duerme Mia?',o:['Quiere leer el final.','Le duele la cabeza.','Hace calor.']}
  ]},
 {ch:42,diff:1,title:'La familia de Leo',
  tz:{de:'Sonntagsessen bei Leos Familie: Eltern, ein Onkel, ein Cousin und viel zu viel Essen.',en:'Sunday lunch with Leo\'s family: parents, an uncle, a cousin and far too much food.'},
  paras:[
   'Es domingo. Hoy como con la familia de Leo. Estoy un poco nerviosa.',
   'Los padres de Leo viven en un piso grande cerca de la playa. Su madre se llama Montse. Es alta, delgada y tiene el pelo negro. Su padre se llama Xavi. Es bajo, un poco gordo y muy simpático.',
   'También está el tío de Leo, Jordi. Es el hermano de Montse. Tiene una barba blanca y habla muy fuerte. Siempre habla de fútbol. Es del Barça, claro.',
   'Y está Marc, el primo de Leo. Es el hijo de Jordi. Tiene veinticinco años y trabaja en un hotel.',
   'La comida es enorme. Primero hay ensalada y pan con tomate. Después, carne con patatas. Después, pescado. Después, postre.',
   '«¿Y qué estudias, hija?», pregunta Montse. «Economía.» «¡Qué inteligente!»',
   'Montse trabaja en una farmacia y Xavi es médico. Pero hoy no hablan de trabajo. Hoy hablan de comida.',
   '«Come, come, hija», dice Montse. Es muy amable. «Estás muy delgada.»',
   '«No estoy delgada. ¡Y no puedo comer más!»',
   'Todos se ríen. En la mesa hay un perro pequeño. Bueno, no en la mesa. Debajo de la mesa.',
   '«Es el perro de Jordi», dice Leo. «Se llama Bombón.»',
   'El perro es un poco feo, pero muy simpático. Tiene los ojos grandes y la cara de un viejo.',
   'Al final de la comida, el tío Jordi levanta su copa. «Tengo una noticia», dice. «Marc se casa. ¡En septiembre!»',
   'Todos gritan. Marc está rojo como un tomate.'
  ],
  quiz:[
   {q:'¿Cómo es la madre de Leo?',o:['Alta y delgada.','Baja y gorda.','Vieja y seria.']},
   {q:'¿Quién es Marc?',o:['El primo de Leo.','El padre de Leo.','El tío de Mia.']},
   {q:'¿Cómo es el perro?',o:['Un poco feo, pero simpático.','Muy grande.','Muy serio.']},
   {q:'¿Cuál es la noticia?',o:['Marc se casa en septiembre.','Jordi vende el hotel.','Leo va a Valencia.']}
  ]},
 {ch:43,diff:1,title:'Una llamada de Suiza',
  tz:{de:'Mias Mutter ruft an. Die Eltern wollen nach Barcelona kommen, und der Vater hat Angst vor dem Fliegen.',en:'Mia\'s mother calls. Her parents want to come to Barcelona, and her father is afraid of flying.'},
  paras:[
   'El lunes por la noche, mi teléfono suena. Es mi madre. Normalmente mi madre escribe mensajes. Pero hoy llama.',
   '«Hola, Mia. ¿Tienes un momento?»',
   '«Sí, mamá. ¿Qué pasa? ¿Todo bien?»',
   '«Sí, todo bien. Tu padre y yo tenemos una idea. Queremos ir a Barcelona. En junio.»',
   '«¿En serio? ¡Qué bien!»',
   '«Sí. Queremos ver a la abuela, conocer a Joan... y conocer a Leo, claro. ¿Y tú? ¿Comes bien? ¿Tienes dinero?»',
   'Es igual que la abuela. Siempre las mismas preguntas.',
   'Me río. «Vale. ¿Y cómo venís? ¿En avión?»',
   '«Tu padre no quiere ir en avión. Tiene miedo. Desde ayer busca trenes en internet. El viaje en tren es largo: once horas. Pero tu padre está contento.»',
   '«¿Y dónde vais a dormir? Mi habitación es muy pequeña.»',
   '«En un hotel. Cerca de la Sagrada Familia. Tu padre quiere ver todo. Todo el país.»',
   '«Mamá, España es un país muy grande. En una semana no podéis ver todo.»',
   '«Díselo a tu padre», dice mi madre. Y las dos nos reímos.',
   'Después de la llamada, escribo a Leo: «Mis padres vienen en junio. Prepárate.»'
  ],
  quiz:[
   {q:'¿Quién llama a Mia?',o:['Su madre.','Su abuela.','Leo.']},
   {q:'¿Cuándo van los padres a Barcelona?',o:['En junio.','En septiembre.','En diciembre.']},
   {q:'¿Por qué no van en avión?',o:['El padre tiene miedo.','Es muy caro.','No hay aviones.']},
   {q:'¿Dónde van a dormir?',o:['En un hotel.','En la casa azul.','En la habitación de Mia.']}
  ]},
 {ch:44,diff:1,title:'En el supermercado',
  tz:{de:'Einkaufen mit Pau, der für eine Party kocht. Mia lernt Preise, Zahlen und spanisches Olivenöl kennen.',en:'Shopping with Pau, who is cooking for a party. Mia learns prices, numbers and Spanish olive oil.'},
  paras:[
   'El sábado hay una cena en nuestro piso. Pau cocina para catorce personas. Bueno, para trece. Marta no come carne.',
   'Es nuestra primera cena grande en el piso. Pau y yo vamos al supermercado. Pau tiene una lista muy larga.',
   '«Vale», dice Pau. «Primero, la fruta y la verdura. Tomates, patatas, cebollas, limones.»',
   'Ponemos todo en el carro. Después vamos a la carne. Pau compra pollo. Mucho pollo.',
   '«¿Y para Marta?», pregunto.',
   'Pau mira los precios. «¡Qué caro está todo!»',
   '«Mañana el supermercado está cerrado. Es domingo», dice Pau. «Entonces compramos todo hoy.»',
   '«Para Marta, tortilla de patatas. La comida más famosa de España.»',
   'Después, el aceite de oliva. Hay muchas botellas diferentes. Una cuesta tres euros. Otra cuesta catorce euros.',
   '«¿Por qué catorce euros?», pregunto.',
   '«Porque es aceite bueno. Muy bueno», dice Pau, muy serio. «Con el aceite no se juega.»',
   'En la caja, la chica dice: «Son sesenta y siete euros con noventa céntimos.»',
   'Pau paga con tarjeta. Yo pago la mitad: treinta y cuatro euros. Bueno, treinta y tres con noventa y cinco.',
   'Volvemos a casa con seis bolsas. Seis bolsas y tres pisos sin ascensor. Pau dice: «Con setenta años, voy a vivir en un piso con ascensor.»'
  ],
  quiz:[
   {q:'¿Para cuántas personas cocina Pau?',o:['Para trece.','Para seis.','Para setenta.']},
   {q:'¿Qué come Marta?',o:['Tortilla de patatas.','Pollo.','Carne.']},
   {q:'¿Cuánto cuesta el aceite bueno?',o:['Catorce euros.','Tres euros.','Noventa céntimos.']},
   {q:'¿Cuánto paga Mia?',o:['La mitad.','Todo.','Nada.']}
  ]},
 {ch:45,diff:1,title:'Clase de baile',
  tz:{de:'Marta nimmt Mia mit zum Salsa. Arme, Beine, Füsse und ein Tanzlehrer namens Rafa.',en:'Marta takes Mia to salsa class. Arms, legs, feet and a dance teacher called Rafa.'},
  paras:[
   'El martes, Marta me lleva a una clase de baile. Es una clase de salsa en un gimnasio de Gracia.',
   '«Yo no sé bailar», digo.',
   '«Nadie sabe bailar al principio», dice Marta. «Vamos.»',
   'El profesor se llama Rafa. Es de Cuba. Tiene mucha energía y una sonrisa enorme.',
   '«¡Vamos! Primero, el cuerpo. Arriba los brazos. Abajo los brazos. ¡Ahora la cabeza, a la derecha, a la izquierda!»',
   'Después vienen los pies. Un, dos, tres. Cinco, seis, siete. El pie derecho adelante. El pie izquierdo atrás.',
   'Mis pies no escuchan. Mis brazos no escuchan. Todo mi cuerpo hace cosas diferentes.',
   '«Mia, ¡relájate!», dice Rafa. «La salsa no está en los pies. Está aquí.» Y pone la mano en el corazón.',
   'Marta baila muy bien. Baila con Rafa y todos miran.',
   'Después de una hora, estoy muy cansada. Me duelen las piernas. Me duelen los pies. Pero estoy feliz.',
   'Después de la clase, cenamos una pizza en la plaza. Marta pide la cuenta. «Es imposible: bailar, comer pizza y no estar cansada», digo.',
   '«¿Vienes el martes que viene?», pregunta Marta.',
   '«Claro», digo. «Quiero bailar con Leo en la boda de su primo.»'
  ],
  quiz:[
   {q:'¿Qué baile aprenden?',o:['Salsa.','Flamenco.','Tango.']},
   {q:'¿De dónde es Rafa?',o:['De Cuba.','De Valencia.','De Madrid.']},
   {q:'¿Dónde está la salsa, según Rafa?',o:['En el corazón.','En los pies.','En la cabeza.']},
   {q:'¿Por qué quiere bailar Mia?',o:['Para la boda del primo de Leo.','Para un examen.','Para su abuela.']}
  ]},
 {ch:46,diff:1,title:'¡Ay, mi brazo!',
  tz:{de:'Ein Fahrrad, ein Hund und ein schmerzender Arm. Zum Glück ist Marta Krankenschwester.',en:'A bike, a dog and a sore arm. Luckily Marta is a nurse.'},
  paras:[
   'Es jueves. Voy a la universidad en bicicleta. En Barcelona hay muchas bicicletas públicas. Son rojas y blancas.',
   'Me gusta ir en bicicleta. Es más rápido que el autobús y más barato que el taxi.',
   'Pero hoy, en una calle pequeña, un perro sale de una puerta. Un perro grande y negro. Corre delante de mi bicicleta.',
   '¡Paro! Pero muy tarde. La bicicleta para, y yo no. Me caigo al suelo.',
   '«¡Ay! ¡Mi brazo!»',
   'Una señora mayor viene rápido. «¿Estás bien, guapa?»',
   '«Me duele el brazo. Mucho.»',
   'El perro me mira. Después mueve la cola y se va. Muy simpático.',
   'Escribo a Marta. Marta es enfermera y hoy no trabaja. Viene en diez minutos.',
   'Me duele el brazo derecho. Marta mira mi brazo con cuidado. «No está roto», dice. «Pero tienes que ponerlo en alto y no moverlo. Una semana, mínimo.»',
   '«¿Una semana? ¿Y cómo escribo? ¿Y cómo cocino?»',
   '«No escribes. Y no cocinas», dice Marta. «Pau cocina. Y Leo escribe por ti.»',
   'Pau cocina sopa. «Para los enfermos, siempre sopa», dice. «¡No estoy enferma! Es mi brazo.» Pau no escucha. Sopa.',
   'Esa noche, Leo viene con flores. Y con chocolate. «Para el brazo», dice. «El chocolate ayuda.»'
  ],
  quiz:[
   {q:'¿Cómo va Mia a la universidad?',o:['En bicicleta.','En metro.','En coche.']},
   {q:'¿Qué sale de una puerta?',o:['Un perro grande.','Un gato.','Un taxi.']},
   {q:'¿Qué le duele a Mia?',o:['El brazo.','La cabeza.','El pie.']},
   {q:'¿Qué trae Leo?',o:['Flores y chocolate.','Una bicicleta nueva.','Pastillas.']}
  ]},
 {ch:47,diff:1,title:'Las cuatro estaciones',
  tz:{de:'Auf dem Balkon reden Mia und Leo über Schnee, Herbst und Monate. Leo hat noch nie Schnee gesehen.',en:'On the balcony Mia and Leo talk about snow, autumn and months. Leo has never seen snow.'},
  paras:[
   'Mi brazo está mejor. Leo y yo estamos en mi balcón. Es una noche bonita de mayo.',
   '«En Suiza, ¿qué tiempo hace ahora?», pregunta Leo.',
   '«En mayo, en Zúrich, a veces hace sol y a veces llueve. Y en las montañas todavía hay nieve.»',
   '«¿Nieve en mayo? ¡Increíble!»',
   '«Sí. En Suiza, el invierno es largo y frío. Nieva mucho en diciembre, en enero y en febrero. La primavera es corta. El verano es bonito, pero no muy caliente. Y el otoño es mi estación favorita: los árboles son rojos, amarillos y naranjas.»',
   '«¿Y tú, Leo? ¿Cuál es tu estación favorita?» «El verano. Por la playa. Y por el helado.»',
   '«En Barcelona no hay invierno de verdad», dice Leo. «En invierno hace diez o doce grados. Casi nunca nieva.»',
   '«Yo tampoco», digo. «En Suiza, me gusta el sol de Barcelona.»',
   '«¿Tú nunca ves la nieve?»',
   'Leo piensa. «En la tele, sí. En la vida real... no. Nunca.»',
   '«¿Nunca? ¿En veinticuatro años?»',
   '«Nunca.»',
   'Miro a Leo. Tengo una idea. «En agosto voy a estar en Suiza. ¿Vienes? Te enseño la nieve. En las montañas hay nieve también en agosto.»',
   '«¿Y cuándo vienes?», pregunto.',
   'Leo sonríe. «¿Nieve en agosto? Vale. Pero en septiembre tengo que volver. La boda de Marc. Y en octubre empiezan mis clases.»',
   '«Perfecto», digo. «Agosto en Suiza. Septiembre en Barcelona. Y noviembre... ya vemos.»'
  ],
  quiz:[
   {q:'¿Cuál es la estación favorita de Mia?',o:['El otoño.','El verano.','El invierno.']},
   {q:'¿Cuándo nieva mucho en Suiza?',o:['En diciembre, enero y febrero.','En agosto.','Nunca.']},
   {q:'¿Leo ve la nieve en la vida real?',o:['No, nunca.','Sí, cada año.','Sí, en Barcelona.']},
   {q:'¿Cuándo va Leo a Suiza?',o:['En agosto.','En octubre.','En noviembre.']}

 {ch:48,diff:2,title:'Una noticia de la abuela',
  tz:{de:'Die Grossmutter ruft alle in die blaue Tür. Sie und Joan haben eine Neuigkeit, mit fünfzig Jahren Verspätung.',en:'Grandmother calls everyone to the blue door. She and Joan have news, fifty years late.'},
  paras:[
   'El domingo, mi abuela nos llama a todos: a Leo, a Laia y a mí. «Venid a la casa azul. A las seis. Es importante.»',
   'A las seis estamos en la casa azul. Mi abuela y Joan están sentados en el sofá. Se dan la mano. Están nerviosos, como dos niños.',
   '«Bueno», dice Joan. «Ana y yo tenemos una noticia.»',
   'Mi abuela mira a Joan. Joan mira a mi abuela. Nadie dice nada.',
   '«¡Abuelo, habla!», dice Laia.',
   '«Nos casamos», dice mi abuela. «En noviembre.»',
   'Silencio. Después, Laia grita. Leo abraza a su abuelo. Yo abrazo a mi abuela.',
   '«¿Por qué en noviembre?», pregunto.',
   '«Porque en noviembre conozco a Joan», dice mi abuela. «Hace muchos años, un día de noviembre, entro en la tienda de radios. Y allí está él, con una radio en las manos.»',
   'Joan saca algo del bolsillo. Es un anillo pequeño, con una piedra azul.',
   '«¡Qué sorpresa!», dice Laia. «¿Y esto? ¿Una boda de verdad?»',
   '«Abuelo, ¿estás seguro?», pregunta Leo. Joan se ríe. «Nunca estoy tan seguro.»',
   '«Azul», digo. «Claro.»',
   '«Claro», dice Joan. «Todo en esta historia es azul.»'
  ],
  quiz:[
   {q:'¿A qué hora están en la casa azul?',o:['A las seis.','A las doce.','A las nueve.']},
   {q:'¿Cuál es la noticia?',o:['La abuela y Joan se casan.','La abuela vuelve a Suiza.','Joan está enfermo.']},
   {q:'¿Cuándo es la boda?',o:['En noviembre.','En septiembre.','En agosto.']},
   {q:'¿De qué color es la piedra del anillo?',o:['Azul.','Roja.','Verde.']}
  ]},
 {ch:49,diff:1,title:'Mis padres llegan',
  tz:{de:'Elf Stunden Zug, ein müder Vater und eine Mutter mit zu viel Gepäck. Leo trifft Mias Eltern.',en:'Eleven hours by train, a tired father and a mother with too much luggage. Leo meets Mia\'s parents.'},
  paras:[
   'Es el diez de junio. Leo y yo estamos en la estación de Sants, la estación de tren más grande de Barcelona.',
   'El tren de mis padres llega a las ocho de la tarde. Llega tarde, claro. Veinte minutos tarde.',
   'Y allí están. Mi padre es bajo y un poco gordo, como el padre de Leo. Mi madre, con dos maletas grandes. Mi padre, con una maleta pequeña y una cara muy cansada.',
   '«¡Mia!» Mi madre me abraza. Mi padre me abraza. Y después miran a Leo.',
   '«Mamá, papá: este es Leo.»',
   '«Encantado», dice Leo, en alemán. Una palabra. La única palabra de alemán que sabe.',
   'Mi padre sonríe. «Encantado», dice en español. La única palabra de español que sabe.',
   'Todos nos reímos. Y ya está: son amigos.',
   'En Zúrich, mi padre tiene un coche. Pero aquí no necesita coche. Vamos al hotel en taxi. Mi padre mira la ciudad por la ventana. «Mucho ruido», dice. «Mucha gente. Me gusta.»',
   'El taxi para. El hotel está en una calle tranquila cerca de la Sagrada Familia. Es pequeño, pero muy bonito.',
   'La chica de la recepción es muy amable. «¿Ustedes tienen una habitación aquí?» En la recepción, mi padre habla en inglés. Yo traduzco al español. Leo traduce al catalán. Es un caos, pero al final tenemos la llave de la habitación.',
   '«Una llave», dice mi madre. «En esta familia, siempre hay una llave.»'
  ],
  quiz:[
   {q:'¿Dónde están Mia y Leo?',o:['En la estación de tren.','En el aeropuerto.','En el hotel.']},
   {q:'¿Cómo llega el tren?',o:['Veinte minutos tarde.','Muy temprano.','A las doce.']},
   {q:'¿Qué palabra dice el padre en español?',o:['«Encantado».','«Hola».','«Gracias».']},
   {q:'¿Dónde está el hotel?',o:['Cerca de la Sagrada Familia.','En la playa.','En la calle Verdi.']}
  ]},
 {ch:50,diff:1,title:'Barcelona en bicicleta',
  tz:{de:'Mias Vater will alles sehen, und zwar mit dem Fahrrad. Ein Tag voller Sehenswürdigkeiten und Muskelkater.',en:'Mia\'s father wants to see everything, by bike. A day full of sights and sore muscles.'},
  paras:[
   'Mi padre tiene un plan. Un plan muy grande. «Hoy vemos Barcelona en bicicleta. Toda Barcelona.»',
   'Mi padre es así: cuando tiene un plan, nadie puede cambiar el plan.',
   'Alquilamos cuatro bicicletas: para mi padre, mi madre, Leo y yo. Mi brazo ya está bien.',
   'Primero vamos por la playa. Hace sol y el mar está azul. Hay gente que corre, gente que está en el agua y gente que toma el sol.',
   'Después vamos al parque de la Ciutadella. Hay un lago con barcas, una fuente enorme y muchas flores moradas.',
   'Después, al Born y al barrio Gótico, la parte más vieja de la ciudad. Las calles son muy estrechas. Mucha gente. Muchos turistas. Mi padre hace fotos de todo: de las puertas, de las ventanas, de los gatos.',
   'A las dos, comemos en un restaurante pequeño. Mi padre pide paella. «¡Es la mejor paella de mi vida!», dice. Es la primera paella de su vida.',
   '«Hoy invito yo», dice mi padre, y pide la cuenta. Después de comer, mi madre dice: «Yo vuelvo al hotel. Me duelen las piernas.»',
   'Pero mi padre no está cansado. «¡Vamos! ¡Ahora Montjuic!»',
   'Leo me mira. «¿Montjuic? ¿En bicicleta? Es una montaña.»',
   '«Mi padre es suizo», digo. «Para él, Montjuic no es una montaña. Es una colina.»',
   'Por la noche, en el hotel, mi padre está en la cama a las nueve. No puede mover las piernas. Pero está muy feliz.'
  ],
  quiz:[
   {q:'¿Cómo ven Barcelona?',o:['En bicicleta.','En autobús.','A pie.']},
   {q:'¿Qué hay en el parque de la Ciutadella?',o:['Un lago y una fuente.','Un dragón.','Una noria.']},
   {q:'¿Qué come el padre?',o:['Paella.','Pizza.','Sopa.']},
   {q:'¿Cómo está el padre por la noche?',o:['Muy cansado, pero feliz.','Enfermo.','Triste.']}
  ]},
 {ch:51,diff:1,title:'Un partido en el Camp Nou',
  tz:{de:'Joan lädt Mias Vater zum Barça Spiel ein. Zwei Männer ohne gemeinsame Sprache, aber mit derselben Leidenschaft.',en:'Joan invites Mia\'s father to a Barça match. Two men with no common language but the same passion.'},
  paras:[
   'Joan tiene dos entradas para el fútbol. Barça contra Real Madrid. El partido más importante del año.',
   '«¿Estás listo, papá?», pregunto. Mi padre está muy nervioso.',
   '«Una entrada es para mí», dice Joan. «Y la otra... para tu padre.»',
   'Mi padre no habla español. Joan no habla alemán. Pero los dos hablan fútbol.',
   'Leo y yo vamos también. En el metro, en la línea tres, todos llevan camisetas del Barça. Tenemos entradas arriba, muy arriba. Desde allí, los jugadores son muy pequeños.',
   'El estadio es enorme. Hay casi cien mil personas. Todos cantan. Todos llevan camisetas azules y rojas, los colores del Barça.',
   'En el minuto diez, el Madrid marca un gol. Silencio en el estadio.',
   'En el minuto cuarenta, el Barça marca un gol. ¡Gooool! Todo el estadio grita. Mi padre grita. Joan grita. Mi padre y Joan se abrazan.',
   'En el minuto noventa, el partido está uno a uno. Y entonces, un jugador joven del Barça corre, corre, corre... y ¡gol!',
   'El Barça gana dos a uno. Su equipo gana. Cien mil personas cantan. Mi padre llora. Joan llora.',
   'Mi padre no sabe jugar al fútbol, pero sabe cantar. Para él, es el mejor día del mundo.',
   'Después del partido, mi padre dice a Joan su segunda palabra en español: «¡Visca el Barça!» Bueno, es catalán. Pero Joan está muy contento.'
  ],
  quiz:[
   {q:'¿Quién juega?',o:['El Barça contra el Real Madrid.','El Barça contra Valencia.','Suiza contra España.']},
   {q:'¿Cuántas personas hay en el estadio?',o:['Casi cien mil.','Mil.','Cien.']},
   {q:'¿Quién gana?',o:['El Barça, dos a uno.','El Madrid.','Nadie.']},
   {q:'¿Qué dice el padre al final?',o:['«¡Visca el Barça!»','«Encantado».','«Gracias».']}
  ]},
 {ch:52,diff:1,title:'El agua está fría',
  tz:{de:'Erster Strandtag des Jahres. Leo schwimmt, Mia zögert, und die Mutter verteilt Sonnencreme.',en:'First beach day of the year. Leo swims, Mia hesitates, and her mother hands out sun cream.'},
  paras:[
   'Es domingo. Hace mucho calor: treinta grados. Vamos todos a la playa: mis padres, Leo, Laia y yo.',
   'Mi madre trae una bolsa enorme: toallas, agua, fruta, bocadillos y tres botellas de crema para el sol.',
   '«Mamá, solo es un día de playa.»',
   '«El sol de España es muy fuerte», dice mi madre. Y pone crema en la cara de mi padre. Mucha crema. Mi padre parece un fantasma.',
   'Leo corre al agua. «¡Vamos, Mia! ¡A nadar!»',
   'Pongo un pie en el agua. «¡Está muy fría!»',
   '«No está fría. ¡Está perfecta!», grita Leo. Leo sabe nadar muy bien. Es como un pez.',
   'Un camarero camina por la playa y vende bebidas frías. «¡Agua! ¡Cerveza! ¡Zumo!» Mi padre compra una cerveza. Mi madre, un agua.',
   'Laia me mira. «Las chicas de Suiza tienen miedo del agua, ¿no?»',
   '¿Miedo? ¿Yo? Corro al agua. Una ola grande viene hacia mí. ¡Splash! Todo mi cuerpo está en el agua.',
   'Está fría. Muy fría. Pero después de un minuto, está bien. Nado hasta Leo.',
   '«¿Ves?», dice Leo. «Perfecta.»',
   'Hay un padre con su hijo en el agua. Mientras yo nado con Leo, mi madre lee un libro. Mi padre duerme debajo de su crema blanca. Laia hace fotos con mi cámara vieja.',
   'Por la noche, en el cielo hay muchas estrellas. Es un buen día. Un día perfecto.'
  ],
  quiz:[
   {q:'¿Cuántos grados hace?',o:['Treinta.','Diez.','Cuarenta.']},
   {q:'¿Qué hay en la bolsa de la madre?',o:['Toallas, agua y crema.','Un libro y una guitarra.','Nada.']},
   {q:'¿Cómo es Leo en el agua?',o:['Como un pez.','Tiene miedo.','No le gusta.']},
   {q:'¿Qué hace el padre al final?',o:['Duerme.','Nada.','Hace fotos.']}
  ]},
 {ch:53,diff:2,title:'La noche de Sant Joan',
  tz:{de:'Die kürzeste Nacht des Jahres: Feuer am Strand, Feuerwerk und Mias Eltern tanzen.',en:'The shortest night of the year: fires on the beach, fireworks, and Mia\'s parents dance.'},
  paras:[
   'Es el veintitrés de junio. Es la noche de Sant Joan, la noche más corta del año.',
   'En Barcelona, esta noche nadie duerme. Hay fiestas en todas las calles, en todas las plazas y en todas las playas.',
   'Por la tarde, comemos coca de Sant Joan en la casa azul. Es un dulce típico, con fruta y azúcar. Mi padre come tres trozos.',
   'Por la noche vamos todos a la playa. Hay bebidas, comida típica y miles de personas. Hay música, hay fuego, hay fuegos artificiales en el cielo.',
   '«¿Qué celebráis?», pregunta mi madre.',
   '«El verano», dice Joan. «El sol. La luz. Y hay una tradición: a las doce, saltas el fuego y pides un deseo.»',
   'Mi madre mira el fuego. «¡Cuidado, Mia!» «Tranquila, mamá.»',
   'A las doce, Leo me da la mano. Saltamos juntos un fuego pequeño. Cierro los ojos y pido un deseo. Es un secreto, claro.',
   'Después, mi madre y mi padre bailan en la arena. Mis padres nunca bailan. Nunca. Pero esta noche bailan.',
   'Mi abuela y Joan miran el cielo. Hay estrellas y fuegos de colores.',
   'A las cuatro de la mañana, todavía estamos en la playa. El cielo está cada vez más claro.',
   'Mi padre mira el mar. «Ahora entiendo», dice en alemán. «Ahora entiendo por qué la abuela vuelve aquí.»'
  ],
  quiz:[
   {q:'¿Qué noche es?',o:['La noche de Sant Joan.','Nochevieja.','Su cumpleaños.']},
   {q:'¿Qué es la coca de Sant Joan?',o:['Un dulce típico.','Una bebida.','Un baile.']},
   {q:'¿Qué hacen a las doce?',o:['Saltan el fuego y piden un deseo.','Comen uvas.','Duermen.']},
   {q:'¿Qué hacen los padres de Mia?',o:['Bailan en la arena.','Duermen en el hotel.','Nadan.']}
  ]},
 {ch:54,diff:1,title:'Adiós en la estación',
  tz:{de:'Abschied am Bahnhof. Mias Vater spricht ein ernstes Wort mit Leo.',en:'Goodbye at the station. Mia\'s father has a serious word with Leo.'},
  paras:[
   'Es el veinticinco de junio. Mis padres vuelven a Suiza hoy.',
   'Estamos otra vez en la estación de Sants. Mi madre tiene tres maletas. Tiene una maleta más que en el viaje a Barcelona.',
   '«¿Qué hay en la maleta nueva, mamá?»',
   '«Recuerdos. Aceite de oliva, queso, una camiseta del Barça para tu tío... y un libro de Gaudí.»',
   'Mi padre está con Leo, un poco lejos. Hablan en inglés. Mi padre está serio. Leo escucha y dice que sí con la cabeza.',
   '«¿Qué dice tu padre?», pregunta mi abuela.',
   '«No sé», digo. «Mi padre es un hombre de pocas palabras.»',
   'El tren está en el andén. Mi madre me abraza y me da un beso. «En julio te esperamos en Zúrich. Y a Leo en agosto.»',
   'Mi padre me abraza también. «Adiós, papá», digo. «Estoy orgulloso de ti», dice en mi oído. «Tu español es muy bueno.»',
   'Mi padre da la mano a Leo y dice su tercera palabra en español: «¡Adiós!» Y después: «¡Visca el Barça!»',
   'El tren sale. Miro el tren hasta el final.',
   'Después, pregunto a Leo: «¿Qué te dice mi padre?»',
   'Leo sonríe. «Dice que el Barça es el mejor equipo del mundo. Y que tengo que cuidar de ti. Pero creo que tú cuidas de ti muy bien.»'
  ],
  quiz:[
   {q:'¿Cuántas maletas tiene la madre ahora?',o:['Tres.','Dos.','Una.']},
   {q:'¿Qué hay en la maleta nueva?',o:['Recuerdos.','Ropa sucia.','La cámara.']},
   {q:'¿Qué dice el padre a Mia?',o:['Que está orgulloso de ella.','Que tiene que volver a Suiza.','Nada.']},
   {q:'¿Qué dice el padre a Leo?',o:['Que el Barça es el mejor y que tiene que cuidar de Mia.','Que no le gusta Barcelona.','Que tiene que estudiar.']}
  ]},
 {ch:55,diff:1,title:'Las notas',
  tz:{de:'Die Prüfungsresultate sind da. Und dann kommt eine E-Mail von der Universität.',en:'The exam results are out. And then an email arrives from the university.'},
  paras:[
   'Hoy es el último día de junio. Hoy salen las notas de los exámenes. Desde ayer no duermo bien.',
   'Estoy en mi habitación con el ordenador. Marta está a mi lado. Pau está en la puerta con un café.',
   '«¿Y?», pregunta Marta.',
   '«Espera. La página no abre.» Internet en nuestro piso es muy lento.',
   'Por fin, la página abre. Economía: un ocho. Marketing: un siete. Estadística: un cinco. Y español... ¡un nueve!',
   '«¡Un nueve en español!», grita Pau. «¡Increíble! ¡Esta chica es casi de Barcelona!»',
   '«Y un cinco en estadística», digo. «Pero un cinco es aprobado. Apruebo todo.»',
   'Marta me abraza. Pau me da el café. «Para celebrar», dice. Escribo un mensaje a Leo: «¡Apruebo todo!» Leo responde con veinte corazones.',
   'Entonces, en el ordenador, hay un correo nuevo. Es de la universidad.',
   {t:'«Querida Mia: Tenemos una plaza para un segundo semestre en Barcelona, de septiembre a diciembre. ¿Quieres continuar con nosotros? Por favor, responde antes del quince de julio.»',cls:'note'},
   'Miro el correo dos veces. Tres veces.',
   'Un semestre más. Cuatro meses más en Barcelona. Con Leo. Con mi abuela. Con la calle Verdi.',
   'Pero también: cuatro meses más sin mis padres. Sin mi vida en Suiza.',
   'Cierro el ordenador. Necesito pensar.'
  ],
  quiz:[
   {q:'¿Qué nota tiene Mia en español?',o:['Un nueve.','Un cinco.','Un siete.']},
   {q:'¿Aprueba todo Mia?',o:['Sí.','No, estadística no.','No sabe.']},
   {q:'¿Qué ofrece la universidad?',o:['Un segundo semestre.','Un trabajo.','Un piso.']},
   {q:'¿Hasta cuándo tiene que responder?',o:['Hasta el quince de julio.','Hasta diciembre.','Hasta mañana.']}
  ]},
 {ch:56,diff:2,title:'La decisión',
  tz:{de:'Bleiben oder gehen? Mia fragt die Grossmutter um Rat und bekommt eine Antwort, mit der sie nicht rechnet.',en:'Stay or go? Mia asks her grandmother for advice and gets an answer she doesn\'t expect.'},
  paras:[
   'Una semana después, todavía no sé qué hacer. Voy a la casa azul. Mi abuela está en la cocina. Hace una tarta de manzana.',
   '«Abuela, necesito tu ayuda.»',
   '«Siéntate», dice. «¿Un té?»',
   'Le hablo del correo de la universidad. Del semestre. De Leo. De mis padres.',
   '«¿Qué hago, abuela? ¿Me quedo o me voy?»',
   'Mi abuela corta la manzana. Despacio. Muy despacio.',
   '«Mia, hace muchos años, yo tengo que tomar una decisión. Quedarme en Barcelona o irme a Suiza.»',
   '«Y te vas.»',
   '«Me voy. Y tengo una buena vida en Suiza. Una buena familia. Tu madre. Tú. No estoy triste por mi vida.» Mi abuela me mira. «Pero cada día, durante cincuenta años, pienso: ¿y si me quedo?»',
   'No digo nada. «No es fácil», dice mi abuela. «Nunca es fácil.»',
   '«No te digo qué hacer», dice mi abuela. «Solo te digo una cosa: una pregunta no es un problema. Una pregunta es un regalo.»',
   'Esa noche, escribo un correo a la universidad. Es un correo muy corto. Solo tiene una palabra.',
   '«Sí.»'
  ],
  quiz:[
   {q:'¿Qué hace la abuela?',o:['Una tarta de manzana.','Una paella.','Un té frío.']},
   {q:'¿Qué decisión tiene que tomar la abuela hace muchos años?',o:['Quedarse en Barcelona o irse a Suiza.','Comprar una casa.','Estudiar o trabajar.']},
   {q:'¿Está triste la abuela por su vida?',o:['No.','Sí, mucho.','No sabe.']},
   {q:'¿Qué responde Mia a la universidad?',o:['«Sí».','«No».','Nada.']}
  ]},
 {ch:57,diff:1,title:'La maleta',
  tz:{de:'Koffer packen für einen Monat Zürich. Was nimmt man mit, wenn man zurückkommen will?',en:'Packing for a month in Zurich. What do you take when you want to come back?'},
  paras:[
   'Es el quince de julio. Mañana viajo a Zúrich. Voy a viajar sola, pero no es mi primer viaje sola. Un mes en Suiza, y después, en septiembre, vuelvo a Barcelona.',
   'Mi maleta está abierta en la cama. ¿Qué pongo?',
   'En Zúrich, en julio, hace calor, pero no mucho. Y en las montañas hace frío. Entonces pongo de todo: camisetas, dos jerseys, unos vaqueros, una chaqueta, el vestido verde y las botas.',
   'También pongo regalos: aceite de oliva para mi tío, una camiseta del Barça para mi primo, y para mi madre, un libro de recetas catalanas.',
   'Marta entra. «¿Llevas la chaqueta azul?»',
   '«Claro. Y la cámara. Y la llave.»',
   'Pau entra. «¿Y para nosotros? ¿Chocolate suizo?»',
   '«En agosto, cuando vuelvo, traigo chocolate para todos. Kilos de chocolate.»',
   'Mi habitación se queda vacía. Pero no del todo. En la mesa dejo la rosa de Sant Jordi, ya seca. Y la novela «La chica del mar». Son una promesa: vuelvo.',
   'Es una buena decisión, pienso. Por la noche, Leo me acompaña a la estación de autobuses. Esta vez no voy en tren. Voy en avión. Pero el aeropuerto está lejos y el autobús sale muy temprano.',
   '«¿Tienes el billete?», pregunta Leo. «Sí, en el teléfono.» «Buen viaje.»',
   '«Un mes», dice Leo.',
   '«Un mes», digo. «Y después, tú en Zúrich. Y la nieve.»',
   '«Y la nieve», dice Leo. Y me da un beso. «Adiós, Mia.» «Adiós no. Hasta pronto.»'
  ],
  quiz:[
   {q:'¿Cuánto tiempo va Mia a Suiza?',o:['Un mes.','Una semana.','Un año.']},
   {q:'¿Qué regalo es para la madre?',o:['Un libro de recetas.','Aceite de oliva.','Una camiseta del Barça.']},
   {q:'¿Qué deja Mia en la mesa?',o:['La rosa y la novela.','La llave.','La cámara.']},
   {q:'¿Cómo viaja Mia a Zúrich?',o:['En avión.','En tren.','En bicicleta.']}
  ]},
 {ch:58,diff:1,title:'Zúrich',
  tz:{de:'Zurück in Zürich. Alles ist sauber, pünktlich und ruhig. Und Mia träumt auf Spanisch.',en:'Back in Zurich. Everything is clean, punctual and quiet. And Mia dreams in Spanish.'},
  paras:[
   'Zúrich. Mi ciudad. Todo es igual: el lago, los tranvías azules, las montañas a lo lejos. Todo está limpio. Todo llega a la hora.',
   'Mi madre prepara mi comida favorita: rosti con salchicha. Y de postre, chocolate suizo, el dulce más típico de Suiza. Mi padre me enseña doscientas fotos de Barcelona. Doscientas. Las miramos todas.',
   'En mi habitación de Zúrich todo está igual: la cama, el armario, los libros de la escuela. Pero algo es diferente. Yo soy diferente.',
   'En el supermercado, digo «¡Hola!» y «¡Gracias!» en español. La cajera me mira raro.',
   'En la calle, busco gente que habla fuerte, que ríe en la calle, que come a las diez de la noche. Pero en Zúrich, a las diez de la noche, la ciudad duerme.',
   'Por la noche sueño en español. Sueño con la calle Verdi, con el Bar Sol, con la casa azul.',
   'Cada noche, Leo me llama. Hablamos una hora. A veces dos.',
   '«¿Qué tal Zúrich?», pregunta.',
   '«Bonita. Tranquila. Muy limpia.»',
   '«¿Y tú?»',
   '«Yo te echo de menos. Y echo de menos el ruido.»',
   'Leo se ríe. «Aquí tengo mucho ruido para ti. En dos semanas estoy en Zúrich. Con mi guitarra.»',

 {ch:59,diff:2,title:'Nieve en agosto',
  tz:{de:'Leo in der Schweiz. Ein Zug auf den Berg, ein Gletscher und zum ersten Mal Schnee in seinen Händen.',en:'Leo in Switzerland. A train up the mountain, a glacier and, for the first time, snow in his hands.'},
  paras:[
   'Es el diez de agosto. Leo está en Zúrich. Lleva pantalones cortos y una camiseta. «Hace fresco aquí», dice. Hace veinticuatro grados.',
   'Hoy vamos a la montaña. En la estación hay muchos turistas con cámaras. Tomamos un tren rojo, muy pequeño, que sube y sube. Primero hay vacas, árboles y casas de madera. Después, solo piedras. Y después...',
   '«¿Eso es nieve?», pregunta Leo. Pone la cara en la ventana como un niño.',
   'Arriba, a tres mil metros, hace frío. Mucho frío. Leo lleva mi jersey rosa. Le queda pequeño. Muy pequeño.',
   'Salimos del tren. Todo es blanco. El sol en la nieve es tan fuerte que no podemos abrir los ojos.',
   'Leo toca la nieve con la mano. Muy despacio, como un niño con un regalo.',
   '«Está fría», dice. «Y es suave. Y...» Hace una bola de nieve. Me la tira. ¡Paf! En mi cara.',
   '«¡Leo!»',
   'Leo corre y se ríe. Yo hago una bola de nieve también. Y otra. Y otra. Después de diez minutos, estamos los dos blancos, mojados y muy felices.',
   'En la montaña no hay ruido. Solo el viento. Leo se sienta en la nieve. Mira las montañas. «Es increíble. Es como estar en otro planeta.»',
   'Saco la cámara vieja y hago una foto. Leo en la nieve, con mi jersey rosa: un poco feo, pero muy guapo. Es precioso, como en una película. Es mi foto favorita de todo el año.'
  ],
  quiz:[
   {q:'¿Qué dice Leo del tiempo en Zúrich?',o:['Que hace fresco.','Que hace mucho calor.','Que llueve.']},
   {q:'¿Qué ven desde el tren?',o:['Vacas, árboles y después nieve.','El mar.','La Sagrada Familia.']},
   {q:'¿Qué lleva Leo arriba?',o:['El jersey rosa de Mia.','Su chaqueta azul.','Una camiseta del Barça.']},
   {q:'¿Qué hace Leo con la nieve?',o:['Una bola de nieve.','Una foto.','Nada.']}
  ]},
 {ch:60,diff:2,title:'Septiembre',
  tz:{de:'Zurück in Barcelona. Ein neues Semester, eine Hochzeit im November und das Ende von A1.',en:'Back in Barcelona. A new semester, a wedding in November and the end of A1.'},
  paras:[
   'Es el primero de septiembre. El avión llega a Barcelona a las once de la mañana. Por la ventana veo el mar. Azul, como siempre.',
   'Leo me espera en el aeropuerto. Me da un beso. «Bienvenida a casa.»',
   'Y también están Laia, mi abuela y Joan. Laia tiene un cartel: «BIENVENIDA A CASA, MIA».',
   '«¡Sorpresa!», gritan todos. A casa. Sí. Barcelona es mi casa ahora. Una de mis casas.',
   'En la calle Verdi, Marta y Pau me esperan con una fiesta. Hay tortilla de patatas, pan con tomate y una tarta. Yo saco el chocolate suizo. Tres kilos. Pau grita de felicidad.',
   'Dejo la maleta en mi habitación. Está igual: la rosa seca, la novela, el balcón. En la mesa hay un sobre nuevo. Es de mi abuela.',
   {t:'«Querida Mia: El veintitrés de noviembre, a las doce, en la casa azul. Tú vas a ser mi testigo. Con amor, Abuela Ana.»',cls:'note'},
   'Sonrío. Mi abuela y Joan se casan. Una boda en noviembre. Una boda de cincuenta años.',
   'Esa noche, en el balcón, Leo toca la guitarra. Abajo, en la calle, la gente habla, ríe, cena tarde. Hay mucho ruido. Me gusta el ruido.',
   'En octubre empiezan las clases de Leo. Y el sábado es la boda de Marc, el primo de Leo. Rafa dice que ya bailo salsa muy bien. Bueno, muy bien no. Pero bailo.',
   'Pienso en mi primer día en Barcelona. En la llave azul en mi maleta. En la nota: «La puerta azul está en la calle del Sol.»',
   'Ahora tengo amigos, una familia nueva, un barrio, una vida. Y hablo español. Todavía no perfecto. Pero hablo.',
   'Y ahora puedo decir mi deseo de Sant Joan. Mi deseo es simple: una vida aquí. Y mi deseo ahora es verdad.',
   'Mi historia en Barcelona no termina aquí. Solo cambia de nivel.',
   {t:'Fin del nivel A1',cls:'voice'}
  ],
  quiz:[
   {q:'¿Quién espera a Mia en el aeropuerto?',o:['Leo, Laia, la abuela y Joan.','Sus padres.','Nadie.']},
   {q:'¿Qué trae Mia de Suiza?',o:['Tres kilos de chocolate.','Una radio.','Un gato.']},
   {q:'¿Qué hay en el sobre?',o:['Una invitación a la boda.','Una foto vieja.','Una llave.']},
   {q:'¿Qué va a ser Mia en la boda?',o:['La testigo.','La cocinera.','La fotógrafa.']}
  ]}
];

 {id:'llave',title:'La llave azul',color:['#3b82f6','#1e3a8a'],

 {id:'familia',title:'Familia',color:['#ec4899','#831843'],
  intro:{de:'Grosseltern, Eltern, Geschwister, Cousins: in Spanien isst die ganze Familie zusammen.',en:'Grandparents, parents, siblings, cousins: in Spain the whole family eats together.'},

 {id:'comida',title:'Comida',color:['#f97316','#7c2d12'],
  intro:{de:'Pan con tomate, Paella, Tortilla: in Spanien redet man beim Essen über das nächste Essen.',en:'Pan con tomate, paella, tortilla: in Spain people talk about the next meal while eating.'},

   'Me llamo Pau. Soy cocinero. Para mí, la comida es más importante que el dinero. Bueno, casi.',

 {id:'barcelona',title:'Barcelona',color:['#eab308','#713f12'],
  intro:{de:'Plätze, Märkte, Strand und ein Drache: Leos Barcelona.',en:'Squares, markets, beach and a dragon: Leo\'s Barcelona.'},
  words:['plaza','mercado','playa','mar','metro','iglesia','parque','barrio','dragón','torre','montaña','ciudad'],
  scene:{title:'El plan de Leo',who:{de:'Leo, in der Nacht, als er das Spiel für Mia plant',en:'Leo, the night he plans the game for Mia'},paras:[
   'Es diciembre. Son las dos de la noche. Estoy en mi habitación con un mapa de Barcelona.',

   'Laia entra sin llamar. «¿Qué haces?»',

   'Laia mira el mapa. Mira mis notas. Sonríe. «Leo, esto es muy romántico. Y muy raro.»',
